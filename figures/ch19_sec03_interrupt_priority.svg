<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arr3r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>
  <style>
    .box      { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; rx: 8; }
    .int-box  { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; rx: 8; }
    .pend-box { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; rx: 8; }
    .gate-box { fill: #D1FAE5; stroke: #059669; stroke-width: 2; rx: 6; }
    .label    { font-size: 13px; fill: #1E3A5F; text-anchor: middle; font-weight: bold; }
    .sub      { font-size: 11px; fill: #475569; text-anchor: middle; }
    .title    { font-size: 18px; fill: #1E3A5F; font-weight: bold; text-anchor: middle; }
    .code     { font-size: 11px; fill: #6B7280; text-anchor: start; font-family: monospace; }
    .pri      { font-size: 12px; fill: #DC2626; text-anchor: middle; font-weight: bold; }
  </style>

  <text x="400" y="30" class="title">비동기 인터럽트 처리 및 우선순위</text>

  <!-- Interrupt Sources -->
  <text x="100" y="65" class="label">인터럽트 소스</text>

  <rect x="30" y="80" width="160" height="50" class="int-box"/>
  <text x="110" y="102" class="label" style="fill:#DC2626;">외부 인터럽트 (MEI)</text>
  <text x="110" y="120" class="sub">Ch17 GPIO/UART</text>

  <rect x="30" y="150" width="160" height="50" class="int-box"/>
  <text x="110" y="172" class="label" style="fill:#DC2626;">타이머 인터럽트 (MTI)</text>
  <text x="110" y="190" class="sub">Ch17 타이머/카운터</text>

  <rect x="30" y="220" width="160" height="50" class="int-box"/>
  <text x="110" y="242" class="label" style="fill:#DC2626;">소프트웨어 인터럽트 (MSI)</text>
  <text x="110" y="260" class="sub">MSIP 레지스터</text>

  <!-- Priority labels -->
  <text x="210" y="108" class="pri">우선순위 1</text>
  <text x="210" y="178" class="pri">우선순위 2</text>
  <text x="210" y="248" class="pri">우선순위 3</text>

  <!-- mip Register -->
  <rect x="270" y="80" width="180" height="200" class="pend-box"/>
  <text x="360" y="105" class="label" style="fill:#92400E;">mip (인터럽트 펜딩)</text>
  <text x="280" y="135" class="code">bit[11] MEIP (외부)</text>
  <text x="280" y="165" class="code">bit[7]  MTIP (타이머)</text>
  <text x="280" y="195" class="code">bit[3]  MSIP (소프트웨어)</text>
  <line x1="280" y1="215" x2="440" y2="215" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="280" y="240" class="code">각 비트 = 해당</text>
  <text x="280" y="258" class="code">인터럽트 펜딩 상태</text>

  <!-- Arrows to mip -->
  <line x1="190" y1="105" x2="270" y2="120" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr3r)"/>
  <line x1="190" y1="175" x2="270" y2="160" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr3r)"/>
  <line x1="190" y1="245" x2="270" y2="200" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr3r)"/>

  <!-- mie Register -->
  <rect x="270" y="310" width="180" height="100" class="pend-box"/>
  <text x="360" y="335" class="label" style="fill:#92400E;">mie (인터럽트 인에이블)</text>
  <text x="280" y="365" class="code">bit[11] MEIE</text>
  <text x="280" y="385" class="code">bit[7]  MTIE</text>
  <text x="280" y="405" class="code">bit[3]  MSIE</text>

  <!-- AND Gate -->
  <rect x="500" y="140" width="100" height="60" class="gate-box"/>
  <text x="550" y="168" class="label" style="fill:#059669;">AND 게이트</text>
  <text x="550" y="185" class="sub" style="fill:#059669;">mip &amp; mie</text>

  <line x1="450" y1="170" x2="500" y2="170" stroke="#D97706" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="360" y1="310" x2="360" y2="295" stroke="#D97706" stroke-width="1.5"/>
  <line x1="360" y1="295" x2="490" y2="295" stroke="#D97706" stroke-width="1.5"/>
  <line x1="490" y1="295" x2="490" y2="180" stroke="#D97706" stroke-width="1.5"/>
  <line x1="490" y1="180" x2="500" y2="180" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Global Enable -->
  <rect x="500" y="240" width="100" height="50" class="gate-box"/>
  <text x="550" y="262" class="label" style="fill:#059669;">mstatus</text>
  <text x="550" y="280" class="sub" style="fill:#059669;">MIE 비트</text>

  <!-- Final AND -->
  <rect x="650" y="170" width="110" height="60" class="gate-box"/>
  <text x="705" y="195" class="label" style="fill:#059669;">최종 AND</text>
  <text x="705" y="215" class="sub" style="fill:#059669;">인터럽트 발생!</text>

  <line x1="600" y1="170" x2="650" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="600" y1="265" x2="625" y2="265" stroke="#059669" stroke-width="1.5"/>
  <line x1="625" y1="265" x2="625" y2="210" stroke="#059669" stroke-width="1.5"/>
  <line x1="625" y1="210" x2="650" y2="210" stroke="#059669" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- To Pipeline -->
  <rect x="650" y="280" width="110" height="50" class="box"/>
  <text x="705" y="303" class="label">파이프라인</text>
  <text x="705" y="320" class="sub">트랩 진입</text>

  <line x1="705" y1="230" x2="705" y2="280" stroke="#2563EB" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Priority note -->
  <rect x="480" y="370" width="290" height="110" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="625" y="395" class="label">RISC-V 인터럽트 우선순위 (높음→낮음)</text>
  <text x="500" y="420" class="code">1. MEI (Machine External Interrupt)</text>
  <text x="500" y="440" class="code">2. MSI (Machine Software Interrupt)</text>
  <text x="500" y="460" class="code">3. MTI (Machine Timer Interrupt)</text>
</svg>