<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Pretendard, sans-serif">
  <!-- 배경 -->
  <rect width="760" height="500" fill="#F8FAFC" rx="12"/>

  <!-- 제목 -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">AHB Master FSM — 상태 전이도</text>

  <!-- 상태 박스 정의 -->
  <!-- M_IDLE (중앙 상단) -->
  <rect x="300" y="60" width="160" height="70" fill="#DBEAFE" rx="10" stroke="#2563EB" stroke-width="2.5"/>
  <text x="380" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">M_IDLE</text>
  <text x="380" y="108" text-anchor="middle" font-size="10" fill="#374151">HTRANS = IDLE</text>
  <text x="380" y="122" text-anchor="middle" font-size="10" fill="#374151">cache_req = 0</text>

  <!-- M_ADDR (오른쪽) -->
  <rect x="540" y="200" width="160" height="80" fill="#DBEAFE" rx="10" stroke="#2563EB" stroke-width="2"/>
  <text x="620" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">M_ADDR</text>
  <text x="620" y="248" text-anchor="middle" font-size="10" fill="#374151">HTRANS = NONSEQ</text>
  <text x="620" y="263" text-anchor="middle" font-size="10" fill="#374151">HADDR = cache_addr</text>
  <text x="620" y="278" text-anchor="middle" font-size="10" fill="#374151">HWRITE = cache_write</text>

  <!-- M_WAIT (하단 오른쪽) -->
  <rect x="540" y="370" width="160" height="70" fill="#FEF3C7" rx="10" stroke="#D97706" stroke-width="2"/>
  <text x="620" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">M_WAIT</text>
  <text x="620" y="416" text-anchor="middle" font-size="10" fill="#78350F">HREADY = 0</text>
  <text x="620" y="430" text-anchor="middle" font-size="10" fill="#78350F">모든 신호 유지</text>

  <!-- M_DATA (하단 중앙) -->
  <rect x="300" y="370" width="160" height="80" fill="#DCFCE7" rx="10" stroke="#16A34A" stroke-width="2"/>
  <text x="380" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">M_DATA</text>
  <text x="380" y="415" text-anchor="middle" font-size="10" fill="#166534">HWDATA = cache_wdata</text>
  <text x="380" y="430" text-anchor="middle" font-size="10" fill="#166534">HRDATA 래치 (Read)</text>
  <text x="380" y="445" text-anchor="middle" font-size="10" fill="#166534">HREADY = 1 필요</text>

  <!-- M_DONE (왼쪽) -->
  <rect x="60" y="200" width="160" height="70" fill="#F3E8FF" rx="10" stroke="#7C3AED" stroke-width="2"/>
  <text x="140" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C1D95">M_DONE</text>
  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#5B21B6">cache_ack = 1</text>
  <text x="140" y="263" text-anchor="middle" font-size="10" fill="#5B21B6">cache_rdata 유효</text>

  <!-- === 전이 화살표 === -->

  <!-- M_IDLE → M_ADDR : cache_req=1 -->
  <path d="M460 95 Q510 95 540 230" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="520" y="145" font-size="11" fill="#1D4ED8">cache_req=1</text>

  <!-- M_IDLE → M_IDLE : cache_req=0 (self-loop) -->
  <path d="M320 60 Q290 30 340 55" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGray)"/>
  <text x="275" y="40" font-size="10" fill="#64748B">cache_req=0</text>

  <!-- M_ADDR → M_DATA : HREADY=1 -->
  <path d="M620 280 Q620 320 500 370" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="548" y="338" font-size="11" fill="#15803D">HREADY=1</text>

  <!-- M_ADDR → M_WAIT : HREADY=0 -->
  <line x1="620" y1="280" x2="620" y2="370" stroke="#D97706" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="628" y="335" font-size="11" fill="#B45309">HREADY=0</text>

  <!-- M_WAIT → M_DATA : HREADY=1 -->
  <path d="M540 405 Q500 405 460 415" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="487" y="398" font-size="11" fill="#15803D">HREADY=1</text>

  <!-- M_WAIT → M_WAIT : HREADY=0 (self-loop) -->
  <path d="M700 380 Q740 380 740 420 Q740 460 700 440" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowOrange)"/>
  <text x="738" y="415" font-size="10" fill="#B45309">HREADY=0</text>

  <!-- M_DATA → M_DONE -->
  <path d="M300 400 Q220 400 220 265" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="185" y="350" font-size="11" fill="#6D28D9">전송 완료</text>

  <!-- M_DONE → M_IDLE -->
  <path d="M140 200 Q140 95 300 95" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="180" y="130" font-size="11" fill="#1D4ED8">cache_ack=1</text>
  <text x="185" y="143" font-size="11" fill="#1D4ED8">→ M_IDLE</text>

  <!-- 마커 정의 -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- 핵심 규칙 박스 -->
  <rect x="30" y="370" width="220" height="100" fill="#FFF7ED" rx="6" stroke="#FB923C" stroke-width="1.5"/>
  <text x="140" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2410C">핵심 규칙</text>
  <text x="40" y="413" font-size="10" fill="#7C2D12">① HWDATA는 M_DATA에서만 구동</text>
  <text x="40" y="428" font-size="10" fill="#7C2D12">② HREADY=0 → 모든 주소 신호 동결</text>
  <text x="40" y="443" font-size="10" fill="#7C2D12">③ cache_ack는 M_DONE 1사이클만</text>
  <text x="40" y="458" font-size="10" fill="#7C2D12">④ HADDR은 1사이클 전 구동 (파이프)</text>
</svg>
