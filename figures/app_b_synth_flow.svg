<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, monospace" font-size="13">
  <defs>
    <style>
      .box { rx: 8; ry: 8; }
      .box-label { fill: white; text-anchor: middle; font-size: 13px; font-weight: 600; }
      .box-sub { fill: white; text-anchor: middle; font-size: 10px; opacity: 0.8; }
      .arrow { stroke: #6B7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .note { fill: #6B7280; font-size: 10px; font-style: italic; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- RTL 소스 -->
  <rect x="20" y="30" width="120" height="60" class="box" fill="#2563EB"/>
  <text x="80" y="55" class="box-label">RTL 소스</text>
  <text x="80" y="72" class="box-sub">.sv 파일</text>

  <!-- 합성 -->
  <rect x="180" y="30" width="120" height="60" class="box" fill="#7C3AED"/>
  <text x="240" y="55" class="box-label">합성</text>
  <text x="240" y="72" class="box-sub">Synthesis</text>

  <!-- 리소스 매핑 -->
  <rect x="340" y="30" width="140" height="60" class="box" fill="#059669"/>
  <text x="410" y="55" class="box-label">리소스 매핑</text>
  <text x="410" y="72" class="box-sub">LUT/BRAM/DSP</text>

  <!-- 배치배선 -->
  <rect x="520" y="30" width="140" height="60" class="box" fill="#D97706"/>
  <text x="590" y="55" class="box-label">배치배선</text>
  <text x="590" y="72" class="box-sub">Place &amp; Route</text>

  <!-- 화살표 -->
  <line x1="140" y1="60" x2="178" y2="60" class="arrow"/>
  <line x1="300" y1="60" x2="338" y2="60" class="arrow"/>
  <line x1="480" y1="60" x2="518" y2="60" class="arrow"/>

  <!-- 추론 결정 박스 -->
  <rect x="180" y="130" width="300" height="130" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="330" y="152" fill="#374151" font-size="12" font-weight="600" text-anchor="middle">합성기 추론 규칙 (Inference Rules)</text>

  <rect x="200" y="165" width="80" height="30" rx="4" fill="#DBEAFE"/>
  <text x="240" y="184" fill="#2563EB" font-size="11" text-anchor="middle">BRAM</text>
  <text x="240" y="200" fill="#6B7280" font-size="9" text-anchor="middle">동기 읽기/쓰기</text>

  <rect x="290" y="165" width="80" height="30" rx="4" fill="#D1FAE5"/>
  <text x="330" y="184" fill="#059669" font-size="11" text-anchor="middle">LUTRAM</text>
  <text x="330" y="200" fill="#6B7280" font-size="9" text-anchor="middle">비동기 읽기</text>

  <rect x="380" y="165" width="80" height="30" rx="4" fill="#FEF3C7"/>
  <text x="420" y="184" fill="#D97706" font-size="11" text-anchor="middle">DSP48E1</text>
  <text x="420" y="200" fill="#6B7280" font-size="9" text-anchor="middle">곱셈/MAC</text>

  <text x="330" y="230" fill="#6B7280" font-size="10" text-anchor="middle">코딩 패턴에 따라 합성기가 자동 결정</text>
  <text x="330" y="245" fill="#6B7280" font-size="10" text-anchor="middle">(* ram_style *), (* use_dsp *) 속성으로 수동 제어 가능</text>

  <!-- 연결선 -->
  <line x1="240" y1="90" x2="240" y2="128" class="arrow" stroke-dasharray="4,3"/>

  <!-- 비트스트림 -->
  <rect x="580" y="130" width="110" height="50" class="box" fill="#DC2626"/>
  <text x="635" y="155" class="box-label">비트스트림</text>
  <text x="635" y="170" class="box-sub">.bit 파일</text>
  <line x1="590" y1="90" x2="635" y2="128" class="arrow"/>
</svg>