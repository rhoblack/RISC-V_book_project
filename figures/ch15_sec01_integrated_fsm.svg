<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="900" height="620" fill="#F8FAFC" rx="12"/>

  <!-- 제목 -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">통합 캐시-메모리 인터페이스 블록 다이어그램</text>

  <!-- ===== I-Cache FSM 블록 (좌상단) ===== -->
  <rect x="30" y="60" width="340" height="230" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">I-Cache FSM</text>

  <!-- FSM 상태 박스들 -->
  <!-- IDLE -->
  <rect x="60" y="100" width="80" height="36" rx="6" fill="#2563EB" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="white">IDLE</text>
  <!-- MISS -->
  <rect x="175" y="100" width="80" height="36" rx="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="215" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MISS</text>
  <!-- WAIT_GRANT -->
  <rect x="60" y="170" width="110" height="36" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="115" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="white">WAIT_GRANT</text>
  <!-- FILL -->
  <rect x="200" y="170" width="80" height="36" rx="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="240" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="white">FILL×8</text>
  <!-- DONE -->
  <rect x="270" y="100" width="80" height="36" rx="6" fill="#2563EB" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="310" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DONE</text>

  <!-- 화살표: IDLE→MISS -->
  <line x1="140" y1="118" x2="175" y2="118" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="157" y="112" text-anchor="middle" font-size="9" fill="#374151">miss</text>
  <!-- 화살표: MISS→WAIT_GRANT -->
  <line x1="215" y1="136" x2="170" y2="170" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="160" text-anchor="middle" font-size="9" fill="#374151">req</text>
  <!-- 화살표: WAIT_GRANT→FILL -->
  <line x1="170" y1="188" x2="200" y2="188" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="182" text-anchor="middle" font-size="9" fill="#374151">grant</text>
  <!-- 화살표: FILL→DONE -->
  <line x1="280" y1="170" x2="310" y2="136" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="160" text-anchor="middle" font-size="9" fill="#374151">beat=7</text>
  <!-- 화살표: DONE→IDLE -->
  <line x1="310" y1="100" x2="140" y2="110" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- 신호 레이블 -->
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#374151">stall: MISS | WAIT_GRANT | FILL</text>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#374151">출력: icache_req, icache_addr[31:0]</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#374151">입력: icache_ack, icache_rdata[31:0]</text>

  <!-- ===== D-Cache FSM 블록 (좌하단) ===== -->
  <rect x="30" y="310" width="340" height="270" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532D">D-Cache FSM</text>

  <!-- IDLE_D -->
  <rect x="45" y="350" width="70" height="32" rx="6" fill="#16A34A" stroke="#14532D" stroke-width="1.5"/>
  <text x="80" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="white">IDLE</text>
  <!-- TAG_CHECK -->
  <rect x="140" y="350" width="90" height="32" rx="6" fill="#22C55E" stroke="#14532D" stroke-width="1.5"/>
  <text x="185" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="white">TAG_CHECK</text>
  <!-- WAIT_WB_GRANT -->
  <rect x="45" y="415" width="110" height="32" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="100" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="white">WAIT_WB_GRANT</text>
  <!-- WRITE_BACK -->
  <rect x="180" y="415" width="90" height="32" rx="6" fill="#22C55E" stroke="#14532D" stroke-width="1.5"/>
  <text x="225" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="white">WRITE_BACK</text>
  <!-- WAIT_REFILL_GRANT -->
  <rect x="45" y="480" width="130" height="32" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="110" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="white">WAIT_REFILL_GRANT</text>
  <!-- REFILL -->
  <rect x="195" y="480" width="70" height="32" rx="6" fill="#22C55E" stroke="#14532D" stroke-width="1.5"/>
  <text x="230" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="white">REFILL</text>
  <!-- UPDATE -->
  <rect x="280" y="480" width="70" height="32" rx="6" fill="#16A34A" stroke="#14532D" stroke-width="1.5"/>
  <text x="315" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="white">UPDATE</text>

  <!-- D-Cache 화살표들 -->
  <line x1="115" y1="366" x2="140" y2="366" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <line x1="155" y1="382" x2="100" y2="415" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <text x="118" y="408" text-anchor="middle" font-size="9" fill="#374151">dirty miss</text>
  <line x1="155" y1="415" x2="195" y2="447" stroke="#14532D" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow_g)"/>
  <text x="200" y="408" text-anchor="middle" font-size="9" fill="#374151">clean miss</text>
  <line x1="155" y1="431" x2="180" y2="431" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <text x="167" y="425" text-anchor="middle" font-size="9" fill="#374151">grant</text>
  <line x1="225" y1="447" x2="175" y2="480" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <line x1="230" y1="447" x2="230" y2="480" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <text x="250" y="468" text-anchor="middle" font-size="9" fill="#374151">grant</text>
  <line x1="265" y1="496" x2="280" y2="496" stroke="#14532D" stroke-width="1.5" marker-end="url(#arrow_g)"/>
  <!-- UPDATE back to IDLE -->
  <path d="M315 512 Q315 545 80 545 Q80 533 80 382" fill="none" stroke="#14532D" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow_g)"/>

  <!-- 신호 레이블 D-Cache -->
  <text x="200" y="558" text-anchor="middle" font-size="11" fill="#374151">stall: TAG_CHECK~UPDATE (miss 시)</text>

  <!-- ===== Arbiter 블록 (우측 중단) ===== -->
  <rect x="530" y="220" width="180" height="160" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="620" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">중재기 (Arbiter)</text>
  <text x="620" y="265" text-anchor="middle" font-size="12" fill="#92400E">D-Cache 우선</text>

  <!-- Arbiter FSM 상태 -->
  <rect x="550" y="278" width="80" height="28" rx="5" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <text x="590" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="white">ARB_IDLE</text>
  <rect x="548" y="326" width="84" height="28" rx="5" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  <text x="590" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">ARB_SERVE_D</text>
  <rect x="648" y="326" width="48" height="28" rx="5" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
  <text x="672" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350F">SERVE_I</text>

  <line x1="590" y1="306" x2="590" y2="326" stroke="#92400E" stroke-width="1.5" marker-end="url(#arrow_o)"/>
  <line x1="672" y1="306" x2="672" y2="326" stroke="#92400E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow_o)"/>
  <line x1="630" y1="278" x2="672" y2="278" stroke="none"/>
  <text x="590" y="370" text-anchor="middle" font-size="10" fill="#78350F">D우선 / I는 D 없을 때</text>

  <!-- ===== Main SRAM 블록 (하단 중앙) ===== -->
  <rect x="530" y="450" width="300" height="120" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="680" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B0764">Main SRAM</text>
  <text x="680" y="494" text-anchor="middle" font-size="11" fill="#5B21B6">16KB (MEM_DEPTH=16384)</text>
  <text x="680" y="512" text-anchor="middle" font-size="11" fill="#5B21B6">블록 RAM (* ram_style="block" *)</text>
  <text x="680" y="530" text-anchor="middle" font-size="11" fill="#5B21B6">8-beat 버스트 인터페이스</text>
  <text x="680" y="548" text-anchor="middle" font-size="11" fill="#5B21B6">addr[31:0] · rdata/wdata[31:0]</text>

  <!-- ===== 연결 화살표 ===== -->
  <!-- I-Cache → Arbiter -->
  <line x1="370" y1="175" x2="530" y2="280" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow_b)"/>
  <text x="455" y="210" text-anchor="middle" font-size="11" fill="#1D4ED8">icache_req</text>
  <text x="455" y="224" text-anchor="middle" font-size="11" fill="#1D4ED8">icache_addr</text>

  <!-- D-Cache → Arbiter -->
  <line x1="370" y1="400" x2="530" y2="360" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow_b)"/>
  <text x="460" y="387" text-anchor="middle" font-size="11" fill="#15803D">dcache_req/wen</text>
  <text x="460" y="401" text-anchor="middle" font-size="11" fill="#15803D">dcache_addr</text>

  <!-- Arbiter → SRAM -->
  <line x1="620" y1="380" x2="620" y2="450" stroke="#D97706" stroke-width="2" marker-end="url(#arrow_b)"/>
  <text x="660" y="420" text-anchor="middle" font-size="11" fill="#78350F">mem_req/wen</text>
  <text x="660" y="434" text-anchor="middle" font-size="11" fill="#78350F">mem_addr</text>

  <!-- SRAM → Arbiter (ack/rdata) -->
  <line x1="740" y1="450" x2="720" y2="380" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow_p)"/>
  <text x="780" y="420" text-anchor="middle" font-size="11" fill="#6D28D9">mem_ack</text>
  <text x="780" y="434" text-anchor="middle" font-size="11" fill="#6D28D9">mem_rdata</text>

  <!-- grant back to caches -->
  <line x1="530" y1="300" x2="370" y2="185" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow_o)"/>
  <text x="448" y="254" text-anchor="middle" font-size="10" fill="#D97706">grant_i</text>
  <line x1="530" y1="340" x2="370" y2="410" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow_o)"/>
  <text x="448" y="370" text-anchor="middle" font-size="10" fill="#D97706">grant_d</text>

  <!-- 범례 -->
  <rect x="530" y="60" width="340" height="145" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <text x="700" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">범례 및 신호 설명</text>
  <rect x="548" y="95" width="12" height="12" fill="#EF4444"/>
  <text x="566" y="106" font-size="11" fill="#374151">신규 상태 (Ch15에서 추가)</text>
  <rect x="548" y="115" width="12" height="12" fill="#2563EB"/>
  <text x="566" y="126" font-size="11" fill="#374151">I-Cache 상태</text>
  <rect x="548" y="135" width="12" height="12" fill="#22C55E"/>
  <text x="566" y="146" font-size="11" fill="#374151">D-Cache 상태</text>
  <line x1="548" y1="160" x2="560" y2="160" stroke="#374151" stroke-width="2"/>
  <text x="566" y="164" font-size="11" fill="#374151">요청/응답 신호 흐름</text>
  <line x1="548" y1="178" x2="560" y2="178" stroke="#374151" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="566" y="182" font-size="11" fill="#374151">승인/반환 신호 흐름</text>
  <text x="548" y="198" font-size="10" fill="#6B7280">미스 페널티: I-Cache 11사이클 / D-Cache Clean 11사이클 / Dirty 19사이클</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1E40AF"/>
    </marker>
    <marker id="arrow_g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#14532D"/>
    </marker>
    <marker id="arrow_b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1E40AF"/>
    </marker>
    <marker id="arrow_o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D97706"/>
    </marker>
    <marker id="arrow_p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
