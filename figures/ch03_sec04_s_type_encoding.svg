<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <style>
      .field-bg { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1.5; }
      .field-bg-alt { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .field-imm { fill: #E0E7FF; stroke: #4F46E5; stroke-width: 2; }
      .field-label { font-size: 13px; fill: #1E293B; font-weight: 600; text-anchor: middle; }
      .field-name { font-size: 11px; fill: #2563EB; font-weight: 600; text-anchor: middle; }
      .title { font-size: 16px; fill: #1E293B; font-weight: 700; }
      .bit-range { font-size: 9px; fill: #9CA3AF; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
      .imm-note { font-size: 10px; fill: #4F46E5; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <text x="400" y="25" text-anchor="middle" class="title">S 타입 명령어 인코딩 (S-Type Encoding)</text>

  <text x="80" y="50" class="bit-range">31    25</text>
  <text x="190" y="50" class="bit-range">24  20</text>
  <text x="290" y="50" class="bit-range">19  15</text>
  <text x="390" y="50" class="bit-range">14  12</text>
  <text x="510" y="50" class="bit-range">11     7</text>
  <text x="660" y="50" class="bit-range">6        0</text>

  <!-- Fields - imm fields highlighted -->
  <rect x="20" y="60" width="120" height="45" rx="4" class="field-imm"/>
  <rect x="140" y="60" width="100" height="45" rx="4" class="field-bg-alt"/>
  <rect x="240" y="60" width="100" height="45" rx="4" class="field-bg"/>
  <rect x="340" y="60" width="100" height="45" rx="4" class="field-bg-alt"/>
  <rect x="440" y="60" width="140" height="45" rx="4" class="field-imm"/>
  <rect x="580" y="60" width="200" height="45" rx="4" class="field-bg"/>

  <text x="80" y="87" class="field-label" style="fill:#4F46E5;">imm[11:5]</text>
  <text x="190" y="87" class="field-label">rs2</text>
  <text x="290" y="87" class="field-label">rs1</text>
  <text x="390" y="87" class="field-label">funct3</text>
  <text x="510" y="87" class="field-label" style="fill:#4F46E5;">imm[4:0]</text>
  <text x="680" y="87" class="field-label">opcode</text>

  <text x="80" y="125" class="field-name">7비트</text>
  <text x="190" y="125" class="field-name">5비트</text>
  <text x="290" y="125" class="field-name">5비트</text>
  <text x="390" y="125" class="field-name">3비트</text>
  <text x="510" y="125" class="field-name">5비트</text>
  <text x="680" y="125" class="field-name">7비트</text>

  <!-- Opcode -->
  <text x="680" y="145" class="bit-range" style="font-size:11px; fill:#2563EB;">0100011</text>

  <!-- Note about split immediate -->
  <text x="400" y="168" text-anchor="middle" class="imm-note">즉치수 12비트가 두 곳(imm[11:5], imm[4:0])으로 분리 — rd 필드 위치에 imm[4:0] 배치</text>
  <line x1="80" y1="110" x2="510" y2="110" stroke="#4F46E5" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
</svg>