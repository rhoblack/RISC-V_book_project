<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="850" height="520" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="425" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">C 프로그램 컴파일에서 FPGA 실행까지</text>
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#64748B">riscv32-unknown-elf-gcc 크로스 컴파일 툴체인 흐름</text>

  <!-- Phase 1: C 소스 -->
  <rect x="30" y="80" width="130" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">C 소스</text>
  <text x="95" y="130" text-anchor="middle" font-size="10" fill="#1E293B">main.c</text>
  <text x="95" y="148" text-anchor="middle" font-size="9" fill="#64748B">drivers.c</text>

  <line x1="165" y1="125" x2="195" y2="125" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Phase 2: 컴파일러 -->
  <rect x="200" y="80" width="130" height="90" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#4F46E5">riscv32-</text>
  <text x="265" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#4F46E5">unknown-elf-gcc</text>
  <text x="265" y="143" text-anchor="middle" font-size="9" fill="#64748B">-march=rv32i</text>
  <text x="265" y="158" text-anchor="middle" font-size="9" fill="#64748B">-mabi=ilp32</text>

  <line x1="335" y1="125" x2="365" y2="125" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Phase 3: 어셈블리 -->
  <rect x="370" y="80" width="120" height="90" rx="8" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#0EA5E9">어셈블리</text>
  <text x="430" y="130" text-anchor="middle" font-size="10" fill="#1E293B">.s 파일</text>
  <text x="430" y="148" text-anchor="middle" font-size="9" fill="#64748B">+ startup.S</text>

  <line x1="495" y1="125" x2="525" y2="125" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Phase 4: 링커 -->
  <rect x="530" y="80" width="130" height="90" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">링커 (ld)</text>
  <text x="595" y="128" text-anchor="middle" font-size="10" fill="#1E293B">+ linker.ld</text>
  <text x="595" y="148" text-anchor="middle" font-size="9" fill="#64748B">섹션 배치</text>
  <text x="595" y="162" text-anchor="middle" font-size="9" fill="#64748B">주소 할당</text>

  <line x1="665" y1="125" x2="695" y2="125" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Phase 5: ELF -->
  <rect x="700" y="80" width="120" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">ELF 파일</text>
  <text x="760" y="130" text-anchor="middle" font-size="10" fill="#1E293B">firmware.elf</text>
  <text x="760" y="148" text-anchor="middle" font-size="9" fill="#64748B">실행 가능 바이너리</text>

  <!-- 아래로 화살표 -->
  <line x1="760" y1="175" x2="760" y2="215" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Phase 6: objcopy -->
  <rect x="700" y="220" width="120" height="60" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">objcopy</text>
  <text x="760" y="266" text-anchor="middle" font-size="9" fill="#64748B">.bin / .hex 변환</text>

  <line x1="695" y1="250" x2="575" y2="250" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Phase 7: Vivado -->
  <rect x="410" y="220" width="160" height="60" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">Vivado 프로젝트</text>
  <text x="490" y="263" text-anchor="middle" font-size="9" fill="#64748B">BRAM 초기화 / COE 파일</text>

  <line x1="405" y1="250" x2="325" y2="250" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Phase 8: Bitstream -->
  <rect x="180" y="220" width="140" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">비트스트림</text>
  <text x="250" y="263" text-anchor="middle" font-size="9" fill="#64748B">.bit 파일 생성</text>

  <line x1="175" y1="250" x2="135" y2="250" stroke="#D97706" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Phase 9: FPGA -->
  <rect x="20" y="215" width="110" height="70" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Basys 3</text>
  <text x="75" y="265" text-anchor="middle" font-size="10" fill="#1E293B">FPGA 실행!</text>

  <!-- ===== 하단: 부팅 시퀀스 ===== -->
  <rect x="30" y="320" width="790" height="180" rx="8" fill="#FFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">FPGA 부팅 시퀀스 (Reset 해제 후)</text>

  <!-- Step 1 -->
  <rect x="55" y="365" width="140" height="55" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="125" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">1. Reset Vector</text>
  <text x="125" y="400" text-anchor="middle" font-size="9" fill="#1E293B">PC = 0x0000_0000</text>
  <text x="125" y="413" text-anchor="middle" font-size="9" fill="#64748B">_start 진입</text>

  <line x1="200" y1="392" x2="225" y2="392" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 2 -->
  <rect x="230" y="365" width="140" height="55" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">2. 스택 초기화</text>
  <text x="300" y="400" text-anchor="middle" font-size="9" fill="#1E293B">sp = _stack_top</text>
  <text x="300" y="413" text-anchor="middle" font-size="9" fill="#64748B">gp = __global_pointer</text>

  <line x1="375" y1="392" x2="400" y2="392" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 3 -->
  <rect x="405" y="365" width="140" height="55" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">3. .bss 클리어</text>
  <text x="475" y="400" text-anchor="middle" font-size="9" fill="#1E293B">_bss_start ~ _bss_end</text>
  <text x="475" y="413" text-anchor="middle" font-size="9" fill="#64748B">0으로 초기화 루프</text>

  <line x1="550" y1="392" x2="575" y2="392" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Step 4 -->
  <rect x="580" y="365" width="110" height="55" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="635" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">4. .data 복사</text>
  <text x="635" y="400" text-anchor="middle" font-size="9" fill="#1E293B">ROM → RAM</text>
  <text x="635" y="413" text-anchor="middle" font-size="9" fill="#64748B">(필요 시)</text>

  <line x1="695" y1="392" x2="720" y2="392" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Step 5 -->
  <rect x="725" y="365" width="80" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="765" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">5. main()</text>
  <text x="765" y="405" text-anchor="middle" font-size="9" fill="#1E293B">C 진입!</text>

  <!-- 하단 주석 -->
  <text x="425" y="465" text-anchor="middle" font-size="10" fill="#64748B">startup.S 어셈블리가 1~4 단계를 수행한 뒤, C 런타임 환경이 준비되면 main() 함수를 호출합니다.</text>
  <text x="425" y="485" text-anchor="middle" font-size="10" fill="#64748B">main()에서 리턴하면 무한 루프(wfi)로 진입하여 프로세서가 안전하게 정지합니다.</text>
</svg>