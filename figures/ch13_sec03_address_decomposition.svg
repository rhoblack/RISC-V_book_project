<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">캐시 주소 분해 연습</text>
  <text x="375" y="48" text-anchor="middle" font-size="12" fill="#6B7280">4KB 직접 매핑 캐시 (128 엔트리, 32B 블록)</text>

  <!-- Example 1 -->
  <text x="30" y="82" font-size="14" font-weight="bold" fill="#2563EB">예제 1: 주소 0x0000_1A60</text>

  <!-- Binary breakdown -->
  <text x="30" y="105" font-size="11" fill="#6B7280">이진수:</text>
  <text x="90" y="105" font-size="12" font-family="monospace" fill="#1F2937">0000 0000 0000 0000 0001 1010 0110 0000</text>

  <!-- Colored fields -->
  <rect x="90" y="112" width="260" height="24" rx="3" fill="#2563EB" opacity="0.15"/>
  <rect x="350" y="112" width="91" height="24" rx="3" fill="#3B82F6" opacity="0.2"/>
  <rect x="441" y="112" width="65" height="24" rx="3" fill="#60A5FA" opacity="0.2"/>

  <text x="220" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Tag = 0x00001</text>
  <text x="395" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B82F6">Index = 83 (0x53)</text>
  <text x="473" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#60A5FA">Offset = 0</text>

  <text x="30" y="158" font-size="12" fill="#1F2937">결과: 캐시 엔트리 <tspan font-weight="bold" fill="#3B82F6">#83</tspan>에 접근, Tag <tspan font-weight="bold" fill="#2563EB">0x00001</tspan>과 비교, 블록 내 <tspan font-weight="bold" fill="#60A5FA">첫 번째 워드</tspan></text>

  <!-- Example 2 -->
  <text x="30" y="200" font-size="14" font-weight="bold" fill="#2563EB">예제 2: 주소 0x0000_1A64</text>
  <text x="30" y="223" font-size="11" fill="#6B7280">이진수:</text>
  <text x="90" y="223" font-size="12" font-family="monospace" fill="#1F2937">0000 0000 0000 0000 0001 1010 0110 0100</text>

  <rect x="90" y="230" width="260" height="24" rx="3" fill="#2563EB" opacity="0.15"/>
  <rect x="350" y="230" width="91" height="24" rx="3" fill="#3B82F6" opacity="0.2"/>
  <rect x="441" y="230" width="65" height="24" rx="3" fill="#60A5FA" opacity="0.2"/>

  <text x="220" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Tag = 0x00001</text>
  <text x="395" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B82F6">Index = 83 (0x53)</text>
  <text x="473" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#60A5FA">Offset = 4</text>

  <text x="30" y="276" font-size="12" fill="#1F2937">결과: 같은 캐시 엔트리 <tspan font-weight="bold" fill="#3B82F6">#83</tspan> 접근 → <tspan font-weight="bold" fill="#059669">공간적 지역성으로 히트!</tspan> (블록 내 <tspan font-weight="bold" fill="#60A5FA">두 번째 워드</tspan>)</text>

  <!-- Example 3: Conflict -->
  <text x="30" y="318" font-size="14" font-weight="bold" fill="#DC2626">예제 3: 충돌 미스 — 주소 0x0001_1A60</text>
  <text x="30" y="341" font-size="11" fill="#6B7280">이진수:</text>
  <text x="90" y="341" font-size="12" font-family="monospace" fill="#1F2937">0000 0000 0000 0001 0001 1010 0110 0000</text>

  <rect x="90" y="348" width="260" height="24" rx="3" fill="#DC2626" opacity="0.15"/>
  <rect x="350" y="348" width="91" height="24" rx="3" fill="#3B82F6" opacity="0.2"/>
  <rect x="441" y="348" width="65" height="24" rx="3" fill="#60A5FA" opacity="0.2"/>

  <text x="220" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">Tag = 0x00011 (다름!)</text>
  <text x="395" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B82F6">Index = 83 (동일)</text>
  <text x="473" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#60A5FA">Offset = 0</text>

  <text x="30" y="394" font-size="12" fill="#1F2937">결과: 같은 인덱스 <tspan font-weight="bold" fill="#3B82F6">#83</tspan>이지만 Tag 불일치 → <tspan font-weight="bold" fill="#DC2626">충돌 미스(Conflict Miss)</tspan> → 기존 블록 퇴출(eviction)</text>

  <!-- Key insight box -->
  <rect x="30" y="408" width="690" height="6" rx="3" fill="#2563EB"/>
</svg>