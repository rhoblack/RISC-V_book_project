<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="ad3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="adr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
    <marker id="adg3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#F8FAFC" rx="12"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">RV32I 멀티사이클 데이터패스 (Multicycle Datapath)</text>

  <!-- ====== FSM 제어 유닛 ====== -->
  <rect x="350" y="50" width="500" height="65" rx="8" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="600" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">FSM 제어 유닛 (FSM Control Unit)</text>
  <text x="600" y="100" text-anchor="middle" font-size="10" fill="#93C5FD">상태에 따라 제어 신호 출력: IorD, MemWrite, IRWrite, RegWrite, ALUSrcA, ALUSrcB, ALUOp, PCSrc, PCWrite ...</text>

  <!-- 제어 신호 버스 -->
  <line x1="600" y1="115" x2="600" y2="140" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="30" y1="140" x2="1170" y2="140" stroke="#DC2626" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="600" y="155" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">제어 신호 버스</text>

  <!-- ====== PC ====== -->
  <rect x="30" y="300" width="65" height="80" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="62" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">PC</text>
  <text x="62" y="355" text-anchor="middle" font-size="9" fill="#6B7280">32-bit</text>
  <text x="62" y="370" text-anchor="middle" font-size="8" fill="#DC2626">PCWrite</text>

  <!-- ====== IorD MUX (메모리 주소 선택) ====== -->
  <polygon points="120,295 120,380 150,365 150,310" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="135" y="342" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">MUX</text>
  <text x="135" y="290" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="600">IorD</text>

  <!-- PC --> IorD MUX -->
  <line x1="95" y1="320" x2="118" y2="320" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>
  <!-- ALUOut --> IorD MUX (아래에서) -->

  <!-- ====== 통합 메모리 (Memory) ====== -->
  <rect x="170" y="270" width="140" height="140" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="240" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">Memory</text>
  <text x="240" y="330" text-anchor="middle" font-size="11" fill="#6B7280">(통합 메모리)</text>
  <text x="240" y="350" text-anchor="middle" font-size="9" fill="#475569">Address ← MUX</text>
  <text x="240" y="365" text-anchor="middle" font-size="9" fill="#475569">Write Data ← B</text>
  <text x="240" y="385" text-anchor="middle" font-size="8" fill="#DC2626">MemRead / MemWrite</text>

  <!-- IorD MUX --> Memory -->
  <line x1="150" y1="338" x2="168" y2="338" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>

  <!-- ====== IR (명령어 레지스터) ====== -->
  <rect x="345" y="250" width="90" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="390" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">IR</text>
  <text x="390" y="293" text-anchor="middle" font-size="8" fill="#6B7280">명령어 레지스터</text>
  <text x="390" y="243" text-anchor="middle" font-size="8" fill="#DC2626">IRWrite</text>

  <!-- ====== MDR (메모리 데이터 레지스터) ====== -->
  <rect x="345" y="320" width="90" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="390" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">MDR</text>
  <text x="390" y="363" text-anchor="middle" font-size="8" fill="#6B7280">메모리 데이터 레지스터</text>

  <!-- Memory --> IR / MDR -->
  <path d="M 310,310 L 330,310 L 330,275 L 343,275" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>
  <path d="M 310,350 L 330,350 L 330,345 L 343,345" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>

  <!-- ====== 레지스터 파일 ====== -->
  <rect x="480" y="250" width="130" height="150" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="545" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Register</text>
  <text x="545" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">File</text>
  <text x="545" y="318" text-anchor="middle" font-size="10" fill="#6B7280">32 x 32-bit</text>
  <text x="500" y="340" font-size="9" fill="#475569">Read Reg 1 ← rs1</text>
  <text x="500" y="355" font-size="9" fill="#475569">Read Reg 2 ← rs2</text>
  <text x="500" y="370" font-size="9" fill="#475569">Write Reg ← rd</text>
  <text x="500" y="387" font-size="8" fill="#DC2626">RegWrite</text>

  <!-- IR --> RegFile (rs1, rs2, rd) -->
  <line x1="435" y1="275" x2="478" y2="275" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>
  <text x="457" y="268" font-size="8" fill="#6B7280">rs1/rs2/rd</text>

  <!-- ====== A 레지스터 ====== -->
  <rect x="650" y="260" width="70" height="45" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="685" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">A</text>
  <text x="685" y="298" text-anchor="middle" font-size="9" fill="#6B7280">rs1 data</text>

  <!-- ====== B 레지스터 ====== -->
  <rect x="650" y="320" width="70" height="45" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="685" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">B</text>
  <text x="685" y="358" text-anchor="middle" font-size="9" fill="#6B7280">rs2 data</text>

  <!-- RegFile --> A / B -->
  <path d="M 610,300 L 630,300 L 630,280 L 648,280" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>
  <path d="M 610,340 L 630,340 L 630,340 L 648,340" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>

  <!-- ====== ALU Source A MUX ====== -->
  <polygon points="750,250 750,320 780,310 780,260" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="290" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">A</text>
  <text x="765" y="245" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="600">ALUSrcA</text>

  <!-- A --> ALUSrcA MUX -->
  <line x1="720" y1="280" x2="748" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>
  <!-- PC --> ALUSrcA MUX -->
  <path d="M 62,300 L 62,210 L 740,210 L 740,265 L 748,265" stroke="#93C5FD" stroke-width="1" fill="none" marker-end="url(#ad3)"/>
  <text x="400" y="205" text-anchor="middle" font-size="8" fill="#6B7280">PC (for PC+4 or branch)</text>

  <!-- ====== ALU Source B MUX ====== -->
  <polygon points="750,340 750,440 780,425 780,355" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="395" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">B</text>
  <text x="765" y="335" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="600">ALUSrcB</text>

  <!-- B --> ALUSrcB MUX -->
  <line x1="720" y1="345" x2="735" y2="345 L 735,370" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M 720,345 L 735,345 L 735,370 L 748,370" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>

  <!-- 즉치수 (Immediate) -->
  <rect x="500" y="430" width="110" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="555" y="455" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">ImmGen</text>
  <!-- ImmGen --> ALUSrcB MUX -->
  <path d="M 610,450 L 740,450 L 740,410 L 748,410" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>

  <!-- 상수 4 --> ALUSrcB -->
  <text x="740" y="440" font-size="9" fill="#6B7280">4 (상수)</text>

  <!-- ====== ALU ====== -->
  <rect x="800" y="290" width="130" height="100" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="865" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">ALU</text>
  <text x="865" y="355" text-anchor="middle" font-size="11" fill="#DBEAFE">공유 ALU</text>
  <text x="865" y="375" text-anchor="middle" font-size="9" fill="#93C5FD">ALUOp</text>

  <!-- MUX A --> ALU -->
  <line x1="780" y1="285" x2="798" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>
  <!-- MUX B --> ALU -->
  <line x1="780" y1="390" x2="798" y2="370" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ad3)"/>

  <!-- ====== ALUOut 레지스터 ====== -->
  <rect x="960" y="310" width="90" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="1005" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">ALUOut</text>
  <text x="1005" y="355" text-anchor="middle" font-size="8" fill="#6B7280">ALU 결과 저장</text>

  <!-- ALU --> ALUOut -->
  <line x1="930" y1="340" x2="958" y2="340" stroke="#2563EB" stroke-width="2" marker-end="url(#ad3)"/>

  <!-- ALU Zero 플래그 --> Control -->
  <path d="M 865,290 L 865,230 L 850,230 L 850,115" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#adg3)"/>
  <text x="870" y="225" font-size="8" fill="#059669" font-weight="600">Zero</text>

  <!-- ====== PC Source MUX ====== -->
  <polygon points="1070,260 1070,340 1100,325 1100,275" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1085" y="305" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">PC</text>
  <text x="1085" y="255" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="600">PCSrc</text>

  <!-- ALU result --> PCSrc MUX (직접) -->
  <path d="M 930,320 L 945,320 L 945,280 L 1068,280" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>
  <text x="990" y="273" font-size="8" fill="#6B7280">ALU result</text>

  <!-- ALUOut --> PCSrc MUX -->
  <path d="M 1050,335 L 1060,335 L 1060,310 L 1068,310" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>
  <text x="1055" y="345" font-size="8" fill="#6B7280">ALUOut</text>

  <!-- PCSrc MUX --> PC (피드백) -->
  <path d="M 1100,300 L 1140,300 L 1140,500 L 45,500 L 45,380" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#adg3)"/>
  <text x="600" y="515" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">PC 갱신 경로 (PC Write-Back)</text>

  <!-- ALUOut --> IorD MUX (메모리 주소) -->
  <path d="M 1005,365 L 1005,470 L 125,470 L 125,360 L 118,360" stroke="#93C5FD" stroke-width="1" fill="none" marker-end="url(#ad3)"/>
  <text x="560" y="483" text-anchor="middle" font-size="8" fill="#6B7280">ALUOut (데이터 메모리 주소)</text>

  <!-- B --> Memory (store data) -->
  <path d="M 685,365 L 685,420 L 195,420 L 195,410" stroke="#93C5FD" stroke-width="1" fill="none" marker-end="url(#ad3)"/>
  <text x="440" y="432" font-size="8" fill="#6B7280">B (Write Data for Store)</text>

  <!-- ====== WB MUX (Write-Back Data) ====== -->
  <polygon points="1070,390 1070,470 1100,455 1100,405" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1085" y="435" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">WB</text>
  <text x="1085" y="385" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="600">MemtoReg</text>

  <!-- ALUOut --> WB MUX -->
  <path d="M 1050,340 L 1060,340 L 1060,415 L 1068,415" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>

  <!-- MDR --> WB MUX -->
  <path d="M 435,345 L 460,345 L 460,460 L 1068,460" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#ad3)"/>
  <text x="750" y="455" font-size="8" fill="#6B7280">MDR (Load 데이터)</text>

  <!-- WB MUX --> RegFile (Write-back) -->
  <path d="M 1100,430 L 1155,430 L 1155,560 L 545,560 L 545,400" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#adg3)"/>
  <text x="850" y="573" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">Write-Back 경로 (WB --> rd)</text>

  <!-- IR --> ImmGen -->
  <path d="M 390,305 L 390,320 L 460,320 L 460,445 L 498,445" stroke="#2563EB" stroke-width="1" fill="none" marker-end="url(#ad3)"/>

  <!-- ====== 범례 ====== -->
  <rect x="30" y="600" width="1140" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="600" y="625" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">범례 및 핵심 포인트</text>

  <rect x="50" y="640" width="18" height="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="2"/>
  <text x="78" y="652" font-size="11" fill="#475569">조합 논리 / 메모리 모듈</text>

  <rect x="50" y="662" width="18" height="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1" rx="2"/>
  <text x="78" y="674" font-size="11" fill="#475569">레지스터 (클럭 에지에서 래치)</text>

  <rect x="50" y="684" width="18" height="14" fill="#2563EB" stroke="#1D4ED8" stroke-width="1" rx="2"/>
  <text x="78" y="696" font-size="11" fill="#475569">ALU / 제어 유닛</text>

  <line x1="50" y1="714" x2="68" y2="714" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="78" y="718" font-size="11" fill="#475569">제어 신호</text>

  <line x1="50" y1="734" x2="68" y2="734" stroke="#059669" stroke-width="2"/>
  <text x="78" y="738" font-size="11" fill="#475569">피드백 / Write-Back 경로</text>

  <!-- 핵심 요점 (우측) -->
  <text x="450" y="652" font-size="12" font-weight="700" fill="#2563EB">핵심 구성 요소:</text>
  <text x="450" y="672" font-size="11" fill="#475569">1. 통합 메모리 (Memory) -- IMEM/DMEM을 하나로 공유 (Princeton 구조)</text>
  <text x="450" y="692" font-size="11" fill="#475569">2. 공유 ALU -- PC+4, 주소 계산, 연산 모두 처리</text>
  <text x="450" y="712" font-size="11" fill="#475569">3. 중간 레지스터 -- IR, MDR, A, B, ALUOut (단계 간 데이터 보존)</text>
  <text x="450" y="732" font-size="11" fill="#475569">4. MUX 증가 -- IorD, ALUSrcA, ALUSrcB, PCSrc, MemtoReg (자원 공유를 위한 선택)</text>
  <text x="450" y="752" font-size="11" fill="#475569">5. FSM 제어 -- 상태별 제어 신호 출력 (Ch08에서 상세 설계)</text>
</svg>