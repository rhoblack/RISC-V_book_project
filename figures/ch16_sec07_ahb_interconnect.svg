<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="850" height="550" fill="#F8FAFC" rx="8"/>
  <text x="425" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">AHB-Lite 인터커넥트 구조</text>
  <text x="425" y="48" text-anchor="middle" font-size="12" fill="#64748B">단일 마스터: 디코더 + 슬레이브 MUX</text>

  <!-- AHB Master -->
  <rect x="320" y="70" width="210" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="425" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">AHB Master</text>
  <text x="425" y="115" text-anchor="middle" font-size="10" fill="#64748B">CPU / 캐시-버스 브리지</text>

  <!-- 주소 버스 (하향) -->
  <line x1="370" y1="140" x2="370" y2="190" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="355" y="170" text-anchor="end" font-size="9" fill="#2563EB">HADDR</text>
  <text x="355" y="182" text-anchor="end" font-size="9" fill="#2563EB">HTRANS</text>

  <!-- 쓰기 데이터 버스 -->
  <line x1="480" y1="140" x2="480" y2="190" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="495" y="170" font-size="9" fill="#2563EB">HWDATA</text>
  <text x="495" y="182" font-size="9" fill="#2563EB">HWRITE</text>

  <!-- 주소 디코더 -->
  <rect x="280" y="190" width="180" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">주소 디코더</text>
  <text x="370" y="235" text-anchor="middle" font-size="9" fill="#1E293B">HADDR[31:28] → HSELx</text>

  <!-- HSEL 신호들 -->
  <line x1="300" y1="250" x2="300" y2="330" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="295" y="280" text-anchor="end" font-size="9" font-weight="600" fill="#D97706">HSEL0</text>

  <line x1="370" y1="250" x2="370" y2="330" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="365" y="280" text-anchor="end" font-size="9" font-weight="600" fill="#D97706">HSEL1</text>

  <line x1="440" y1="250" x2="440" y2="330" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="435" y="280" text-anchor="end" font-size="9" font-weight="600" fill="#D97706">HSEL2</text>

  <!-- 공유 버스 -->
  <rect x="100" y="290" width="650" height="16" rx="3" fill="#2563EB" opacity="0.15"/>
  <line x1="100" y1="298" x2="750" y2="298" stroke="#2563EB" stroke-width="2"/>
  <text x="75" y="302" text-anchor="end" font-size="9" fill="#2563EB">공유 버스</text>

  <!-- 슬레이브들 -->
  <!-- Slave 0: SRAM -->
  <rect x="70" y="330" width="170" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Slave 0</text>
  <text x="155" y="375" text-anchor="middle" font-size="11" fill="#1E293B">SRAM (16KB)</text>
  <text x="155" y="395" text-anchor="middle" font-size="9" fill="#64748B">0x0000_0000</text>
  <text x="155" y="410" text-anchor="middle" font-size="9" fill="#64748B">~ 0x0000_3FFF</text>

  <!-- Slave 1: APB Bridge -->
  <rect x="270" y="330" width="170" height="100" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="355" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">Slave 1</text>
  <text x="355" y="375" text-anchor="middle" font-size="11" fill="#1E293B">APB Bridge</text>
  <text x="355" y="395" text-anchor="middle" font-size="9" fill="#64748B">0x4000_0000</text>
  <text x="355" y="410" text-anchor="middle" font-size="9" fill="#64748B">~ 0x4FFF_FFFF</text>

  <!-- Slave 2: Default -->
  <rect x="470" y="330" width="170" height="100" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Default Slave</text>
  <text x="555" y="375" text-anchor="middle" font-size="11" fill="#1E293B">ERROR 응답</text>
  <text x="555" y="395" text-anchor="middle" font-size="9" fill="#64748B">미매핑 주소 →</text>
  <text x="555" y="410" text-anchor="middle" font-size="9" fill="#DC2626">HRESP = ERROR</text>

  <!-- 슬레이브 MUX -->
  <rect x="100" y="460" width="600" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">슬레이브 MUX (HRDATA / HREADY / HRESP 선택)</text>
  <text x="400" y="502" text-anchor="middle" font-size="9" fill="#64748B">디코더 출력(HSELx)으로 활성 슬레이브의 응답을 선택</text>

  <!-- 슬레이브 → MUX -->
  <line x1="155" y1="430" x2="155" y2="460" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="355" y1="430" x2="355" y2="460" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="555" y1="430" x2="555" y2="460" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- MUX → Master (응답) -->
  <line x1="700" y1="485" x2="780" y2="485" stroke="#059669" stroke-width="2"/>
  <line x1="780" y1="485" x2="780" y2="105" stroke="#059669" stroke-width="2"/>
  <line x1="780" y1="105" x2="530" y2="105" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="790" y="300" font-size="9" font-weight="600" fill="#059669">HRDATA</text>
  <text x="790" y="315" font-size="9" font-weight="600" fill="#059669">HREADY</text>
  <text x="790" y="330" font-size="9" font-weight="600" fill="#059669">HRESP</text>
</svg>