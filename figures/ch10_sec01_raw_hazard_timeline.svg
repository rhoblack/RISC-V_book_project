<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460"
     font-family="'Pretendard', 'Noto Sans KR', sans-serif">

  <!-- 배경 -->
  <rect width="860" height="460" fill="#F8FAFC" rx="8"/>

  <!-- 제목 바 -->
  <rect x="0" y="0" width="860" height="44" fill="#1E3A8A" rx="8"/>
  <rect x="0" y="36" width="860" height="8" fill="#1E3A8A"/>
  <text x="430" y="27" text-anchor="middle" fill="white" font-size="15" font-weight="bold">
    RAW 해저드: 포워딩이 없으면 잘못된 값 읽기
  </text>

  <!-- 범례 -->
  <rect x="28" y="54" width="12" height="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="2"/>
  <text x="46" y="65" fill="#1E40AF" font-size="11">명령어 A: ADD x1, x2, x3</text>
  <rect x="260" y="54" width="12" height="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="2"/>
  <text x="278" y="65" fill="#5B21B6" font-size="11">명령어 B: ADD x4, x1, x5</text>
  <rect x="490" y="54" width="12" height="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="2"/>
  <text x="508" y="65" fill="#991B1B" font-size="11">RAW 충돌</text>
  <rect x="610" y="54" width="12" height="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2"/>
  <text x="628" y="65" fill="#166534" font-size="11">포워딩 해결</text>

  <!-- 사이클 헤더 -->
  <rect x="118" y="76" width="720" height="28" fill="#1E3A8A" rx="4"/>
  <text x="60" y="95" text-anchor="middle" fill="#334155" font-size="11" font-weight="bold">명령어</text>

  <!-- 사이클 레이블 C1~C8 -->
  <text x="208" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C1</text>
  <text x="298" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C2</text>
  <text x="388" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C3</text>
  <text x="478" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C4</text>
  <text x="568" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C5</text>
  <text x="658" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C6</text>
  <text x="748" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C7</text>
  <text x="820" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C8</text>

  <!-- 그리드 세로선 -->
  <line x1="163" y1="76" x2="163" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="253" y1="76" x2="253" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="343" y1="76" x2="343" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="433" y1="76" x2="433" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="523" y1="76" x2="523" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="613" y1="76" x2="613" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="703" y1="76" x2="703" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="793" y1="76" x2="793" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="838" y1="76" x2="838" y2="310" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 명령어 A 행 레이블 -->
  <rect x="4" y="110" width="112" height="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="3"/>
  <text x="60" y="124" text-anchor="middle" fill="#1E40AF" font-size="9.5" font-weight="bold">ADD x1,x2,x3</text>
  <text x="60" y="136" text-anchor="middle" fill="#1E40AF" font-size="8.5">(명령어 A)</text>

  <!-- A: IF(C1) ID(C2) EX(C3) MEM(C4) WB(C5) -->
  <rect x="165" y="110" width="85" height="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="208" y="130" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="bold">IF</text>

  <rect x="255" y="110" width="85" height="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="298" y="130" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="bold">ID</text>

  <!-- EX(C3): x1 계산 중 - 강조 파란 -->
  <rect x="345" y="110" width="85" height="32" fill="#2563EB" stroke="#1E3A8A" stroke-width="2" rx="3"/>
  <text x="388" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EX</text>
  <text x="388" y="137" text-anchor="middle" fill="#BFDBFE" font-size="8.5">x1 계산 중</text>

  <rect x="435" y="110" width="85" height="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="478" y="130" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="bold">MEM</text>

  <!-- WB(C5): x1 쓰기 완료 - 초록 -->
  <rect x="525" y="110" width="85" height="32" fill="#16A34A" stroke="#166534" stroke-width="2" rx="3"/>
  <text x="568" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">WB</text>
  <text x="568" y="137" text-anchor="middle" fill="#BBF7D0" font-size="8.5">x1 쓰기 완료</text>

  <!-- 명령어 B 행 레이블 -->
  <rect x="4" y="168" width="112" height="32" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" rx="3"/>
  <text x="60" y="182" text-anchor="middle" fill="#5B21B6" font-size="9.5" font-weight="bold">ADD x4,x1,x5</text>
  <text x="60" y="194" text-anchor="middle" fill="#5B21B6" font-size="8.5">(명령어 B)</text>

  <!-- B: IF(C2) ID(C3-충돌!) EX(C4) MEM(C5) WB(C6) -->
  <rect x="255" y="168" width="85" height="32" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="298" y="188" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">IF</text>

  <!-- ID(C3): x1 읽기 시도 - 충돌! 빨간 -->
  <rect x="345" y="168" width="85" height="32" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" rx="3"/>
  <text x="388" y="183" text-anchor="middle" fill="#991B1B" font-size="11" font-weight="bold">ID</text>
  <text x="388" y="195" text-anchor="middle" fill="#DC2626" font-size="8.5">x1 읽기? ← ?!</text>

  <rect x="435" y="168" width="85" height="32" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="478" y="188" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">EX</text>

  <rect x="525" y="168" width="85" height="32" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="568" y="188" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">MEM</text>

  <rect x="615" y="168" width="85" height="32" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="658" y="188" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">WB</text>

  <!-- 충돌 구간 점선 박스 -->
  <rect x="341" y="104" width="93" height="103" fill="#FEE2E2" fill-opacity="0.3" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" rx="4"/>
  <text x="388" y="215" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">RAW 충돌!</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#EA580C"/>
    </marker>
  </defs>

  <!-- 빨간 화살표: x1 아직 없음 (A.EX → B.ID 에서 충돌 설명) -->
  <path d="M388,142 L388,165" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <rect x="320" y="228" width="175" height="50" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="4"/>
  <text x="408" y="244" text-anchor="middle" fill="#991B1B" font-size="10.5" font-weight="bold">C3 시점의 문제</text>
  <text x="408" y="257" text-anchor="middle" fill="#991B1B" font-size="9.5">A.EX: x1 ALU 계산 중 (미완료)</text>
  <text x="408" y="269" text-anchor="middle" fill="#991B1B" font-size="9.5">B.ID: x1 레지스터 파일 읽기 시도</text>

  <!-- 파란 화살표: x1 WB 완료 시점 (C5) -->
  <path d="M388,142 Q388,232 568,145" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <rect x="438" y="228" width="100" height="16" fill="#DBEAFE" rx="2"/>
  <text x="488" y="240" text-anchor="middle" fill="#1E40AF" font-size="9">x1 WB 완료: C5</text>

  <!-- 초록 화살표: EX-EX 포워딩 가능 경로 (C3.EX → C4.EX) -->
  <path d="M430,126 Q460,150 435,179" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <rect x="442" y="148" width="115" height="26" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" rx="3"/>
  <text x="499" y="160" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">포워딩 해결 가능!</text>
  <text x="499" y="170" text-anchor="middle" fill="#166534" font-size="8.5">EX→EX (2'b10)</text>

  <!-- 하단 설명 패널 -->
  <rect x="16" y="295" width="828" height="110" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5" rx="6"/>
  <text x="430" y="315" text-anchor="middle" fill="#0369A1" font-size="12" font-weight="bold">RAW(Read After Write) 해저드 발생 원리</text>
  <line x1="32" y1="320" x2="828" y2="320" stroke="#BAE6FD" stroke-width="1"/>
  <text x="32" y="337" fill="#0369A1" font-size="10.5">
    • 명령어 A가 C3(EX)에서 x1을 계산하는 동안, 명령어 B는 C3(ID)에서 x1을 레지스터 파일로부터 읽으려 함
  </text>
  <text x="32" y="353" fill="#0369A1" font-size="10.5">
    • x1 WB는 C5에 완료 → 포워딩 없이는 B가 읽는 x1 = 이전 명령어의 낡은 값(stale value), 결과 오류 발생
  </text>
  <text x="32" y="369" fill="#0369A1" font-size="10.5">
    • 해결: EX/MEM 레지스터의 alu_result_mem을 EX 입력 MUX로 직접 전달 (EX-EX 포워딩, forward_a = 2'b10)
  </text>
  <text x="32" y="390" fill="#475569" font-size="9.5" font-style="italic">
    * 조건: rs1_addr_ex == rd_addr_mem AND reg_write_mem == 1 AND rd_addr_mem != 0
  </text>

</svg>
