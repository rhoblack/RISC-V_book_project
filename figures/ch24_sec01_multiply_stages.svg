<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="420" viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="780" height="420" fill="#F8FAFC" rx="8"/>
  <text x="390" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">곱셈기 구현의 진화: 순차 → Booth → Wallace 트리 → DSP</text>
  <text x="390" y="44" text-anchor="middle" font-size="11" fill="#64748B">면적-속도 트레이드오프 — 왼쪽(느림/작음) → 오른쪽(빠름/큼)</text>

  <!-- Stage 1: 순차 시프트-덧셈 -->
  <g transform="translate(30, 70)">
    <rect width="160" height="280" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">① 순차 시프트-덧셈</text>
    <text x="80" y="42" text-anchor="middle" font-size="10" fill="#64748B">32사이클 · 최소 면적</text>

    <!-- 순차 루프 다이어그램 -->
    <rect x="20" y="60" width="120" height="30" rx="4" fill="#2563EB"/>
    <text x="80" y="80" text-anchor="middle" font-size="9" fill="white" font-weight="600">누적기(ACC) 64비트</text>

    <rect x="20" y="100" width="120" height="30" rx="4" fill="#3B82F6"/>
    <text x="80" y="120" text-anchor="middle" font-size="9" fill="white" font-weight="600">32비트 가산기</text>

    <rect x="20" y="140" width="120" height="30" rx="4" fill="#60A5FA"/>
    <text x="80" y="160" text-anchor="middle" font-size="9" fill="white" font-weight="600">시프터 (1비트/clk)</text>

    <!-- 루프 화살표 -->
    <path d="M140,115 Q155,115 155,90 Q155,75 140,75" fill="none" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="195" text-anchor="middle" font-size="9" fill="#1E40AF">×32회 반복</text>

    <rect x="20" y="210" width="120" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="80" y="227" text-anchor="middle" font-size="9" fill="#1E293B">지연: 32사이클</text>
    <text x="80" y="242" text-anchor="middle" font-size="9" fill="#1E293B">면적: 가산기 1개</text>
  </g>

  <!-- Stage 2: Booth Radix-4 -->
  <g transform="translate(210, 70)">
    <rect width="160" height="280" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">② Booth Radix-4</text>
    <text x="80" y="42" text-anchor="middle" font-size="10" fill="#64748B">16사이클 · 부분적 절반</text>

    <!-- 부분적 다이어그램 -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="130" height="18" rx="3" fill="#2563EB"/>
      <text x="65" y="13" text-anchor="middle" font-size="8" fill="white">PP0 (0, ±M, ±2M)</text>
      <rect x="0" y="22" width="130" height="18" rx="3" fill="#3B82F6"/>
      <text x="65" y="35" text-anchor="middle" font-size="8" fill="white">PP1 (0, ±M, ±2M)</text>
      <rect x="0" y="44" width="130" height="18" rx="3" fill="#60A5FA"/>
      <text x="65" y="57" text-anchor="middle" font-size="8" fill="white">PP2 ...</text>
      <text x="65" y="80" text-anchor="middle" font-size="10" fill="#64748B">⋮ (16개)</text>
      <rect x="0" y="88" width="130" height="18" rx="3" fill="#93C5FD"/>
      <text x="65" y="101" text-anchor="middle" font-size="8" fill="#1E293B">PP15</text>
    </g>

    <text x="80" y="180" text-anchor="middle" font-size="9" fill="#1E40AF">2비트씩 인코딩</text>
    <text x="80" y="195" text-anchor="middle" font-size="9" fill="#1E40AF">→ 부분적 32→16개</text>

    <rect x="20" y="210" width="120" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="80" y="227" text-anchor="middle" font-size="9" fill="#1E293B">지연: 16사이클</text>
    <text x="80" y="242" text-anchor="middle" font-size="9" fill="#1E293B">면적: 인코더+가산기</text>
  </g>

  <!-- Stage 3: Wallace/Dadda 트리 -->
  <g transform="translate(390, 70)">
    <rect width="160" height="280" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">③ Wallace/Dadda 트리</text>
    <text x="80" y="42" text-anchor="middle" font-size="10" fill="#64748B">1~3사이클 · 대면적</text>

    <!-- 트리 구조 -->
    <g transform="translate(20, 55)">
      <!-- Level 1: 16 부분적 -->
      <rect x="0" y="0" width="25" height="12" rx="2" fill="#2563EB"/>
      <rect x="28" y="0" width="25" height="12" rx="2" fill="#2563EB"/>
      <rect x="56" y="0" width="25" height="12" rx="2" fill="#2563EB"/>
      <rect x="84" y="0" width="25" height="12" rx="2" fill="#2563EB"/>
      <text x="60" y="28" text-anchor="middle" font-size="8" fill="#64748B">16개 → CSA 축소</text>

      <!-- Level 2 -->
      <rect x="14" y="38" width="30" height="12" rx="2" fill="#3B82F6"/>
      <rect x="50" y="38" width="30" height="12" rx="2" fill="#3B82F6"/>
      <rect x="86" y="38" width="30" height="12" rx="2" fill="#3B82F6"/>
      <text x="60" y="66" text-anchor="middle" font-size="8" fill="#64748B">11개 → CSA 축소</text>

      <!-- Level 3 -->
      <rect x="25" y="76" width="30" height="12" rx="2" fill="#60A5FA"/>
      <rect x="65" y="76" width="30" height="12" rx="2" fill="#60A5FA"/>
      <text x="60" y="104" text-anchor="middle" font-size="8" fill="#64748B">... → 최종 2개</text>

      <!-- Final CPA -->
      <rect x="10" y="114" width="100" height="18" rx="4" fill="#1E40AF"/>
      <text x="60" y="127" text-anchor="middle" font-size="8" fill="white" font-weight="600">최종 CPA (64비트)</text>
    </g>

    <text x="80" y="200" text-anchor="middle" font-size="9" fill="#1E40AF">O(log n) 깊이</text>

    <rect x="20" y="210" width="120" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="80" y="227" text-anchor="middle" font-size="9" fill="#1E293B">지연: 1~3사이클</text>
    <text x="80" y="242" text-anchor="middle" font-size="9" fill="#1E293B">면적: CSA 다수</text>
  </g>

  <!-- Stage 4: FPGA DSP -->
  <g transform="translate(570, 70)">
    <rect width="180" height="280" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">④ FPGA DSP 슬라이스</text>
    <text x="90" y="42" text-anchor="middle" font-size="10" fill="#64748B">1사이클 · 전용 하드웨어</text>

    <!-- DSP48E1 블록 -->
    <rect x="20" y="60" width="140" height="100" rx="6" fill="#059669"/>
    <text x="90" y="82" text-anchor="middle" font-size="11" fill="white" font-weight="700">DSP48E1</text>
    <text x="90" y="100" text-anchor="middle" font-size="9" fill="#DCFCE7">25×18비트 곱셈기</text>
    <text x="90" y="116" text-anchor="middle" font-size="9" fill="#DCFCE7">48비트 누적기</text>
    <text x="90" y="132" text-anchor="middle" font-size="9" fill="#DCFCE7">내장 파이프라인</text>

    <text x="90" y="180" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">Vivado가 * 연산자를</text>
    <text x="90" y="195" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">자동으로 DSP에 매핑</text>

    <rect x="20" y="210" width="140" height="40" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="90" y="227" text-anchor="middle" font-size="9" fill="#1E293B">지연: 1사이클</text>
    <text x="90" y="242" text-anchor="middle" font-size="9" fill="#1E293B">면적: DSP 2~4개</text>
  </g>

  <!-- 화살표 (진화 방향) -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <line x1="195" y1="380" x2="380" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="375" y1="380" x2="560" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="390" y="405" text-anchor="middle" font-size="10" fill="#64748B">면적 증가 · 지연 감소 →</text>
</svg>
