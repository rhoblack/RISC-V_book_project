<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="580" viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="780" height="580" fill="#F8FAFC" rx="8"/>
  <text x="390" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Tomasulo 구조 블록 다이어그램</text>
  <text x="390" y="44" text-anchor="middle" font-size="11" fill="#64748B">예약 스테이션 + CDB 브로드캐스트 + ROB(Reorder Buffer)</text>

  <defs>
    <marker id="aT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="aTB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="aTR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 명령어 큐 -->
  <rect x="300" y="60" width="180" height="45" rx="6" fill="#1E40AF" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="white">명령어 큐</text>
  <text x="390" y="96" text-anchor="middle" font-size="8" fill="#BFDBFE">Instruction Queue (Fetch + Decode)</text>

  <!-- 디스패치/이슈 화살표 -->
  <line x1="350" y1="105" x2="150" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#aT)"/>
  <line x1="390" y1="105" x2="390" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#aT)"/>
  <line x1="430" y1="105" x2="630" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#aT)"/>
  <text x="390" y="140" text-anchor="middle" font-size="8" fill="#64748B">이슈 (Issue)</text>

  <!-- 예약 스테이션 1: ALU -->
  <rect x="60" y="163" width="180" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="150" y="183" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">예약 스테이션 (ALU)</text>
  <text x="150" y="200" text-anchor="middle" font-size="8" fill="#2563EB">Reservation Station</text>
  <g transform="translate(75, 210)">
    <rect x="0" y="0" width="150" height="15" rx="2" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="5" y="11" font-size="7" fill="#64748B" font-family="monospace">Op | Vj | Vk | Qj | Qk | Busy</text>
  </g>
  <text x="150" y="238" text-anchor="middle" font-size="7" fill="#94A3B8">오퍼랜드 준비 시 실행 시작</text>

  <!-- 예약 스테이션 2: MUL/DIV -->
  <rect x="300" y="163" width="180" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="390" y="183" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">예약 스테이션 (MUL)</text>
  <text x="390" y="200" text-anchor="middle" font-size="8" fill="#2563EB">Reservation Station</text>
  <g transform="translate(315, 210)">
    <rect x="0" y="0" width="150" height="15" rx="2" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="5" y="11" font-size="7" fill="#64748B" font-family="monospace">Op | Vj | Vk | Qj | Qk | Busy</text>
  </g>

  <!-- 예약 스테이션 3: Load/Store -->
  <rect x="540" y="163" width="180" height="80" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="630" y="183" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">예약 스테이션 (MEM)</text>
  <text x="630" y="200" text-anchor="middle" font-size="8" fill="#2563EB">Load/Store Buffer</text>
  <g transform="translate(555, 210)">
    <rect x="0" y="0" width="150" height="15" rx="2" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="5" y="11" font-size="7" fill="#64748B" font-family="monospace">Addr | Vk | Qk | Busy</text>
  </g>

  <!-- 기능 유닛 -->
  <rect x="90" y="280" width="120" height="45" rx="6" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="150" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="white">ALU</text>
  <text x="150" y="316" text-anchor="middle" font-size="8" fill="#BFDBFE">1사이클</text>

  <rect x="330" y="280" width="120" height="45" rx="6" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="390" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="white">MUL/DIV</text>
  <text x="390" y="316" text-anchor="middle" font-size="8" fill="#BFDBFE">3~32사이클</text>

  <rect x="570" y="280" width="120" height="45" rx="6" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="630" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="white">메모리 유닛</text>
  <text x="630" y="316" text-anchor="middle" font-size="8" fill="#BFDBFE">1~N사이클</text>

  <!-- RS → FU 화살표 -->
  <line x1="150" y1="243" x2="150" y2="278" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aTB)"/>
  <line x1="390" y1="243" x2="390" y2="278" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aTB)"/>
  <line x1="630" y1="243" x2="630" y2="278" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aTB)"/>

  <!-- CDB (Common Data Bus) — 빨간 굵은 선 -->
  <rect x="40" y="365" width="700" height="35" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="390" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">CDB (Common Data Bus) — 브로드캐스트</text>
  <text x="390" y="395" text-anchor="middle" font-size="8" fill="#B91C1C">결과 값 + 태그(생산자 RS 식별자)를 모든 대기 RS와 ROB에 동시 전달</text>

  <!-- FU → CDB 화살표 -->
  <line x1="150" y1="325" x2="150" y2="363" stroke="#DC2626" stroke-width="1.5" marker-end="url(#aTR)"/>
  <line x1="390" y1="325" x2="390" y2="363" stroke="#DC2626" stroke-width="1.5" marker-end="url(#aTR)"/>
  <line x1="630" y1="325" x2="630" y2="363" stroke="#DC2626" stroke-width="1.5" marker-end="url(#aTR)"/>

  <!-- CDB → RS 피드백 (점선) -->
  <line x1="100" y1="365" x2="100" y2="243" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>
  <line x1="340" y1="365" x2="340" y2="243" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>
  <line x1="580" y1="365" x2="580" y2="243" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>

  <!-- ROB (Reorder Buffer) -->
  <rect x="200" y="430" width="380" height="70" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="390" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#EA580C">ROB (Reorder Buffer)</text>
  <text x="390" y="468" text-anchor="middle" font-size="9" fill="#EA580C">프로그램 순서대로 커밋 — 정확한 예외 보장</text>

  <!-- ROB 내부 엔트리 -->
  <g transform="translate(220, 478)">
    <rect x="0" y="0" width="340" height="14" rx="2" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="5" y="10" font-size="7" fill="#64748B" font-family="monospace">Entry# | Instr | Dest | Value | Ready | ← head ... tail →</text>
  </g>

  <!-- CDB → ROB -->
  <line x1="390" y1="400" x2="390" y2="428" stroke="#DC2626" stroke-width="1.5" marker-end="url(#aTR)"/>
  <text x="398" y="418" font-size="7" fill="#DC2626">결과 기록</text>

  <!-- ROB → 레지스터 파일 (커밋) -->
  <rect x="200" y="525" width="180" height="35" rx="6" fill="#16A34A" stroke="#166534" stroke-width="1.5"/>
  <text x="290" y="545" text-anchor="middle" font-size="10" font-weight="700" fill="white">아키텍처 레지스터 파일</text>
  <text x="290" y="555" text-anchor="middle" font-size="8" fill="#DCFCE7">x0~x31 (커밋 시 갱신)</text>

  <line x1="300" y1="500" x2="300" y2="523" stroke="#16A34A" stroke-width="1.5" marker-end="url(#aT)"/>
  <text x="308" y="516" font-size="7" fill="#166534">커밋 (in-order)</text>

  <!-- 범례 -->
  <g transform="translate(30" y="545)">
    <rect x="500" y="530" width="12" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="516" y="540" font-size="8" fill="#1E293B">예약 스테이션</text>
    <rect x="590" y="530" width="12" height="12" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="606" y="540" font-size="8" fill="#1E293B">CDB</text>
    <rect x="640" y="530" width="12" height="12" rx="2" fill="#FFF7ED" stroke="#EA580C" stroke-width="1"/>
    <text x="656" y="540" font-size="8" fill="#1E293B">ROB</text>
    <rect x="690" y="530" width="12" height="12" rx="2" fill="#16A34A"/>
    <text x="706" y="540" font-size="8" fill="#1E293B">커밋</text>
  </g>
</svg>
