<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Moore FSM vs Mealy FSM 비교</text>

  <!-- ========== Moore FSM (왼쪽) ========== -->
  <rect x="20" y="50" width="420" height="430" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">Moore FSM</text>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="#6B7280">출력 = f(현재 상태)</text>

  <!-- 상태 S0 -->
  <circle cx="130" cy="200" r="45" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <text x="130" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">S0</text>
  <text x="130" y="215" text-anchor="middle" font-size="11" fill="#6B7280">out=0</text>

  <!-- 상태 S1 -->
  <circle cx="330" cy="200" r="45" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <text x="330" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">S1</text>
  <text x="330" y="215" text-anchor="middle" font-size="11" fill="#6B7280">out=1</text>

  <!-- 상태 S2 -->
  <circle cx="230" cy="350" r="45" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <text x="230" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">S2</text>
  <text x="230" y="365" text-anchor="middle" font-size="11" fill="#6B7280">out=0</text>

  <!-- S0 -> S1 -->
  <line x1="175" y1="190" x2="280" y2="190" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="228" y="183" text-anchor="middle" font-size="11" fill="#1F2937">in=1</text>

  <!-- S1 -> S2 -->
  <line x1="305" y1="238" x2="258" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="295" y="280" text-anchor="middle" font-size="11" fill="#1F2937">in=1</text>

  <!-- S2 -> S0 -->
  <line x1="195" y1="330" x2="145" y2="248" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="152" y="295" text-anchor="middle" font-size="11" fill="#1F2937">in=0</text>

  <!-- Moore 블록 다이어그램 -->
  <rect x="60" y="410" width="80" height="40" rx="4" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="435" text-anchor="middle" font-size="11" fill="#2563EB">다음 상태</text>
  <text x="100" y="448" text-anchor="middle" font-size="9" fill="#2563EB">로직</text>

  <rect x="180" y="410" width="60" height="40" rx="4" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
  <text x="210" y="435" text-anchor="middle" font-size="11" fill="white" font-weight="bold">상태</text>
  <text x="210" y="448" text-anchor="middle" font-size="9" fill="white">레지스터</text>

  <rect x="280" y="410" width="80" height="40" rx="4" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="320" y="435" text-anchor="middle" font-size="11" fill="#2563EB">출력</text>
  <text x="320" y="448" text-anchor="middle" font-size="9" fill="#2563EB">로직</text>

  <line x1="30" y1="430" x2="55" y2="430" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="25" y="425" font-size="9" fill="#6B7280">입력</text>
  <line x1="140" y1="430" x2="175" y2="430" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="240" y1="430" x2="275" y2="430" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <line x1="360" y1="430" x2="400" y2="430" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="405" y="425" font-size="9" fill="#6B7280">출력</text>

  <!-- 피드백 -->
  <path d="M 210 455 L 210 470 L 80 470 L 80 406" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow1)" stroke-dasharray="4,2"/>

  <!-- ========== Mealy FSM (오른쪽) ========== -->
  <rect x="460" y="50" width="420" height="430" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#DC2626">Mealy FSM</text>
  <text x="670" y="100" text-anchor="middle" font-size="12" fill="#6B7280">출력 = f(현재 상태, 입력)</text>

  <!-- 상태 S0 -->
  <circle cx="570" cy="200" r="45" fill="white" stroke="#DC2626" stroke-width="2.5"/>
  <text x="570" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">S0</text>

  <!-- 상태 S1 -->
  <circle cx="770" cy="200" r="45" fill="white" stroke="#DC2626" stroke-width="2.5"/>
  <text x="770" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">S1</text>

  <!-- S0 -> S1 (위쪽) -->
  <path d="M 615 180 Q 670 140 725 180" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="670" y="152" text-anchor="middle" font-size="11" fill="#1F2937">in=1 / out=1</text>

  <!-- S1 -> S0 (아래쪽) -->
  <path d="M 725 220 Q 670 260 615 220" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="670" y="258" text-anchor="middle" font-size="11" fill="#1F2937">in=0 / out=0</text>

  <!-- 셀프 루프 S0 -->
  <path d="M 540 165 Q 510 110 555 160" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="510" y="130" text-anchor="middle" font-size="10" fill="#1F2937">in=0/out=0</text>

  <!-- 셀프 루프 S1 -->
  <path d="M 800 165 Q 830 110 805 160" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="835" y="130" text-anchor="middle" font-size="10" fill="#1F2937">in=1/out=1</text>

  <!-- Mealy 블록 다이어그램 -->
  <rect x="500" y="410" width="80" height="40" rx="4" fill="white" stroke="#DC2626" stroke-width="1.5"/>
  <text x="540" y="435" text-anchor="middle" font-size="11" fill="#DC2626">다음 상태</text>
  <text x="540" y="448" text-anchor="middle" font-size="9" fill="#DC2626">로직</text>

  <rect x="620" y="410" width="60" height="40" rx="4" fill="#DC2626" stroke="#DC2626" stroke-width="1.5"/>
  <text x="650" y="435" text-anchor="middle" font-size="11" fill="white" font-weight="bold">상태</text>
  <text x="650" y="448" text-anchor="middle" font-size="9" fill="white">레지스터</text>

  <rect x="720" y="410" width="80" height="40" rx="4" fill="white" stroke="#DC2626" stroke-width="1.5"/>
  <text x="760" y="435" text-anchor="middle" font-size="11" fill="#DC2626">출력</text>
  <text x="760" y="448" text-anchor="middle" font-size="9" fill="#DC2626">로직</text>

  <line x1="470" y1="430" x2="495" y2="430" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="465" y="425" font-size="9" fill="#6B7280">입력</text>
  <line x1="580" y1="430" x2="615" y2="430" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="680" y1="430" x2="715" y2="430" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="800" y1="430" x2="840" y2="430" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="845" y="425" font-size="9" fill="#6B7280">출력</text>

  <!-- 피드백 -->
  <path d="M 650 455 L 650 470 L 520 470 L 520 406" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)" stroke-dasharray="4,2"/>

  <!-- 입력 직결 출력 로직 (Mealy 특징) -->
  <path d="M 475 430 L 475 390 L 740 390 L 740 406" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow2)" stroke-dasharray="4,2"/>
  <text x="607" y="385" text-anchor="middle" font-size="10" fill="#DC2626" font-style="italic">입력이 출력에 직접 영향</text>

  <!-- 핵심 차이점 레이블 -->
  <rect x="50" y="120" width="140" height="24" rx="4" fill="#2563EB" opacity="0.15"/>
  <text x="120" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">출력: 상태 내부 표기</text>

  <rect x="490" y="290" width="180" height="24" rx="4" fill="#DC2626" opacity="0.15"/>
  <text x="580" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">출력: 전이 화살표에 표기</text>
</svg>