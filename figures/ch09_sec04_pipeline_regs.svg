<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="960" height="580" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">파이프라인 레지스터 4개 — 필드 구성</text>
  <text x="480" y="48" text-anchor="middle" font-size="10" fill="#64748B">역방향 추적: WB에서 필요한 것 → MEM/WB → EX/MEM → ID/EX → IF/ID</text>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
  </defs>

  <!-- ======= IF/ID 레지스터 ======= -->
  <rect x="30" y="65" width="185" height="220" fill="#374151" rx="6" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="65" width="185" height="32" fill="#1E293B" rx="6"/>
  <text x="122" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="white">IF/ID</text>
  <!-- 필드들 -->
  <rect x="40" y="103" width="165" height="24" fill="#DBEAFE" rx="3"/>
  <text x="122" y="119" text-anchor="middle" font-size="10" fill="#1E40AF">instr[31:0]    — 32비트</text>
  <rect x="40" y="131" width="165" height="24" fill="#DBEAFE" rx="3"/>
  <text x="122" y="147" text-anchor="middle" font-size="10" fill="#1E40AF">pc[31:0]       — 32비트</text>
  <rect x="40" y="159" width="165" height="24" fill="#DBEAFE" rx="3"/>
  <text x="122" y="175" text-anchor="middle" font-size="10" fill="#1E40AF">pc_plus4[31:0] — 32비트</text>
  <!-- enable/flush -->
  <rect x="40" y="193" width="165" height="24" fill="#FEF3C7" rx="3"/>
  <text x="122" y="209" text-anchor="middle" font-size="9" fill="#92400E">en (enable)   ← Ch10</text>
  <rect x="40" y="221" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="122" y="237" text-anchor="middle" font-size="9" fill="#9D174D">flush         ← Ch11</text>
  <!-- 합계 -->
  <text x="122" y="270" text-anchor="middle" font-size="9" fill="#94A3B8">데이터: 96비트</text>

  <!-- ======= ID/EX 레지스터 ======= -->
  <rect x="255" y="65" width="185" height="390" fill="#374151" rx="6" stroke="#1E293B" stroke-width="2"/>
  <rect x="255" y="65" width="185" height="32" fill="#1E293B" rx="6"/>
  <text x="347" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ID/EX</text>
  <!-- 데이터 필드 -->
  <rect x="265" y="103" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="119" text-anchor="middle" font-size="10" fill="#065F46">rs1_data[31:0] — 32비트</text>
  <rect x="265" y="131" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="147" text-anchor="middle" font-size="10" fill="#065F46">rs2_data[31:0] — 32비트</text>
  <rect x="265" y="159" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="175" text-anchor="middle" font-size="10" fill="#065F46">imm_ext[31:0]  — 32비트</text>
  <rect x="265" y="187" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="203" text-anchor="middle" font-size="10" fill="#065F46">pc[31:0]       — 32비트</text>
  <rect x="265" y="215" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="231" text-anchor="middle" font-size="10" fill="#065F46">pc_plus4[31:0] — 32비트</text>
  <!-- 주소 필드 (포워딩용) -->
  <rect x="265" y="247" width="165" height="24" fill="#FEF9C3" rx="3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="347" y="263" text-anchor="middle" font-size="10" fill="#713F12">rs1_addr[4:0]  — 5비트 ★</text>
  <rect x="265" y="275" width="165" height="24" fill="#FEF9C3" rx="3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="347" y="291" text-anchor="middle" font-size="10" fill="#713F12">rs2_addr[4:0]  — 5비트 ★</text>
  <rect x="265" y="303" width="165" height="24" fill="#BBF7D0" rx="3"/>
  <text x="347" y="319" text-anchor="middle" font-size="10" fill="#065F46">rd_addr[4:0]   — 5비트</text>
  <!-- 제어 신호 -->
  <rect x="265" y="335" width="165" height="58" fill="#E0F2FE" rx="3" stroke="#7DD3FC"/>
  <text x="347" y="351" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369A1">제어 신호 (10비트)</text>
  <text x="347" y="364" text-anchor="middle" font-size="8" fill="#0369A1">alu_src_a(1), alu_src_b(1)</text>
  <text x="347" y="376" text-anchor="middle" font-size="8" fill="#0369A1">alu_control(4), branch(1)</text>
  <text x="347" y="388" text-anchor="middle" font-size="8" fill="#0369A1">mem_r/w(2), reg_write(1)</text>
  <!-- enable/flush -->
  <rect x="265" y="399" width="165" height="24" fill="#FEF3C7" rx="3"/>
  <text x="347" y="415" text-anchor="middle" font-size="9" fill="#92400E">en / flush ← Ch10/11</text>
  <!-- 합계 -->
  <text x="347" y="443" text-anchor="middle" font-size="9" fill="#94A3B8">데이터: 197비트+제어</text>

  <!-- ★ 포워딩 주석 -->
  <text x="347" y="462" text-anchor="middle" font-size="8" fill="#B45309">★ rs1/rs2_addr: Ch10 포워딩 유닛에서 사용</text>

  <!-- ======= EX/MEM 레지스터 ======= -->
  <rect x="480" y="65" width="185" height="310" fill="#374151" rx="6" stroke="#1E293B" stroke-width="2"/>
  <rect x="480" y="65" width="185" height="32" fill="#1E293B" rx="6"/>
  <text x="572" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="white">EX/MEM</text>
  <!-- 필드 -->
  <rect x="490" y="103" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="572" y="119" text-anchor="middle" font-size="10" fill="#831843">alu_result[31:0] — 32비트</text>
  <rect x="490" y="131" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="572" y="147" text-anchor="middle" font-size="10" fill="#831843">rs2_data[31:0]  — 32비트</text>
  <rect x="490" y="159" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="572" y="175" text-anchor="middle" font-size="10" fill="#831843">pc_plus4[31:0]  — 32비트</text>
  <rect x="490" y="187" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="572" y="203" text-anchor="middle" font-size="10" fill="#831843">rd_addr[4:0]    — 5비트</text>
  <rect x="490" y="215" width="165" height="24" fill="#FCE7F3" rx="3"/>
  <text x="572" y="231" text-anchor="middle" font-size="10" fill="#831843">zero(1), branch_taken(1)</text>
  <!-- 제어 신호 -->
  <rect x="490" y="247" width="165" height="48" fill="#E0F2FE" rx="3" stroke="#7DD3FC"/>
  <text x="572" y="263" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369A1">제어 신호 (5비트)</text>
  <text x="572" y="276" text-anchor="middle" font-size="8" fill="#0369A1">mem_read(1), mem_write(1)</text>
  <text x="572" y="289" text-anchor="middle" font-size="8" fill="#0369A1">reg_write(1), mem_to_reg(2)</text>
  <!-- enable/flush -->
  <rect x="490" y="303" width="165" height="24" fill="#FEF3C7" rx="3"/>
  <text x="572" y="319" text-anchor="middle" font-size="9" fill="#92400E">en / flush ← Ch10/11</text>
  <!-- 합계 -->
  <text x="572" y="353" text-anchor="middle" font-size="9" fill="#94A3B8">데이터: 95비트+제어</text>

  <!-- ======= MEM/WB 레지스터 ======= -->
  <rect x="705" y="65" width="185" height="270" fill="#374151" rx="6" stroke="#1E293B" stroke-width="2"/>
  <rect x="705" y="65" width="185" height="32" fill="#1E293B" rx="6"/>
  <text x="797" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MEM/WB</text>
  <!-- 필드 -->
  <rect x="715" y="103" width="165" height="24" fill="#F3E8FF" rx="3"/>
  <text x="797" y="119" text-anchor="middle" font-size="10" fill="#4C1D95">read_data[31:0] — 32비트</text>
  <rect x="715" y="131" width="165" height="24" fill="#F3E8FF" rx="3"/>
  <text x="797" y="147" text-anchor="middle" font-size="10" fill="#4C1D95">alu_result[31:0]— 32비트</text>
  <rect x="715" y="159" width="165" height="24" fill="#F3E8FF" rx="3"/>
  <text x="797" y="175" text-anchor="middle" font-size="10" fill="#4C1D95">pc_plus4[31:0]  — 32비트</text>
  <rect x="715" y="187" width="165" height="24" fill="#F3E8FF" rx="3"/>
  <text x="797" y="203" text-anchor="middle" font-size="10" fill="#4C1D95">rd_addr[4:0]    — 5비트</text>
  <!-- 제어 신호 -->
  <rect x="715" y="219" width="165" height="38" fill="#E0F2FE" rx="3" stroke="#7DD3FC"/>
  <text x="797" y="235" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369A1">제어 신호 (3비트)</text>
  <text x="797" y="250" text-anchor="middle" font-size="8" fill="#0369A1">reg_write(1), mem_to_reg(2)</text>
  <!-- enable -->
  <rect x="715" y="265" width="165" height="24" fill="#FEF3C7" rx="3"/>
  <text x="797" y="281" text-anchor="middle" font-size="9" fill="#92400E">en ← Ch10</text>
  <!-- 합계 -->
  <text x="797" y="323" text-anchor="middle" font-size="9" fill="#94A3B8">데이터: 101비트+제어</text>

  <!-- 연결 화살표 -->
  <line x1="215" y1="200" x2="255" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <line x1="440" y1="220" x2="480" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>
  <line x1="665" y1="200" x2="705" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- 스테이지 레이블 (상단 연결) -->
  <text x="122" y="56" text-anchor="middle" font-size="9" fill="#3B82F6">← IF | ID →</text>
  <text x="347" y="56" text-anchor="middle" font-size="9" fill="#22C55E">← ID | EX →</text>
  <text x="572" y="56" text-anchor="middle" font-size="9" fill="#F59E0B">← EX | MEM →</text>
  <text x="797" y="56" text-anchor="middle" font-size="9" fill="#EC4899">← MEM | WB →</text>

  <!-- 하단 설명 -->
  <rect x="30" y="490" width="900" height="75" fill="#EFF6FF" rx="6" stroke="#BFDBFE"/>
  <text x="480" y="508" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">파이프라인 레지스터 설계 원칙</text>
  <text x="480" y="524" text-anchor="middle" font-size="9" fill="#1E40AF">1) 동기 리셋(synchronous reset): 파이프라인 레지스터는 posedge clk에서 rst가 활성이면 NOP 버블 삽입</text>
  <text x="480" y="540" text-anchor="middle" font-size="9" fill="#1E40AF">2) NOP 버블 = 32'h0000_0013 (ADDI x0, x0, 0) — 아무 부작용 없는 명령어</text>
  <text x="480" y="555" text-anchor="middle" font-size="9" fill="#1E40AF">3) en=1 고정 (Ch09), flush=0 고정 (Ch09) → Ch10/Ch11에서 해저드 처리 시 동적 제어</text>
</svg>
