<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="700" height="400" fill="#F8FAFC" rx="8"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">이슈 폭(Issue Width) 증가에 따른 복잡도</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#64748B">의존성 비교기 수 = n(n-1)/2, 하드웨어 비용은 O(n²)으로 급증</text>

  <!-- 축 -->
  <line x1="100" y1="320" x2="620" y2="320" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="100" y1="320" x2="100" y2="80" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- X축 레이블 -->
  <text x="360" y="360" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">이슈 폭 (n)</text>
  <text x="150" y="340" text-anchor="middle" font-size="10" fill="#64748B">1</text>
  <text x="250" y="340" text-anchor="middle" font-size="10" fill="#64748B">2</text>
  <text x="350" y="340" text-anchor="middle" font-size="10" fill="#64748B">4</text>
  <text x="450" y="340" text-anchor="middle" font-size="10" fill="#64748B">6</text>
  <text x="550" y="340" text-anchor="middle" font-size="10" fill="#64748B">8</text>

  <!-- Y축 레이블 (비교기 수) -->
  <text x="50" y="200" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="600" transform="rotate(-90, 50, 200)">비교기 수</text>
  <text x="90" y="324" text-anchor="end" font-size="9" fill="#64748B">0</text>
  <text x="90" y="260" text-anchor="end" font-size="9" fill="#64748B">10</text>
  <text x="90" y="200" text-anchor="end" font-size="9" fill="#64748B">20</text>
  <text x="90" y="140" text-anchor="end" font-size="9" fill="#64748B">30</text>

  <!-- 격자 -->
  <line x1="100" y1="260" x2="620" y2="260" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="100" y1="200" x2="620" y2="200" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="100" y1="140" x2="620" y2="140" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="3"/>

  <!-- 비교기 수 곡선: n=1→0, n=2→1, n=4→6, n=6→15, n=8→28 -->
  <polyline points="150,320 250,314 350,284 450,230 550,152" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>

  <!-- 데이터 포인트 -->
  <circle cx="150" cy="320" r="6" fill="#2563EB"/>
  <text x="150" y="310" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">0</text>

  <circle cx="250" cy="314" r="6" fill="#2563EB"/>
  <text x="250" y="304" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">1</text>

  <circle cx="350" cy="284" r="6" fill="#2563EB"/>
  <text x="350" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">6</text>

  <circle cx="450" cy="230" r="6" fill="#2563EB"/>
  <text x="450" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">15</text>

  <circle cx="550" cy="152" r="6" fill="#DC2626"/>
  <text x="550" y="142" text-anchor="middle" font-size="9" font-weight="700" fill="#DC2626">28</text>

  <!-- 실용 영역 표시 -->
  <rect x="130" y="70" width="240" height="245" rx="4" fill="#DBEAFE" fill-opacity="0.2" stroke="#2563EB" stroke-width="1" stroke-dasharray="5"/>
  <text x="250" y="85" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">실용 영역</text>

  <rect x="380" y="70" width="200" height="245" rx="4" fill="#FEE2E2" fill-opacity="0.2" stroke="#DC2626" stroke-width="1" stroke-dasharray="5"/>
  <text x="480" y="85" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">비용 급증 영역</text>

  <!-- 설명 박스 -->
  <rect x="420" y="100" width="180" height="80" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="510" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">비교기 수 = n(n-1)/2</text>
  <text x="510" y="135" text-anchor="middle" font-size="9" fill="#64748B">n=4: 6개 (실용적)</text>
  <text x="510" y="150" text-anchor="middle" font-size="9" fill="#64748B">n=6: 15개 (고비용)</text>
  <text x="510" y="165" text-anchor="middle" font-size="9" fill="#DC2626">n=8: 28개 (매우 고비용)</text>

  <!-- 수식 -->
  <text x="350" y="388" text-anchor="middle" font-size="10" fill="#475569">비교기 수 = n(n-1)/2 | 포워딩 경로 = n² | 레지스터 파일 포트 = 2n(읽기) + n(쓰기)</text>
</svg>
