<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="720" height="340" fill="#F8FAFC" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Flush vs Stall 우선순위 결정 테이블</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#64748B">규칙: Flush &gt; Stall — 잘못된 명령어 제거가 지연보다 항상 우선</text>

  <!-- 테이블 헤더 -->
  <rect x="30" y="58" width="660" height="36" fill="#1E40AF" rx="4"/>
  <text x="165" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">상황</text>
  <text x="345" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">pc_en</text>
  <text x="465" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">if_id_flush</text>
  <text x="605" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">id_ex_flush</text>
  <!-- 컬럼 구분선 -->
  <line x1="270" y1="58" x2="270" y2="290" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="410" y1="58" x2="410" y2="290" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="530" y1="58" x2="530" y2="290" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 행 1: 정상 동작 -->
  <rect x="30" y="94" width="660" height="48" fill="#F0FDF4" rx="2"/>
  <text x="165" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">정상 동작</text>
  <text x="165" y="132" text-anchor="middle" font-size="10" fill="#64748B">(해저드 없음)</text>
  <rect x="320" y="102" width="50" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
  <text x="345" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">1</text>
  <rect x="440" y="102" width="50" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
  <text x="465" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">0</text>
  <rect x="580" y="102" width="50" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
  <text x="605" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">0</text>

  <!-- 행 2: Load-Use 스톨만 -->
  <rect x="30" y="142" width="660" height="48" fill="#FFF7ED" rx="2"/>
  <text x="165" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#C2410C">Load-Use 스톨만</text>
  <text x="165" y="180" text-anchor="middle" font-size="10" fill="#64748B">(분기 없음)</text>
  <rect x="320" y="150" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="345" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">0</text>
  <rect x="440" y="150" width="50" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
  <text x="465" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">0</text>
  <rect x="580" y="150" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="605" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">1</text>

  <!-- 행 3: 분기 taken만 -->
  <rect x="30" y="190" width="660" height="48" fill="#FEF3C7" rx="2"/>
  <text x="165" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#B45309">분기 taken만</text>
  <text x="165" y="228" text-anchor="middle" font-size="10" fill="#64748B">(Load-Use 없음)</text>
  <text x="345" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED">1</text>
  <text x="345" y="226" text-anchor="middle" font-size="8" fill="#7C3AED">(분기타겟으로)</text>
  <rect x="440" y="198" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="465" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">1</text>
  <rect x="580" y="198" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="605" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">1</text>

  <!-- 행 4: 스톨+분기 동시 -->
  <rect x="30" y="238" width="660" height="48" fill="#EDE9FE" rx="2"/>
  <text x="165" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">스톨 + 분기 동시</text>
  <text x="165" y="276" text-anchor="middle" font-size="10" fill="#64748B">(Flush 우선 적용)</text>
  <text x="345" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED">1</text>
  <text x="345" y="274" text-anchor="middle" font-size="8" fill="#7C3AED">(분기타겟, Flush 우선)</text>
  <rect x="440" y="246" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="465" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">1</text>
  <rect x="580" y="246" width="50" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="3"/>
  <text x="605" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">1</text>

  <!-- 외곽선 -->
  <rect x="30" y="94" width="660" height="192" fill="none" stroke="#CBD5E1" stroke-width="1.5" rx="2"/>

  <!-- 규칙 박스 -->
  <rect x="30" y="298" width="660" height="32" fill="#1E40AF" rx="4"/>
  <text x="360" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="white">규칙: Flush &gt; Stall — 분기 flush 발생 시 스톨보다 우선하여 wrong-path 명령어 즉시 제거</text>
</svg>