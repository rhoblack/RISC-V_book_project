<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 배경 -->
  <rect width="1000" height="500" fill="#f8fafc"/>

  <!-- 제목 -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">
    동적 전력 vs 정적 전력
  </text>

  <!-- ===== 좌측: 동적 전력 ===== -->
  <g>
    <!-- 배경 박스 -->
    <rect x="50" y="80" width="400" height="380" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/>

    <!-- 제목 -->
    <text x="250" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e40af">
      동적 전력 (Dynamic Power)
    </text>
    <text x="250" y="135" font-size="14" text-anchor="middle" fill="#0c4a6e">
      P_dyn = C × V² × f
    </text>

    <!-- 회로 표현: 신호 토글 중 -->
    <circle cx="150" cy="200" r="25" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="150" y="210" font-size="12" text-anchor="middle" fill="white" font-weight="bold">SRC</text>

    <!-- 신호선: 토글 표현 (지그재그) -->
    <polyline points="175,200 200,190 225,200 250,190 275,200 300,190"
              fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

    <!-- 가산기 표현 -->
    <circle cx="330" cy="200" r="25" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="330" y="210" font-size="12" text-anchor="middle" fill="white" font-weight="bold">+</text>

    <!-- 설명 텍스트 -->
    <text x="250" y="280" font-size="12" text-anchor="middle" fill="#0c4a6e" font-weight="bold">
      신호가 빠르게 토글됨
    </text>
    <text x="250" y="300" font-size="11" text-anchor="middle" fill="#0c4a6e">
      → 캐퍼시턴스 충방전
    </text>
    <text x="250" y="320" font-size="11" text-anchor="middle" fill="#0c4a6e">
      → 에너지 소비 증가
    </text>

    <!-- 수식 분해 -->
    <rect x="80" y="350" width="340" height="90" fill="white" stroke="#3b82f6" stroke-width="1" rx="4"/>
    <text x="90" y="370" font-size="11" fill="#0c4a6e" font-family="monospace">
      C: 커패시턴스 (회로 용량)
    </text>
    <text x="90" y="390" font-size="11" fill="#0c4a6e" font-family="monospace">
      V: 공급 전압 (V에 비례)
    </text>
    <text x="90" y="410" font-size="11" fill="#0c4a6e" font-family="monospace">
      f: 클록 주파수 (f에 비례)
    </text>
  </g>

  <!-- ===== 우측: 정적 전력 ===== -->
  <g>
    <!-- 배경 박스 -->
    <rect x="550" y="80" width="400" height="380" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>

    <!-- 제목 -->
    <text x="750" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
      정적 전력 (Static Power)
    </text>
    <text x="750" y="135" font-size="14" text-anchor="middle" fill="#7f1d1d">
      P_static = I_leak × V
    </text>

    <!-- 회로 표현: 안정적 상태 -->
    <circle cx="650" cy="200" r="25" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <text x="650" y="210" font-size="12" text-anchor="middle" fill="white" font-weight="bold">SRC</text>

    <!-- 신호선: 고정 -->
    <line x1="675" y1="200" x2="825" y2="200" stroke="#404040" stroke-width="3" stroke-linecap="round"/>

    <!-- 가산기 표현 -->
    <circle cx="850" cy="200" r="25" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <text x="850" y="210" font-size="12" text-anchor="middle" fill="white" font-weight="bold">+</text>

    <!-- 누설 화살표 -->
    <defs>
      <marker id="arrowred" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
      </marker>
    </defs>
    <path d="M 750 250 Q 730 320 700 380" fill="none" stroke="#dc2626" stroke-width="3"
          marker-end="url(#arrowred)" stroke-dasharray="5,5"/>

    <!-- 누설 전류 표현 -->
    <text x="670" y="350" font-size="11" text-anchor="middle" fill="#991b1b" font-weight="bold">
      누설 전류
    </text>
    <text x="670" y="370" font-size="11" text-anchor="middle" fill="#991b1b">
      I_leak 흐름
    </text>

    <!-- 온도 영향 -->
    <rect x="600" y="400" width="300" height="25" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
    <text x="750" y="418" font-size="11" text-anchor="middle" fill="#991b1b" font-weight="bold">
      온도 ↑ → I_leak ↑ (지수적 증가!)
    </text>
  </g>

  <!-- 하단: 비교 요약 -->
  <g>
    <rect x="50" y="470" width="900" height="25" fill="#dbeafe" rx="3"/>
    <text x="500" y="490" font-size="12" text-anchor="middle" fill="#0c4a6e" font-weight="bold">
      동적 전력은 주파수/활동도에 의존 • 정적 전력은 온도에 지배적 의존 • 둘 다 중요!
    </text>
  </g>
</svg>
