<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">Write-Back Direct-Mapped D-Cache 구조</text>

  <!-- 주소 분해 -->
  <rect x="30" y="55" width="860" height="60" rx="8" fill="#F0F7FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="50" y="75" font-size="13" fill="#1E3A5F" font-weight="bold">32-bit Address:</text>

  <rect x="180" y="65" width="220" height="35" rx="4" fill="#2563EB"/>
  <text x="290" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Tag [31:12]  (20 bits)</text>

  <rect x="400" y="65" width="180" height="35" rx="4" fill="#3B82F6"/>
  <text x="490" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Index [11:5]  (7 bits)</text>

  <rect x="580" y="65" width="140" height="35" rx="4" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="650" y="88" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">Offset [4:0]  (5 bits)</text>

  <text x="780" y="88" font-size="11" fill="#6B7280">128 lines x 32B</text>

  <!-- 캐시 테이블 -->
  <rect x="50" y="140" width="720" height="35" rx="4" fill="#1E3A5F"/>
  <text x="80" y="163" font-size="13" fill="white" font-weight="bold">V</text>
  <text x="130" y="163" font-size="13" fill="#FDE68A" font-weight="bold">D</text>
  <text x="210" y="163" font-size="13" fill="white" font-weight="bold">Tag (20 bits)</text>
  <text x="460" y="163" font-size="13" fill="white" font-weight="bold">Data Block (32 bytes = 8 words)</text>

  <!-- 캐시 라인 0 -->
  <rect x="50" y="175" width="720" height="30" rx="0" fill="white" stroke="#CBD5E1"/>
  <text x="80" y="195" font-size="12" fill="#059669" font-weight="bold">1</text>
  <text x="130" y="195" font-size="12" fill="#E11D48" font-weight="bold">1</text>
  <text x="210" y="195" font-size="12" fill="#1E3A5F" font-family="monospace">0xABCDE</text>
  <text x="380" y="195" font-size="11" fill="#6B7280" font-family="monospace">W0  W1  W2  W3  W4  W5  W6  W7</text>
  <text x="790" y="195" font-size="10" fill="#6B7280">Line 0</text>

  <!-- 캐시 라인 1 -->
  <rect x="50" y="205" width="720" height="30" rx="0" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="80" y="225" font-size="12" fill="#059669" font-weight="bold">1</text>
  <text x="130" y="225" font-size="12" fill="#059669" font-weight="bold">0</text>
  <text x="210" y="225" font-size="12" fill="#1E3A5F" font-family="monospace">0x12345</text>
  <text x="380" y="225" font-size="11" fill="#6B7280" font-family="monospace">W0  W1  W2  W3  W4  W5  W6  W7</text>
  <text x="790" y="225" font-size="10" fill="#6B7280">Line 1</text>

  <!-- 줄임표 -->
  <text x="400" y="260" font-size="16" fill="#6B7280">. . .</text>

  <!-- 캐시 라인 127 -->
  <rect x="50" y="275" width="720" height="30" rx="0" fill="white" stroke="#CBD5E1"/>
  <text x="80" y="295" font-size="12" fill="#9CA3AF">0</text>
  <text x="130" y="295" font-size="12" fill="#9CA3AF">0</text>
  <text x="210" y="295" font-size="12" fill="#9CA3AF" font-family="monospace">0x00000</text>
  <text x="380" y="295" font-size="11" fill="#9CA3AF" font-family="monospace">W0  W1  W2  W3  W4  W5  W6  W7</text>
  <text x="790" y="295" font-size="10" fill="#6B7280">Line 127</text>

  <!-- 비교기 -->
  <rect x="50" y="330" width="120" height="40" rx="8" fill="#2563EB"/>
  <text x="110" y="355" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Tag 비교기</text>

  <!-- Hit/Miss 판정 -->
  <rect x="210" y="330" width="120" height="40" rx="8" fill="#059669"/>
  <text x="270" y="355" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Hit / Miss</text>

  <line x1="170" y1="350" x2="208" y2="350" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Dirty Eviction 경로 -->
  <rect x="400" y="330" width="180" height="40" rx="8" fill="#E11D48"/>
  <text x="490" y="355" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Dirty Eviction 로직</text>

  <line x1="330" y1="350" x2="398" y2="350" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Main Memory -->
  <rect x="650" y="330" width="150" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="725" y="355" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">Main Memory</text>

  <line x1="580" y1="350" x2="648" y2="350" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="614" y="340" font-size="10" fill="#E11D48">Write-Back</text>

  <!-- FSM 설명 -->
  <rect x="50" y="400" width="820" height="100" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="70" y="425" font-size="13" font-weight="bold" fill="#92400E">Write-Back 캐시 FSM 상태:</text>
  <text x="70" y="450" font-size="12" fill="#1E3A5F">IDLE --> TAG_CHECK --> HIT_WRITE (Dirty=1로 설정) --> IDLE</text>
  <text x="70" y="470" font-size="12" fill="#1E3A5F">IDLE --> TAG_CHECK --> MISS + Dirty --> WRITE_BACK (evict) --> REFILL --> IDLE</text>
  <text x="70" y="490" font-size="12" fill="#1E3A5F">IDLE --> TAG_CHECK --> MISS + Clean --> REFILL --> IDLE</text>
</svg>