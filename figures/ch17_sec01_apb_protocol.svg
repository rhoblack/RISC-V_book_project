<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#FFFFFF" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">APB 프로토콜 타이밍 — 쓰기 전송 (Write Transfer)</text>

  <!-- Clock -->
  <text x="30" y="70" font-size="12" fill="#1F2937" font-weight="bold">PCLK</text>
  <polyline points="100,75 100,55 140,55 140,75 180,75 180,55 220,55 220,75 260,75 260,55 300,55 300,75 340,75 340,55 380,55 380,75 420,75 420,55 460,55 460,75 500,75 500,55 540,55 540,75 580,75 580,55 620,55 620,75 660,75 660,55 700,55 700,75" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- PSEL -->
  <text x="30" y="110" font-size="12" fill="#1F2937" font-weight="bold">PSEL</text>
  <polyline points="100,115 180,115 180,95 460,95 460,115 700,115" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- PENABLE -->
  <text x="30" y="150" font-size="12" fill="#1F2937" font-weight="bold">PENABLE</text>
  <polyline points="100,155 300,155 300,135 460,135 460,155 700,155" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- PWRITE -->
  <text x="30" y="190" font-size="12" fill="#1F2937" font-weight="bold">PWRITE</text>
  <polyline points="100,195 180,195 180,175 460,175 460,195 700,195" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- PADDR -->
  <text x="30" y="230" font-size="12" fill="#1F2937" font-weight="bold">PADDR</text>
  <polyline points="100,235 180,235 180,215 460,215 460,235 700,235" fill="none" stroke="#2563EB" stroke-width="2"/>
  <rect x="190" y="216" width="260" height="18" fill="#DBEAFE" opacity="0.5"/>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#2563EB" font-family="monospace">ADDR</text>

  <!-- PWDATA -->
  <text x="30" y="270" font-size="12" fill="#1F2937" font-weight="bold">PWDATA</text>
  <polyline points="100,275 180,275 180,255 460,255 460,275 700,275" fill="none" stroke="#2563EB" stroke-width="2"/>
  <rect x="190" y="256" width="260" height="18" fill="#DBEAFE" opacity="0.5"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#2563EB" font-family="monospace">WDATA</text>

  <!-- PREADY -->
  <text x="30" y="310" font-size="12" fill="#1F2937" font-weight="bold">PREADY</text>
  <polyline points="100,315 300,315 300,295 460,295 460,315 700,315" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- Phase Labels -->
  <rect x="180" y="340" width="120" height="30" rx="4" fill="#DBEAFE"/>
  <text x="240" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">SETUP</text>

  <rect x="300" y="340" width="160" height="30" rx="4" fill="#2563EB"/>
  <text x="380" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ACCESS</text>

  <!-- Cycle labels -->
  <text x="220" y="400" text-anchor="middle" font-size="11" fill="#6B7280">T1 (Setup Phase)</text>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#6B7280">T2 (Access Phase)</text>

  <!-- Annotations -->
  <line x1="180" y1="50" x2="180" y2="390" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="50" x2="300" y2="390" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="460" y1="50" x2="460" y2="390" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Legend -->
  <rect x="100" y="430" width="600" height="55" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="120" y="452" font-size="11" fill="#1F2937">SETUP 단계: PSEL=1, PENABLE=0 → 주소/데이터/제어 신호 설정</text>
  <text x="120" y="472" font-size="11" fill="#1F2937">ACCESS 단계: PSEL=1, PENABLE=1 → PREADY=1이면 전송 완료 (최소 2사이클)</text>
</svg>