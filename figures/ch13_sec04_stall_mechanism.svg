<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="ar4r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">캐시 미스 시 파이프라인 스톨 메커니즘</text>

  <!-- Pipeline stages - normal -->
  <text x="30" y="65" font-size="14" font-weight="bold" fill="#059669">캐시 히트 시 (정상 동작)</text>

  <!-- Cycle labels -->
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#6B7280">C1</text>
  <text x="230" y="90" text-anchor="middle" font-size="11" fill="#6B7280">C2</text>
  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#6B7280">C3</text>
  <text x="390" y="90" text-anchor="middle" font-size="11" fill="#6B7280">C4</text>
  <text x="470" y="90" text-anchor="middle" font-size="11" fill="#6B7280">C5</text>

  <!-- Inst 1 -->
  <text x="70" y="112" font-size="11" fill="#1F2937">I1</text>
  <rect x="110" y="98" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="148" y="113" text-anchor="middle" font-size="10" fill="#2563EB">IF</text>
  <rect x="190" y="98" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="228" y="113" text-anchor="middle" font-size="10" fill="#2563EB">ID</text>
  <rect x="270" y="98" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="308" y="113" text-anchor="middle" font-size="10" fill="#2563EB">EX</text>
  <rect x="350" y="98" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="388" y="113" text-anchor="middle" font-size="10" fill="#2563EB">MEM</text>
  <rect x="430" y="98" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="468" y="113" text-anchor="middle" font-size="10" fill="#2563EB">WB</text>

  <!-- Inst 2 -->
  <text x="70" y="137" font-size="11" fill="#1F2937">I2</text>
  <rect x="190" y="123" width="76" height="22" rx="3" fill="#ECFDF5" stroke="#059669"/>
  <text x="228" y="138" text-anchor="middle" font-size="10" fill="#059669">IF</text>
  <rect x="270" y="123" width="76" height="22" rx="3" fill="#ECFDF5" stroke="#059669"/>
  <text x="308" y="138" text-anchor="middle" font-size="10" fill="#059669">ID</text>
  <rect x="350" y="123" width="76" height="22" rx="3" fill="#ECFDF5" stroke="#059669"/>
  <text x="388" y="138" text-anchor="middle" font-size="10" fill="#059669">EX</text>
  <rect x="430" y="123" width="76" height="22" rx="3" fill="#ECFDF5" stroke="#059669"/>
  <text x="468" y="138" text-anchor="middle" font-size="10" fill="#059669">MEM</text>

  <!-- Cache Miss scenario -->
  <text x="30" y="185" font-size="14" font-weight="bold" fill="#DC2626">캐시 미스 시 (스톨 발생, 미스 페널티 = 8 사이클 가정)</text>

  <!-- Extended cycle labels -->
  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#6B7280">C1</text>
  <text x="210" y="210" text-anchor="middle" font-size="11" fill="#6B7280">C2</text>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#6B7280">C3</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">C4~C11</text>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#6B7280">C12</text>
  <text x="530" y="210" text-anchor="middle" font-size="11" fill="#6B7280">C13</text>

  <!-- Inst 1 with stall -->
  <text x="70" y="232" font-size="11" fill="#1F2937">I1</text>
  <rect x="120" y="218" width="56" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="148" y="233" text-anchor="middle" font-size="10" fill="#2563EB">IF</text>

  <!-- MISS indicator -->
  <rect x="180" y="218" width="180" height="22" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="270" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">MISS! → 메모리에서 블록 로드 (8 사이클)</text>

  <rect x="365" y="218" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="403" y="233" text-anchor="middle" font-size="10" fill="#2563EB">IF(재시도)</text>
  <rect x="445" y="218" width="76" height="22" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="483" y="233" text-anchor="middle" font-size="10" fill="#2563EB">ID</text>

  <!-- Inst 2 stalled -->
  <text x="70" y="257" font-size="11" fill="#1F2937">I2</text>
  <rect x="180" y="243" width="180" height="22" rx="3" fill="#FFF7ED" stroke="#D97706" stroke-dasharray="4"/>
  <text x="270" y="258" text-anchor="middle" font-size="10" fill="#D97706">STALL (파이프라인 홀드)</text>
  <rect x="445" y="243" width="76" height="22" rx="3" fill="#ECFDF5" stroke="#059669"/>
  <text x="483" y="258" text-anchor="middle" font-size="10" fill="#059669">IF</text>

  <!-- Stall signal diagram -->
  <text x="30" y="300" font-size="14" font-weight="bold" fill="#2563EB">icache_stall 신호 연결</text>

  <!-- Processor block -->
  <rect x="30" y="315" width="200" height="140" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">파이프라인 프로세서</text>

  <text x="55" y="365" font-size="11" fill="#1F2937">PC_en</text>
  <text x="55" y="385" font-size="11" fill="#1F2937">IF/ID_en</text>
  <text x="55" y="405" font-size="11" fill="#1F2937">ID/EX_en</text>
  <text x="55" y="425" font-size="11" fill="#1F2937">전체 파이프라인</text>
  <text x="55" y="440" font-size="10" fill="#6B7280">icache_stall=1 → 홀드</text>

  <!-- Cache block -->
  <rect x="310" y="315" width="200" height="140" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="410" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B82F6">L1 I-Cache</text>

  <text x="335" y="365" font-size="11" fill="#1F2937">addr[31:0]</text>
  <text x="335" y="385" font-size="11" fill="#1F2937">rdata[31:0]</text>
  <text x="335" y="410" font-size="11" font-weight="bold" fill="#DC2626">icache_stall</text>

  <!-- Arrows -->
  <line x1="230" y1="365" x2="308" y2="365" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="308" y1="385" x2="232" y2="385" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="510" y1="410" x2="560" y2="410" stroke="#DC2626" stroke-width="2"/>
  <line x1="560" y1="410" x2="560" y2="460" stroke="#DC2626" stroke-width="2"/>
  <line x1="560" y1="460" x2="130" y2="460" stroke="#DC2626" stroke-width="2"/>
  <line x1="130" y1="460" x2="130" y2="452" stroke="#DC2626" stroke-width="2" marker-end="url(#ar4r)"/>
  <text x="350" y="475" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">icache_stall이 1이면 전체 파이프라인 정지</text>

  <!-- Memory block -->
  <rect x="580" y="315" width="170" height="140" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="665" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#7C3AED">주 메모리</text>
  <text x="665" y="365" font-size="11" fill="#1F2937">블록 전송</text>
  <text x="665" y="385" font-size="11" fill="#1F2937">(8 워드)</text>

  <line x1="510" y1="365" x2="578" y2="365" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#ar4)"/>
  <line x1="578" y1="385" x2="512" y2="385" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#ar4)"/>
</svg>