<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="900" height="500" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">NOP 삽입 전후 타이밍 다이어그램 비교</text>

  <!-- ============ 왼쪽: NOP 없는 경우 (문제 상황) ============ -->
  <text x="200" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">NOP 없이 실행 — 해저드 발생!</text>
  <text x="200" y="72" text-anchor="middle" font-size="9" fill="#64748B">ADD x1, x2, x3  → SUB x4, x1, x5</text>

  <!-- 격자 배경 -->
  <rect x="30" y="85" width="350" height="185" fill="white" stroke="#E2E8F0" rx="4"/>
  <!-- 세로선 -->
  <line x1="90"  y1="85" x2="90"  y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="140" y1="85" x2="140" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="190" y1="85" x2="190" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="240" y1="85" x2="240" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="290" y1="85" x2="290" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="340" y1="85" x2="340" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <!-- 가로선 -->
  <line x1="30" y1="122" x2="380" y2="122" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="30" y1="159" x2="380" y2="159" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="30" y1="196" x2="380" y2="196" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="30" y1="233" x2="380" y2="233" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 헤더 -->
  <text x="60" y="80" text-anchor="middle" font-size="9" fill="#475569">명령어</text>
  <text x="115" y="80" text-anchor="middle" font-size="9" fill="#475569">C1</text>
  <text x="165" y="80" text-anchor="middle" font-size="9" fill="#475569">C2</text>
  <text x="215" y="80" text-anchor="middle" font-size="9" fill="#475569">C3</text>
  <text x="265" y="80" text-anchor="middle" font-size="9" fill="#475569">C4</text>
  <text x="315" y="80" text-anchor="middle" font-size="9" fill="#475569">C5</text>
  <text x="360" y="80" text-anchor="middle" font-size="9" fill="#475569">C6</text>

  <!-- ADD: IF ID EX MEM WB -->
  <text x="60" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">ADD x1</text>
  <rect x="91"  y="87" width="48" height="34" fill="#DBEAFE" rx="2" stroke="#93C5FD"/>
  <text x="115" y="108" text-anchor="middle" font-size="9" fill="#1E40AF">IF</text>
  <rect x="141" y="87" width="48" height="34" fill="#BBF7D0" rx="2" stroke="#6EE7B7"/>
  <text x="165" y="108" text-anchor="middle" font-size="9" fill="#065F46">ID</text>
  <rect x="191" y="87" width="48" height="34" fill="#FEF3C7" rx="2" stroke="#FCD34D"/>
  <text x="215" y="108" text-anchor="middle" font-size="9" fill="#78350F">EX</text>
  <rect x="241" y="87" width="48" height="34" fill="#FCE7F3" rx="2" stroke="#F9A8D4"/>
  <text x="265" y="108" text-anchor="middle" font-size="9" fill="#831843">MEM</text>
  <rect x="291" y="87" width="48" height="34" fill="#F3E8FF" rx="2" stroke="#C4B5FD"/>
  <text x="315" y="108" text-anchor="middle" font-size="9" fill="#4C1D95">WB</text>

  <!-- SUB: IF ID EX MEM WB (바로 이어서) -->
  <text x="60" y="145" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">SUB x4</text>
  <rect x="141" y="124" width="48" height="34" fill="#DBEAFE" rx="2" stroke="#93C5FD"/>
  <text x="165" y="145" text-anchor="middle" font-size="9" fill="#1E40AF">IF</text>
  <rect x="191" y="124" width="48" height="34" fill="#BBF7D0" rx="2" stroke="#6EE7B7"/>
  <text x="215" y="145" text-anchor="middle" font-size="9" fill="#065F46">ID</text>
  <!-- EX 단계에서 x1 값이 아직 없음 - 빨간색 강조 -->
  <rect x="241" y="124" width="48" height="34" fill="#FEE2E2" rx="2" stroke="#EF4444" stroke-width="2"/>
  <text x="265" y="142" text-anchor="middle" font-size="9" fill="#DC2626">EX</text>
  <text x="265" y="154" text-anchor="middle" font-size="7" fill="#DC2626">x1=?</text>
  <rect x="291" y="124" width="48" height="34" fill="#FCE7F3" rx="2" stroke="#F9A8D4"/>
  <text x="315" y="145" text-anchor="middle" font-size="9" fill="#831843">MEM</text>
  <rect x="341" y="124" width="48" height="34" fill="#F3E8FF" rx="2" stroke="#C4B5FD"/>
  <text x="365" y="145" text-anchor="middle" font-size="9" fill="#4C1D95">WB</text>

  <!-- 해저드 화살표 -->
  <line x1="215" y1="87" x2="215" y2="270" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="215" y="278" text-anchor="middle" font-size="8" fill="#DC2626">ADD EX시</text>
  <line x1="265" y1="87" x2="265" y2="270" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="265" y="278" text-anchor="middle" font-size="8" fill="#DC2626">SUB EX</text>

  <!-- 경고 박스 -->
  <rect x="30" y="283" width="350" height="38" fill="#FEE2E2" rx="4" stroke="#EF4444"/>
  <text x="205" y="300" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">ADD의 WB(C5)보다 SUB의 EX(C4)가 먼저!</text>
  <text x="205" y="313" text-anchor="middle" font-size="9" fill="#991B1B">SUB가 x1을 읽을 때 ADD는 아직 WB 전 → 오래된 값 사용!</text>

  <!-- ============ 오른쪽: NOP 삽입 ============ -->
  <text x="670" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A">NOP 3개 삽입 — 해저드 해결</text>
  <text x="670" y="72" text-anchor="middle" font-size="9" fill="#64748B">ADD → NOP → NOP → NOP → SUB</text>

  <!-- 격자 배경 -->
  <rect x="490" y="85" width="390" height="225" fill="white" stroke="#E2E8F0" rx="4"/>
  <!-- 세로선 -->
  <line x1="540" y1="85" x2="540" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="590" y1="85" x2="590" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="640" y1="85" x2="640" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="690" y1="85" x2="690" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="740" y1="85" x2="740" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="790" y1="85" x2="790" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="840" y1="85" x2="840" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <!-- 가로선 -->
  <line x1="490" y1="122" x2="880" y2="122" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="490" y1="159" x2="880" y2="159" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="490" y1="196" x2="880" y2="196" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="490" y1="233" x2="880" y2="233" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="490" y1="270" x2="880" y2="270" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 헤더 -->
  <text x="515" y="80" text-anchor="middle" font-size="9" fill="#475569">명령어</text>
  <text x="565" y="80" text-anchor="middle" font-size="9" fill="#475569">C1</text>
  <text x="615" y="80" text-anchor="middle" font-size="9" fill="#475569">C2</text>
  <text x="665" y="80" text-anchor="middle" font-size="9" fill="#475569">C3</text>
  <text x="715" y="80" text-anchor="middle" font-size="9" fill="#475569">C4</text>
  <text x="765" y="80" text-anchor="middle" font-size="9" fill="#475569">C5</text>
  <text x="815" y="80" text-anchor="middle" font-size="9" fill="#475569">C6</text>
  <text x="858" y="80" text-anchor="middle" font-size="9" fill="#475569">C7~</text>

  <!-- ADD: IF ID EX MEM WB -->
  <text x="515" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">ADD x1</text>
  <rect x="541" y="87" width="48" height="34" fill="#DBEAFE" rx="2" stroke="#93C5FD"/>
  <text x="565" y="108" text-anchor="middle" font-size="9" fill="#1E40AF">IF</text>
  <rect x="591" y="87" width="48" height="34" fill="#BBF7D0" rx="2" stroke="#6EE7B7"/>
  <text x="615" y="108" text-anchor="middle" font-size="9" fill="#065F46">ID</text>
  <rect x="641" y="87" width="48" height="34" fill="#FEF3C7" rx="2" stroke="#FCD34D"/>
  <text x="665" y="108" text-anchor="middle" font-size="9" fill="#78350F">EX</text>
  <rect x="691" y="87" width="48" height="34" fill="#FCE7F3" rx="2" stroke="#F9A8D4"/>
  <text x="715" y="108" text-anchor="middle" font-size="9" fill="#831843">MEM</text>
  <rect x="741" y="87" width="48" height="34" fill="#F3E8FF" rx="2" stroke="#C4B5FD"/>
  <text x="765" y="108" text-anchor="middle" font-size="9" fill="#4C1D95">WB ✓</text>

  <!-- NOP1 -->
  <text x="515" y="145" text-anchor="middle" font-size="9" fill="#94A3B8">NOP1</text>
  <rect x="591" y="124" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="615" y="145" text-anchor="middle" font-size="8" fill="#94A3B8">IF</text>
  <rect x="641" y="124" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="665" y="145" text-anchor="middle" font-size="8" fill="#94A3B8">ID</text>
  <rect x="691" y="124" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="715" y="145" text-anchor="middle" font-size="8" fill="#94A3B8">EX</text>
  <rect x="741" y="124" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="765" y="145" text-anchor="middle" font-size="8" fill="#94A3B8">MEM</text>
  <rect x="791" y="124" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="815" y="145" text-anchor="middle" font-size="8" fill="#94A3B8">WB</text>

  <!-- NOP2 -->
  <text x="515" y="182" text-anchor="middle" font-size="9" fill="#94A3B8">NOP2</text>
  <rect x="641" y="161" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="665" y="182" text-anchor="middle" font-size="8" fill="#94A3B8">IF</text>
  <rect x="691" y="161" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="715" y="182" text-anchor="middle" font-size="8" fill="#94A3B8">ID</text>
  <rect x="741" y="161" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="765" y="182" text-anchor="middle" font-size="8" fill="#94A3B8">EX</text>
  <rect x="791" y="161" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="815" y="182" text-anchor="middle" font-size="8" fill="#94A3B8">MEM</text>
  <rect x="841" y="161" width="39" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="860" y="182" text-anchor="middle" font-size="8" fill="#94A3B8">WB</text>

  <!-- NOP3 -->
  <text x="515" y="219" text-anchor="middle" font-size="9" fill="#94A3B8">NOP3</text>
  <rect x="691" y="198" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="715" y="219" text-anchor="middle" font-size="8" fill="#94A3B8">IF</text>
  <rect x="741" y="198" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="765" y="219" text-anchor="middle" font-size="8" fill="#94A3B8">ID</text>
  <rect x="791" y="198" width="48" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="815" y="219" text-anchor="middle" font-size="8" fill="#94A3B8">EX</text>
  <rect x="841" y="198" width="39" height="34" fill="#F1F5F9" rx="2" stroke="#CBD5E1"/>
  <text x="860" y="219" text-anchor="middle" font-size="8" fill="#94A3B8">MEM</text>

  <!-- SUB: C5(IF) -->
  <text x="515" y="256" text-anchor="middle" font-size="9" font-weight="bold" fill="#16A34A">SUB x4</text>
  <rect x="741" y="235" width="48" height="34" fill="#DBEAFE" rx="2" stroke="#93C5FD"/>
  <text x="765" y="256" text-anchor="middle" font-size="9" fill="#1E40AF">IF</text>
  <rect x="791" y="235" width="48" height="34" fill="#BBF7D0" rx="2" stroke="#6EE7B7"/>
  <text x="815" y="256" text-anchor="middle" font-size="9" fill="#065F46">ID</text>
  <rect x="841" y="235" width="39" height="34" fill="#FEF3C7" rx="2" stroke="#FCD34D"/>
  <text x="860" y="256" text-anchor="middle" font-size="9" fill="#78350F">EX✓</text>

  <!-- WB 완료 후 SUB ID 시점 강조 -->
  <line x1="765" y1="85" x2="765" y2="310" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="765" y="318" text-anchor="middle" font-size="8" fill="#16A34A">ADD WB✓</text>
  <text x="765" y="328" text-anchor="middle" font-size="8" fill="#16A34A">SUB IF</text>

  <!-- 해결 박스 -->
  <rect x="490" y="340" width="390" height="50" fill="#DCFCE7" rx="4" stroke="#86EFAC"/>
  <text x="685" y="358" text-anchor="middle" font-size="9" font-weight="bold" fill="#16A34A">NOP 3개 삽입으로 해저드 해결!</text>
  <text x="685" y="373" text-anchor="middle" font-size="9" fill="#166534">ADD WB(C5) 완료 후 SUB ID(C6)에서 x1 정상 읽기 가능</text>
  <text x="685" y="386" text-anchor="middle" font-size="9" fill="#166534">단, 성능 손실: 5개 명령어 실행에 9+3=12사이클 → Ch10 포워딩으로 해결</text>

  <!-- 하단 NOP 값 주석 -->
  <rect x="30" y="400" width="860" height="40" fill="#F1F5F9" rx="4" stroke="#E2E8F0"/>
  <text x="450" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">NOP 명령어: ADDI x0, x0, 0 → 기계어 32'h0000_0013</text>
  <text x="450" y="433" text-anchor="middle" font-size="9" fill="#475569">32'd0 (= 32'h0000_0000 = ECALL) 사용 금지! — 시스템 콜로 해석되어 시뮬레이션 오류 발생</text>

  <!-- 좌우 구분선 -->
  <line x1="455" y1="65" x2="455" y2="330" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
