<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arr3g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">5단계 파이프라인 완성 블록 다이어그램</text>

  <!-- Stage backgrounds -->
  <rect x="30" y="40" width="140" height="420" rx="6" fill="#DBEAFE" opacity="0.3"/>
  <text x="100" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">IF</text>

  <rect x="180" y="40" width="140" height="420" rx="6" fill="#DBEAFE" opacity="0.3"/>
  <text x="250" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">ID</text>

  <rect x="330" y="40" width="160" height="420" rx="6" fill="#DBEAFE" opacity="0.3"/>
  <text x="410" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">EX</text>

  <rect x="500" y="40" width="150" height="420" rx="6" fill="#DBEAFE" opacity="0.3"/>
  <text x="575" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">MEM</text>

  <rect x="660" y="40" width="140" height="420" rx="6" fill="#DBEAFE" opacity="0.3"/>
  <text x="730" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">WB</text>

  <!-- Pipeline registers (vertical bars) -->
  <rect x="172" y="65" width="6" height="380" rx="2" fill="#3B82F6"/>
  <text x="175" y="460" text-anchor="middle" font-size="9" fill="#3B82F6">IF/ID</text>

  <rect x="322" y="65" width="6" height="380" rx="2" fill="#3B82F6"/>
  <text x="325" y="460" text-anchor="middle" font-size="9" fill="#3B82F6">ID/EX</text>

  <rect x="492" y="65" width="6" height="380" rx="2" fill="#3B82F6"/>
  <text x="495" y="460" text-anchor="middle" font-size="9" fill="#3B82F6">EX/MEM</text>

  <rect x="652" y="65" width="6" height="380" rx="2" fill="#3B82F6"/>
  <text x="655" y="460" text-anchor="middle" font-size="9" fill="#3B82F6">MEM/WB</text>

  <!-- IF Stage components -->
  <rect x="45" y="100" width="110" height="40" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">PC</text>

  <rect x="45" y="160" width="110" height="40" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">IMEM</text>

  <rect x="45" y="220" width="110" height="30" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="240" text-anchor="middle" font-size="10" fill="#2563EB">PC+4 Adder</text>

  <!-- ID Stage components -->
  <rect x="195" y="100" width="110" height="40" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Decoder</text>

  <rect x="195" y="155" width="110" height="45" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">Register File</text>
  <text x="250" y="190" text-anchor="middle" font-size="9" fill="#6B7280">+ WB-ID Fwd</text>

  <rect x="195" y="215" width="110" height="35" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="237" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">Imm Gen</text>

  <rect x="195" y="265" width="110" height="35" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">Branch Comp</text>

  <!-- EX Stage -->
  <rect x="345" y="100" width="130" height="40" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">ALU</text>

  <rect x="345" y="160" width="130" height="35" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">ALU Src MUX</text>

  <rect x="345" y="210" width="130" height="35" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">Branch Target</text>

  <!-- MEM Stage -->
  <rect x="515" y="100" width="120" height="45" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="575" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">DMEM</text>

  <!-- WB Stage -->
  <rect x="675" y="100" width="110" height="40" rx="5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="730" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">WB MUX</text>

  <!-- Forwarding Unit -->
  <rect x="345" y="330" width="300" height="40" rx="5" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="495" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Forwarding Unit</text>

  <!-- Hazard Detection -->
  <rect x="195" y="330" width="140" height="40" rx="5" fill="#D97706" stroke="#D97706" stroke-width="1.5"/>
  <text x="265" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Hazard Detection</text>

  <!-- Control Unit -->
  <rect x="195" y="390" width="140" height="35" rx="5" fill="#7C3AED" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="265" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Control Unit</text>

  <!-- Forwarding paths (green dashed) -->
  <path d="M 495 330 Q 495 280 430 195" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr3g)"/>
  <path d="M 575 330 Q 575 280 440 195" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr3g)"/>

  <!-- WB writeback -->
  <path d="M 730 142 Q 730 480 250 480 Q 200 480 200 195" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <text x="470" y="495" text-anchor="middle" font-size="9" fill="#2563EB">WB → Register File (Write Back)</text>

  <!-- Legend -->
  <rect x="680" y="350" width="190" height="95" rx="6" fill="white" stroke="#E5E7EB"/>
  <text x="775" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">범례</text>
  <line x1="695" y1="385" x2="730" y2="385" stroke="#059669" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="740" y="389" font-size="9" fill="#1F2937">포워딩 경로</text>
  <rect x="695" y="398" width="35" height="10" rx="2" fill="#D97706"/>
  <text x="740" y="408" font-size="9" fill="#1F2937">해저드 감지</text>
  <rect x="695" y="418" width="35" height="10" rx="2" fill="#3B82F6"/>
  <text x="740" y="428" font-size="9" fill="#1F2937">파이프라인 레지스터</text>
</svg>