<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="850" height="550" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="425" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">링커 스크립트와 메모리 맵 — 섹션 배치</text>
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#64748B">ELF 파일의 .text / .data / .bss 섹션이 FPGA 메모리에 매핑되는 과정</text>

  <!-- ===== 왼쪽: ELF 파일 구조 ===== -->
  <text x="140" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">ELF 실행 파일</text>

  <!-- ELF Header -->
  <rect x="50" y="100" width="180" height="35" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">ELF Header</text>

  <!-- .text 섹션 -->
  <rect x="50" y="140" width="180" height="80" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">.text</text>
  <text x="140" y="186" text-anchor="middle" font-size="10" fill="#1E293B">실행 코드 (기계어)</text>
  <text x="140" y="202" text-anchor="middle" font-size="9" fill="#64748B">읽기 전용, 실행 가능</text>

  <!-- .rodata 섹션 -->
  <rect x="50" y="225" width="180" height="50" rx="4" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#4F46E5">.rodata</text>
  <text x="140" y="264" text-anchor="middle" font-size="9" fill="#64748B">읽기 전용 데이터 (상수)</text>

  <!-- .data 섹션 -->
  <rect x="50" y="280" width="180" height="65" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">.data</text>
  <text x="140" y="323" text-anchor="middle" font-size="10" fill="#1E293B">초기화된 전역/정적 변수</text>
  <text x="140" y="337" text-anchor="middle" font-size="9" fill="#64748B">읽기/쓰기</text>

  <!-- .bss 섹션 -->
  <rect x="50" y="350" width="180" height="60" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">.bss</text>
  <text x="140" y="391" text-anchor="middle" font-size="10" fill="#1E293B">미초기화 전역 변수 (0)</text>
  <text x="140" y="405" text-anchor="middle" font-size="9" fill="#64748B">실행 시 0으로 초기화</text>

  <!-- ===== 화살표: ELF → 링커 스크립트 ===== -->
  <line x1="235" y1="250" x2="310" y2="250" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="273" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">링커</text>

  <!-- ===== 중앙: 링커 스크립트 ===== -->
  <rect x="315" y="110" width="180" height="310" rx="6" fill="#FFF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="405" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#3B82F6">링커 스크립트 (.ld)</text>

  <text x="330" y="165" font-size="10" font-family="monospace" fill="#1E293B">MEMORY {</text>
  <text x="340" y="182" font-size="9" font-family="monospace" fill="#2563EB">  IMEM : 0x0000_0000</text>
  <text x="340" y="197" font-size="9" font-family="monospace" fill="#059669">  DMEM : 0x8000_0000</text>
  <text x="340" y="212" font-size="9" font-family="monospace" fill="#D97706">  MMIO : 0xC000_0000</text>
  <text x="330" y="229" font-size="10" font-family="monospace" fill="#1E293B">}</text>

  <text x="330" y="256" font-size="10" font-family="monospace" fill="#1E293B">SECTIONS {</text>
  <text x="340" y="273" font-size="9" font-family="monospace" fill="#2563EB">  .text → IMEM</text>
  <text x="340" y="290" font-size="9" font-family="monospace" fill="#4F46E5">  .rodata → IMEM</text>
  <text x="340" y="307" font-size="9" font-family="monospace" fill="#059669">  .data → DMEM</text>
  <text x="340" y="324" font-size="9" font-family="monospace" fill="#D97706">  .bss  → DMEM</text>
  <text x="340" y="341" font-size="9" font-family="monospace" fill="#DC2626">  _stack_top = .</text>
  <text x="330" y="358" font-size="10" font-family="monospace" fill="#1E293B">}</text>

  <text x="405" y="395" text-anchor="middle" font-size="10" fill="#64748B">주소 배치 결정</text>

  <!-- ===== 화살표: 링커 스크립트 → FPGA 메모리 ===== -->
  <line x1="500" y1="250" x2="575" y2="250" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="538" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">배치</text>

  <!-- ===== 오른쪽: FPGA 메모리 맵 ===== -->
  <text x="700" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">FPGA 메모리 맵</text>

  <!-- IMEM 영역 -->
  <rect x="580" y="100" width="240" height="130" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="120" font-size="9" font-family="monospace" font-weight="700" fill="#2563EB">0x0000_0000</text>
  <text x="700" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">IMEM (16 KB)</text>
  <text x="700" y="170" text-anchor="middle" font-size="10" fill="#1E293B">.text + .rodata</text>
  <text x="700" y="188" text-anchor="middle" font-size="9" fill="#64748B">BRAM × 4 블록</text>
  <text x="610" y="225" font-size="9" font-family="monospace" fill="#64748B">0x0000_3FFF</text>

  <!-- DMEM 영역 -->
  <rect x="580" y="240" width="240" height="120" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="260" font-size="9" font-family="monospace" font-weight="700" fill="#059669">0x8000_0000</text>
  <text x="700" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">DMEM (8 KB)</text>
  <text x="700" y="310" text-anchor="middle" font-size="10" fill="#1E293B">.data + .bss + stack</text>
  <text x="700" y="328" text-anchor="middle" font-size="9" fill="#64748B">BRAM × 2 블록</text>
  <text x="610" y="355" font-size="9" font-family="monospace" fill="#64748B">0x8000_1FFF</text>

  <!-- MMIO 영역 -->
  <rect x="580" y="370" width="240" height="90" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="390" font-size="9" font-family="monospace" font-weight="700" fill="#D97706">0xC000_0000</text>
  <text x="700" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">MMIO</text>
  <text x="700" y="435" text-anchor="middle" font-size="10" fill="#1E293B">UART / GPIO / Timer</text>
  <text x="610" y="455" font-size="9" font-family="monospace" fill="#64748B">0xC000_00FF</text>

  <!-- Stack 화살표 (DMEM 내부) -->
  <text x="790" y="330" font-size="10" font-weight="600" fill="#DC2626">sp (stack)</text>
  <line x1="785" y1="335" x2="785" y2="295" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowB)" stroke-dasharray="4,2"/>
  <text x="790" y="293" font-size="9" fill="#DC2626">성장 방향</text>

  <!-- 범례 -->
  <rect x="50" y="470" width="750" height="60" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="75" y="495" font-size="11" font-weight="600" fill="#1E293B">범례:</text>
  <rect x="120" y="484" width="14" height="14" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="140" y="496" font-size="10" fill="#1E293B">코드 영역 (읽기 전용)</text>
  <rect x="280" y="484" width="14" height="14" rx="2" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="300" y="496" font-size="10" fill="#1E293B">데이터 영역 (읽기/쓰기)</text>
  <rect x="460" y="484" width="14" height="14" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="480" y="496" font-size="10" fill="#1E293B">MMIO 영역 (주변 장치)</text>
  <text x="650" y="496" font-size="10" fill="#DC2626">↑ 스택 성장 방향</text>
</svg>