<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Pretendard, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">메모리 계층 구조 (Memory Hierarchy)</text>

  <!-- Level 0: Register File -->
  <rect x="240" y="50" width="240" height="50" rx="6" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="white">레지스터 파일 (Register File)</text>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#DBEAFE">32 x 32비트 | ~0.1ns | ~128B</text>

  <!-- Level 1: L1 Cache -->
  <rect x="180" y="120" width="360" height="50" rx="6" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
  <text x="360" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="white">L1 캐시 (L1 Cache)</text>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#DBEAFE">I-Cache + D-Cache | ~1ns | 4~64KB</text>

  <!-- Level 2: L2 Cache -->
  <rect x="120" y="190" width="480" height="50" rx="6" fill="#60A5FA" stroke="#3B82F6" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="white">L2 캐시 (L2 Cache)</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#1E3A5F">통합 캐시 | ~10ns | 256KB~2MB</text>

  <!-- Level 3: Main Memory -->
  <rect x="60" y="260" width="600" height="50" rx="6" fill="#93C5FD" stroke="#60A5FA" stroke-width="2"/>
  <text x="360" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">주 메모리 (Main Memory / DRAM)</text>
  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#1E3A5F">~100ns | 수 GB</text>

  <!-- Level 4: Storage -->
  <rect x="20" y="330" width="680" height="50" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">보조 저장장치 (SSD / HDD)</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#1E3A5F">~ms | 수 TB</text>

  <!-- Annotations: left side - speed -->
  <text x="15" y="55" font-size="12" font-weight="bold" fill="#2563EB">빠름</text>
  <line x1="15" y1="65" x2="15" y2="370" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="15" y="390" font-size="12" font-weight="bold" fill="#2563EB">느림</text>

  <!-- Annotations: right side - capacity -->
  <text x="710" y="55" text-anchor="end" font-size="12" font-weight="bold" fill="#2563EB">작음</text>
  <line x1="710" y1="65" x2="710" y2="370" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="390" text-anchor="end" font-size="12" font-weight="bold" fill="#2563EB">큼</text>

  <!-- Locality explanation -->
  <rect x="80" y="410" width="280" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="220" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">시간적 지역성 (Temporal)</text>
  <text x="220" y="452" text-anchor="middle" font-size="11" fill="#92400E">최근 접근한 데이터를 곧 다시 접근</text>

  <rect x="380" y="410" width="280" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="520" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">공간적 지역성 (Spatial)</text>
  <text x="520" y="452" text-anchor="middle" font-size="11" fill="#92400E">인접 주소의 데이터를 곧 접근</text>
</svg>