<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" font-family="Pretendard, sans-serif">
  <rect width="820" height="530" fill="#F8FAFC" rx="12"/>
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">메모리 계층 구조 (Memory Hierarchy)</text>

  <!-- 역삼각형 피라미드: 위로 갈수록 좁음 (빠름/비쌈/작음) -->
  <!-- 계층 1: 레지스터 (맨 위) -->
  <polygon points="310,55 510,55 560,100 260,100" fill="#1D4ED8" opacity="0.96"/>
  <text x="410" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="white">레지스터 파일 (Register File)</text>
  <text x="410" y="91" text-anchor="middle" font-size="10" fill="#BFDBFE">32 × 32bit  |  ~1사이클</text>

  <!-- 계층 2: L1 캐시 -->
  <polygon points="260,104 560,104 610,149 210,149" fill="#2563EB" opacity="0.93"/>
  <text x="410" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="white">L1 캐시 (L1 Cache)</text>
  <text x="410" y="141" text-anchor="middle" font-size="10" fill="#DBEAFE">수십 KB  |  ~4사이클</text>

  <!-- 계층 3: L2 캐시 -->
  <polygon points="210,153 610,153 660,198 160,198" fill="#3B82F6" opacity="0.90"/>
  <text x="410" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="white">L2 캐시 (L2 Cache)</text>
  <text x="410" y="191" text-anchor="middle" font-size="10" fill="#DBEAFE">수백 KB  |  ~10사이클</text>

  <!-- 계층 4: DRAM -->
  <polygon points="160,202 660,202 720,252 100,252" fill="#60A5FA" opacity="0.88"/>
  <text x="410" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">DRAM (주 메모리)</text>
  <text x="410" y="243" text-anchor="middle" font-size="10" fill="#1E3A5F">수 GB  |  ~100~300사이클</text>

  <!-- 계층 5: 저장장치 (맨 아래, 가장 넓음) -->
  <polygon points="100,256 720,256 770,306 50,306" fill="#BFDBFE" opacity="0.85"/>
  <text x="410" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">저장장치 (SSD / HDD)</text>
  <text x="410" y="297" text-anchor="middle" font-size="10" fill="#1E3A5F">수 TB  |  ~수만 사이클</text>

  <!-- 왼쪽 축: 속도↑/비용↑ -->
  <defs>
    <marker id="arL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,8 L4,0 L8,8" fill="#EF4444"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L4,8 L8,0" fill="#10B981"/>
    </marker>
  </defs>
  <line x1="38" y1="310" x2="38" y2="58" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arL)"/>
  <text x="22" y="190" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="600"
        transform="rotate(-90,22,190)">속도 ↑  /  비용 ↑</text>

  <!-- 오른쪽 축: 용량↑ -->
  <line x1="782" y1="58" x2="782" y2="310" stroke="#10B981" stroke-width="2.5" marker-end="url(#arR)"/>
  <text x="798" y="190" text-anchor="middle" font-size="11" fill="#10B981" font-weight="600"
        transform="rotate(90,798,190)">용량 ↑</text>

  <!-- AMAT 설명 박스 -->
  <rect x="40" y="330" width="740" height="170" fill="white" rx="10" stroke="#DBEAFE" stroke-width="2"/>
  <text x="410" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">AMAT 공식 (Average Memory Access Time, 평균 메모리 접근 시간)</text>
  <line x1="60" y1="365" x2="760" y2="365" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="410" y="390" text-anchor="middle" font-size="15" fill="#2563EB" font-weight="700">AMAT = 히트 시간 + 미스율 × 미스 페널티</text>
  <text x="410" y="415" text-anchor="middle" font-size="12" fill="#374151">예시: 히트 시간 = 1사이클,  미스율 = 5%,  미스 페널티 = 100사이클</text>
  <text x="410" y="438" text-anchor="middle" font-size="15" fill="#2563EB" font-weight="700">AMAT = 1 + 0.05 × 100 = 6사이클</text>
  <line x1="60" y1="450" x2="760" y2="450" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="410" y="470" text-anchor="middle" font-size="12" fill="#6B7280">캐시 없이 DRAM 직접 접근: AMAT ≈ 200사이클 → 캐시 도입 시 6사이클  (33배 향상)</text>
  <text x="410" y="490" text-anchor="middle" font-size="12" fill="#9CA3AF">* Basys 3 파라미터: 4KB / 128엔트리 / 32바이트 블록 / 미스 페널티 5사이클 (단순화)</text>
</svg>
