<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="860" height="500" fill="#F8FAFC" rx="8"/>
  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">2-bit 포화 카운터 상태 전이도</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#64748B">Saturating Counter: 한 번의 예측 실패로 즉시 반전하지 않음 (히스테리시스)</text>

  <!-- 상태 00: Strongly Not-Taken -->
  <circle cx="150" cy="170" r="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="150" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">00</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#DC2626">Strongly</text>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="#DC2626">Not-Taken</text>

  <!-- 상태 01: Weakly Not-Taken -->
  <circle cx="370" cy="170" r="55" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="370" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">01</text>
  <text x="370" y="180" text-anchor="middle" font-size="10" fill="#D97706">Weakly</text>
  <text x="370" y="195" text-anchor="middle" font-size="10" fill="#D97706">Not-Taken</text>

  <!-- 상태 10: Weakly Taken -->
  <circle cx="530" cy="170" r="55" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="530" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">10</text>
  <text x="530" y="180" text-anchor="middle" font-size="10" fill="#D97706">Weakly</text>
  <text x="530" y="195" text-anchor="middle" font-size="10" fill="#D97706">Taken</text>

  <!-- 상태 11: Strongly Taken -->
  <circle cx="710" cy="170" r="55" fill="#D1FAE5" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
  <text x="710" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">11</text>
  <text x="710" y="180" text-anchor="middle" font-size="10" fill="#059669">Strongly</text>
  <text x="710" y="195" text-anchor="middle" font-size="10" fill="#059669">Taken</text>

  <!-- 예측 결과 라벨 -->
  <rect x="100" y="240" width="100" height="24" rx="4" fill="#DC2626"/>
  <text x="150" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="white">예측: NT</text>
  <rect x="320" y="240" width="100" height="24" rx="4" fill="#DC2626"/>
  <text x="370" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="white">예측: NT</text>
  <rect x="480" y="240" width="100" height="24" rx="4" fill="#059669"/>
  <text x="530" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="white">예측: T</text>
  <rect x="660" y="240" width="100" height="24" rx="4" fill="#059669"/>
  <text x="710" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="white">예측: T</text>

  <!-- 전이 화살표: Taken (위쪽) -->
  <path d="M205,155 Q260,100 315,155" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="260" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Taken</text>

  <path d="M425,155 Q480,100 475,155" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="450" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Taken</text>

  <path d="M585,155 Q630,100 655,155" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="620" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Taken</text>

  <!-- 자기 루프: 11 Taken -->
  <path d="M740,125 Q780,80 750,120" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="780" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Taken</text>

  <!-- 전이 화살표: Not-Taken (아래쪽) -->
  <path d="M315,190 Q260,240 205,190" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="260" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">Not-Taken</text>

  <path d="M475,190 Q450,240 425,190" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="450" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">NT</text>

  <path d="M655,190 Q620,240 585,190" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="620" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">Not-Taken</text>

  <!-- 자기 루프: 00 Not-Taken -->
  <path d="M120,125 Q80,80 110,120" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="70" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">NT</text>

  <!-- BHT 구조 설명 -->
  <rect x="40" y="290" width="380" height="190" rx="8" fill="#DBEAFE" filter="url(#shadow)"/>
  <text x="230" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">BHT (Branch History Table) 구조</text>

  <rect x="60" y="330" width="340" height="25" rx="3" fill="#2563EB"/>
  <text x="100" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">PC[9:2]</text>
  <text x="200" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">2-bit Counter</text>
  <text x="330" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">예측</text>

  <rect x="60" y="358" width="340" height="22" rx="0" fill="white" stroke="#E5E7EB"/>
  <text x="100" y="373" text-anchor="middle" font-size="10" fill="#1E293B">0x00</text>
  <text x="200" y="373" text-anchor="middle" font-size="10" fill="#1E293B">11</text>
  <text x="330" y="373" text-anchor="middle" font-size="10" fill="#059669">Taken</text>

  <rect x="60" y="380" width="340" height="22" rx="0" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="100" y="395" text-anchor="middle" font-size="10" fill="#1E293B">0x01</text>
  <text x="200" y="395" text-anchor="middle" font-size="10" fill="#1E293B">00</text>
  <text x="330" y="395" text-anchor="middle" font-size="10" fill="#DC2626">Not-Taken</text>

  <rect x="60" y="402" width="340" height="22" rx="0" fill="white" stroke="#E5E7EB"/>
  <text x="100" y="417" text-anchor="middle" font-size="10" fill="#1E293B">0x02</text>
  <text x="200" y="417" text-anchor="middle" font-size="10" fill="#1E293B">10</text>
  <text x="330" y="417" text-anchor="middle" font-size="10" fill="#D97706">Taken</text>

  <text x="230" y="455" text-anchor="middle" font-size="11" fill="#64748B">... (256 엔트리, PC[9:2]로 인덱싱)</text>
  <text x="230" y="473" text-anchor="middle" font-size="10" fill="#64748B">Basys 3 LUTRAM: 256×2 = 512bit = 1 LUTRAM Slice</text>

  <!-- BTB 구조 -->
  <rect x="440" y="290" width="380" height="190" rx="8" fill="#DBEAFE" filter="url(#shadow)"/>
  <text x="630" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">BTB (Branch Target Buffer) 구조</text>

  <rect x="460" y="330" width="340" height="25" rx="3" fill="#2563EB"/>
  <text x="500" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">Tag</text>
  <text x="580" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">Valid</text>
  <text x="700" y="347" text-anchor="middle" font-size="10" font-weight="600" fill="white">Target PC</text>

  <rect x="460" y="358" width="340" height="22" rx="0" fill="white" stroke="#E5E7EB"/>
  <text x="500" y="373" text-anchor="middle" font-size="10" fill="#1E293B">0x3F</text>
  <text x="580" y="373" text-anchor="middle" font-size="10" fill="#059669">1</text>
  <text x="700" y="373" text-anchor="middle" font-size="10" fill="#1E293B">0x0000_1040</text>

  <rect x="460" y="380" width="340" height="22" rx="0" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="500" y="395" text-anchor="middle" font-size="10" fill="#1E293B">0x12</text>
  <text x="580" y="395" text-anchor="middle" font-size="10" fill="#059669">1</text>
  <text x="700" y="395" text-anchor="middle" font-size="10" fill="#1E293B">0x0000_1080</text>

  <rect x="460" y="402" width="340" height="22" rx="0" fill="white" stroke="#E5E7EB"/>
  <text x="500" y="417" text-anchor="middle" font-size="10" fill="#1E293B">—</text>
  <text x="580" y="417" text-anchor="middle" font-size="10" fill="#DC2626">0</text>
  <text x="700" y="417" text-anchor="middle" font-size="10" fill="#6B7280">—</text>

  <text x="630" y="455" text-anchor="middle" font-size="11" fill="#64748B">BTB는 BHT가 Taken 예측 시 분기 대상 주소를 제공</text>
  <text x="630" y="473" text-anchor="middle" font-size="10" fill="#64748B">IF 스테이지에서 BTB hit 시 즉시 redirect 가능</text>
</svg>