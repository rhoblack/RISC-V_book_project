<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">포워딩 우선순위 — EX-EX가 MEM-EX보다 우선</text>

  <!-- 시나리오 코드 -->
  <rect x="20" y="50" width="860" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="75" font-size="13" font-weight="bold" fill="#1F2937">우선순위가 필요한 시나리오:</text>
  <text x="40" y="100" font-size="13" fill="#1F2937" font-family="monospace">add  x1, x2, x3    // I1: x1에 값 A 쓰기</text>
  <text x="40" y="120" font-size="13" fill="#1F2937" font-family="monospace">add  x1, x4, x5    // I2: x1에 값 B 쓰기 (x1 덮어쓰기)</text>
  <text x="450" y="120" font-size="13" fill="#DC2626" font-family="monospace">add  x6, x1, x7    // I3: x1을 읽어야 함 → 값 B가 정답!</text>

  <!-- 파이프라인 타이밍 -->
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC1</text>
  <text x="230" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC2</text>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC3</text>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC4</text>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC5</text>
  <text x="590" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC6</text>
  <text x="680" y="170" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="bold">CC7</text>

  <!-- I1: add x1, x2, x3 -->
  <text x="48" y="200" font-size="11" fill="#1F2937">I1</text>
  <rect x="102" y="183" width="76" height="26" rx="3" fill="#2563EB"/>
  <text x="140" y="201" text-anchor="middle" font-size="10" fill="white" font-weight="bold">IF</text>
  <rect x="192" y="183" width="76" height="26" rx="3" fill="#3B82F6"/>
  <text x="230" y="201" text-anchor="middle" font-size="10" fill="white" font-weight="bold">ID</text>
  <rect x="282" y="183" width="76" height="26" rx="3" fill="#60A5FA"/>
  <text x="320" y="201" text-anchor="middle" font-size="10" fill="white" font-weight="bold">EX</text>
  <rect x="372" y="183" width="76" height="26" rx="3" fill="#93C5FD"/>
  <text x="410" y="201" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="462" y="183" width="76" height="26" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.5"/>
  <text x="500" y="201" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I2: add x1, x4, x5 -->
  <text x="48" y="240" font-size="11" fill="#1F2937">I2</text>
  <rect x="192" y="223" width="76" height="26" rx="3" fill="#2563EB"/>
  <text x="230" y="241" text-anchor="middle" font-size="10" fill="white" font-weight="bold">IF</text>
  <rect x="282" y="223" width="76" height="26" rx="3" fill="#3B82F6"/>
  <text x="320" y="241" text-anchor="middle" font-size="10" fill="white" font-weight="bold">ID</text>
  <rect x="372" y="223" width="76" height="26" rx="3" fill="#60A5FA"/>
  <text x="410" y="241" text-anchor="middle" font-size="10" fill="white" font-weight="bold">EX</text>
  <rect x="462" y="223" width="76" height="26" rx="3" fill="#93C5FD"/>
  <text x="500" y="241" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="552" y="223" width="76" height="26" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.5"/>
  <text x="590" y="241" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I3: add x6, x1, x7 -->
  <text x="48" y="280" font-size="11" fill="#DC2626" font-weight="bold">I3</text>
  <rect x="282" y="263" width="76" height="26" rx="3" fill="#2563EB"/>
  <text x="320" y="281" text-anchor="middle" font-size="10" fill="white" font-weight="bold">IF</text>
  <rect x="372" y="263" width="76" height="26" rx="3" fill="#3B82F6"/>
  <text x="410" y="281" text-anchor="middle" font-size="10" fill="white" font-weight="bold">ID</text>
  <rect x="462" y="263" width="76" height="26" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="500" y="281" text-anchor="middle" font-size="10" fill="#D97706" font-weight="bold">EX</text>

  <!-- 포워딩 경로: I1 MEM → I3 EX (MEM-EX, 우선순위 낮음) -->
  <path d="M 410 209 L 410 250 Q 410 260, 420 260 L 462 270" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="380" y="255" font-size="9" fill="#059669">MEM-EX (x1=값A)</text>
  <text x="710" y="340" font-size="11" fill="#059669">x (오래된 값)</text>

  <!-- 포워딩 경로: I2 EX → I3 EX (EX-EX, 우선순위 높음) -->
  <path d="M 448 236 L 462 250 Q 465 260, 470 265" stroke="#DC2626" stroke-width="3" fill="none"/>
  <text x="420" y="260" font-size="9" fill="#DC2626" font-weight="bold">EX-EX (x1=값B)</text>
  <text x="710" y="320" font-size="11" fill="#DC2626" font-weight="bold">O (최신 값!)</text>

  <!-- 결론 박스 -->
  <rect x="20" y="310" width="660" height="160" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="40" y="340" font-size="14" font-weight="bold" fill="#DC2626">포워딩 우선순위 규칙</text>
  <text x="40" y="365" font-size="12" fill="#1F2937">CC4에서 I3가 EX 스테이지를 실행할 때:</text>
  <text x="60" y="390" font-size="12" fill="#1F2937">- I1의 결과 (값 A)는 MEM/WB 레지스터에 있음 → MEM-EX 포워딩 가능</text>
  <text x="60" y="410" font-size="12" fill="#1F2937">- I2의 결과 (값 B)는 EX/MEM 레지스터에 있음 → EX-EX 포워딩 가능</text>
  <text x="40" y="440" font-size="13" fill="#DC2626" font-weight="bold">두 경로 모두 조건 충족 → EX-EX 포워딩이 우선! (가장 최신 값을 사용해야 함)</text>
  <text x="40" y="460" font-size="11" fill="#6B7280">구현: if(EX-EX 조건) → EX-EX 선택; else if(MEM-EX 조건) → MEM-EX 선택; else → 레지스터 파일 값</text>
</svg>