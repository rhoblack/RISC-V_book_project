<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480"
     font-family="'Pretendard', 'Noto Sans KR', sans-serif">

  <!-- 배경 -->
  <rect width="900" height="480" fill="#F8FAFC" rx="8"/>

  <!-- 제목 바 -->
  <rect x="0" y="0" width="900" height="44" fill="#1E3A8A" rx="8"/>
  <rect x="0" y="36" width="900" height="8" fill="#1E3A8A"/>
  <text x="450" y="27" text-anchor="middle" fill="white" font-size="15" font-weight="bold">
    더블 해저드: EX-EX 포워딩 우선순위
  </text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="aOrangeDark" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#EA580C"/>
    </marker>
    <marker id="aOrangeLight" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#F97316"/>
    </marker>
    <marker id="aGreen" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#16A34A"/>
    </marker>
    <marker id="aGray" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <line x1="30" y1="56" x2="60" y2="56" stroke="#EA580C" stroke-width="2.5"/>
  <text x="66" y="60" fill="#7C2D12" font-size="10" font-weight="bold">EX-EX 포워딩 (2'b10, 최신값 우선)</text>
  <line x1="280" y1="56" x2="310" y2="56" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="316" y="60" fill="#92400E" font-size="10">MEM-EX 포워딩 (2'b01, 무시됨)</text>
  <rect x="540" y="50" width="10" height="10" fill="#16A34A" stroke="#166534" stroke-width="1" rx="1"/>
  <text x="556" y="60" fill="#166534" font-size="10">선택됨 (EX-EX 승리)</text>
  <rect x="680" y="50" width="10" height="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" rx="1"/>
  <text x="696" y="60" fill="#991B1B" font-size="10">무시됨 (MEM-EX 패배)</text>

  <!-- 사이클 헤더 -->
  <rect x="110" y="72" width="770" height="24" fill="#1E3A8A" rx="4"/>
  <text x="55" y="88" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">명령어</text>

  <!-- 사이클 C1~C8 -->
  <text x="196" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C1</text>
  <text x="282" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C2</text>
  <text x="368" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C3</text>
  <text x="454" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C4</text>
  <text x="540" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C5</text>
  <text x="626" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C6</text>
  <text x="712" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C7</text>
  <text x="798" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="bold">C8</text>

  <!-- 그리드 세로선 -->
  <line x1="153" y1="72" x2="153" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="239" y1="72" x2="239" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="325" y1="72" x2="325" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="411" y1="72" x2="411" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="497" y1="72" x2="497" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="583" y1="72" x2="583" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="669" y1="72" x2="669" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="755" y1="72" x2="755" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="838" y1="72" x2="838" y2="340" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ======== 명령어 A: ADD x1,x2,x3 ======== -->
  <rect x="4" y="100" width="103" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="3"/>
  <text x="55" y="113" text-anchor="middle" fill="#1E40AF" font-size="9" font-weight="bold">ADD x1,x2,x3</text>
  <text x="55" y="123" text-anchor="middle" fill="#1E40AF" font-size="8">(명령어 A)</text>

  <rect x="153" y="100" width="84" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="2"/>
  <text x="196" y="118" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="bold">IF</text>
  <rect x="239" y="100" width="84" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="2"/>
  <text x="282" y="118" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="bold">ID</text>
  <rect x="325" y="100" width="84" height="28" fill="#2563EB" stroke="#1E3A8A" stroke-width="2" rx="2"/>
  <text x="368" y="114" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EX</text>
  <text x="368" y="124" text-anchor="middle" fill="#BFDBFE" font-size="7.5">x1 계산</text>
  <rect x="411" y="100" width="84" height="28" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2" rx="2"/>
  <text x="454" y="114" text-anchor="middle" fill="white" font-size="10" font-weight="bold">MEM</text>
  <text x="454" y="124" text-anchor="middle" fill="#BFDBFE" font-size="7.5">alu_result_mem</text>

  <!-- A: C5에 MEM/WB 위치 -->
  <rect x="497" y="100" width="84" height="28" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2" rx="2"/>
  <text x="540" y="114" text-anchor="middle" fill="white" font-size="10" font-weight="bold">WB</text>
  <text x="540" y="124" text-anchor="middle" fill="#BFDBFE" font-size="7.5">alu_result_wb</text>

  <!-- ======== 명령어 B: ADD x1,x1,x4 ======== -->
  <rect x="4" y="148" width="103" height="28" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" rx="3"/>
  <text x="55" y="161" text-anchor="middle" fill="#5B21B6" font-size="9" font-weight="bold">ADD x1,x1,x4</text>
  <text x="55" y="171" text-anchor="middle" fill="#5B21B6" font-size="8">(명령어 B)</text>

  <rect x="239" y="148" width="84" height="28" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="2"/>
  <text x="282" y="166" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="bold">IF</text>
  <rect x="325" y="148" width="84" height="28" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="2"/>
  <text x="368" y="166" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="bold">ID</text>
  <rect x="411" y="148" width="84" height="28" fill="#7C3AED" stroke="#4C1D95" stroke-width="2" rx="2"/>
  <text x="454" y="162" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EX</text>
  <text x="454" y="172" text-anchor="middle" fill="#DDD6FE" font-size="7.5">x1 계산</text>
  <!-- C5: EX/MEM 위치 -->
  <rect x="497" y="148" width="84" height="28" fill="#6D28D9" stroke="#4C1D95" stroke-width="2" rx="2"/>
  <text x="540" y="162" text-anchor="middle" fill="white" font-size="10" font-weight="bold">MEM</text>
  <text x="540" y="172" text-anchor="middle" fill="#DDD6FE" font-size="7.5">alu_result_mem</text>
  <rect x="583" y="148" width="84" height="28" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="2"/>
  <text x="626" y="166" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="bold">WB</text>

  <!-- ======== 명령어 C: ADD x5,x1,x6 ======== -->
  <rect x="4" y="196" width="103" height="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" rx="3"/>
  <text x="55" y="209" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">ADD x5,x1,x6</text>
  <text x="55" y="219" text-anchor="middle" fill="#166534" font-size="8">(명령어 C)</text>

  <rect x="325" y="196" width="84" height="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2"/>
  <text x="368" y="214" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">IF</text>
  <rect x="411" y="196" width="84" height="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2"/>
  <text x="454" y="214" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">ID</text>

  <!-- C5: EX 위치 (두 포워딩 모두 수신 가능) -->
  <rect x="497" y="196" width="84" height="28" fill="#16A34A" stroke="#166534" stroke-width="2.5" rx="2"/>
  <text x="540" y="210" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EX</text>
  <text x="540" y="220" text-anchor="middle" fill="#BBF7D0" font-size="7.5">x1 포워딩 수신</text>

  <rect x="583" y="196" width="84" height="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2"/>
  <text x="626" y="214" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">MEM</text>
  <rect x="669" y="196" width="84" height="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2"/>
  <text x="712" y="214" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">WB</text>

  <!-- ======== C5 시점 강조 배경 ======== -->
  <rect x="497" y="72" width="84" height="160" fill="#FEF3C7" fill-opacity="0.4" stroke="#D97706" stroke-width="2" stroke-dasharray="5,3" rx="3"/>
  <text x="540" y="248" text-anchor="middle" fill="#D97706" font-size="9.5" font-weight="bold">C5 시점</text>
  <text x="540" y="260" text-anchor="middle" fill="#D97706" font-size="8.5">충돌 결정!</text>

  <!-- ======== 포워딩 화살표 ======== -->
  <!-- B→C EX-EX 포워딩: B.EX/MEM(C5) → C.EX(C5) - 진한 주황 -->
  <!-- B의 EX/MEM(C5 컬럼)에서 C의 EX(C5 컬럼)로 세로 -->
  <path d="M540,176 Q540,186 540,196" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#aOrangeDark)"/>
  <rect x="552" y="183" width="120" height="14" fill="#FED7AA" rx="2"/>
  <text x="612" y="193" text-anchor="middle" fill="#7C2D12" font-size="8.5" font-weight="bold">B→C: EX-EX (2'b10) ✓ 선택!</text>

  <!-- A→C MEM-EX 포워딩: A.MEM/WB(C5) → C.EX(C5) - 연한 주황 점선 (무시됨) -->
  <path d="M540,128 Q490,160 497,196" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aOrangeLight)"/>
  <rect x="400" y="162" width="115" height="14" fill="#FFF7ED" stroke="#F97316" stroke-width="0.8" rx="2"/>
  <text x="458" y="172" text-anchor="middle" fill="#92400E" font-size="8.5">A→C: MEM-EX (2'b01) ✗ 무시</text>

  <!-- ======== 설명 패널 ======== -->
  <rect x="8" y="280" width="884" height="80" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" rx="6"/>
  <text x="450" y="298" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">더블 해저드(Double Hazard) 해결 원리</text>
  <line x1="24" y1="304" x2="876" y2="304" stroke="#BBF7D0" stroke-width="1"/>
  <text x="24" y="320" fill="#166534" font-size="10.5">• C5 시점: 명령어 A는 MEM/WB 위치(alu_result_wb), 명령어 B는 EX/MEM 위치(alu_result_mem), 명령어 C는 EX 진입</text>
  <text x="24" y="336" fill="#166534" font-size="10.5">• B→C 조건: rd_addr_mem(=x1) == rs1_addr_ex(=x1) AND reg_write_mem==1 → forward_a = 2'b10 (최신값, B의 결과)</text>
  <text x="24" y="352" fill="#166534" font-size="10.5">• A→C 조건: rd_addr_wb(=x1) == rs1_addr_ex(=x1) AND reg_write_wb==1 → 만족하지만 2'b10 우선이므로 2'b01 무시</text>

  <!-- 우선순위 규칙 박스 -->
  <rect x="8" y="370" width="884" height="96" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" rx="6"/>
  <text x="450" y="388" text-anchor="middle" fill="#7C2D12" font-size="12" font-weight="bold">SystemVerilog 포워딩 우선순위 로직 (핵심)</text>
  <line x1="24" y1="394" x2="876" y2="394" stroke="#FED7AA" stroke-width="1"/>
  <text x="24" y="410" fill="#78350F" font-size="10" font-family="monospace">if      (rd_addr_mem != 0 &amp;&amp; reg_write_mem &amp;&amp; rd_addr_mem == rs1_addr_ex) forward_a = 2'b10;  // EX-EX 우선</text>
  <text x="24" y="426" fill="#78350F" font-size="10" font-family="monospace">else if (rd_addr_wb  != 0 &amp;&amp; reg_write_wb  &amp;&amp; rd_addr_wb  == rs1_addr_ex) forward_a = 2'b01;  // MEM-EX</text>
  <text x="24" y="442" fill="#78350F" font-size="10" font-family="monospace">else                                                                             forward_a = 2'b00;  // 포워딩 없음</text>
  <text x="24" y="458" fill="#EA580C" font-size="9.5" font-style="italic">* EX-EX를 먼저 검사 (if-else 순서) → 더 최신의 값을 자동 선택. forward_b도 동일 로직.</text>

</svg>
