<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="700" height="420" fill="#F8FAFC" rx="8"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">2-bit 포화 카운터 상태 전이도</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#64748B">BHT(Branch History Table) 엔트리 — taken(T) 시 좌측, not-taken(NT) 시 우측 이동</text>
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 상태 원 -->
  <!-- 11: 강한 Taken -->
  <circle cx="140" cy="220" r="65" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2.5"/>
  <text x="140" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="white">11</text>
  <text x="140" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="#BFDBFE">강하게</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#BFDBFE">분기함</text>
  <text x="140" y="258" text-anchor="middle" font-size="9" fill="#93C5FD">예측: Taken</text>

  <!-- 10: 약한 Taken -->
  <circle cx="320" cy="220" r="65" fill="#3B82F6" stroke="#2563EB" stroke-width="2.5"/>
  <text x="320" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="white">10</text>
  <text x="320" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="#DBEAFE">약하게</text>
  <text x="320" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#DBEAFE">분기함</text>
  <text x="320" y="258" text-anchor="middle" font-size="9" fill="#BFDBFE">예측: Taken</text>

  <!-- 01: 약한 Not-Taken -->
  <circle cx="500" cy="220" r="65" fill="#93C5FD" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="500" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">01</text>
  <text x="500" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A">약하게</text>
  <text x="500" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A">미분기</text>
  <text x="500" y="258" text-anchor="middle" font-size="9" fill="#1E40AF">예측: Not-Taken</text>

  <!-- 00: 강한 Not-Taken -->
  <circle cx="620" cy="220" r="55" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
  <text x="620" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">00</text>
  <text x="620" y="224" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A">강하게</text>
  <text x="620" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A">미분기</text>
  <text x="620" y="254" text-anchor="middle" font-size="9" fill="#1E40AF">예측: Not-Taken</text>

  <!-- 11 → 11 (T, 포화) -->
  <path d="M 100 160 Q 70 120 110 160" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="68" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">T</text>
  <text x="68" y="150" text-anchor="middle" font-size="8" fill="#64748B">(포화)</text>

  <!-- 11 → 10 (NT) -->
  <line x1="205" y1="220" x2="255" y2="220" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="230" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">NT</text>

  <!-- 10 → 11 (T) -->
  <path d="M 275 200 Q 260 160 225 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="240" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">T</text>

  <!-- 10 → 01 (NT) -->
  <line x1="385" y1="220" x2="435" y2="220" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="410" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">NT</text>

  <!-- 01 → 10 (T) -->
  <path d="M 455 200 Q 440 160 400 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="420" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">T</text>

  <!-- 01 → 00 (NT) -->
  <line x1="565" y1="220" x2="565" y2="220" stroke="#DC2626" stroke-width="2"/>
  <line x1="565" y1="220" x2="565" y2="220" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <!-- 직선 연결 -->
  <path d="M 560 220 L 565 220" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <!-- 01 → 00 수평 -->
  <line x1="563" y1="220" x2="567" y2="220" stroke="#DC2626" stroke-width="0.5"/>
  <!-- 재작성 -->
  <path d="M 558 230 Q 588 260 610 250" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="590" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">NT</text>

  <!-- 00 → 01 (T) -->
  <path d="M 580 195 Q 570 160 545 195" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="557" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">T</text>

  <!-- 00 → 00 (NT 포화) -->
  <path d="M 650 168 Q 680 130 660 165" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="688" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">NT</text>
  <text x="688" y="160" text-anchor="middle" font-size="8" fill="#64748B">(포화)</text>

  <!-- 예측 구분선 -->
  <line x1="405" y1="80" x2="405" y2="380" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">예측: Taken (11, 10)</text>
  <text x="540" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">예측: Not-Taken (01, 00)</text>

  <!-- BHT 설명 -->
  <rect x="30" y="345" width="320" height="55" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" rx="6"/>
  <text x="190" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">BHT (Branch History Table)</text>
  <text x="190" y="381" text-anchor="middle" font-size="9" fill="#334155">256 엔트리 × 2-bit = 512 bit (Basys 3 LUT ~256개)</text>
  <text x="190" y="395" text-anchor="middle" font-size="9" fill="#334155">PC[9:2]로 인덱싱 — 루프 예측률 95%+ 달성 가능</text>

  <!-- T/NT 범례 -->
  <rect x="360" y="345" width="300" height="55" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" rx="6"/>
  <text x="510" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">T = Taken (분기 실행됨)</text>
  <text x="510" y="381" text-anchor="middle" font-size="10" fill="#15803D">NT = Not-Taken (분기 미실행)</text>
  <text x="510" y="397" text-anchor="middle" font-size="9" fill="#64748B">2회 연속 오예측 후 상태 변경</text>
</svg>