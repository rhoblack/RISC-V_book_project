<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arr4g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">RISC-V 공식 테스트 스위트 실행 흐름</text>

  <!-- Source -->
  <rect x="30" y="55" width="150" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="105" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">riscv-tests</text>
  <text x="105" y="98" text-anchor="middle" font-size="9" fill="#6B7280">GitHub 공식 저장소</text>
  <text x="105" y="114" text-anchor="middle" font-size="9" fill="#6B7280">rv32ui-p-*.S</text>

  <line x1="180" y1="90" x2="220" y2="90" stroke="#2563EB" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Cross-compile -->
  <rect x="225" y="55" width="150" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Cross Compile</text>
  <text x="300" y="98" text-anchor="middle" font-size="9" fill="#6B7280">riscv32-unknown-elf-gcc</text>
  <text x="300" y="114" text-anchor="middle" font-size="9" fill="#6B7280">→ .elf → .hex</text>

  <line x1="375" y1="90" x2="415" y2="90" stroke="#2563EB" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Load to DUT -->
  <rect x="420" y="55" width="150" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="495" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97706">FPGA/Sim 로드</text>
  <text x="495" y="98" text-anchor="middle" font-size="9" fill="#6B7280">$readmemh (시뮬)</text>
  <text x="495" y="114" text-anchor="middle" font-size="9" fill="#6B7280">BRAM 초기화 (FPGA)</text>

  <line x1="570" y1="90" x2="610" y2="90" stroke="#2563EB" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Execute -->
  <rect x="615" y="55" width="160" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="695" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">실행 + HTIF 확인</text>
  <text x="695" y="98" text-anchor="middle" font-size="9" fill="#6B7280">tohost CSR 감시</text>
  <text x="695" y="114" text-anchor="middle" font-size="9" fill="#6B7280">PASS=1 / FAIL≠1</text>

  <!-- HTIF Detail -->
  <rect x="30" y="160" width="745" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="402" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">HTIF (Host-Target Interface) 프로토콜</text>

  <!-- Test flow diagram -->
  <rect x="50" y="205" width="120" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="230" text-anchor="middle" font-size="10" fill="#1F2937">테스트 시작</text>

  <line x1="170" y1="225" x2="210" y2="225" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="215" y="205" width="130" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="280" y="223" text-anchor="middle" font-size="10" fill="#1F2937">테스트 케이스</text>
  <text x="280" y="237" text-anchor="middle" font-size="9" fill="#6B7280">N번 실행</text>

  <line x1="345" y1="225" x2="385" y2="225" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Branch: pass/fail -->
  <polygon points="435,205 485,225 435,245 385,225" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="435" y="228" text-anchor="middle" font-size="9" fill="#1F2937">결과?</text>

  <!-- Pass path -->
  <line x1="485" y1="215" x2="530" y2="205" stroke="#059669" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <rect x="535" y="195" width="100" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="215" text-anchor="middle" font-size="10" fill="#059669">PASS</text>

  <!-- tohost write -->
  <line x1="635" y1="210" x2="665" y2="210" stroke="#059669" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <rect x="670" y="195" width="90" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="715" y="214" text-anchor="middle" font-size="9" fill="#059669">tohost = 1</text>

  <!-- Fail path -->
  <line x1="485" y1="235" x2="530" y2="245" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="535" y="235" width="100" height="30" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="585" y="255" text-anchor="middle" font-size="10" fill="#DC2626">FAIL</text>

  <line x1="635" y1="250" x2="665" y2="250" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="670" y="235" width="90" height="30" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="715" y="254" text-anchor="middle" font-size="9" fill="#DC2626">tohost = N&lt;&lt;1|1</text>

  <text x="60" y="290" font-size="10" fill="#6B7280">tohost 주소: 0x80001000 (링커 스크립트로 지정) — 테스트벤치/FPGA가 이 주소의 쓰기를 감시하여 PASS/FAIL 판정</text>

  <!-- Test categories -->
  <rect x="30" y="330" width="745" height="155" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="402" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">RV32I 테스트 카테고리 (rv32ui-p-*)</text>

  <rect x="50" y="370" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="110" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">산술/논리</text>
  <text x="110" y="408" text-anchor="middle" font-size="9" fill="#6B7280">add, sub, and, or,</text>
  <text x="110" y="420" text-anchor="middle" font-size="9" fill="#6B7280">xor, sll, srl, sra</text>

  <rect x="185" y="370" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="245" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">즉치수 연산</text>
  <text x="245" y="408" text-anchor="middle" font-size="9" fill="#6B7280">addi, andi, ori,</text>
  <text x="245" y="420" text-anchor="middle" font-size="9" fill="#6B7280">slti, slli, srli</text>

  <rect x="320" y="370" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="380" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">로드/스토어</text>
  <text x="380" y="408" text-anchor="middle" font-size="9" fill="#6B7280">lw, lh, lb, lhu,</text>
  <text x="380" y="420" text-anchor="middle" font-size="9" fill="#6B7280">lbu, sw, sh, sb</text>

  <rect x="455" y="370" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="515" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">분기/점프</text>
  <text x="515" y="408" text-anchor="middle" font-size="9" fill="#6B7280">beq, bne, blt,</text>
  <text x="515" y="420" text-anchor="middle" font-size="9" fill="#6B7280">jal, jalr, auipc</text>

  <rect x="590" y="370" width="170" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="675" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">시스템</text>
  <text x="675" y="408" text-anchor="middle" font-size="9" fill="#6B7280">fence, ecall, ebreak</text>
  <text x="675" y="420" text-anchor="middle" font-size="9" fill="#6B7280">(간소화 구현 가능)</text>

  <text x="402" y="470" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">총 39개 테스트 — 모두 PASS 시 RV32I 명령어 구현 완전성 보장</text>
  <text x="402" y="490" text-anchor="middle" font-size="10" fill="#6B7280">테스트별 평균 50~200 명령어 실행, 전체 ~5000 명령어</text>
</svg>