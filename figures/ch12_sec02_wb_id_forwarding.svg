<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrRed2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">WB-ID 포워딩 (레지스터 파일 내부 바이패스)</text>

  <!-- Register File Block -->
  <rect x="250" y="50" width="300" height="300" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">레지스터 파일 (Register File)</text>

  <!-- Write Port -->
  <rect x="280" y="100" width="120" height="60" rx="6" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="340" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">Write Port</text>
  <text x="340" y="145" text-anchor="middle" font-size="10" fill="#6B7280">@posedge clk</text>

  <!-- Read Port 1 -->
  <rect x="280" y="180" width="120" height="50" rx="6" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="340" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">Read Port 1</text>
  <text x="340" y="218" text-anchor="middle" font-size="10" fill="#6B7280">rs1 (비동기)</text>

  <!-- Read Port 2 -->
  <rect x="280" y="250" width="120" height="50" rx="6" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="340" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">Read Port 2</text>
  <text x="340" y="288" text-anchor="middle" font-size="10" fill="#6B7280">rs2 (비동기)</text>

  <!-- Forwarding MUX -->
  <rect x="430" y="170" width="90" height="50" rx="6" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Forward</text>
  <text x="475" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="white">MUX</text>

  <rect x="430" y="240" width="90" height="50" rx="6" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Forward</text>
  <text x="475" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="white">MUX</text>

  <!-- Input from WB stage -->
  <line x1="140" y1="130" x2="278" y2="130" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="140" y="120" font-size="10" fill="#2563EB" font-weight="bold">WB Stage</text>
  <text x="140" y="145" font-size="9" fill="#6B7280">wb_rd, wb_data, wb_reg_wen</text>

  <!-- Input from ID stage -->
  <line x1="140" y1="205" x2="278" y2="205" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="140" y1="275" x2="278" y2="275" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="140" y="195" font-size="10" fill="#2563EB" font-weight="bold">ID Stage</text>
  <text x="140" y="265" font-size="10" fill="#2563EB" font-weight="bold">ID Stage</text>

  <!-- Forwarding paths -->
  <path d="M 400 130 L 425 130 L 425 195 L 428 195" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="5,3"/>
  <path d="M 400 130 L 425 130 L 425 265 L 428 265" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="5,3"/>

  <!-- Read outputs -->
  <line x1="400" y1="205" x2="428" y2="195" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="400" y1="275" x2="428" y2="265" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- MUX outputs -->
  <line x1="520" y1="195" x2="580" y2="195" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="520" y1="265" x2="580" y2="265" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="590" y="195" font-size="10" fill="#059669" font-weight="bold">rd1_data</text>
  <text x="590" y="265" font-size="10" fill="#059669" font-weight="bold">rd2_data</text>

  <!-- Forwarding condition -->
  <rect x="450" y="320" width="330" height="55" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="615" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">포워딩 조건</text>
  <text x="615" y="358" text-anchor="middle" font-size="10" fill="#1F2937" font-family="monospace">wb_reg_wen &amp;&amp; (wb_rd != 0) &amp;&amp; (wb_rd == id_rs1)</text>
  <text x="615" y="372" text-anchor="middle" font-size="9" fill="#6B7280">→ MUX에서 wb_data 선택 (레지스터 파일 읽기값 대신)</text>
</svg>