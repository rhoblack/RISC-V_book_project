<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E11D48"/>
    </marker>
  </defs>

  <text x="475" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">D-Cache와 파이프라인 MEM 스테이지 연동</text>

  <!-- Pipeline Stages -->
  <rect x="30" y="60" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="92" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">IF Stage</text>

  <rect x="200" y="60" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">ID Stage</text>

  <rect x="370" y="60" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="440" y="92" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">EX Stage</text>

  <rect x="540" y="60" width="160" height="55" rx="10" fill="#2563EB" stroke="#1E3A5F" stroke-width="2"/>
  <text x="620" y="85" text-anchor="middle" font-size="14" fill="white" font-weight="bold">MEM Stage</text>
  <text x="620" y="102" text-anchor="middle" font-size="11" fill="#BFDBFE">D-Cache 접근</text>

  <rect x="730" y="60" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="800" y="92" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">WB Stage</text>

  <!-- 화살표 연결 -->
  <line x1="170" y1="87" x2="198" y2="87" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="340" y1="87" x2="368" y2="87" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="510" y1="87" x2="538" y2="87" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="700" y1="87" x2="728" y2="87" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- D-Cache 블록 -->
  <rect x="520" y="150" width="200" height="100" rx="12" fill="#3B82F6" stroke="#1E3A5F" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" font-size="15" fill="white" font-weight="bold">D-Cache</text>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#BFDBFE">2-Way Set-Associative</text>
  <text x="620" y="218" text-anchor="middle" font-size="11" fill="#BFDBFE">Write-Back + LRU</text>

  <line x1="620" y1="115" x2="620" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- dcache_stall 신호 -->
  <rect x="320" y="290" width="180" height="40" rx="8" fill="#E11D48"/>
  <text x="410" y="315" text-anchor="middle" font-size="13" fill="white" font-weight="bold">dcache_stall</text>

  <line x1="520" y1="250" x2="500" y2="290" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- Stall 영향 범위 -->
  <line x1="320" y1="310" x2="100" y2="310" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="100" y1="310" x2="100" y2="120" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="105" y="135" font-size="10" fill="#E11D48">PC Hold</text>

  <line x1="350" y1="290" x2="270" y2="120" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="275" y="135" font-size="10" fill="#E11D48">IF/ID Hold</text>

  <line x1="390" y1="290" x2="440" y2="120" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="445" y="135" font-size="10" fill="#E11D48">ID/EX Hold</text>

  <line x1="450" y1="290" x2="620" y2="120" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="625" y="135" font-size="10" fill="#E11D48">EX/MEM Hold</text>

  <!-- Main Memory -->
  <rect x="770" y="170" width="150" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="845" y="198" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">Main Memory</text>
  <text x="845" y="215" text-anchor="middle" font-size="10" fill="#6B7280">(느린 접근)</text>

  <line x1="720" y1="200" x2="768" y2="200" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 타이밍 다이어그램 -->
  <rect x="30" y="350" width="890" height="90" rx="8" fill="#F0F7FF" stroke="#2563EB" stroke-width="1"/>
  <text x="50" y="375" font-size="13" font-weight="bold" fill="#1E3A5F">타이밍:</text>

  <text x="50" y="400" font-size="11" fill="#059669" font-weight="bold">Cache Hit:</text>
  <text x="140" y="400" font-size="11" fill="#1E3A5F">MEM 스테이지 1 사이클 완료, dcache_stall = 0</text>

  <text x="50" y="420" font-size="11" fill="#F59E0B" font-weight="bold">Miss (Clean):</text>
  <text x="160" y="420" font-size="11" fill="#1E3A5F">Refill 동안 dcache_stall = 1 (약 8~16 사이클), 전체 파이프라인 정지</text>

  <text x="50" y="440" font-size="11" fill="#E11D48" font-weight="bold">Miss (Dirty):</text>
  <text x="160" y="440" font-size="11" fill="#1E3A5F">Write-Back + Refill 동안 dcache_stall = 1 (약 16~32 사이클), 전체 파이프라인 정지</text>
</svg>