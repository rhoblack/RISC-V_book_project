<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <style>
      .field-bg { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1.5; }
      .field-bg-alt { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
      .field-label { font-size: 13px; fill: #1E293B; font-weight: 600; text-anchor: middle; }
      .field-name { font-size: 11px; fill: #2563EB; font-weight: 600; text-anchor: middle; }
      .title { font-size: 16px; fill: #1E293B; font-weight: 700; }
      .bit-range { font-size: 9px; fill: #9CA3AF; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
      /* Color coding for bit reordering */
      .imm12 { fill: #DC2626; } /* bit 12 - red */
      .imm10-5 { fill: #2563EB; } /* bits 10:5 - blue */
      .imm4-1 { fill: #059669; } /* bits 4:1 - green */
      .imm11 { fill: #D97706; } /* bit 11 - amber */
      .field-red { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; }
      .field-blue { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; }
      .field-green { fill: #D1FAE5; stroke: #059669; stroke-width: 2; }
      .field-amber { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
    </style>
  </defs>

  <text x="400" y="25" text-anchor="middle" class="title">B 타입 명령어 인코딩 (B-Type Encoding) — 비트 재배열 색상 코딩</text>

  <!-- Bit positions -->
  <text x="40" y="50" class="bit-range">31</text>
  <text x="120" y="50" class="bit-range">30    25</text>
  <text x="240" y="50" class="bit-range">24  20</text>
  <text x="340" y="50" class="bit-range">19  15</text>
  <text x="430" y="50" class="bit-range">14  12</text>
  <text x="540" y="50" class="bit-range">11  8</text>
  <text x="620" y="50" class="bit-range">7</text>
  <text x="710" y="50" class="bit-range">6      0</text>

  <!-- Encoding fields with color coding -->
  <rect x="20" y="60" width="40" height="45" rx="4" class="field-red"/>
  <rect x="60" y="60" width="120" height="45" rx="4" class="field-blue"/>
  <rect x="180" y="60" width="100" height="45" rx="4" class="field-bg-alt"/>
  <rect x="280" y="60" width="100" height="45" rx="4" class="field-bg"/>
  <rect x="380" y="60" width="90" height="45" rx="4" class="field-bg-alt"/>
  <rect x="470" y="60" width="120" height="45" rx="4" class="field-green"/>
  <rect x="590" y="60" width="60" height="45" rx="4" class="field-amber"/>
  <rect x="650" y="60" width="130" height="45" rx="4" class="field-bg"/>

  <text x="40" y="87" class="field-label" style="fill:#DC2626;">imm[12]</text>
  <text x="120" y="87" class="field-label" style="fill:#2563EB;">imm[10:5]</text>
  <text x="230" y="87" class="field-label">rs2</text>
  <text x="330" y="87" class="field-label">rs1</text>
  <text x="425" y="87" class="field-label">funct3</text>
  <text x="530" y="87" class="field-label" style="fill:#059669;">imm[4:1]</text>
  <text x="620" y="87" class="field-label" style="fill:#D97706;">imm[11]</text>
  <text x="715" y="87" class="field-label">opcode</text>

  <!-- Bit widths -->
  <text x="40" y="123" class="field-name">1</text>
  <text x="120" y="123" class="field-name">6비트</text>
  <text x="230" y="123" class="field-name">5비트</text>
  <text x="330" y="123" class="field-name">5비트</text>
  <text x="425" y="123" class="field-name">3비트</text>
  <text x="530" y="123" class="field-name">4비트</text>
  <text x="620" y="123" class="field-name">1</text>
  <text x="715" y="123" class="field-name">7비트</text>

  <text x="715" y="143" class="bit-range" style="font-size:11px; fill:#2563EB;">1100011</text>

  <!-- Reassembled immediate -->
  <text x="400" y="165" text-anchor="middle" style="font-size:13px; fill:#1E293B; font-weight:700;">재조합된 즉치수 (Reassembled Immediate)</text>

  <rect x="80" y="175" width="50" height="35" rx="3" class="field-red"/>
  <rect x="130" y="175" width="50" height="35" rx="3" class="field-amber"/>
  <rect x="180" y="175" width="200" height="35" rx="3" class="field-blue"/>
  <rect x="380" y="175" width="150" height="35" rx="3" class="field-green"/>
  <rect x="530" y="175" width="50" height="35" rx="3" style="fill:#F3F4F6; stroke:#9CA3AF; stroke-width:1.5;"/>

  <text x="105" y="197" style="font-size:12px; fill:#DC2626; font-weight:600; text-anchor:middle;">12</text>
  <text x="155" y="197" style="font-size:12px; fill:#D97706; font-weight:600; text-anchor:middle;">11</text>
  <text x="280" y="197" style="font-size:12px; fill:#2563EB; font-weight:600; text-anchor:middle;">10  9  8  7  6  5</text>
  <text x="455" y="197" style="font-size:12px; fill:#059669; font-weight:600; text-anchor:middle;">4  3  2  1</text>
  <text x="555" y="197" style="font-size:11px; fill:#9CA3AF; font-weight:600; text-anchor:middle;">0</text>

  <text x="555" y="230" style="font-size:10px; fill:#9CA3AF; text-anchor:middle;">항상 0</text>

  <!-- Legend -->
  <text x="80" y="260" style="font-size:12px; fill:#1E293B; font-weight:600;">색상 범례:</text>
  <rect x="180" y="248" width="16" height="16" rx="2" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="200" y="261" style="font-size:11px; fill:#DC2626;">imm[12] — 부호 비트 (MSB)</text>
  <rect x="370" y="248" width="16" height="16" rx="2" fill="#FEF3C7" stroke="#D97706"/>
  <text x="390" y="261" style="font-size:11px; fill:#D97706;">imm[11] — S 타입 대비 이동</text>
  <rect x="180" y="272" width="16" height="16" rx="2" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="200" y="285" style="font-size:11px; fill:#2563EB;">imm[10:5] — S 타입과 동일 위치</text>
  <rect x="370" y="272" width="16" height="16" rx="2" fill="#D1FAE5" stroke="#059669"/>
  <text x="390" y="285" style="font-size:11px; fill:#059669;">imm[4:1] — S 타입 대비 이동</text>

  <text x="400" y="308" text-anchor="middle" style="font-size:11px; fill:#6B7280;">imm[0]은 항상 0 (2바이트 정렬) — 13비트 범위: -4096 ~ +4094 (짝수 오프셋만 가능)</text>
</svg>