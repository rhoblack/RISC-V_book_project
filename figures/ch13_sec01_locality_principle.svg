<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Pretendard, sans-serif">
  <rect width="820" height="500" fill="#F8FAFC" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">지역성 원리 (Locality Principle)</text>

  <!-- 시간적 지역성 (왼쪽) -->
  <rect x="30" y="50" width="370" height="210" fill="white" rx="10" stroke="#2563EB" stroke-width="2"/>
  <rect x="30" y="50" width="370" height="36" fill="#2563EB" rx="10"/>
  <rect x="30" y="72" width="370" height="14" fill="#2563EB"/>
  <text x="215" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="white">시간적 지역성 (Temporal Locality)</text>
  <text x="215" y="105" text-anchor="middle" font-size="11" fill="#374151">최근 접근 주소는 가까운 미래에 다시 접근 가능성 높음</text>
  <text x="215" y="122" text-anchor="middle" font-size="11" fill="#374151">예: 루프 카운터 i, 반복 실행 명령어</text>

  <text x="50" y="148" font-size="11" fill="#6B7280">시간 -&gt;</text>
  <line x1="50" y1="155" x2="380" y2="155" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="80" cy="155" r="8" fill="#2563EB"/>
  <circle cx="140" cy="155" r="8" fill="#2563EB"/>
  <circle cx="200" cy="155" r="8" fill="#2563EB"/>
  <circle cx="260" cy="155" r="8" fill="#2563EB"/>
  <circle cx="320" cy="155" r="8" fill="#2563EB"/>
  <text x="80" y="178" text-anchor="middle" font-size="10" fill="#2563EB">0x100</text>
  <text x="140" y="178" text-anchor="middle" font-size="10" fill="#2563EB">0x100</text>
  <text x="200" y="178" text-anchor="middle" font-size="10" fill="#2563EB">0x100</text>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#2563EB">0x100</text>
  <text x="320" y="178" text-anchor="middle" font-size="10" fill="#2563EB">0x100</text>
  <text x="80" y="218" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">MISS</text>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="200" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="260" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="320" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <rect x="50" y="228" width="330" height="24" fill="#DBEAFE" rx="4"/>
  <text x="215" y="244" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">버블정렬 루프 카운터가 반복 접근되는 패턴</text>

  <!-- 공간적 지역성 (오른쪽) -->
  <rect x="420" y="50" width="370" height="210" fill="white" rx="10" stroke="#3B82F6" stroke-width="2"/>
  <rect x="420" y="50" width="370" height="36" fill="#3B82F6" rx="10"/>
  <rect x="420" y="72" width="370" height="14" fill="#3B82F6"/>
  <text x="605" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="white">공간적 지역성 (Spatial Locality)</text>
  <text x="605" y="105" text-anchor="middle" font-size="11" fill="#374151">접근 주소 인근도 곧 접근할 가능성이 높음</text>
  <text x="605" y="122" text-anchor="middle" font-size="11" fill="#374151">예: 배열 순차 접근 arr[0], arr[1], arr[2]...</text>

  <text x="440" y="148" font-size="11" fill="#6B7280">시간 -&gt;</text>
  <line x1="440" y1="155" x2="770" y2="155" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="470" cy="155" r="8" fill="#3B82F6"/>
  <circle cx="530" cy="155" r="8" fill="#3B82F6"/>
  <circle cx="590" cy="155" r="8" fill="#3B82F6"/>
  <circle cx="650" cy="155" r="8" fill="#3B82F6"/>
  <circle cx="710" cy="155" r="8" fill="#3B82F6"/>
  <text x="470" y="178" text-anchor="middle" font-size="10" fill="#3B82F6">0x000</text>
  <text x="530" y="178" text-anchor="middle" font-size="10" fill="#3B82F6">0x004</text>
  <text x="590" y="178" text-anchor="middle" font-size="10" fill="#3B82F6">0x008</text>
  <text x="650" y="178" text-anchor="middle" font-size="10" fill="#3B82F6">0x00C</text>
  <text x="710" y="178" text-anchor="middle" font-size="10" fill="#3B82F6">0x010</text>
  <text x="470" y="218" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">MISS</text>
  <text x="530" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="590" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="650" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <text x="710" y="218" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">HIT</text>
  <rect x="440" y="228" width="330" height="24" fill="#DBEAFE" rx="4"/>
  <text x="605" y="244" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">버블정렬 arr[j] 순차 접근 -&gt; 블록 채움 후 HIT</text>

  <!-- 캐시 라인 블록 시각화 -->
  <rect x="30" y="280" width="760" height="195" fill="white" rx="10" stroke="#DBEAFE" stroke-width="2"/>
  <text x="410" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">캐시 라인(Cache Line) - 왜 32바이트씩 가져오는가?</text>

  <text x="50" y="335" font-size="12" fill="#374151" font-weight="600">메모리:</text>
  <rect x="115" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="135" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x00</text>
  <rect x="155" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="175" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x04</text>
  <rect x="195" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="215" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x08</text>
  <rect x="235" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="255" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x0C</text>
  <rect x="275" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="295" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x10</text>
  <rect x="315" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="335" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x14</text>
  <rect x="355" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="375" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x18</text>
  <rect x="395" y="320" width="40" height="28" fill="#FEF3C7" rx="3" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="415" y="338" text-anchor="middle" font-size="10" fill="#92400E">0x1C</text>
  <rect x="435" y="320" width="40" height="28" fill="#E5E7EB" rx="3" stroke="#9CA3AF" stroke-width="1"/>
  <text x="455" y="338" text-anchor="middle" font-size="10" fill="#6B7280">0x20</text>
  <text x="490" y="338" font-size="14" fill="#6B7280">...</text>

  <rect x="114" y="319" width="323" height="30" fill="none" rx="3" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="275" y="368" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="600">&lt;-- 32바이트 (8워드) 블록 단위로 한 번에 전송 --&gt;</text>
  <line x1="275" y1="372" x2="275" y2="392" stroke="#2563EB" stroke-width="2"/>
  <polygon points="268,392 282,392 275,402" fill="#2563EB"/>

  <text x="50" y="430" font-size="12" fill="#374151" font-weight="600">캐시:</text>
  <rect x="115" y="410" width="323" height="32" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="2"/>
  <text x="275" y="430" text-anchor="middle" font-size="12" fill="#1D4ED8" font-weight="700">캐시 라인 #0 (32바이트 = 8워드)</text>
  <text x="410" y="462" text-anchor="middle" font-size="11" fill="#374151">0x00 접근 시 0x00~0x1F 전체를 DRAM에서 캐시로 로드 -&gt; 이후 접근은 모두 HIT!</text>
</svg>
