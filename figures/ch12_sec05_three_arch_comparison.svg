<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Pretendard, sans-serif">
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">단일 사이클 vs 멀티사이클 vs 파이프라인 성능 비교</text>

  <!-- Bar chart: Clock Frequency -->
  <text x="140" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">최대 클럭 주파수 (MHz)</text>

  <rect x="60" y="85" width="40" height="120" rx="3" fill="#DC2626"/>
  <text x="80" y="220" text-anchor="middle" font-size="9" fill="#1F2937">단일</text>
  <text x="80" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">25</text>

  <rect x="120" y="75" width="40" height="130" rx="3" fill="#D97706"/>
  <text x="140" y="220" text-anchor="middle" font-size="9" fill="#1F2937">멀티</text>
  <text x="140" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">65</text>

  <rect x="180" y="90" width="40" height="115" rx="3" fill="#059669"/>
  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#1F2937">파이프</text>
  <text x="200" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">50</text>

  <!-- Bar chart: CPI -->
  <text x="370" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">평균 CPI</text>

  <rect x="300" y="180" width="40" height="25" rx="3" fill="#DC2626"/>
  <text x="320" y="220" text-anchor="middle" font-size="9" fill="#1F2937">단일</text>
  <text x="320" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">1.0</text>

  <rect x="360" y="100" width="40" height="105" rx="3" fill="#D97706"/>
  <text x="380" y="220" text-anchor="middle" font-size="9" fill="#1F2937">멀티</text>
  <text x="380" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">4.2</text>

  <rect x="420" y="165" width="40" height="40" rx="3" fill="#059669"/>
  <text x="440" y="220" text-anchor="middle" font-size="9" fill="#1F2937">파이프</text>
  <text x="440" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">1.35</text>

  <!-- Bar chart: Performance (MIPS) -->
  <text x="610" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">처리량 (MIPS)</text>

  <rect x="540" y="130" width="40" height="75" rx="3" fill="#DC2626"/>
  <text x="560" y="220" text-anchor="middle" font-size="9" fill="#1F2937">단일</text>
  <text x="560" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">25</text>

  <rect x="600" y="155" width="40" height="50" rx="3" fill="#D97706"/>
  <text x="620" y="220" text-anchor="middle" font-size="9" fill="#1F2937">멀티</text>
  <text x="620" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">15.5</text>

  <rect x="660" y="88" width="40" height="117" rx="3" fill="#059669"/>
  <text x="680" y="220" text-anchor="middle" font-size="9" fill="#1F2937">파이프</text>
  <text x="680" y="83" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">37</text>

  <!-- Comparison Table -->
  <rect x="30" y="250" width="740" height="230" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Table header -->
  <rect x="30" y="250" width="740" height="35" rx="8" fill="#2563EB"/>
  <rect x="30" y="270" width="740" height="15" fill="#2563EB"/>
  <text x="140" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="white">항목</text>
  <text x="310" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="white">단일 사이클</text>
  <text x="480" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="white">멀티사이클</text>
  <text x="660" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="white">파이프라인</text>

  <!-- Row 1 -->
  <text x="140" y="305" text-anchor="middle" font-size="10" fill="#1F2937">클럭 주파수</text>
  <text x="310" y="305" text-anchor="middle" font-size="10" fill="#DC2626">~25 MHz</text>
  <text x="480" y="305" text-anchor="middle" font-size="10" fill="#D97706">~65 MHz</text>
  <text x="660" y="305" text-anchor="middle" font-size="10" fill="#059669">~50 MHz</text>

  <!-- Row 2 -->
  <rect x="30" y="315" width="740" height="25" fill="#F9FAFB"/>
  <text x="140" y="332" text-anchor="middle" font-size="10" fill="#1F2937">CPI (avg)</text>
  <text x="310" y="332" text-anchor="middle" font-size="10" fill="#DC2626">1.0</text>
  <text x="480" y="332" text-anchor="middle" font-size="10" fill="#D97706">~4.2</text>
  <text x="660" y="332" text-anchor="middle" font-size="10" fill="#059669">~1.35</text>

  <!-- Row 3 -->
  <text x="140" y="358" text-anchor="middle" font-size="10" fill="#1F2937">MIPS</text>
  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#DC2626">25</text>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#D97706">~15.5</text>
  <text x="660" y="358" text-anchor="middle" font-size="10" fill="#059669" font-weight="bold">~37</text>

  <!-- Row 4 -->
  <rect x="30" y="368" width="740" height="25" fill="#F9FAFB"/>
  <text x="140" y="385" text-anchor="middle" font-size="10" fill="#1F2937">LUT 사용량</text>
  <text x="310" y="385" text-anchor="middle" font-size="10" fill="#DC2626">~1,800</text>
  <text x="480" y="385" text-anchor="middle" font-size="10" fill="#D97706">~2,200</text>
  <text x="660" y="385" text-anchor="middle" font-size="10" fill="#059669">~3,500</text>

  <!-- Row 5 -->
  <text x="140" y="410" text-anchor="middle" font-size="10" fill="#1F2937">WNS (ns)</text>
  <text x="310" y="410" text-anchor="middle" font-size="10" fill="#DC2626">+0.5</text>
  <text x="480" y="410" text-anchor="middle" font-size="10" fill="#D97706">+2.1</text>
  <text x="660" y="410" text-anchor="middle" font-size="10" fill="#059669">+1.2</text>

  <!-- Row 6 -->
  <rect x="30" y="418" width="740" height="25" fill="#F9FAFB"/>
  <text x="140" y="435" text-anchor="middle" font-size="10" fill="#1F2937">설계 복잡도</text>
  <text x="310" y="435" text-anchor="middle" font-size="10" fill="#DC2626">낮음</text>
  <text x="480" y="435" text-anchor="middle" font-size="10" fill="#D97706">중간 (FSM)</text>
  <text x="660" y="435" text-anchor="middle" font-size="10" fill="#059669">높음 (해저드)</text>

  <!-- Winner badge -->
  <rect x="620" y="448" width="120" height="25" rx="12" fill="#059669"/>
  <text x="680" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Best Performance</text>
</svg>