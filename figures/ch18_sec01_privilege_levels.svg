<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="800" height="400" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">RISC-V 특권 수준 (Privilege Levels)</text>

  <!-- ===== 동심 계층 박스 ===== -->

  <!-- M-mode (바깥) -->
  <rect x="60" y="55" width="460" height="270" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
  <text x="290" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#EF4444">M-mode (Machine Mode)</text>
  <text x="290" y="98" text-anchor="middle" font-size="12" fill="#7F1D1D">모든 하드웨어 자원에 직접 접근 가능 · 특권 수준 3</text>

  <!-- S-mode (중간) -->
  <rect x="110" y="110" width="360" height="190" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="290" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">S-mode (Supervisor Mode)</text>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#78350F">OS 커널 수준 · RV32I에서 선택적 구현 · 특권 수준 1</text>

  <!-- U-mode (안쪽) -->
  <rect x="165" y="168" width="250" height="112" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
  <text x="290" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">U-mode (User Mode)</text>
  <text x="290" y="210" text-anchor="middle" font-size="11" fill="#064E3B">애플리케이션 수준 · 특권 수준 0</text>
  <text x="290" y="228" text-anchor="middle" font-size="10" fill="#064E3B">CSR 직접 접근 불가</text>
  <text x="290" y="246" text-anchor="middle" font-size="10" fill="#064E3B">시스템 콜로만 커널 접근</text>
  <text x="290" y="264" text-anchor="middle" font-size="10" fill="#064E3B">권한 위반 시 예외 발생</text>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- 예외 진입 화살표 -->
  <path d="M 290 340 Q 450 355 530 290" fill="none" stroke="#EF4444" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="380" y="372" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="600">예외/인터럽트 발생 시 → M-mode로 진입</text>

  <!-- ===== 이 교재 범위 박스 ===== -->
  <rect x="555" y="55" width="210" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="660" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">이 교재 구현 범위</text>
  <text x="660" y="98" text-anchor="middle" font-size="12" fill="#1E40AF">M-mode만 구현</text>
  <text x="660" y="116" text-anchor="middle" font-size="11" fill="#1E40AF">S-mode · U-mode 미구현</text>
  <text x="660" y="134" text-anchor="middle" font-size="11" fill="#1E40AF">(Basys 3 단순 시스템)</text>
  <line x1="555" y1="100" x2="522" y2="100" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== CSR 접근 권한 표 ===== -->
  <rect x="555" y="165" width="210" height="160" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="660" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">CSR 접근 권한</text>

  <!-- 표 헤더 -->
  <rect x="556" y="192" width="208" height="24" fill="#E2E8F0"/>
  <text x="660" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">접근 주체 / 허용 여부</text>

  <!-- 행 1 -->
  <rect x="556" y="216" width="208" height="28" fill="#FEE2E2"/>
  <text x="622" y="233" text-anchor="middle" font-size="10" fill="#1E293B">M-mode → 모든 CSR</text>
  <text x="743" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">허용</text>

  <!-- 행 2 -->
  <rect x="556" y="244" width="208" height="28" fill="#FEF3C7"/>
  <text x="622" y="261" text-anchor="middle" font-size="10" fill="#1E293B">S-mode → mstatus 일부</text>
  <text x="743" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">제한</text>

  <!-- 행 3 -->
  <rect x="556" y="272" width="208" height="28" fill="#FEE2E2"/>
  <text x="622" y="289" text-anchor="middle" font-size="10" fill="#1E293B">U-mode → CSR 직접 접근</text>
  <text x="743" y="289" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444">금지</text>

  <!-- 표 세로 구분선 -->
  <line x1="700" y1="192" x2="700" y2="300" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 하단 주석 -->
  <text x="660" y="318" text-anchor="middle" font-size="9" fill="#64748B">* 권한 위반 시 Illegal Instruction 예외</text>

</svg>
