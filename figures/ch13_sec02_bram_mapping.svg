<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Pretendard, sans-serif">
  <rect width="820" height="440" fill="#F8FAFC" rx="12"/>
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Basys 3 하드웨어 매핑 (FPGA Resource Mapping)</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#374151">Tag, Valid, Data 배열을 서로 다른 FPGA 자원에 할당</text>

  <defs>
    <marker id="arBR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 주소 입력 박스 -->
  <rect x="30" y="80" width="130" height="250" fill="#1D4ED8" rx="8"/>
  <text x="95" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="white">CPU 주소</text>
  <text x="95" y="124" text-anchor="middle" font-size="11" fill="#BFDBFE">cpu_addr[31:0]</text>
  <line x1="60" y1="145" x2="145" y2="145" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="95" y="165" text-anchor="middle" font-size="11" fill="white" font-weight="600">Tag</text>
  <text x="95" y="180" text-anchor="middle" font-size="10" fill="#BFDBFE">[31:12]</text>
  <text x="95" y="195" text-anchor="middle" font-size="10" fill="#BFDBFE">20비트</text>
  <line x1="60" y1="210" x2="145" y2="210" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="95" y="230" text-anchor="middle" font-size="11" fill="white" font-weight="600">Index</text>
  <text x="95" y="245" text-anchor="middle" font-size="10" fill="#BFDBFE">[11:5]</text>
  <text x="95" y="260" text-anchor="middle" font-size="10" fill="#BFDBFE">7비트</text>
  <line x1="60" y1="275" x2="145" y2="275" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="95" y="295" text-anchor="middle" font-size="11" fill="white" font-weight="600">Offset</text>
  <text x="95" y="310" text-anchor="middle" font-size="10" fill="#BFDBFE">[4:0]</text>
  <text x="95" y="325" text-anchor="middle" font-size="10" fill="#BFDBFE">5비트</text>

  <!-- Valid 배열 (FF) -->
  <rect x="200" y="80" width="170" height="100" fill="white" rx="8" stroke="#10B981" stroke-width="2"/>
  <rect x="200" y="80" width="170" height="32" fill="#10B981" rx="8"/>
  <rect x="200" y="98" width="170" height="14" fill="#10B981"/>
  <text x="285" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="white">Valid 배열</text>
  <text x="285" y="116" text-anchor="middle" font-size="11" fill="white">FF Array (플립플롭)</text>
  <text x="285" y="142" text-anchor="middle" font-size="11" fill="#374151">128비트 (1비트 × 128)</text>
  <text x="285" y="160" text-anchor="middle" font-size="11" fill="#374151">동기 리셋, 비동기 읽기</text>
  <line x1="160" y1="192" x2="198" y2="140" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arBR)"/>

  <!-- Tag 배열 (LUTRAM) -->
  <rect x="200" y="210" width="170" height="120" fill="white" rx="8" stroke="#2563EB" stroke-width="2"/>
  <rect x="200" y="210" width="170" height="32" fill="#2563EB" rx="8"/>
  <rect x="200" y="228" width="170" height="14" fill="#2563EB"/>
  <text x="285" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="white">Tag 배열</text>
  <text x="285" y="246" text-anchor="middle" font-size="11" fill="white">LUTRAM (분산 RAM)</text>
  <text x="285" y="272" text-anchor="middle" font-size="11" fill="#374151">128 × 20비트 = 2,560비트</text>
  <text x="285" y="290" text-anchor="middle" font-size="11" fill="#374151">비동기 읽기 (0사이클 지연)</text>
  <text x="285" y="308" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="600">(* ram_style="distributed" *)</text>
  <line x1="160" y1="230" x2="198" y2="260" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arBR)"/>

  <!-- Data 배열 (BRAM) -->
  <rect x="420" y="80" width="200" height="170" fill="white" rx="8" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="420" y="80" width="200" height="32" fill="#F59E0B" rx="8"/>
  <rect x="420" y="98" width="200" height="14" fill="#F59E0B"/>
  <text x="520" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="white">Data 배열</text>
  <text x="520" y="116" text-anchor="middle" font-size="11" fill="white">BRAM36 (블록 RAM)</text>
  <text x="520" y="142" text-anchor="middle" font-size="11" fill="#374151">1024 × 32비트 = 32,768비트</text>
  <text x="520" y="160" text-anchor="middle" font-size="11" fill="#374151">(128엔트리 × 8워드/엔트리)</text>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#374151">동기 읽기 (1사이클 지연)</text>
  <text x="520" y="196" text-anchor="middle" font-size="10" fill="#F59E0B" font-weight="600">(* ram_style="block" *)</text>
  <text x="520" y="212" text-anchor="middle" font-size="10" fill="#374151">동기 쓰기 (채움 시)</text>
  <line x1="160" y1="265" x2="418" y2="155" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arBR)"/>

  <!-- 히트 판정 로직 박스 -->
  <rect x="660" y="80" width="140" height="170" fill="white" rx="8" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="660" y="80" width="140" height="32" fill="#8B5CF6" rx="8"/>
  <rect x="660" y="98" width="140" height="14" fill="#8B5CF6"/>
  <text x="730" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="white">히트 판정</text>
  <text x="730" y="116" text-anchor="middle" font-size="10" fill="white">Hit Detector</text>
  <text x="730" y="140" text-anchor="middle" font-size="10" fill="#374151">valid[idx]</text>
  <text x="730" y="156" text-anchor="middle" font-size="10" fill="#374151">&amp;&amp;</text>
  <text x="730" y="172" text-anchor="middle" font-size="10" fill="#374151">tag_mem[idx]</text>
  <text x="730" y="188" text-anchor="middle" font-size="10" fill="#374151">==</text>
  <text x="730" y="204" text-anchor="middle" font-size="10" fill="#374151">addr_tag</text>
  <text x="730" y="222" text-anchor="middle" font-size="11" fill="#8B5CF6" font-weight="700">→ cache_hit</text>

  <line x1="372" y1="130" x2="658" y2="130" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arBR)"/>
  <line x1="372" y1="265" x2="658" y2="175" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arBR)"/>

  <!-- Basys 3 자원 사용량 -->
  <rect x="30" y="365" width="760" height="55" fill="white" rx="8" stroke="#DBEAFE" stroke-width="2"/>
  <text x="410" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Basys 3 (XC7A35T) 자원 사용량</text>
  <text x="200" y="406" text-anchor="middle" font-size="11" fill="#374151">Valid: FF 128개 (전체 41,600개 중 0.3%)</text>
  <text x="430" y="406" text-anchor="middle" font-size="11" fill="#374151">Tag: LUTRAM 2,560비트 (전체 44,000개 중 5.8%)</text>
  <text x="660" y="406" text-anchor="middle" font-size="11" fill="#374151">Data: BRAM36 1개 (전체 50개 중 2%)</text>
</svg>
