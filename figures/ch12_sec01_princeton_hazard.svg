<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Pretendard, monospace, sans-serif">
  <!-- 배경 -->
  <rect width="760" height="420" fill="#F8FAFC" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">Princeton 구조의 구조적 해저드: IF와 MEM의 메모리 충돌</text>

  <!-- 범례 -->
  <rect x="520" y="45" width="14" height="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="2"/>
  <text x="538" y="56" font-size="11" fill="#374151">정상 접근</text>
  <rect x="620" y="45" width="14" height="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" rx="2"/>
  <text x="638" y="56" font-size="11" fill="#374151">충돌 접근</text>

  <!-- 클럭 사이클 헤더 -->
  <text x="160" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">사이클 N</text>
  <text x="280" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">사이클 N+1</text>
  <text x="400" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">사이클 N+2</text>
  <text x="520" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">사이클 N+3</text>
  <text x="640" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">사이클 N+4</text>

  <!-- 구분선 -->
  <line x1="100" y1="80" x2="740" y2="80" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 명령어 레이블 -->
  <text x="90" y="105" text-anchor="end" font-size="11" fill="#374151">INSTR-1</text>
  <text x="90" y="145" text-anchor="end" font-size="11" fill="#374151">INSTR-2</text>
  <text x="90" y="185" text-anchor="end" font-size="11" fill="#374151">INSTR-3</text>
  <text x="90" y="225" text-anchor="end" font-size="11" fill="#374151">INSTR-4 (LW)</text>

  <!-- INSTR-1 파이프라인 단계 -->
  <rect x="100" y="88" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#1E40AF" font-weight="bold">IF → MEM</text>
  <rect x="220" y="88" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#1E40AF">ID</text>
  <rect x="340" y="88" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="400" y="106" text-anchor="middle" font-size="11" fill="#1E40AF">EX</text>
  <rect x="460" y="88" width="120" height="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="3"/>
  <text x="520" y="106" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">MEM ⚡</text>
  <rect x="580" y="88" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="640" y="106" text-anchor="middle" font-size="11" fill="#1E40AF">WB</text>

  <!-- INSTR-2 파이프라인 단계 -->
  <rect x="220" y="128" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#1E40AF">IF</text>
  <rect x="340" y="128" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="400" y="146" text-anchor="middle" font-size="11" fill="#1E40AF">ID</text>
  <rect x="460" y="128" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="520" y="146" text-anchor="middle" font-size="11" fill="#1E40AF">EX</text>
  <rect x="580" y="128" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="640" y="146" text-anchor="middle" font-size="11" fill="#1E40AF">MEM</text>

  <!-- INSTR-3 파이프라인 단계 -->
  <rect x="340" y="168" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="400" y="186" text-anchor="middle" font-size="11" fill="#1E40AF">IF</text>
  <rect x="460" y="168" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="520" y="186" text-anchor="middle" font-size="11" fill="#1E40AF">ID</text>
  <rect x="580" y="168" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="640" y="186" text-anchor="middle" font-size="11" fill="#1E40AF">EX</text>

  <!-- INSTR-4 (LW) 파이프라인 단계 -->
  <rect x="460" y="208" width="120" height="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="3"/>
  <text x="520" y="226" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">IF ⚡</text>
  <rect x="580" y="208" width="120" height="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" rx="3"/>
  <text x="640" y="226" text-anchor="middle" font-size="11" fill="#1E40AF">ID</text>

  <!-- 충돌 영역 강조 박스 -->
  <rect x="453" y="82" width="134" height="162" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" rx="5"/>
  <text x="520" y="260" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="bold">동시 메모리 접근!</text>
  <text x="520" y="275" text-anchor="middle" font-size="10" fill="#DC2626">INSTR-1: MEM 스테이지 (데이터 메모리 R/W)</text>
  <text x="520" y="289" text-anchor="middle" font-size="10" fill="#DC2626">INSTR-4: IF 스테이지 (명령어 메모리 R)</text>

  <!-- 단일 메모리 블록 다이어그램 -->
  <rect x="100" y="310" width="560" height="80" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" rx="8"/>
  <text x="380" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">통합 메모리 (Princeton / Von Neumann)</text>

  <rect x="140" y="340" width="100" height="35" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="190" y="362" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">명령어 인출</text>
  <text x="190" y="375" text-anchor="middle" font-size="10" fill="#991B1B">(IF 스테이지)</text>

  <text x="290" y="362" text-anchor="middle" font-size="18" fill="#EF4444" font-weight="bold">⚡</text>
  <text x="380" y="355" text-anchor="middle" font-size="11" fill="#92400E">단일 포트 → 동시 접근 불가</text>

  <rect x="440" y="340" width="100" height="35" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="490" y="362" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">데이터 접근</text>
  <text x="490" y="375" text-anchor="middle" font-size="10" fill="#991B1B">(MEM 스테이지)</text>

  <!-- 하단 설명 -->
  <text x="380" y="408" text-anchor="middle" font-size="11" fill="#64748B">IF와 MEM 스테이지가 같은 사이클에 동일한 메모리를 사용 → 구조적 해저드(Structural Hazard)</text>
</svg>
