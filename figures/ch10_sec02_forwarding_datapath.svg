<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Noto Sans KR', sans-serif">

  <!-- 배경 -->
  <rect width="900" height="420" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">포워딩 유닛이 추가된 파이프라인 데이터패스</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#64748B">Forwarding Unit은 EX-EX(녹색)와 MEM-EX(오렌지) 두 경로로 데이터를 우회 전달합니다</text>

  <!-- =========== 5단계 스테이지 블록 =========== -->
  <!-- IF 스테이지 -->
  <rect x="20" y="70" width="110" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <rect x="20" y="70" width="110" height="28" fill="#2563EB" rx="6"/>
  <rect x="20" y="92" width="110" height="6" fill="#2563EB"/>
  <text x="75" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="white">IF</text>
  <text x="75" y="112" text-anchor="middle" font-size="10" fill="#1D4ED8">PC 레지스터</text>
  <text x="75" y="126" text-anchor="middle" font-size="10" fill="#1D4ED8">IMEM</text>
  <text x="75" y="142" text-anchor="middle" font-size="9" fill="#3B82F6">instr[31:0]</text>
  <text x="75" y="155" text-anchor="middle" font-size="9" fill="#3B82F6">pc_plus4</text>

  <!-- IF/ID 레지스터 -->
  <rect x="138" y="80" width="22" height="140" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" rx="3"/>
  <text x="149" y="145" text-anchor="middle" font-size="8" fill="white" transform="rotate(-90 149 145)">IF/ID REG</text>

  <!-- ID 스테이지 -->
  <rect x="168" y="70" width="120" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <rect x="168" y="70" width="120" height="28" fill="#2563EB" rx="6"/>
  <rect x="168" y="92" width="120" height="6" fill="#2563EB"/>
  <text x="228" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="white">ID</text>
  <text x="228" y="112" text-anchor="middle" font-size="10" fill="#1D4ED8">레지스터 파일</text>
  <text x="228" y="126" text-anchor="middle" font-size="10" fill="#1D4ED8">즉치수 확장</text>
  <text x="228" y="142" text-anchor="middle" font-size="10" fill="#1D4ED8">제어 유닛</text>
  <text x="228" y="158" text-anchor="middle" font-size="9" fill="#3B82F6">rs1/rs2_data</text>
  <text x="228" y="171" text-anchor="middle" font-size="9" fill="#3B82F6">rs1/rs2_addr</text>
  <text x="228" y="184" text-anchor="middle" font-size="9" fill="#3B82F6">ctrl_signals</text>

  <!-- ID/EX 레지스터 -->
  <rect x="296" y="80" width="22" height="140" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" rx="3"/>
  <text x="307" y="145" text-anchor="middle" font-size="8" fill="white" transform="rotate(-90 307 145)">ID/EX REG</text>

  <!-- EX 스테이지 -->
  <rect x="326" y="70" width="130" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <rect x="326" y="70" width="130" height="28" fill="#1E40AF" rx="6"/>
  <rect x="326" y="92" width="130" height="6" fill="#1E40AF"/>
  <text x="391" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="white">EX</text>
  <text x="391" y="112" text-anchor="middle" font-size="10" fill="#1D4ED8">ALU</text>
  <text x="391" y="126" text-anchor="middle" font-size="10" fill="#1D4ED8">포워딩 MUX A</text>
  <text x="391" y="140" text-anchor="middle" font-size="10" fill="#1D4ED8">포워딩 MUX B</text>
  <text x="391" y="156" text-anchor="middle" font-size="9" fill="#3B82F6">forward_a[1:0]</text>
  <text x="391" y="169" text-anchor="middle" font-size="9" fill="#3B82F6">forward_b[1:0]</text>
  <text x="391" y="182" text-anchor="middle" font-size="9" fill="#3B82F6">alu_result</text>

  <!-- EX/MEM 레지스터 -->
  <rect x="464" y="80" width="22" height="140" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" rx="3"/>
  <text x="475" y="145" text-anchor="middle" font-size="8" fill="white" transform="rotate(-90 475 145)">EX/MEM REG</text>

  <!-- MEM 스테이지 -->
  <rect x="494" y="70" width="120" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <rect x="494" y="70" width="120" height="28" fill="#2563EB" rx="6"/>
  <rect x="494" y="92" width="120" height="6" fill="#2563EB"/>
  <text x="554" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="white">MEM</text>
  <text x="554" y="112" text-anchor="middle" font-size="10" fill="#1D4ED8">DMEM</text>
  <text x="554" y="126" text-anchor="middle" font-size="10" fill="#1D4ED8">분기 처리</text>
  <text x="554" y="142" text-anchor="middle" font-size="9" fill="#3B82F6">read_data</text>
  <text x="554" y="155" text-anchor="middle" font-size="9" fill="#3B82F6">alu_result</text>

  <!-- MEM/WB 레지스터 -->
  <rect x="622" y="80" width="22" height="140" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" rx="3"/>
  <text x="633" y="145" text-anchor="middle" font-size="8" fill="white" transform="rotate(-90 633 145)">MEM/WB REG</text>

  <!-- WB 스테이지 -->
  <rect x="652" y="70" width="110" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <rect x="652" y="70" width="110" height="28" fill="#2563EB" rx="6"/>
  <rect x="652" y="92" width="110" height="6" fill="#2563EB"/>
  <text x="707" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="white">WB</text>
  <text x="707" y="112" text-anchor="middle" font-size="10" fill="#1D4ED8">wb_data MUX</text>
  <text x="707" y="126" text-anchor="middle" font-size="10" fill="#1D4ED8">레지스터 파일</text>
  <text x="707" y="142" text-anchor="middle" font-size="9" fill="#3B82F6">wb_data</text>
  <text x="707" y="155" text-anchor="middle" font-size="9" fill="#3B82F6">rd_addr</text>

  <!-- =========== 포워딩 유닛 박스 =========== -->
  <rect x="770" y="70" width="115" height="160" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" rx="6" stroke-dasharray="6,3"/>
  <rect x="770" y="70" width="115" height="28" fill="#2563EB" rx="6"/>
  <rect x="770" y="92" width="115" height="6" fill="#2563EB"/>
  <text x="827" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="white">Forwarding</text>
  <text x="827" y="108" text-anchor="middle" font-size="10" fill="#1D4ED8">Unit</text>
  <text x="780" y="126" font-size="9" fill="#1D4ED8">입력:</text>
  <text x="780" y="139" font-size="8.5" fill="#3B82F6">ex_mem_rd_addr</text>
  <text x="780" y="151" font-size="8.5" fill="#3B82F6">mem_wb_rd_addr</text>
  <text x="780" y="163" font-size="8.5" fill="#3B82F6">ex_mem_reg_write</text>
  <text x="780" y="175" font-size="8.5" fill="#3B82F6">mem_wb_reg_write</text>
  <text x="780" y="187" font-size="8.5" fill="#3B82F6">id_ex_rs1_addr</text>
  <text x="780" y="199" font-size="8.5" fill="#3B82F6">id_ex_rs2_addr</text>
  <text x="780" y="213" font-size="9" fill="#1D4ED8">출력:</text>
  <text x="780" y="225" font-size="8.5" fill="#16A34A" font-weight="600">forward_a[1:0]</text>
  <text x="780" y="237" font-size="8.5" fill="#D97706" font-weight="600">forward_b[1:0]</text>

  <!-- =========== 포워딩 화살표 =========== -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/>
    </marker>
    <marker id="arrowOrange2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- EX-EX 포워딩: EX/MEM 레지스터 출력(475) → EX 스테이지 MUX(391, 135) -->
  <!-- 아래 경로로 우회: y=270 라인 경유 -->
  <polyline points="475,150 475,280 391,280 391,230" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="380" y="263" width="102" height="16" fill="#F0FDF4" rx="3" stroke="#16A34A" stroke-width="1"/>
  <text x="431" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#16A34A">EX-EX 포워딩</text>

  <!-- MEM-EX 포워딩: MEM/WB 레지스터 출력(633) → EX 스테이지 MUX(391, 135) -->
  <!-- 더 아래 경로로 우회: y=310 라인 경유 -->
  <polyline points="633,160 633,315 391,315 391,232" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowOrange2)"/>
  <rect x="470" y="300" width="110" height="16" fill="#FFFBEB" rx="3" stroke="#D97706" stroke-width="1"/>
  <text x="525" y="311" text-anchor="middle" font-size="9" font-weight="700" fill="#D97706">MEM-EX 포워딩</text>

  <!-- 포워딩 유닛 → EX 스테이지 제어선 -->
  <line x1="770" y1="225" x2="456" y2="182" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue2)"/>
  <text x="600" y="205" font-size="9" fill="#2563EB">forward_a/b</text>

  <!-- 범례 영역 -->
  <rect x="20" y="355" width="860" height="55" fill="#F1F5F9" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="35" y="373" font-size="11" font-weight="700" fill="#1E293B">범례:</text>
  <line x1="80" y1="370" x2="120" y2="370" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="125" y="374" font-size="10" fill="#1E293B">EX-EX 포워딩 (forward_a/b=2'b01)</text>
  <line x1="340" y1="370" x2="380" y2="370" stroke="#D97706" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowOrange2)"/>
  <text x="385" y="374" font-size="10" fill="#1E293B">MEM-EX 포워딩 (forward_a/b=2'b10)</text>
  <line x1="600" y1="370" x2="640" y2="370" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue2)"/>
  <text x="645" y="374" font-size="10" fill="#1E293B">제어 신호</text>

  <text x="35" y="398" font-size="9" fill="#64748B">※ 포워딩 유닛은 조합 논리 회로로, 매 사이클 rd_addr와 rs_addr를 비교하여 forward_a/b 신호를 즉시 결정합니다.</text>
  <text x="35" y="410" font-size="9" fill="#64748B">   우선순위: EX-EX &gt; MEM-EX &gt; 레지스터 파일 (if-else if 구조)</text>

</svg>
