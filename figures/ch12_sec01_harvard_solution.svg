<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Pretendard, monospace, sans-serif">
  <!-- 배경 -->
  <rect width="760" height="380" fill="#F8FAFC" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">Harvard 구조의 해결: IMEM / DMEM 분리</text>

  <!-- 파이프라인 5단계 블록 -->
  <!-- IF -->
  <rect x="30" y="60" width="110" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <text x="85" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">IF</text>
  <text x="85" y="99" text-anchor="middle" font-size="10" fill="#1E40AF">명령어 인출</text>
  <!-- ID -->
  <rect x="165" y="60" width="110" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <text x="220" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">ID</text>
  <text x="220" y="99" text-anchor="middle" font-size="10" fill="#1E40AF">해독/레지스터</text>
  <!-- EX -->
  <rect x="300" y="60" width="110" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <text x="355" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">EX</text>
  <text x="355" y="99" text-anchor="middle" font-size="10" fill="#1E40AF">ALU 연산</text>
  <!-- MEM -->
  <rect x="435" y="60" width="110" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <text x="490" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">MEM</text>
  <text x="490" y="99" text-anchor="middle" font-size="10" fill="#1E40AF">메모리 접근</text>
  <!-- WB -->
  <rect x="570" y="60" width="110" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
  <text x="625" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">WB</text>
  <text x="625" y="99" text-anchor="middle" font-size="10" fill="#1E40AF">레지스터 쓰기</text>

  <!-- 파이프라인 레지스터 화살표 -->
  <line x1="140" y1="85" x2="165" y2="85" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275" y1="85" x2="300" y2="85" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="85" x2="435" y2="85" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="85" x2="570" y2="85" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- IMEM 블록 -->
  <rect x="30" y="160" width="200" height="70" fill="#D1FAE5" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="130" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532D">IMEM</text>
  <text x="130" y="206" text-anchor="middle" font-size="11" fill="#14532D">명령어 메모리</text>
  <text x="130" y="221" text-anchor="middle" font-size="10" fill="#16A34A">(LUTRAM — 비동기 읽기)</text>

  <!-- DMEM 블록 -->
  <rect x="435" y="160" width="200" height="70" fill="#D1FAE5" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="535" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532D">DMEM</text>
  <text x="535" y="206" text-anchor="middle" font-size="11" fill="#14532D">데이터 메모리</text>
  <text x="535" y="221" text-anchor="middle" font-size="10" fill="#16A34A">(BRAM — 동기 쓰기)</text>

  <!-- IF → IMEM 화살표 -->
  <line x1="85" y1="110" x2="85" y2="160" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="91" y="142" font-size="10" fill="#16A34A" font-weight="bold">읽기 전용</text>

  <!-- MEM → DMEM 화살표 -->
  <line x1="490" y1="110" x2="490" y2="160" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="496" y="142" font-size="10" fill="#16A34A" font-weight="bold">읽기/쓰기</text>

  <!-- 분리 표시 -->
  <rect x="250" y="150" width="155" height="90" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="5,3" rx="8"/>
  <text x="327" y="180" text-anchor="middle" font-size="13" fill="#16A34A" font-weight="bold">완전 분리</text>
  <text x="327" y="198" text-anchor="middle" font-size="12" fill="#16A34A">✅ 동시 접근</text>
  <text x="327" y="215" text-anchor="middle" font-size="12" fill="#16A34A">✅ 충돌 없음</text>
  <text x="327" y="232" text-anchor="middle" font-size="11" fill="#15803D">구조적 해저드 해결!</text>

  <!-- 구조 비교 박스 -->
  <rect x="30" y="255" width="700" height="100" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" rx="8"/>
  <text x="380" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532D">✅ Ch09에서 이미 Harvard 구조를 채택하였습니다</text>

  <rect x="50" y="285" width="300" height="55" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1" rx="5"/>
  <text x="200" y="305" text-anchor="middle" font-size="12" fill="#14532D" font-weight="bold">IMEM (Ch09 결정)</text>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#166534">instruction_memory — 조합 논리 읽기</text>
  <text x="200" y="337" text-anchor="middle" font-size="11" fill="#166534">LUTRAM 추론, 비동기 접근</text>

  <rect x="400" y="285" width="300" height="55" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1" rx="5"/>
  <text x="550" y="305" text-anchor="middle" font-size="12" fill="#14532D" font-weight="bold">DMEM (Ch09 결정)</text>
  <text x="550" y="322" text-anchor="middle" font-size="11" fill="#166534">data_memory — 동기 쓰기 / 비동기 읽기</text>
  <text x="550" y="337" text-anchor="middle" font-size="11" fill="#166534">BRAM 추론 가능</text>

  <text x="380" y="372" text-anchor="middle" font-size="11" fill="#64748B">IF 스테이지(IMEM)와 MEM 스테이지(DMEM)가 독립된 포트를 사용 → 구조적 해저드 없음</text>
</svg>
