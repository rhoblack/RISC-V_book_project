<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- 배경 -->
  <rect width="900" height="700" fill="#f9fafb"/>

  <!-- 제목 -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2563eb">
    최종 통합 시스템 블록도
  </text>

  <!-- CPU (중앙) -->
  <rect x="350" y="80" width="200" height="100" fill="#93c5fd" stroke="#2563eb" stroke-width="3" rx="10"/>
  <text x="450" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">RV32I CPU</text>
  <text x="450" y="135" font-size="11" text-anchor="middle" fill="#4b5563">5-stage Pipeline</text>
  <text x="450" y="155" font-size="11" text-anchor="middle" fill="#4b5563">50MHz</text>

  <!-- 캐시 계층 -->
  <!-- I-Cache -->
  <rect x="150" y="80" width="140" height="100" fill="#86efac" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="220" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">I-Cache</text>
  <text x="220" y="130" font-size="10" text-anchor="middle" fill="#4b5563">4KB</text>
  <text x="220" y="145" font-size="10" text-anchor="middle" fill="#4b5563">Direct Mapped</text>
  <path d="M 290 130 L 350 130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- D-Cache -->
  <rect x="610" y="80" width="140" height="100" fill="#86efac" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="680" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">D-Cache</text>
  <text x="680" y="130" font-size="10" text-anchor="middle" fill="#4b5563">4KB</text>
  <text x="680" y="145" font-size="10" text-anchor="middle" fill="#4b5563">2-Way Set</text>
  <path d="M 610 130 L 550 130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 메모리 (아래) -->
  <rect x="250" y="250" width="400" height="80" fill="#fde68a" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="450" y="280" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">메모리 컨트롤러 &amp; BRAM</text>
  <text x="450" y="300" font-size="10" text-anchor="middle" fill="#4b5563">IMEM (16KB) | DMEM (32KB)</text>
  <path d="M 450 180 L 450 250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- AHB 버스 -->
  <rect x="250" y="400" width="400" height="60" fill="#c084fc" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="450" y="435" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">AMBA AHB 버스</text>
  <path d="M 450 330 L 450 400" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 주변 장치 -->
  <!-- UART -->
  <rect x="50" y="500" width="120" height="80" fill="#fca5a5" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="110" y="530" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">UART</text>
  <text x="110" y="550" font-size="10" text-anchor="middle" fill="#4b5563">printf()</text>
  <text x="110" y="565" font-size="10" text-anchor="middle" fill="#4b5563">@0x6000_0000</text>
  <path d="M 110 460 L 110 500" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- GPIO -->
  <rect x="245" y="500" width="120" height="80" fill="#a78bfa" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="305" y="530" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">GPIO</text>
  <text x="305" y="550" font-size="10" text-anchor="middle" fill="#ffffff">LED/Button</text>
  <text x="305" y="565" font-size="10" text-anchor="middle" fill="#ffffff">@0x6000_0010</text>
  <path d="M 305 460 L 305 500" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 타이머 -->
  <rect x="440" y="500" width="120" height="80" fill="#93c5fd" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="500" y="530" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Timer</text>
  <text x="500" y="550" font-size="10" text-anchor="middle" fill="#4b5563">Interrupt</text>
  <text x="500" y="565" font-size="10" text-anchor="middle" fill="#4b5563">@0x6000_0020</text>
  <path d="M 500 460 L 500 500" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 확장 포트 -->
  <rect x="635" y="500" width="120" height="80" fill="#86efac" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="695" y="530" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">미래 확장</text>
  <text x="695" y="550" font-size="10" text-anchor="middle" fill="#4b5563">SPI, I2C</text>
  <text x="695" y="565" font-size="10" text-anchor="middle" fill="#4b5563">etc...</text>
  <path d="M 695 460 L 695 500" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 외부 연결 -->
  <g id="external">
    <!-- PC 터미널 -->
    <rect x="50" y="650" width="120" height="40" fill="#f0f0f0" stroke="#999" stroke-width="2" rx="5"/>
    <text x="110" y="673" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">PC 터미널</text>
    <path d="M 110 580 L 110 650" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
    <text x="125" y="615" font-size="9" fill="#dc2626">USB UART</text>

    <!-- Basys 3 보드 -->
    <rect x="245" y="650" width="120" height="40" fill="#f0f0f0" stroke="#999" stroke-width="2" rx="5"/>
    <text x="305" y="673" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">Basys 3 보드</text>
    <path d="M 305 580 L 305 650" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-green)"/>
    <text x="330" y="615" font-size="9" fill="#059669">GPIO</text>

    <!-- 사용자 (스위치) -->
    <rect x="440" y="650" width="120" height="40" fill="#f0f0f0" stroke="#999" stroke-width="2" rx="5"/>
    <text x="500" y="673" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">사용자 입력</text>
    <path d="M 500 580 L 500 650" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-purple)"/>
    <text x="525" y="615" font-size="9" fill="#7c3aed">Button</text>

    <!-- FPGA 파일 -->
    <rect x="635" y="650" width="120" height="40" fill="#f0f0f0" stroke="#999" stroke-width="2" rx="5"/>
    <text x="695" y="673" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937">FPGA 로드</text>
    <path d="M 695 580 L 695 650" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="720" y="615" font-size="9" fill="#2563eb">Config</text>
  </g>

  <!-- 범례 -->
  <g id="legend" transform="translate(50, 230)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1f2937">주요 컴포넌트:</text>
    <text x="0" y="20" font-size="10" fill="#4b5563">• CPU: 5단계 파이프라인 RV32I</text>
    <text x="0" y="35" font-size="10" fill="#4b5563">• 캐시: I/D Cache 하버드 구조</text>
    <text x="0" y="50" font-size="10" fill="#4b5563">• 버스: AMBA AHB 표준</text>
    <text x="0" y="65" font-size="10" fill="#4b5563">• 주변: UART, GPIO, Timer</text>
  </g>

  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
