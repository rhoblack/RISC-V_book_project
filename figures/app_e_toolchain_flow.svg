<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">RISC-V 크로스 컴파일 도구 체인 (riscv-gnu-toolchain)</text>

  <!-- 호스트 (PC) 영역 -->
  <rect x="20" y="45" width="580" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="65" font-size="12" font-weight="bold" fill="#1E40AF">호스트 (PC)</text>

  <!-- 소스 코드 -->
  <rect x="40" y="80" width="110" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="95" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">소스 코드</text>
  <text x="95" y="122" text-anchor="middle" font-size="10" fill="#3B82F6">.c / .s 파일</text>
  <line x1="150" y1="110" x2="178" y2="110" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

  <!-- GCC -->
  <rect x="183" y="80" width="120" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="243" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">riscv64-</text>
  <text x="243" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">unknown-elf-gcc</text>
  <text x="243" y="130" text-anchor="middle" font-size="9" fill="#3B82F6">-march=rv32i</text>
  <line x1="303" y1="110" x2="328" y2="110" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ELF -->
  <rect x="333" y="80" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="383" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">ELF 파일</text>
  <text x="383" y="122" text-anchor="middle" font-size="10" fill="#3B82F6">.elf 바이너리</text>
  <line x1="433" y1="110" x2="458" y2="110" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

  <!-- objcopy -->
  <rect x="463" y="80" width="120" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="523" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">riscv64-</text>
  <text x="523" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">objcopy</text>
  <text x="523" y="130" text-anchor="middle" font-size="9" fill="#3B82F6">-O verilog</text>

  <!-- 화살표: objcopy → HEX -->
  <line x1="583" y1="110" x2="583" y2="110" stroke="none"/>
  <path d="M583,110 L630,110 L630,220" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrG)"/>

  <!-- 타겟 (FPGA) 영역 -->
  <rect x="20" y="195" width="880" height="95" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="215" font-size="12" font-weight="bold" fill="#166534">타겟 (FPGA - Basys 3)</text>

  <!-- HEX 파일 -->
  <rect x="580" y="225" width="100" height="50" rx="8" fill="#D1FAE5" stroke="#16A34A" stroke-width="2"/>
  <text x="630" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">.hex 파일</text>
  <text x="630" y="264" text-anchor="middle" font-size="10" fill="#16A34A">Verilog 형식</text>
  <line x1="680" y1="250" x2="708" y2="250" stroke="#16A34A" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- $readmemh -->
  <rect x="713" y="225" width="100" height="50" rx="8" fill="#D1FAE5" stroke="#16A34A" stroke-width="2"/>
  <text x="763" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">$readmemh</text>
  <text x="763" y="264" text-anchor="middle" font-size="10" fill="#16A34A">IMEM 로드</text>
  <line x1="813" y1="250" x2="838" y2="250" stroke="#16A34A" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- CPU -->
  <rect x="843" y="225" width="50" height="50" rx="8" fill="#D1FAE5" stroke="#16A34A" stroke-width="2"/>
  <text x="868" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">RV32I</text>
  <text x="868" y="264" text-anchor="middle" font-size="10" fill="#16A34A">CPU</text>

  <!-- 보조 도구 영역 (우측 상단) -->
  <rect x="640" y="45" width="240" height="120" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="760" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">보조 도구</text>
  <text x="660" y="88" font-size="10" fill="#92400E">&#x2022; objdump: 디스어셈블리 분석</text>
  <text x="660" y="106" font-size="10" fill="#92400E">&#x2022; readelf: ELF 헤더 정보</text>
  <text x="660" y="124" font-size="10" fill="#92400E">&#x2022; size: 섹션별 크기 확인</text>
  <text x="660" y="142" font-size="10" fill="#92400E">&#x2022; gdb: 디버깅 (선택)</text>
</svg>