<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="400" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="860" height="400" fill="#F8FAFC" rx="8"/>
  <text x="430" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">제어 해저드 발생 원인 — BEQ 명령어 실행 시</text>
  <text x="430" y="44" text-anchor="middle" font-size="11" fill="#64748B">분기 판정(EX)이 끝나기 전 wrong-path 명령어 2개가 파이프라인에 진입</text>
  <!-- header row -->
  <rect x="185" y="58" width="657" height="26" fill="#1E40AF" rx="4"/>
  <text x="92" y="75" text-anchor="middle" font-size="10" fill="#334155">명령어</text>
  <text x="221" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C1</text>
  <text x="294" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C2</text>
  <text x="367" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C3</text>
  <text x="440" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C4</text>
  <text x="513" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C5</text>
  <text x="586" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C6</text>
  <text x="659" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C7</text>
  <text x="732" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C8</text>
  <text x="805" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="white">C9</text>
  <!-- label column bg -->
  <rect x="4" y="88" width="181" height="265" fill="#EFF6FF" rx="4" stroke="#BFDBFE" stroke-width="1"/>
  <text x="10" y="110" font-size="10" font-weight="700" fill="#1E40AF">① ADD x1, x2, x3</text>
  <text x="10" y="124" font-size="9" fill="#64748B">(BEQ 직전 명령어)</text>
  <text x="10" y="174" font-size="10" font-weight="700" fill="#7C3AED">② BEQ x1, x0, label</text>
  <text x="10" y="188" font-size="9" fill="#7C3AED">(분기 명령어)</text>
  <text x="10" y="243" font-size="10" font-weight="700" fill="#DC2626">③ ADDI x5, x0, 1</text>
  <text x="10" y="257" font-size="9" fill="#DC2626">(wrong-path 1)</text>
  <text x="10" y="313" font-size="10" font-weight="700" fill="#DC2626">④ ADDI x6, x0, 2</text>
  <text x="10" y="327" font-size="9" fill="#DC2626">(wrong-path 2)</text>
  <!-- row1: ADD IF..WB -->
  <rect x="185" y="88" width="73" height="53" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="3"/>
  <text x="221" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">IF</text>
  <rect x="258" y="88" width="73" height="53" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="3"/>
  <text x="294" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">ID</text>
  <rect x="331" y="88" width="73" height="53" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="3"/>
  <text x="367" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">EX</text>
  <rect x="404" y="88" width="73" height="53" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="3"/>
  <text x="440" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">MEM</text>
  <rect x="477" y="88" width="73" height="53" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="3"/>
  <text x="513" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">WB</text>
  <!-- row2: BEQ IF/ID/EX(판정)/MEM/WB -->
  <rect x="258" y="155" width="73" height="53" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="294" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">IF</text>
  <rect x="331" y="155" width="73" height="53" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="367" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">ID</text>
  <rect x="404" y="155" width="73" height="53" fill="#8B5CF6" stroke="#6D28D9" stroke-width="2.5" rx="3"/>
  <text x="440" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="white">EX</text>
  <text x="440" y="192" text-anchor="middle" font-size="8" font-weight="600" fill="#FDE68A">분기 판정!</text>
  <rect x="477" y="155" width="73" height="53" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="513" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">MEM</text>
  <rect x="550" y="155" width="73" height="53" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="3"/>
  <text x="586" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">WB</text>
  <!-- row3: wrong-path 1 -->
  <rect x="331" y="222" width="73" height="53" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="3"/>
  <text x="367" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">IF</text>
  <text x="367" y="260" text-anchor="middle" font-size="8" fill="#DC2626">wrong!</text>
  <rect x="404" y="222" width="73" height="53" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="3"/>
  <text x="440" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">ID</text>
  <text x="440" y="260" text-anchor="middle" font-size="8" fill="#DC2626">wrong!</text>
  <rect x="477" y="222" width="73" height="53" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" stroke-dasharray="5,3" rx="3"/>
  <text x="513" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">NOP</text>
  <text x="513" y="260" text-anchor="middle" font-size="8" fill="#16A34A">flush 후</text>
  <!-- row4: wrong-path 2 -->
  <rect x="404" y="292" width="73" height="53" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="3"/>
  <text x="440" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">IF</text>
  <text x="440" y="330" text-anchor="middle" font-size="8" fill="#DC2626">wrong!</text>
  <rect x="477" y="292" width="73" height="53" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" stroke-dasharray="5,3" rx="3"/>
  <text x="513" y="316" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">NOP</text>
  <text x="513" y="330" text-anchor="middle" font-size="8" fill="#16A34A">flush 후</text>
  <!-- correct target label: -->
  <rect x="550" y="222" width="73" height="53" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="3"/>
  <text x="586" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">IF</text>
  <text x="586" y="258" text-anchor="middle" font-size="8" fill="#16A34A">label: 올바름</text>
  <rect x="623" y="222" width="73" height="53" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
  <text x="659" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#16A34A">ID</text>
  <!-- penalty brace -->
  <line x1="331" y1="357" x2="477" y2="357" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="331" y1="351" x2="331" y2="363" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="477" y1="351" x2="477" y2="363" stroke="#DC2626" stroke-width="2.5"/>
  <text x="404" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">2사이클 페널티 (버블 2개)</text>
  <!-- legend -->
  <rect x="630" y="292" width="14" height="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="2"/>
  <text x="650" y="303" font-size="10" fill="#DC2626">Wrong-path 명령어</text>
  <rect x="630" y="310" width="14" height="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="2" stroke-dasharray="4,2"/>
  <text x="650" y="321" font-size="10" fill="#16A34A">Flush 후 NOP 삽입</text>
  <rect x="630" y="328" width="14" height="12" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.5" rx="2"/>
  <text x="650" y="339" font-size="10" fill="#7C3AED">BEQ EX — 분기 판정</text>
</svg>