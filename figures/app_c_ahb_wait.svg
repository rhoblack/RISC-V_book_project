<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Pretendard, monospace" font-size="12">
  <defs>
    <style>
      .sig-name { fill: #374151; font-size: 12px; font-weight: 600; text-anchor: end; }
      .clk-line { stroke: #2563EB; stroke-width: 1.5; fill: none; }
      .sig-line { stroke: #374151; stroke-width: 1.5; fill: none; }
      .sig-high { stroke: #059669; stroke-width: 2; fill: none; }
      .sig-low { stroke: #DC2626; stroke-width: 2; fill: none; }
      .addr-valid { fill: #DBEAFE; opacity: 0.4; }
      .data-valid { fill: #D1FAE5; opacity: 0.4; }
      .wait-area { fill: #FEE2E2; opacity: 0.3; }
      .cycle-num { font-size: 10px; fill: #9CA3AF; text-anchor: middle; }
      .title { font-size: 14px; fill: #2563EB; font-weight: 700; }
      .val-text { font-size: 10px; fill: #2563EB; text-anchor: middle; font-weight: 600; }
      .warn-text { font-size: 10px; fill: #DC2626; text-anchor: middle; font-weight: 600; }
    </style>
  </defs>
  <text x="10" y="20" class="title">AHB 웨이트 스테이트 (HREADY=0)</text>

  <text x="230" y="40" class="cycle-num">T1</text>
  <text x="380" y="40" class="cycle-num">T2 (wait)</text>
  <text x="530" y="40" class="cycle-num">T3</text>

  <!-- HCLK -->
  <text x="120" y="65" class="sig-name">HCLK</text>
  <path d="M 130,60 L 160,60 L 160,45 L 230,45 L 230,60 L 310,60 L 310,45 L 380,45 L 380,60 L 460,60 L 460,45 L 530,45 L 530,60 L 610,60 L 610,45 L 680,45 L 680,60 L 750,60" class="clk-line"/>

  <!-- Wait area highlight -->
  <rect x="310" y="38" width="150" height="200" class="wait-area"/>

  <!-- HTRANS -->
  <text x="120" y="95" class="sig-name">HTRANS</text>
  <rect x="160" y="78" width="300" height="20" rx="2" class="addr-valid"/>
  <path d="M 130,95 L 160,95 L 165,80 L 455,80 L 460,95 L 750,95" class="sig-line"/>
  <text x="310" y="92" class="val-text">NONSEQ (유지)</text>

  <!-- HADDR -->
  <text x="120" y="125" class="sig-name">HADDR</text>
  <rect x="160" y="108" width="300" height="20" rx="2" class="addr-valid"/>
  <path d="M 130,125 L 160,125 L 165,110 L 455,110 L 460,125 L 750,125" class="sig-line"/>
  <text x="310" y="122" class="val-text">Address (유지)</text>

  <!-- HWDATA -->
  <text x="120" y="165" class="sig-name">HWDATA</text>
  <rect x="460" y="148" width="150" height="20" rx="2" class="data-valid"/>
  <path d="M 130,165 L 460,165 L 465,150 L 605,150 L 610,165 L 750,165" class="sig-line"/>
  <text x="535" y="162" class="val-text" fill="#059669">Write Data</text>

  <!-- HREADY -->
  <text x="120" y="200" class="sig-name">HREADY</text>
  <path d="M 130,200 L 130,185 L 310,185 L 310,200 L 460,200 L 460,185 L 750,185" class="sig-line" stroke-width="2"/>
  <text x="385" y="212" class="warn-text">HREADY = 0 (대기)</text>

  <!-- 설명 -->
  <text x="385" y="248" fill="#6B7280" font-size="11" text-anchor="middle" font-style="italic">
    Slave가 HREADY=0으로 유지하면 Master는 주소/제어 신호를 변경하지 않아야 함 (Critical 규칙)
  </text>
</svg>