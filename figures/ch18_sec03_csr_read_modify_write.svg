<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#FFFFFF" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937">CSR 원자적 읽기-수정-쓰기 동작 흐름</text>

  <!-- CSR 레지스터 박스 -->
  <rect x="280" y="50" width="160" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">CSR 레지스터</text>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#6B7280">현재 값: old_val</text>

  <!-- 1단계: READ -->
  <rect x="40" y="140" width="180" height="60" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">1 READ</text>
  <text x="130" y="183" text-anchor="middle" font-size="11" fill="#1F2937">rd = old_val</text>
  <line x1="300" y1="100" x2="170" y2="140" stroke="#059669" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- 2단계: MODIFY -->
  <rect x="270" y="140" width="180" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">2 MODIFY</text>
  <text x="360" y="183" text-anchor="middle" font-size="11" fill="#1F2937">new_val = f(old_val, src)</text>

  <!-- 3단계: WRITE -->
  <rect x="500" y="140" width="180" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="590" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">3 WRITE</text>
  <text x="590" y="183" text-anchor="middle" font-size="11" fill="#1F2937">CSR = new_val</text>
  <line x1="550" y1="140" x2="420" y2="100" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- 연결 화살표 -->
  <line x1="220" y1="170" x2="268" y2="170" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="450" y1="170" x2="498" y2="170" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- 세 가지 연산 비교 -->
  <rect x="40" y="230" width="200" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="140" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">CSRRW / CSRRWI</text>
  <text x="50" y="272" font-size="11" fill="#1F2937">new_val = rs1 (또는 zimm)</text>
  <text x="50" y="292" font-size="10" fill="#6B7280">기존 값 무시, 완전 덮어쓰기</text>
  <text x="50" y="312" font-size="10" fill="#6B7280" font-family="monospace">CSR ← src</text>
  <text x="50" y="332" font-size="10" fill="#059669" font-style="italic">용도: CSR 초기 설정</text>

  <rect x="260" y="230" width="200" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="360" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">CSRRS / CSRRSI</text>
  <text x="270" y="272" font-size="11" fill="#1F2937">new_val = old_val | rs1</text>
  <text x="270" y="292" font-size="10" fill="#6B7280">특정 비트를 1로 세트</text>
  <text x="270" y="312" font-size="10" fill="#6B7280" font-family="monospace">CSR ← CSR | src</text>
  <text x="270" y="332" font-size="10" fill="#059669" font-style="italic">용도: 인터럽트 활성화</text>

  <rect x="480" y="230" width="200" height="110" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="580" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">CSRRC / CSRRCI</text>
  <text x="490" y="272" font-size="11" fill="#1F2937">new_val = old_val &amp; ~rs1</text>
  <text x="490" y="292" font-size="10" fill="#6B7280">특정 비트를 0으로 클리어</text>
  <text x="490" y="312" font-size="10" fill="#6B7280" font-family="monospace">CSR ← CSR &amp; ~src</text>
  <text x="490" y="332" font-size="10" fill="#059669" font-style="italic">용도: 인터럽트 비활성화</text>
</svg>