<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">멀티사이클 FSM 상태 전이도 — 명령어 타입별 분기</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#6B7280">각 상태 = 1 클럭 사이클 | Moore FSM (출력은 현재 상태에 의해 결정)</text>

  <!-- ========== IF 상태 ========== -->
  <circle cx="480" cy="120" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="480" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">IF</text>
  <text x="480" y="130" text-anchor="middle" font-size="10" fill="#1F2937">명령어 인출</text>
  <text x="480" y="145" text-anchor="middle" font-size="9" fill="#6B7280">IorD=0, MemRead=1</text>
  <text x="480" y="157" text-anchor="middle" font-size="9" fill="#6B7280">IRWrite=1, PC+=4</text>

  <!-- 리셋 화살표 -->
  <line x1="480" y1="40" x2="480" y2="65" stroke="#1F2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="497" y="55" font-size="10" fill="#1F2937">Reset</text>

  <!-- ========== ID 상태 ========== -->
  <circle cx="480" cy="270" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="480" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">ID</text>
  <text x="480" y="280" text-anchor="middle" font-size="10" fill="#1F2937">명령어 해독</text>
  <text x="480" y="295" text-anchor="middle" font-size="9" fill="#6B7280">A=rs1, B=rs2</text>
  <text x="480" y="307" text-anchor="middle" font-size="9" fill="#6B7280">ALUOut=PC+Imm</text>

  <!-- IF -> ID -->
  <line x1="480" y1="172" x2="480" y2="218" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="498" y="197" font-size="11" fill="#2563EB" font-weight="bold">모든 명령어</text>

  <!-- ========== EX 상태들 (분기) ========== -->

  <!-- EX-R: R/I 타입 -->
  <circle cx="150" cy="430" r="50" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="150" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">EX</text>
  <text x="150" y="438" text-anchor="middle" font-size="10" fill="#1F2937">ALU 실행</text>
  <text x="150" y="453" text-anchor="middle" font-size="9" fill="#6B7280">ALUSrcA=1</text>
  <text x="150" y="465" text-anchor="middle" font-size="9" fill="#6B7280">ALUSrcB=R/Imm</text>

  <!-- EX-Mem: Load/Store -->
  <circle cx="380" cy="430" r="50" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="380" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97706">EX</text>
  <text x="380" y="438" text-anchor="middle" font-size="10" fill="#1F2937">주소 계산</text>
  <text x="380" y="453" text-anchor="middle" font-size="9" fill="#6B7280">ALUSrcA=1</text>
  <text x="380" y="465" text-anchor="middle" font-size="9" fill="#6B7280">ALUSrcB=Imm</text>

  <!-- EX-Branch: Branch -->
  <circle cx="600" cy="430" r="50" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="600" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">EX</text>
  <text x="600" y="438" text-anchor="middle" font-size="10" fill="#1F2937">분기 판정</text>
  <text x="600" y="453" text-anchor="middle" font-size="9" fill="#6B7280">ALUSrcA=1,B=rs2</text>
  <text x="600" y="465" text-anchor="middle" font-size="9" fill="#6B7280">Branch조건확인</text>

  <!-- EX-UJ: U/J 타입 -->
  <circle cx="810" cy="430" r="50" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="810" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#7C3AED">EX</text>
  <text x="810" y="438" text-anchor="middle" font-size="10" fill="#1F2937">U/J 실행</text>
  <text x="810" y="453" text-anchor="middle" font-size="9" fill="#6B7280">LUI/AUIPC</text>
  <text x="810" y="465" text-anchor="middle" font-size="9" fill="#6B7280">JAL/JALR</text>

  <!-- ID -> EX-R (R/I) -->
  <path d="M 435 300 Q 280 350 180 380" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="270" y="335" font-size="11" fill="#059669" font-weight="bold">R/I 타입</text>

  <!-- ID -> EX-Mem (Load/Store) -->
  <path d="M 460 318 Q 420 370 395 378" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="405" y="355" font-size="11" fill="#D97706" font-weight="bold">Load/Store</text>

  <!-- ID -> EX-Branch -->
  <path d="M 510 310 Q 560 360 585 378" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="570" y="350" font-size="11" fill="#DC2626" font-weight="bold">Branch</text>

  <!-- ID -> EX-UJ -->
  <path d="M 525 295 Q 670 340 785 385" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="700" y="335" font-size="11" fill="#7C3AED" font-weight="bold">U/J 타입</text>

  <!-- ========== MEM 상태 ========== -->
  <circle cx="380" cy="580" r="50" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="380" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97706">MEM</text>
  <text x="380" y="588" text-anchor="middle" font-size="10" fill="#1F2937">메모리 접근</text>
  <text x="380" y="603" text-anchor="middle" font-size="9" fill="#6B7280">Load: MemRead</text>
  <text x="380" y="615" text-anchor="middle" font-size="9" fill="#6B7280">Store: MemWrite</text>

  <!-- EX-Mem -> MEM -->
  <line x1="380" y1="482" x2="380" y2="528" stroke="#D97706" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- ========== WB 상태들 ========== -->

  <!-- WB-R: R/I 타입 -->
  <circle cx="150" cy="580" r="50" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="150" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">WB</text>
  <text x="150" y="588" text-anchor="middle" font-size="10" fill="#1F2937">R/I 결과 저장</text>
  <text x="150" y="603" text-anchor="middle" font-size="9" fill="#6B7280">RegWrite=1</text>
  <text x="150" y="615" text-anchor="middle" font-size="9" fill="#6B7280">RegSrc=ALUOut</text>

  <!-- EX-R -> WB-R -->
  <line x1="150" y1="482" x2="150" y2="528" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- WB-Load -->
  <circle cx="380" cy="700" r="40" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="380" y="693" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97706">WB</text>
  <text x="380" y="710" text-anchor="middle" font-size="10" fill="#1F2937">Load 결과</text>
  <text x="380" y="725" text-anchor="middle" font-size="9" fill="#6B7280">RegSrc=MDR</text>

  <!-- MEM -> WB-Load (Load) -->
  <path d="M 365 628 Q 360 655 370 658" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="338" y="660" font-size="10" fill="#D97706">Load</text>

  <!-- MEM -> IF (Store 완료) -->
  <path d="M 420 555 Q 700 500 700 250 Q 700 140 535 120" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrO)" stroke-dasharray="6,3"/>
  <text x="720" y="340" font-size="11" fill="#D97706" font-weight="bold">Store 완료</text>
  <text x="720" y="355" font-size="10" fill="#D97706">(4사이클)</text>

  <!-- WB-UJ -->
  <circle cx="810" cy="580" r="50" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="810" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#7C3AED">WB</text>
  <text x="810" y="588" text-anchor="middle" font-size="10" fill="#1F2937">U/J 결과 저장</text>
  <text x="810" y="603" text-anchor="middle" font-size="9" fill="#6B7280">RegWrite=1</text>
  <text x="810" y="615" text-anchor="middle" font-size="9" fill="#6B7280">PC 갱신</text>

  <!-- EX-UJ -> WB-UJ -->
  <line x1="810" y1="482" x2="810" y2="528" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- ========== IF로 복귀 화살표들 ========== -->

  <!-- WB-R -> IF -->
  <path d="M 105 565 Q 30 400 30 250 Q 30 120 428 120" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrG)" stroke-dasharray="6,3"/>
  <text x="15" y="380" font-size="11" fill="#059669" font-weight="bold" writing-mode="tb">R/I: 4사이클</text>

  <!-- WB-Load -> IF -->
  <path d="M 340 700 Q 60 680 30 400 Q 30 120 428 120" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrO)" stroke-dasharray="6,3"/>
  <text x="50" y="660" font-size="11" fill="#D97706" font-weight="bold">Load: 5사이클</text>

  <!-- EX-Branch -> IF (분기) -->
  <path d="M 640 410 Q 750 370 750 250 Q 750 140 535 120" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)" stroke-dasharray="6,3"/>
  <text x="760" y="250" font-size="11" fill="#DC2626" font-weight="bold">Branch</text>
  <text x="760" y="265" font-size="10" fill="#DC2626">(3사이클)</text>

  <!-- WB-UJ -> IF -->
  <path d="M 855 565 Q 920 400 920 250 Q 920 80 535 118" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)" stroke-dasharray="6,3"/>
  <text x="930" y="340" font-size="11" fill="#7C3AED" font-weight="bold">U/J: 4사이클</text>

  <!-- ========== 범례 ========== -->
  <rect x="20" y="55" width="200" height="115" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="30" y="75" font-size="12" font-weight="bold" fill="#1F2937">명령어별 사이클 수</text>
  <circle cx="40" cy="93" r="6" fill="#059669"/><text x="55" y="97" font-size="11" fill="#1F2937">R/I 타입: 4 사이클</text>
  <circle cx="40" cy="113" r="6" fill="#D97706"/><text x="55" y="117" font-size="11" fill="#1F2937">Load: 5 / Store: 4 사이클</text>
  <circle cx="40" cy="133" r="6" fill="#DC2626"/><text x="55" y="137" font-size="11" fill="#1F2937">Branch: 3 사이클</text>
  <circle cx="40" cy="153" r="6" fill="#7C3AED"/><text x="55" y="157" font-size="11" fill="#1F2937">U/J 타입: 4 사이클</text>
</svg>