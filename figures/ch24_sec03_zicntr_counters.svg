<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Pretendard, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#F8FAFC" rx="8"/>
  <text x="430" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E293B">Zicntr 확장: 성능 카운터 CSR 구조</text>

  <!-- 파이프라인 상단 -->
  <g transform="translate(60, 60)">
    <!-- 파이프라인 스테이지 -->
    <rect x="0" y="0" width="130" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">IF</text>

    <rect x="150" y="0" width="130" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
    <text x="215" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">ID</text>

    <rect x="300" y="0" width="130" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
    <text x="365" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">EX</text>

    <rect x="450" y="0" width="130" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
    <text x="515" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">MEM</text>

    <rect x="600" y="0" width="130" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="6"/>
    <text x="665" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">WB</text>

    <!-- retire 신호 -->
    <line x1="665" y1="50" x2="665" y2="90" stroke="#2563EB" stroke-width="2" marker-end="url(#a3)"/>
    <text x="665" y="105" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">retire</text>
  </g>

  <!-- CSR 카운터 박스 -->
  <g transform="translate(60, 185)">
    <!-- mcycle -->
    <rect x="0" y="0" width="340" height="100" fill="white" stroke="#2563EB" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="340" height="35" fill="#2563EB" rx="10"/>
    <rect x="0" y="24" width="340" height="11" fill="#2563EB"/>
    <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="white">mcycle / mcycleh</text>

    <text x="15" y="55" font-size="12" fill="#475569" font-family="monospace">CSR 0xB00 (mcycle)   - 하위 32비트</text>
    <text x="15" y="73" font-size="12" fill="#475569" font-family="monospace">CSR 0xB80 (mcycleh)  - 상위 32비트</text>
    <text x="15" y="91" font-size="12" fill="#2563EB" font-weight="bold">매 클럭 사이클마다 +1 증가</text>

    <!-- minstret -->
    <rect x="390" y="0" width="340" height="100" fill="white" stroke="#2563EB" stroke-width="2" rx="10"/>
    <rect x="390" y="0" width="340" height="35" fill="#2563EB" rx="10"/>
    <rect x="390" y="24" width="340" height="11" fill="#2563EB"/>
    <text x="560" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="white">minstret / minstreth</text>

    <text x="405" y="55" font-size="12" fill="#475569" font-family="monospace">CSR 0xB02 (minstret)  - 하위 32비트</text>
    <text x="405" y="73" font-size="12" fill="#475569" font-family="monospace">CSR 0xB82 (minstreth) - 상위 32비트</text>
    <text x="405" y="91" font-size="12" fill="#2563EB" font-weight="bold">명령어 retire 시 +1 증가</text>

    <!-- clk 신호 -->
    <line x1="170" y1="-70" x2="170" y2="0" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
    <text x="195" y="-45" font-size="11" fill="#3B82F6">clk</text>
  </g>

  <!-- IPC 계산 공식 -->
  <rect x="60" y="320" width="740" height="55" fill="white" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="430" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">IPC (Instructions Per Cycle) 계산</text>
  <text x="430" y="365" text-anchor="middle" font-size="15" fill="#2563EB" font-family="monospace">IPC = minstret / mcycle    |    CPI = mcycle / minstret</text>

  <!-- 읽기 전용 미러 -->
  <g transform="translate(60, 395)">
    <rect x="0" y="0" width="740" height="35" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="6"/>
    <text x="370" y="22" text-anchor="middle" font-size="12" fill="#92400E">사용자 모드 읽기 전용 미러: cycle(0xC00), cycleh(0xC80), instret(0xC02), instreth(0xC82) - mcounteren CSR로 접근 제어</text>
  </g>
</svg>