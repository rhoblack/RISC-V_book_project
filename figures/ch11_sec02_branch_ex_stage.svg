<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="820" height="480" fill="#F8FAFC" rx="8"/>
  <text x="410" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">EX 스테이지 분기 판정 — 데이터패스 블록 다이어그램</text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#64748B">branch_unit이 EX에서 조건 평가, pc_next MUX가 4-way 선택</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- PC -->
  <rect x="20" y="200" width="80" height="50" fill="#1E40AF" rx="6"/>
  <text x="60" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="white">PC</text>

  <!-- IF/ID -->
  <rect x="140" y="170" width="90" height="110" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="6"/>
  <text x="185" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">IF/ID</text>
  <text x="185" y="212" text-anchor="middle" font-size="9" fill="#334155">instr</text>
  <text x="185" y="226" text-anchor="middle" font-size="9" fill="#334155">pc</text>
  <text x="185" y="240" text-anchor="middle" font-size="9" fill="#334155">pc_plus4</text>
  <text x="185" y="257" text-anchor="middle" font-size="8" fill="#DC2626">← if_id_flush</text>
  <text x="185" y="271" text-anchor="middle" font-size="8" fill="#DC2626">→ NOP 삽입</text>

  <!-- ID/EX -->
  <rect x="270" y="155" width="100" height="130" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="6"/>
  <text x="320" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">ID/EX</text>
  <text x="320" y="196" text-anchor="middle" font-size="9" fill="#334155">rs1_data, rs2_data</text>
  <text x="320" y="210" text-anchor="middle" font-size="9" fill="#334155">imm, pc, pc_plus4</text>
  <text x="320" y="224" text-anchor="middle" font-size="9" fill="#334155">funct3, branch</text>
  <text x="320" y="238" text-anchor="middle" font-size="9" fill="#334155">jalr, rd</text>
  <text x="320" y="255" text-anchor="middle" font-size="8" fill="#DC2626">← id_ex_flush</text>
  <text x="320" y="270" text-anchor="middle" font-size="8" fill="#DC2626">→ NOP 삽입</text>

  <!-- branch_unit -->
  <rect x="410" y="170" width="120" height="90" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="6"/>
  <text x="470" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">branch_unit</text>
  <text x="470" y="212" text-anchor="middle" font-size="9" fill="#78350F">rs1, rs2 비교</text>
  <text x="470" y="226" text-anchor="middle" font-size="9" fill="#78350F">funct3 조건 판별</text>
  <text x="470" y="242" text-anchor="middle" font-size="9" fill="#78350F">branch_taken_ex 출력</text>

  <!-- EX/MEM -->
  <rect x="560" y="180" width="90" height="80" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="6"/>
  <text x="605" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">EX/MEM</text>
  <text x="605" y="222" text-anchor="middle" font-size="9" fill="#334155">alu_result</text>
  <text x="605" y="236" text-anchor="middle" font-size="9" fill="#334155">rd, 제어신호</text>
  <text x="605" y="250" text-anchor="middle" font-size="9" fill="#334155">pc_plus4</text>

  <!-- PC MUX (4-way) -->
  <rect x="110" y="70" width="130" height="90" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" rx="6"/>
  <text x="175" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#0C4A6E">pc_next MUX</text>
  <text x="175" y="108" text-anchor="middle" font-size="9" fill="#0C4A6E">00: PC+4</text>
  <text x="175" y="122" text-anchor="middle" font-size="9" fill="#0C4A6E">01: branch_target</text>
  <text x="175" y="136" text-anchor="middle" font-size="9" fill="#0C4A6E">10: jal_target</text>
  <text x="175" y="150" text-anchor="middle" font-size="9" fill="#0C4A6E">11: jalr_target</text>

  <!-- Connections -->
  <line x1="100" y1="225" x2="140" y2="225" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="225" x2="270" y2="225" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="225" x2="410" y2="220" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="220" x2="560" y2="220" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- branch_taken_ex -> PC MUX -->
  <line x1="470" y1="170" x2="470" y2="130" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <line x1="470" y1="130" x2="240" y2="130" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="355" y="120" text-anchor="middle" font-size="9" fill="#DC2626">branch_taken_ex</text>

  <!-- jal_id -> PC MUX -->
  <text x="185" y="62" text-anchor="middle" font-size="9" fill="#7C3AED">jal_id (IF/ID opcode=JAL?)</text>
  <line x1="185" y1="66" x2="185" y2="70" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PC MUX -> PC -->
  <line x1="110" y1="115" x2="60" y2="115" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="60" y1="115" x2="60" y2="200" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="82" y="155" text-anchor="middle" font-size="9" fill="#16A34A">pc_next</text>

  <!-- if_id_flush label -->
  <text x="185" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">if_id_flush =</text>
  <text x="185" y="325" text-anchor="middle" font-size="9" fill="#DC2626">branch_taken_ex | jal_id | jalr_taken_ex</text>
  <rect x="100" y="297" width="170" height="38" fill="none" stroke="#DC2626" stroke-width="1.5" rx="4" stroke-dasharray="4,2"/>

  <!-- id_ex_flush label -->
  <text x="320" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">id_ex_flush =</text>
  <text x="320" y="355" text-anchor="middle" font-size="9" fill="#DC2626">load_use | branch_taken_ex | jalr_taken_ex</text>
  <rect x="230" y="327" width="185" height="38" fill="none" stroke="#DC2626" stroke-width="1.5" rx="4" stroke-dasharray="4,2"/>

  <!-- if_id_flush arrow -->
  <line x1="185" y1="297" x2="185" y2="280" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- id_ex_flush arrow -->
  <line x1="320" y1="327" x2="320" y2="285" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Branch target calc -->
  <rect x="410" y="300" width="160" height="55" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" rx="4"/>
  <text x="490" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#15803D">분기 타겟 계산</text>
  <text x="490" y="336" text-anchor="middle" font-size="9" fill="#15803D">branch: id_ex_pc + id_ex_imm</text>
  <text x="490" y="350" text-anchor="middle" font-size="9" fill="#15803D">jalr: (rs1 + imm) &amp; ~1</text>

  <!-- JALR taken_ex label -->
  <text x="605" y="290" text-anchor="middle" font-size="9" fill="#7C3AED">jalr_taken_ex =</text>
  <text x="605" y="304" text-anchor="middle" font-size="9" fill="#7C3AED">id_ex_jalr</text>
</svg>