<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box-main { fill: #2563EB; stroke: #1E40AF; stroke-width: 2; }
      .box-folder { fill: #3B82F6; stroke: #2563EB; stroke-width: 1.5; }
      .box-file { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.5; }
      .text-main { font-size: 14px; font-weight: bold; fill: white; font-family: 'Pretendard', monospace; }
      .text-label { font-size: 12px; fill: #1E40AF; font-family: 'Pretendard', monospace; }
      .text-count { font-size: 11px; fill: #666; font-family: monospace; }
      .line { stroke: #2563EB; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="text-main" text-anchor="middle" font-size="18">riscv-tests 디렉터리 구조</text>

  <!-- Main folder -->
  <rect x="300" y="60" width="200" height="40" class="box-main" rx="4"/>
  <text x="400" y="88" class="text-main" text-anchor="middle">riscv-tests/</text>

  <!-- isa folder -->
  <line x1="400" y1="100" x2="400" y2="130" class="line"/>
  <line x1="400" y1="130" x2="250" y2="130" class="line"/>
  <rect x="150" y="130" width="100" height="35" class="box-folder" rx="3"/>
  <text x="200" y="151" class="text-label" text-anchor="middle">isa/</text>

  <!-- env folder -->
  <line x1="400" y1="100" x2="550" y2="100" class="line"/>
  <line x1="550" y1="100" x2="550" y2="130" class="line"/>
  <rect x="500" y="130" width="100" height="35" class="box-folder" rx="3"/>
  <text x="550" y="151" class="text-label" text-anchor="middle">env/</text>

  <!-- rv32ui -->
  <line x1="200" y1="165" x2="200" y2="190" class="line"/>
  <rect x="140" y="190" width="120" height="35" class="box-folder" rx="3"/>
  <text x="200" y="211" class="text-label" text-anchor="middle">rv32ui/</text>

  <!-- rv32ui files -->
  <line x1="200" y1="225" x2="200" y2="250" class="line"/>
  <rect x="100" y="250" width="80" height="28" class="box-file" rx="2"/>
  <text x="140" y="269" class="text-count" text-anchor="middle">add.S</text>

  <line x1="200" y1="225" x2="180" y2="250" class="line"/>
  <rect x="120" y="250" width="80" height="28" class="box-file" rx="2"/>
  <text x="160" y="269" class="text-count" text-anchor="middle">addi.S</text>

  <line x1="200" y1="225" x2="220" y2="250" class="line"/>
  <rect x="140" y="250" width="80" height="28" class="box-file" rx="2"/>
  <text x="180" y="269" class="text-count" text-anchor="middle">and.S</text>

  <text x="220" y="269" class="text-count">... (40개)</text>

  <!-- rv32mi -->
  <line x1="200" y1="165" x2="320" y2="165" class="line"/>
  <line x1="320" y1="165" x2="320" y2="190" class="line"/>
  <rect x="260" y="190" width="120" height="35" class="box-folder" rx="3"/>
  <text x="320" y="211" class="text-label" text-anchor="middle">rv32mi/</text>

  <!-- rv32mi files -->
  <line x1="320" y1="225" x2="320" y2="250" class="line"/>
  <rect x="260" y="250" width="80" height="28" class="box-file" rx="2"/>
  <text x="300" y="269" class="text-count" text-anchor="middle">csr.S</text>

  <text x="360" y="269" class="text-count">... (12개)</text>

  <!-- rv32uf -->
  <line x1="200" y1="165" x2="420" y2="165" class="line"/>
  <line x1="420" y1="165" x2="420" y2="190" class="line"/>
  <rect x="360" y="190" width="120" height="35" class="box-folder" rx="3"/>
  <text x="420" y="211" class="text-label" text-anchor="middle">rv32uf/</text>

  <!-- rv32uf files -->
  <line x1="420" y1="225" x2="420" y2="250" class="line"/>
  <rect x="360" y="250" width="80" height="28" class="box-file" rx="2"/>
  <text x="400" y="269" class="text-count" text-anchor="middle">fadd.S</text>

  <text x="460" y="269" class="text-count">... (선택)</text>

  <!-- Makefile -->
  <line x1="550" y1="165" x2="550" y2="190" class="line"/>
  <rect x="500" y="190" width="100" height="35" class="box-file" rx="2"/>
  <text x="550" y="211" class="text-count" text-anchor="middle">Makefile</text>

  <!-- Legend/Description -->
  <text x="50" y="350" class="text-label" font-size="13" font-weight="bold">각 폴더의 의미:</text>

  <rect x="50" y="365" width="10" height="10" class="box-folder" rx="1"/>
  <text x="70" y="373" class="text-label">폴더 (Directory)</text>

  <rect x="270" y="365" width="10" height="10" class="box-file" rx="1"/>
  <text x="290" y="373" class="text-label">테스트 파일 (.S = 어셈블리)</text>

  <!-- Descriptions -->
  <text x="50" y="420" class="text-label" font-weight="bold">rv32ui</text>
  <text x="50" y="440" class="text-count">RV32I 기본 정수 명령어 테스트 (사용자 모드)</text>
  <text x="50" y="455" class="text-count">add, addi, and, or, lw, sw, beq, jal 등 40개 명령어</text>

  <text x="50" y="485" class="text-label" font-weight="bold">rv32mi</text>
  <text x="50" y="505" class="text-count">RV32I 머신 모드 테스트 (시스템 명령어, 고급)</text>

  <text x="50" y="535" class="text-label" font-weight="bold">rv32uf</text>
  <text x="50" y="555" class="text-count">RV32F 부동소수점 확장 테스트 (선택사항)</text>
</svg>
