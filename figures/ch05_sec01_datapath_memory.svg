<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="850" height="500" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="425" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">단일 사이클 데이터패스 — 메모리 서브시스템 위치</text>
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#64748B">Chapter 05에서 설계할 IMEM, DMEM, 메모리 맵 모듈 강조</text>

  <!-- PC 블록 -->
  <rect x="30" y="180" width="70" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">PC</text>
  <text x="65" y="215" text-anchor="middle" font-size="9" fill="#64748B">32-bit</text>

  <!-- ★ IMEM 블록 (강조) -->
  <rect x="130" y="155" width="120" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3" filter="url(#shadow)"/>
  <text x="190" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">IMEM</text>
  <text x="190" y="203" text-anchor="middle" font-size="10" fill="#1E293B">명령어 메모리</text>
  <text x="190" y="218" text-anchor="middle" font-size="9" fill="#64748B">ROM / BRAM</text>
  <text x="190" y="233" text-anchor="middle" font-size="9" fill="#64748B">$readmemh</text>
  <!-- Ch05 표시 -->
  <rect x="215" y="148" width="42" height="18" rx="9" fill="#2563EB"/>
  <text x="236" y="161" text-anchor="middle" font-size="9" font-weight="600" fill="white">Ch05</text>

  <!-- 디코더 블록 -->
  <rect x="285" y="180" width="80" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">디코더</text>
  <text x="325" y="215" text-anchor="middle" font-size="9" fill="#64748B">Ch06</text>

  <!-- 레지스터 파일 블록 -->
  <rect x="395" y="155" width="90" height="100" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">레지스터</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">파일</text>
  <text x="440" y="218" text-anchor="middle" font-size="9" fill="#64748B">32×32</text>
  <text x="440" y="233" text-anchor="middle" font-size="9" fill="#64748B">Ch04</text>

  <!-- ALU 블록 -->
  <rect x="520" y="180" width="80" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">ALU</text>
  <text x="560" y="215" text-anchor="middle" font-size="9" fill="#64748B">Ch04</text>

  <!-- ★ DMEM 블록 (강조) -->
  <rect x="635" y="155" width="120" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3" filter="url(#shadow)"/>
  <text x="695" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">DMEM</text>
  <text x="695" y="203" text-anchor="middle" font-size="10" fill="#1E293B">데이터 메모리</text>
  <text x="695" y="218" text-anchor="middle" font-size="9" fill="#64748B">바이트 인에이블</text>
  <text x="695" y="233" text-anchor="middle" font-size="9" fill="#64748B">LB/LH/LW/SB/SH/SW</text>
  <!-- Ch05 표시 -->
  <rect x="720" y="148" width="42" height="18" rx="9" fill="#2563EB"/>
  <text x="741" y="161" text-anchor="middle" font-size="9" font-weight="600" fill="white">Ch05</text>

  <!-- 즉치수 생성기 -->
  <rect x="370" y="290" width="90" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="415" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">즉치수 생성기</text>
  <text x="415" y="323" text-anchor="middle" font-size="9" fill="#64748B">Ch04</text>

  <!-- WB MUX -->
  <rect x="780" y="180" width="50" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="805" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">WB</text>
  <text x="805" y="215" text-anchor="middle" font-size="9" fill="#92400E">MUX</text>

  <!-- 데이터 흐름 화살표 -->
  <line x1="100" y1="205" x2="125" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="250" y1="205" x2="280" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="365" y1="205" x2="390" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="485" y1="205" x2="515" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="600" y1="205" x2="630" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="755" y1="205" x2="775" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- WB → 레지스터 파일 피드백 -->
  <path d="M805,235 L805,350 L440,350 L440,260" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <text x="620" y="365" text-anchor="middle" font-size="9" fill="#059669">Write-Back 경로</text>

  <!-- ★ 메모리 맵 블록 (하단, 강조) -->
  <rect x="200" y="400" width="450" height="80" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">메모리 주소 공간 (Memory Map) — Ch05</text>
  <rect x="220" y="438" width="120" height="30" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#2563EB">IMEM (0x0000)</text>
  <rect x="355" y="438" width="120" height="30" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="415" y="458" text-anchor="middle" font-size="10" fill="#2563EB">DMEM (0x1000)</text>
  <rect x="490" y="438" width="140" height="30" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="560" y="458" text-anchor="middle" font-size="10" fill="#D97706">MMIO (0x4000)</text>

  <!-- 하버드 구조 라벨 -->
  <rect x="30" y="80" width="200" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">하버드 구조 (Harvard)</text>
  <text x="130" y="118" text-anchor="middle" font-size="10" fill="#64748B">IMEM ↔ DMEM 분리 접근</text>

  <!-- 범례 -->
  <rect x="600" y="80" width="220" height="55" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="615" y="92" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="640" y="103" font-size="10" fill="#1E293B">이번 챕터에서 설계 (Ch05)</text>
  <rect x="615" y="112" width="14" height="14" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="640" y="123" font-size="10" fill="#1E293B">이전/이후 챕터 모듈</text>
</svg>