<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" font-family="Pretendard, monospace" font-size="13">
  <defs>
    <style>
      .field-label { font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .bit-label { font-size: 10px; fill: #374151; text-anchor: middle; }
      .field-name { font-size: 13px; fill: white; text-anchor: middle; font-weight: 600; }
      .type-label { font-size: 16px; fill: #D97706; font-weight: 700; }
    </style>
  </defs>
  <text x="10" y="30" class="type-label">S-Type</text>
  <!-- imm[11:5]: bits 31-25 (7 bits) -->
  <rect x="60" y="40" width="140" height="40" rx="4" fill="#D97706"/>
  <text x="130" y="65" class="field-name">imm[11:5]</text>
  <text x="130" y="95" class="field-label">[31:25] 7비트</text>
  <!-- rs2: bits 24-20 (5 bits) -->
  <rect x="202" y="40" width="100" height="40" rx="4" fill="#F59E0B"/>
  <text x="252" y="65" class="field-name">rs2</text>
  <text x="252" y="95" class="field-label">[24:20] 5비트</text>
  <!-- rs1: bits 19-15 (5 bits) -->
  <rect x="304" y="40" width="100" height="40" rx="4" fill="#FBBF24"/>
  <text x="354" y="65" class="field-name">rs1</text>
  <text x="354" y="95" class="field-label">[19:15] 5비트</text>
  <!-- funct3: bits 14-12 (3 bits) -->
  <rect x="406" y="40" width="60" height="40" rx="4" fill="#D97706"/>
  <text x="436" y="65" class="field-name">funct3</text>
  <text x="436" y="95" class="field-label">[14:12] 3비트</text>
  <!-- imm[4:0]: bits 11-7 (5 bits) -->
  <rect x="468" y="40" width="100" height="40" rx="4" fill="#D97706"/>
  <text x="518" y="65" class="field-name">imm[4:0]</text>
  <text x="518" y="95" class="field-label">[11:7] 5비트</text>
  <!-- opcode: bits 6-0 (7 bits) -->
  <rect x="570" y="40" width="140" height="40" rx="4" fill="#B45309"/>
  <text x="640" y="65" class="field-name">opcode</text>
  <text x="640" y="95" class="field-label">[6:0] 7비트</text>
  <!-- bit markers -->
  <text x="60" y="38" class="bit-label">31</text>
  <text x="200" y="38" class="bit-label">25 24</text>
  <text x="302" y="38" class="bit-label">20 19</text>
  <text x="404" y="38" class="bit-label">15 14</text>
  <text x="466" y="38" class="bit-label">12 11</text>
  <text x="568" y="38" class="bit-label">7 6</text>
  <text x="710" y="38" class="bit-label">0</text>
</svg>