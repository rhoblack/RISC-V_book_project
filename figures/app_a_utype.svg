<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" font-family="Pretendard, monospace" font-size="13">
  <defs>
    <style>
      .field-label { font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .bit-label { font-size: 10px; fill: #374151; text-anchor: middle; }
      .field-name { font-size: 13px; fill: white; text-anchor: middle; font-weight: 600; }
      .type-label { font-size: 16px; fill: #7C3AED; font-weight: 700; }
    </style>
  </defs>
  <text x="10" y="30" class="type-label">U-Type</text>
  <!-- imm[31:12]: bits 31-12 (20 bits) -->
  <rect x="60" y="40" width="406" height="40" rx="4" fill="#7C3AED"/>
  <text x="263" y="65" class="field-name">imm[31:12]</text>
  <text x="263" y="95" class="field-label">[31:12] 20비트</text>
  <!-- rd: bits 11-7 (5 bits) -->
  <rect x="468" y="40" width="100" height="40" rx="4" fill="#A78BFA"/>
  <text x="518" y="65" class="field-name">rd</text>
  <text x="518" y="95" class="field-label">[11:7] 5비트</text>
  <!-- opcode: bits 6-0 (7 bits) -->
  <rect x="570" y="40" width="140" height="40" rx="4" fill="#6D28D9"/>
  <text x="640" y="65" class="field-name">opcode</text>
  <text x="640" y="95" class="field-label">[6:0] 7비트</text>
  <!-- bit markers -->
  <text x="60" y="38" class="bit-label">31</text>
  <text x="466" y="38" class="bit-label">12 11</text>
  <text x="568" y="38" class="bit-label">7 6</text>
  <text x="710" y="38" class="bit-label">0</text>
</svg>