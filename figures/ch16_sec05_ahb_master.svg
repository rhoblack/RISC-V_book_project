<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="850" height="500" fill="#F8FAFC" rx="8"/>
  <text x="425" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">AHB Master FSM — 캐시-버스 브리지</text>
  <text x="425" y="48" text-anchor="middle" font-size="12" fill="#64748B">캐시 미스 핸들러가 AHB Master 역할 수행</text>

  <!-- FSM 상태들 -->
  <!-- IDLE -->
  <circle cx="170" cy="180" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="170" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">IDLE</text>
  <text x="170" y="193" text-anchor="middle" font-size="9" fill="#1E293B">HTRANS=00</text>

  <!-- ADDR -->
  <circle cx="425" cy="140" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="425" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">ADDR</text>
  <text x="425" y="153" text-anchor="middle" font-size="9" fill="#1E293B">HTRANS=10</text>

  <!-- DATA -->
  <circle cx="680" cy="180" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="680" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">DATA</text>
  <text x="680" y="193" text-anchor="middle" font-size="9" fill="#1E293B">데이터 수신</text>

  <!-- BURST -->
  <circle cx="425" cy="320" r="50" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="425" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">BURST</text>
  <text x="425" y="333" text-anchor="middle" font-size="9" fill="#1E293B">HTRANS=11</text>

  <!-- 전이 화살표들 -->
  <!-- IDLE → ADDR: cache_miss -->
  <line x1="218" y1="168" x2="376" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="290" y="147" font-size="10" font-weight="600" fill="#2563EB">cache_miss</text>

  <!-- ADDR → DATA: HREADY=1 -->
  <line x1="474" y1="148" x2="632" y2="172" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="555" y="147" font-size="10" font-weight="600" fill="#059669">HREADY=1</text>

  <!-- ADDR self: HREADY=0 -->
  <path d="M 445,92 A 30,30 0 1 1 405,92" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="425" y="78" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">HREADY=0 (wait)</text>

  <!-- DATA → IDLE: last_beat -->
  <line x1="640" y1="210" x2="210" y2="205" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="425" y="225" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">단일 전송 완료</text>

  <!-- DATA → BURST: burst mode -->
  <line x1="650" y1="222" x2="470" y2="305" stroke="#D97706" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="580" y="275" font-size="10" font-weight="600" fill="#D97706">burst_cnt &gt; 0</text>

  <!-- BURST self -->
  <path d="M 445,370 A 30,30 0 1 0 405,370" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="425" y="398" text-anchor="middle" font-size="9" font-weight="600" fill="#D97706">beat_cnt--</text>

  <!-- BURST → IDLE -->
  <line x1="378" y1="330" x2="200" y2="225" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="260" y="290" font-size="10" font-weight="600" fill="#059669">last beat</text>

  <!-- 캐시 인터페이스 블록 -->
  <rect x="30" y="380" width="200" height="100" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#7C3AED">L1 캐시</text>
  <text x="130" y="425" text-anchor="middle" font-size="9" fill="#1E293B">cache_miss →</text>
  <text x="130" y="440" text-anchor="middle" font-size="9" fill="#1E293B">miss_addr[31:0] →</text>
  <text x="130" y="455" text-anchor="middle" font-size="9" fill="#1E293B">← cache_line[127:0]</text>
  <text x="130" y="470" text-anchor="middle" font-size="9" fill="#1E293B">← fill_done</text>

  <!-- AHB 버스 인터페이스 블록 -->
  <rect x="620" y="380" width="200" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">AHB Bus</text>
  <text x="720" y="425" text-anchor="middle" font-size="9" fill="#1E293B">→ HADDR, HTRANS</text>
  <text x="720" y="440" text-anchor="middle" font-size="9" fill="#1E293B">→ HWRITE, HSIZE</text>
  <text x="720" y="455" text-anchor="middle" font-size="9" fill="#1E293B">→ HWDATA, HBURST</text>
  <text x="720" y="470" text-anchor="middle" font-size="9" fill="#1E293B">← HRDATA, HREADY</text>
</svg>