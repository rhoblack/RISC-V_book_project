<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #2563EB; }
      .label { font-size: 13px; fill: #1F2937; font-weight: bold; }
      .sublabel { font-size: 11px; fill: #4B5563; }
      .code { font-size: 10px; fill: #1F2937; font-family: monospace; }
      .cycle1 { fill: #FED7AA; stroke: #EA580C; stroke-width: 2; }
      .cycle2 { fill: #FEC3C3; stroke: #DC2626; stroke-width: 2; }
      .cycle3 { fill: #D1FAE5; stroke: #059669; stroke-width: 2; }
      .cycle4 { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; }
      .bar-label { font-size: 11px; fill: #1F2937; }
    </style>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title">인터럽트 지연시간 (Latency) 분석</text>

  <!-- Timeline -->
  <text x="50" y="85" class="label">시간축 (사이클 단위):</text>

  <!-- Cycle 0: Interrupt signal asserts -->
  <rect x="100" y="110" width="80" height="40" class="cycle1" rx="3"/>
  <text x="140" y="135" text-anchor="middle" class="bar-label" font-weight="bold">0</text>

  <line x1="180" y1="130" x2="220" y2="130" stroke="#1F2937" stroke-width="1.5"/>
  <text x="230" y="135" class="sublabel">외부 장치에서</text>
  <text x="230" y="148" class="sublabel">uart_intr 신호 발생</text>

  <!-- Cycle 1: mip reflects -->
  <rect x="220" y="110" width="80" height="40" class="cycle2" rx="3"/>
  <text x="260" y="135" text-anchor="middle" class="bar-label" font-weight="bold">1</text>

  <line x1="300" y1="130" x2="340" y2="130" stroke="#1F2937" stroke-width="1.5"/>
  <text x="350" y="135" class="sublabel">다음 사이클에</text>
  <text x="350" y="148" class="sublabel">mip[11] = 1 반영</text>

  <!-- Cycle 2: trap_en generation (combinational) -->
  <rect x="340" y="110" width="80" height="40" class="cycle3" rx="3"/>
  <text x="380" y="135" text-anchor="middle" class="bar-label" font-weight="bold">2</text>

  <line x1="420" y1="130" x2="460" y2="130" stroke="#1F2937" stroke-width="1.5"/>
  <text x="470" y="135" class="sublabel">조합 논리로</text>
  <text x="470" y="148" class="sublabel">trap_en 생성</text>

  <!-- Cycle 3: Trap handling & CSR update -->
  <rect x="460" y="110" width="80" height="40" class="cycle4" rx="3"/>
  <text x="500" y="135" text-anchor="middle" class="bar-label" font-weight="bold">3</text>

  <line x1="540" y1="130" x2="580" y2="130" stroke="#1F2937" stroke-width="1.5"/>
  <text x="590" y="135" class="sublabel">CSR 업데이트</text>
  <text x="590" y="148" class="sublabel">(mepc, mcause, ...)</text>

  <!-- Summary box -->
  <rect x="50" y="180" width="900" height="80" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1" rx="5"/>

  <text x="70" y="205" class="label">지연시간 계산:</text>
  <text x="70" y="225" class="code">총 지연시간 = 0～3 사이클</text>
  <text x="70" y="240" class="sublabel">실제 구현: 2～4 사이클 (메모리 지연, 패치 레이턴시 포함)</text>

  <!-- Detailed breakdown -->
  <text x="50" y="300" class="label">상세 분석:</text>

  <!-- Stage 1: Signal generation -->
  <rect x="50" y="320" width="900" height="100" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <rect x="70" y="330" width="20" height="20" class="cycle1" rx="2"/>
  <text x="100" y="345" class="label">Stage 1: 외부 신호 생성</text>
  <text x="100" y="365" class="sublabel">• UART 수신 신호 (uart_rx_data_valid) 또는 Timer 만료 신호</text>
  <text x="100" y="380" class="sublabel">• 지연시간: 장치 의존적, 1～10ns (negligible compared to cycle time)</text>
  <text x="100" y="395" class="sublabel">• 사이클 개수: 0～1 사이클</text>

  <!-- Stage 2: mip reflection -->
  <rect x="50" y="430" width="900" height="100" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <rect x="70" y="440" width="20" height="20" class="cycle2" rx="2"/>
  <text x="100" y="455" class="label">Stage 2: mip 신호 반영</text>
  <text x="100" y="475" class="sublabel">• uart_intr 또는 timer_intr → mip[11] 또는 mip[7] 업데이트</text>
  <text x="100" y="490" class="sublabel">• 지연시간: 1 사이클 (다음 클럭 상승 에지에서 반영)</text>
  <text x="100" y="505" class="sublabel">• 누적: 1 사이클</text>

  <!-- Stage 3: trap_en generation -->
  <rect x="50" y="540" width="900" height="100" fill="none" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <rect x="70" y="550" width="20" height="20" class="cycle3" rx="2"/>
  <text x="100" y="565" class="label">Stage 3: trap_en 생성 (조합 논리)</text>
  <text x="100" y="585" class="sublabel">• trap_en = mstatus.MIE & (mie & mip)</text>
  <text x="100" y="600" class="sublabel">• 지연시간: 0 사이클 (조합 논리, 같은 사이클 내)</text>
  <text x="100" y="615" class="sublabel">• 누적: ~1 사이클</text>

  <!-- Bottom note -->
  <rect x="50" y="660" width="900" height="30" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" rx="3"/>
  <text x="70" y="680" class="sublabel">💡 실제 지연시간은 메모리 접근, 파이프라인 플러시, 캐시 미스 등을 고려하면 더 클 수 있습니다.</text>
</svg>
