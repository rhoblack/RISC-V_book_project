<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="700" height="380" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">타이밍 다이어그램 읽기 Step 1: 축의 의미 이해</text>

  <!-- Y축 레이블 -->
  <text x="24" y="200" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90, 24, 200)">명령어 (세로축)</text>

  <!-- X축 레이블 -->
  <text x="420" y="370" text-anchor="middle" font-size="11" fill="#374151">클럭 사이클 (가로축)</text>

  <!-- 격자 배경 -->
  <rect x="80" y="60" width="560" height="240" fill="white" stroke="#E2E8F0" rx="4"/>

  <!-- 격자 세로선 -->
  <line x1="150" y1="60" x2="150" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="220" y1="60" x2="220" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="290" y1="60" x2="290" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="360" y1="60" x2="360" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="430" y1="60" x2="430" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="500" y1="60" x2="500" y2="300" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="570" y1="60" x2="570" y2="300" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 격자 가로선 -->
  <line x1="80" y1="108" x2="640" y2="108" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="156" x2="640" y2="156" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="204" x2="640" y2="204" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="252" x2="640" y2="252" stroke="#E2E8F0" stroke-width="1"/>

  <!-- X축 사이클 번호 -->
  <text x="115" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C1</text>
  <text x="185" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C2</text>
  <text x="255" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C3</text>
  <text x="325" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C4</text>
  <text x="395" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C5</text>
  <text x="465" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C6</text>
  <text x="535" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C7</text>
  <text x="605" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">C8</text>

  <!-- Y축 명령어 번호 -->
  <text x="70" y="89" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">I1</text>
  <text x="70" y="137" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">I2</text>
  <text x="70" y="185" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">I3</text>
  <text x="70" y="233" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">I4</text>
  <text x="70" y="281" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">I5</text>

  <!-- 빈 격자 - 연한 회색 셀 -->
  <!-- 각 셀은 70×48px -->
  <!-- I1 행 -->
  <rect x="81" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="151" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="221" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="291" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="361" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="431" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="501" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="571" y="61" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <!-- I2 행 -->
  <rect x="81" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="151" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="221" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="291" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="361" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="431" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="501" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>
  <rect x="571" y="109" width="68" height="46" fill="#F9FAFB" rx="2"/>

  <!-- 축 화살표 -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>
  <!-- X축 화살표 -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Y축 화살표 -->
  <line x1="50" y1="300" x2="50" y2="40" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 설명 박스 -->
  <rect x="80" y="330" width="250" height="32" fill="#EFF6FF" rx="4" stroke="#BFDBFE"/>
  <text x="205" y="344" text-anchor="middle" font-size="9" fill="#1E40AF">→ 가로(시간): 클럭 사이클이 지날수록 오른쪽</text>
  <text x="205" y="357" text-anchor="middle" font-size="9" fill="#1E40AF">시간 흐름 = 프로세서 실행 진행 상황</text>

  <rect x="370" y="330" width="270" height="32" fill="#F0FDF4" rx="4" stroke="#86EFAC"/>
  <text x="505" y="344" text-anchor="middle" font-size="9" fill="#166534">↑ 세로(명령어): 위에서 아래로 I1, I2, I3 …</text>
  <text x="505" y="357" text-anchor="middle" font-size="9" fill="#166534">각 행 = 하나의 명령어가 파이프라인을 통과</text>
</svg>
