<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <style>
      .block { stroke: #2563EB; stroke-width: 2; rx: 8; }
      .block-highlight { fill: #DBEAFE; stroke: #2563EB; stroke-width: 3; rx: 8; }
      .block-dim { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; rx: 8; }
      .label { font-size: 13px; fill: #1E293B; font-weight: 600; text-anchor: middle; }
      .label-highlight { font-size: 14px; fill: #2563EB; font-weight: 700; text-anchor: middle; }
      .label-dim { font-size: 12px; fill: #9CA3AF; font-weight: 500; text-anchor: middle; }
      .title { font-size: 18px; fill: #1E293B; font-weight: 700; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #6B7280; text-anchor: middle; }
      .arrow { stroke: #3B82F6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dim { stroke: #CBD5E1; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-dim); }
      .signal { font-size: 10px; fill: #2563EB; font-family: 'JetBrains Mono', monospace; }
      .signal-dim { font-size: 10px; fill: #9CA3AF; font-family: 'JetBrains Mono', monospace; }
      .badge { font-size: 10px; fill: white; font-weight: 700; text-anchor: middle; }
      .legend { font-size: 11px; fill: #6B7280; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="arrowhead-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#CBD5E1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" class="title">단일 사이클 데이터패스 — Chapter 04 모듈 위치</text>
  <text x="450" y="50" class="subtitle">강조 표시: 이번 챕터에서 설계할 모듈 (ALU, Register File, Immediate Generator)</text>

  <!-- Legend -->
  <rect x="30" y="470" width="18" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="55" y="484" class="legend">이번 챕터에서 설계</text>
  <rect x="200" y="470" width="18" height="18" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="225" y="484" class="legend">이후 챕터에서 설계</text>

  <!-- PC (dim - Ch06) -->
  <rect x="30" y="140" width="80" height="50" class="block-dim"/>
  <text x="70" y="170" class="label-dim">PC</text>
  <text x="70" y="185" class="label-dim" style="font-size:9px;">Ch06</text>

  <!-- IMEM (dim - Ch05) -->
  <rect x="150" y="120" width="100" height="80" class="block-dim"/>
  <text x="200" y="160" class="label-dim">IMEM</text>
  <text x="200" y="178" class="label-dim" style="font-size:9px;">명령어 메모리</text>
  <text x="200" y="192" class="label-dim" style="font-size:9px;">Ch05</text>

  <!-- Arrow: PC → IMEM -->
  <line x1="110" y1="165" x2="148" y2="165" class="arrow-dim"/>
  <text x="130" y="158" class="signal-dim">addr</text>

  <!-- ★ Immediate Generator (HIGHLIGHT - Ch04) -->
  <rect x="310" y="80" width="140" height="60" class="block-highlight"/>
  <text x="380" y="108" class="label-highlight">즉치수 생성기</text>
  <text x="380" y="125" class="label-highlight" style="font-size:11px;">Imm Gen</text>
  <!-- Ch04 badge -->
  <rect x="425" y="82" width="22" height="14" rx="3" fill="#2563EB"/>
  <text x="436" y="93" class="badge">04</text>

  <!-- Arrow: IMEM → ImmGen -->
  <line x1="250" y1="140" x2="308" y2="110" class="arrow"/>
  <text x="270" y="118" class="signal">inst[31:7]</text>

  <!-- Control Unit (dim - Ch06) -->
  <rect x="310" y="350" width="140" height="60" class="block-dim"/>
  <text x="380" y="378" class="label-dim">제어 유닛</text>
  <text x="380" y="395" class="label-dim" style="font-size:9px;">Control Unit · Ch06</text>

  <!-- Arrow: IMEM → Control -->
  <path d="M 250 180 L 280 180 L 280 375 L 308 375" class="arrow-dim"/>
  <text x="285" y="280" class="signal-dim" transform="rotate(-90,285,280)">inst[31:0]</text>

  <!-- ★ Register File (HIGHLIGHT - Ch04) -->
  <rect x="310" y="190" width="140" height="110" class="block-highlight"/>
  <text x="380" y="220" class="label-highlight">레지스터 파일</text>
  <text x="380" y="240" class="label-highlight" style="font-size:11px;">Register File</text>
  <text x="380" y="260" class="label-highlight" style="font-size:10px;">32 x 32bit</text>
  <text x="380" y="278" class="label-highlight" style="font-size:10px; fill:#3B82F6;">x0 = 0 (고정)</text>
  <!-- Ch04 badge -->
  <rect x="425" y="192" width="22" height="14" rx="3" fill="#2563EB"/>
  <text x="436" y="203" class="badge">04</text>

  <!-- Arrow: IMEM → RF (rs1, rs2, rd) -->
  <line x1="250" y1="160" x2="308" y2="210" class="arrow"/>
  <text x="265" y="180" class="signal">rs1[19:15]</text>
  <line x1="250" y1="170" x2="308" y2="235" class="arrow"/>
  <text x="260" y="210" class="signal">rs2[24:20]</text>

  <!-- MUX before ALU (dim) -->
  <rect x="490" y="170" width="30" height="60" class="block-dim" style="rx:2;"/>
  <text x="505" y="205" class="label-dim" style="font-size:10px;">M</text>

  <!-- Arrow: RF read_data1 → ALU -->
  <line x1="450" y1="220" x2="520" y2="200" class="arrow"/>
  <text x="470" y="213" class="signal">rd1</text>

  <!-- Arrow: RF read_data2 → MUX -->
  <line x1="450" y1="250" x2="488" y2="210" class="arrow"/>
  <text x="468" y="245" class="signal">rd2</text>

  <!-- Arrow: ImmGen → MUX -->
  <line x1="450" y1="110" x2="495" y2="170" class="arrow"/>
  <text x="478" y="140" class="signal">imm</text>

  <!-- ★ ALU (HIGHLIGHT - Ch04) -->
  <rect x="540" y="160" width="120" height="80" class="block-highlight"/>
  <text x="600" y="198" class="label-highlight">ALU</text>
  <text x="600" y="218" class="label-highlight" style="font-size:10px;">10가지 연산</text>
  <!-- Ch04 badge -->
  <rect x="635" y="162" width="22" height="14" rx="3" fill="#2563EB"/>
  <text x="646" y="173" class="badge">04</text>

  <!-- Arrow: MUX → ALU -->
  <line x1="520" y1="200" x2="538" y2="200" class="arrow"/>

  <!-- DMEM (dim - Ch05) -->
  <rect x="710" y="155" width="100" height="80" class="block-dim"/>
  <text x="760" y="193" class="label-dim">DMEM</text>
  <text x="760" y="210" class="label-dim" style="font-size:9px;">데이터 메모리</text>
  <text x="760" y="224" class="label-dim" style="font-size:9px;">Ch05</text>

  <!-- Arrow: ALU → DMEM -->
  <line x1="660" y1="200" x2="708" y2="195" class="arrow-dim"/>
  <text x="680" y="190" class="signal-dim">addr</text>

  <!-- Arrow: RF → DMEM (write data) -->
  <path d="M 450 270 L 700 270 L 700 220 L 708 220" class="arrow-dim"/>
  <text x="580" y="265" class="signal-dim">write_data</text>

  <!-- WB MUX (dim) -->
  <rect x="730" y="290" width="30" height="60" class="block-dim" style="rx:2;"/>
  <text x="745" y="325" class="label-dim" style="font-size:10px;">M</text>

  <!-- Arrow: ALU result → WB MUX -->
  <path d="M 660 210 L 680 210 L 680 310 L 728 310" class="arrow-dim"/>
  <text x="688" y="265" class="signal-dim" transform="rotate(-90,688,265)">alu_result</text>

  <!-- Arrow: DMEM → WB MUX -->
  <path d="M 810 210 L 830 210 L 830 330 L 762 330" class="arrow-dim"/>
  <text x="822" y="275" class="signal-dim" transform="rotate(-90,822,275)">read_data</text>

  <!-- Arrow: WB MUX → RF (write back) -->
  <path d="M 745 350 L 745 430 L 370 430 L 370 302" class="arrow"/>
  <text x="560" y="445" class="signal">write_data (WB)</text>
  <text x="355" y="320" class="signal" style="text-anchor:end;">rd[11:7]</text>

  <!-- Adder for PC+4 (dim) -->
  <rect x="50" y="250" width="70" height="40" class="block-dim"/>
  <text x="85" y="275" class="label-dim" style="font-size:10px;">PC+4</text>

  <!-- Arrow: PC → Adder -->
  <line x1="70" y1="190" x2="85" y2="248" class="arrow-dim"/>

  <!-- Control signals (dim arrows) -->
  <line x1="380" y1="350" x2="505" y2="230" class="arrow-dim" stroke-dasharray="4,3"/>
  <text x="430" y="300" class="signal-dim">ALUSel</text>
  <line x1="380" y1="350" x2="745" y2="290" class="arrow-dim" stroke-dasharray="4,3"/>
  <text x="570" y="330" class="signal-dim">WBSel, RegWEn, MemRW</text>

  <!-- Zero flag from ALU -->
  <line x1="600" y1="240" x2="600" y2="360" class="arrow-dim" stroke-dasharray="3,3"/>
  <text x="615" y="310" class="signal-dim" transform="rotate(-90,615,310)">zero</text>
</svg>