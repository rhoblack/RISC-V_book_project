<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, monospace, sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="400" fill="#F8FAFC" rx="10"/>

  <!-- 제목 -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">R-type 명령어 4사이클 신호 타이밍 다이어그램</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#64748B">(예: ADD rd, rs1, rs2)</text>

  <!-- 사이클 구분선 및 레이블 -->
  <!-- 사이클 경계 x좌표: 160, 320, 480, 640, 800 -->
  <!-- 사이클 배경 색 -->
  <rect x="160" y="58" width="160" height="322" fill="#DBEAFE" opacity="0.35"/>
  <rect x="320" y="58" width="160" height="322" fill="#E0E7FF" opacity="0.35"/>
  <rect x="480" y="58" width="160" height="322" fill="#D1FAE5" opacity="0.35"/>
  <rect x="640" y="58" width="160" height="322" fill="#FEF9C3" opacity="0.35"/>

  <!-- 사이클 레이블 -->
  <text x="240" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">S0: IF</text>
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">S1: ID</text>
  <text x="560" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">S2: EX</text>
  <text x="720" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">S3: WB</text>

  <!-- 사이클 수직선 -->
  <line x1="160" y1="58" x2="160" y2="380" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="320" y1="58" x2="320" y2="380" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="58" x2="480" y2="380" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="58" x2="640" y2="380" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 신호 이름 열 배경 -->
  <rect x="0" y="58" width="158" height="322" fill="#F1F5F9" rx="0"/>
  <line x1="158" y1="58" x2="158" y2="380" stroke="#94A3B8" stroke-width="1"/>

  <!-- 행 간격: 각 신호 y 중심 = 85, 135, 185, 235, 285, 335 -->
  <!-- 행 구분선 -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="310" x2="800" y2="310" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 신호 이름 -->
  <text x="79" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B" font-family="monospace">clk</text>
  <text x="79" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#374151" font-family="monospace">pc_write</text>
  <text x="79" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#374151" font-family="monospace">ir_write</text>
  <text x="79" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#374151" font-family="monospace">alu_src_a</text>
  <text x="79" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#374151" font-family="monospace">alu_src_b</text>
  <text x="79" y="291" text-anchor="middle" font-size="9" fill="#6B7280" font-family="monospace">[1:0]</text>
  <text x="79" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#374151" font-family="monospace">reg_write</text>

  <!-- ===== CLK 파형 (y 범위: 80~105) ===== -->
  <!-- 4사이클: 160px씩, 각 사이클 내 half=80px -->
  <!-- 시작 x = 160 -->
  <polyline points="160,105 160,80 240,80 240,105 320,105 320,80 400,80 400,105 480,105 480,80 560,80 560,105 640,105 640,80 720,80 720,105 800,105"
            fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- ===== pc_write (y: 130 low, 150 low, 125 high) ===== -->
  <!-- S0(IF): 1 / S1(ID): 0 / S2(EX): 0 / S3(WB): 0 -->
  <!-- HIGH=130, LOW=150 -->
  <polyline points="160,150 160,130 320,130 320,150 640,150"
            fill="none" stroke="#059669" stroke-width="2"/>
  <!-- 이후 계속 low -->
  <line x1="640" y1="150" x2="800" y2="150" stroke="#059669" stroke-width="2"/>
  <!-- 레이블 -->
  <text x="240" y="143" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">1</text>
  <text x="400" y="153" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="560" y="153" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="720" y="153" text-anchor="middle" font-size="10" fill="#6B7280">0</text>

  <!-- ===== ir_write (y: 175 high, 195 low) ===== -->
  <!-- S0(IF): 1 / S1~S3: 0 -->
  <polyline points="160,195 160,175 320,175 320,195 800,195"
            fill="none" stroke="#059669" stroke-width="2"/>
  <text x="240" y="188" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">1</text>
  <text x="400" y="198" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="560" y="198" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="720" y="198" text-anchor="middle" font-size="10" fill="#6B7280">0</text>

  <!-- ===== alu_src_a (y: 225 high, 245 low) ===== -->
  <!-- S0(IF): 0 (PC) / S1(ID): 0 / S2(EX): 1 (A reg) / S3(WB): X -->
  <polyline points="160,245 320,245 320,245 480,245 480,225 640,225 640,245 800,245"
            fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="240" y="248" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="560" y="238" text-anchor="middle" font-size="10" fill="#7C3AED" font-weight="700">1</text>
  <!-- WB 단계: don't care -->
  <rect x="641" y="226" width="158" height="18" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="238" text-anchor="middle" font-size="10" fill="#9CA3AF">X</text>

  <!-- ===== alu_src_b[1:0] (y: 275 high, 305 low) — 버스 형태 ===== -->
  <!-- S0(IF): 2'b01 (4) / S1(ID): 2'b10 (imm, 주소계산) / S2(EX): 2'b00 (B reg) / S3: X -->
  <!-- 버스 파형: 상/하 두 선 + 사다리꼴 전환 -->
  <!-- S0 구간: x=160~320 -->
  <line x1="160" y1="275" x2="318" y2="275" stroke="#DC2626" stroke-width="2"/>
  <line x1="160" y1="305" x2="318" y2="305" stroke="#DC2626" stroke-width="2"/>
  <polygon points="160,290 165,275 315,275 320,290 315,305 165,305" fill="#FEE2E2" opacity="0.5"/>
  <text x="240" y="294" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="700">2'b01</text>
  <!-- S1 구간: x=320~480 -->
  <line x1="322" y1="275" x2="478" y2="275" stroke="#DC2626" stroke-width="2"/>
  <line x1="322" y1="305" x2="478" y2="305" stroke="#DC2626" stroke-width="2"/>
  <polygon points="320,290 325,275 475,275 480,290 475,305 325,305" fill="#FEF3C7" opacity="0.5"/>
  <text x="400" y="294" text-anchor="middle" font-size="10" fill="#B45309" font-weight="700">2'b10</text>
  <!-- S2 구간: x=480~640 -->
  <line x1="482" y1="275" x2="638" y2="275" stroke="#DC2626" stroke-width="2"/>
  <line x1="482" y1="305" x2="638" y2="305" stroke="#DC2626" stroke-width="2"/>
  <polygon points="480,290 485,275 635,275 640,290 635,305 485,305" fill="#D1FAE5" opacity="0.5"/>
  <text x="560" y="294" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">2'b00</text>
  <!-- S3: don't care -->
  <rect x="641" y="276" width="158" height="28" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="294" text-anchor="middle" font-size="10" fill="#9CA3AF">X</text>

  <!-- ===== reg_write (y: 325 high, 350 low) ===== -->
  <!-- S0~S2: 0 / S3(WB): 1 -->
  <polyline points="160,350 640,350 640,325 800,325"
            fill="none" stroke="#059669" stroke-width="2"/>
  <text x="240" y="353" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="400" y="353" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="560" y="353" text-anchor="middle" font-size="10" fill="#6B7280">0</text>
  <text x="720" y="338" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">1</text>

  <!-- 하단 사이클 번호 레이블 -->
  <text x="240" y="375" text-anchor="middle" font-size="10" fill="#64748B">Cycle 1</text>
  <text x="400" y="375" text-anchor="middle" font-size="10" fill="#64748B">Cycle 2</text>
  <text x="560" y="375" text-anchor="middle" font-size="10" fill="#64748B">Cycle 3</text>
  <text x="720" y="375" text-anchor="middle" font-size="10" fill="#64748B">Cycle 4</text>

  <!-- 상단 테두리 -->
  <rect x="0" y="58" width="800" height="322" fill="none" stroke="#CBD5E1" stroke-width="1" rx="0"/>
</svg>
