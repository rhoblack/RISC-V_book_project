<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Pretendard, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="a4r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#F8FAFC" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E293B">M 확장 곱셈기의 파이프라인 통합 구조</text>

  <!-- EX 스테이지 확장 -->
  <rect x="30" y="70" width="840" height="370" fill="white" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8,4" rx="10"/>
  <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748B">EX Stage (확장)</text>

  <!-- ALU 경로 -->
  <rect x="60" y="120" width="200" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="160" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">기존 ALU</text>
  <text x="160" y="168" text-anchor="middle" font-size="11" fill="#475569">1-cycle 지연</text>

  <!-- MUL 경로: 파이프라인 곱셈기 -->
  <rect x="60" y="210" width="200" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="160" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">DSP48E1 곱셈기</text>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#475569">3-cycle 파이프라인</text>

  <!-- DIV 경로 -->
  <rect x="60" y="300" width="200" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="160" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">반복 나눗셈기</text>
  <text x="160" y="348" text-anchor="middle" font-size="11" fill="#475569">32-cycle (최악)</text>

  <!-- 파이프라인 단계 표시 (곱셈기) -->
  <g transform="translate(290, 200)">
    <rect x="0" y="0" width="120" height="80" fill="#E0F2FE" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
    <text x="60" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Stage 1</text>
    <text x="60" y="42" text-anchor="middle" font-size="10" fill="#475569">부분곱 생성</text>
    <text x="60" y="58" text-anchor="middle" font-size="10" fill="#475569">rs1[15:0]*rs2</text>
    <text x="60" y="74" text-anchor="middle" font-size="10" fill="#475569">rs1[31:16]*rs2</text>

    <rect x="135" y="0" width="120" height="80" fill="#E0F2FE" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
    <text x="195" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Stage 2</text>
    <text x="195" y="45" text-anchor="middle" font-size="10" fill="#475569">부분곱 정렬</text>
    <text x="195" y="62" text-anchor="middle" font-size="10" fill="#475569">시프트 + 누적</text>

    <rect x="270" y="0" width="120" height="80" fill="#E0F2FE" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
    <text x="330" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Stage 3</text>
    <text x="330" y="45" text-anchor="middle" font-size="10" fill="#475569">최종 합산</text>
    <text x="330" y="62" text-anchor="middle" font-size="10" fill="#475569">결과 선택</text>
  </g>

  <!-- MUX -->
  <g transform="translate(700, 180)">
    <polygon points="0,0 80,30 80,130 0,160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="50" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">MUX</text>
  </g>

  <!-- 연결선 -->
  <!-- ALU -> MUX -->
  <line x1="260" y1="150" x2="700" y2="220" stroke="#2563EB" stroke-width="2" marker-end="url(#a4)"/>
  <!-- MUL -> MUX -->
  <line x1="680" y1="260" x2="700" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#a4)"/>
  <!-- DIV -> MUX -->
  <line x1="260" y1="330" x2="700" y2="310" stroke="#2563EB" stroke-width="2" marker-end="url(#a4)"/>

  <!-- MUX 출력 -->
  <line x1="780" y1="260" x2="840" y2="260" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="850" y="255" font-size="11" fill="#2563EB" font-weight="bold">EX/MEM</text>
  <text x="850" y="270" font-size="11" fill="#2563EB">레지스터</text>

  <!-- 스톨 신호 -->
  <rect x="520" y="360" width="200" height="60" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="8"/>
  <text x="620" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">mul_stall / div_stall</text>
  <text x="620" y="402" text-anchor="middle" font-size="11" fill="#DC2626">파이프라인 홀드 신호</text>
  <text x="620" y="416" text-anchor="middle" font-size="10" fill="#78350F">IF/ID, ID/EX 홀드</text>

  <line x1="260" y1="340" x2="520" y2="380" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a4r)"/>
  <line x1="260" y1="250" x2="520" y2="375" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a4r)"/>

  <!-- 선택 신호 -->
  <text x="730" y="170" text-anchor="middle" font-size="11" fill="#475569">alu_op_sel</text>
</svg>