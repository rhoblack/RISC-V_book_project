<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 배경 -->
  <rect width="1200" height="600" fill="#f8fafc"/>

  <!-- 제목 -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">
    3가지 벤치마크 결과 비교
  </text>
  <text x="600" y="55" font-size="12" text-anchor="middle" fill="#64748b">
    순차 처리 vs 메모리 스래싱 vs 최적화된 설계
  </text>

  <!-- ===== 벤치마크 1: 순차 처리 ===== -->
  <g>
    <rect x="50" y="90" width="350" height="500" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/>

    <text x="225" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
      벤치마크 1: 순차 처리
    </text>
    <text x="225" y="140" font-size="10" text-anchor="middle" fill="#64748b">
      (순수 ALU 연산)
    </text>

    <!-- 동적 전력 -->
    <rect x="80" y="170" width="130" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="145" y="190" font-size="11" fill="#0c4a6e" font-weight="bold">
      동적 전력
    </text>
    <text x="145" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">
      320 mW
    </text>
    <text x="145" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (높은 활동도)
    </text>

    <!-- 정적 전력 -->
    <rect x="220" y="170" width="130" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="285" y="190" font-size="11" fill="#991b1b" font-weight="bold">
      정적 전력
    </text>
    <text x="285" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
      50 mW
    </text>
    <text x="285" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (저온도)
    </text>

    <!-- 온도 -->
    <rect x="80" y="270" width="270" height="70" fill="#fed7aa" stroke="#f97316" stroke-width="2" rx="4"/>
    <text x="215" y="290" font-size="11" fill="#ea580c" font-weight="bold">
      예상 온도
    </text>
    <text x="215" y="315" font-size="18" font-weight="bold" text-anchor="middle" fill="#7c2d12">
      30~35°C
    </text>

    <!-- CPI -->
    <rect x="80" y="350" width="270" height="70" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="4"/>
    <text x="215" y="370" font-size="11" fill="#312e81" font-weight="bold">
      CPI (사이클/명령)
    </text>
    <text x="215" y="395" font-size="18" font-weight="bold" text-anchor="middle" fill="#2d1b69">
      1.0
    </text>

    <!-- 특징 -->
    <rect x="80" y="430" width="270" height="40" fill="white" stroke="#3b82f6" stroke-width="1" rx="4"/>
    <text x="215" y="455" font-size="10" text-anchor="middle" fill="#0c4a6e" font-weight="bold">
      ✓ 최고의 성능 CPI • 안정적인 온도
    </text>
  </g>

  <!-- ===== 벤치마크 2: 메모리 스래싱 ===== -->
  <g>
    <rect x="430" y="90" width="350" height="500" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>

    <text x="605" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">
      벤치마크 2: 메모리 스래싱
    </text>
    <text x="605" y="140" font-size="10" text-anchor="middle" fill="#64748b">
      (캐시 미스 반복)
    </text>

    <!-- 동적 전력 -->
    <rect x="460" y="170" width="130" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="525" y="190" font-size="11" fill="#0c4a6e" font-weight="bold">
      동적 전력
    </text>
    <text x="525" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">
      380 mW
    </text>
    <text x="525" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (메모리 활동)
    </text>

    <!-- 정적 전력 -->
    <rect x="600" y="170" width="130" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="665" y="190" font-size="11" fill="#991b1b" font-weight="bold">
      정적 전력
    </text>
    <text x="665" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
      90 mW
    </text>
    <text x="665" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (고온도)
    </text>

    <!-- 온도 -->
    <rect x="460" y="270" width="270" height="70" fill="#fed7aa" stroke="#f97316" stroke-width="2" rx="4"/>
    <text x="595" y="290" font-size="11" fill="#ea580c" font-weight="bold">
      예상 온도
    </text>
    <text x="595" y="315" font-size="18" font-weight="bold" text-anchor="middle" fill="#7c2d12">
      38~45°C
    </text>

    <!-- CPI -->
    <rect x="460" y="350" width="270" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="595" y="370" font-size="11" fill="#991b1b" font-weight="bold">
      CPI (사이클/명령)
    </text>
    <text x="595" y="395" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
      10~15
    </text>

    <!-- 특징 -->
    <rect x="460" y="430" width="270" height="40" fill="white" stroke="#dc2626" stroke-width="1" rx="4"/>
    <text x="595" y="455" font-size="10" text-anchor="middle" fill="#991b1b" font-weight="bold">
      ✗ 최악의 경우 • 메모리 병목
    </text>
  </g>

  <!-- ===== 벤치마크 3: 최적화 후 ===== -->
  <g>
    <rect x="810" y="90" width="350" height="500" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>

    <text x="985" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">
      벤치마크 3: 최적화 후
    </text>
    <text x="985" y="140" font-size="10" text-anchor="middle" fill="#64748b">
      (Clock Gating + 캐시 최적화)
    </text>

    <!-- 동적 전력 -->
    <rect x="840" y="170" width="130" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="905" y="190" font-size="11" fill="#0c4a6e" font-weight="bold">
      동적 전력
    </text>
    <text x="905" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">
      280 mW
    </text>
    <text x="905" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (-25%)
    </text>

    <!-- 정적 전력 -->
    <rect x="980" y="170" width="130" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
    <text x="1045" y="190" font-size="11" fill="#15803d" font-weight="bold">
      정적 전력
    </text>
    <text x="1045" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">
      35 mW
    </text>
    <text x="1045" y="230" font-size="9" text-anchor="middle" fill="#64748b">
      (-60%)
    </text>

    <!-- 온도 -->
    <rect x="840" y="270" width="270" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
    <text x="975" y="290" font-size="11" fill="#15803d" font-weight="bold">
      예상 온도
    </text>
    <text x="975" y="315" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">
      28~32°C
    </text>

    <!-- CPI -->
    <rect x="840" y="350" width="270" height="70" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="4"/>
    <text x="975" y="370" font-size="11" fill="#312e81" font-weight="bold">
      CPI (사이클/명령)
    </text>
    <text x="975" y="395" font-size="18" font-weight="bold" text-anchor="middle" fill="#2d1b69">
      1.5
    </text>

    <!-- 특징 -->
    <rect x="840" y="430" width="270" height="40" fill="white" stroke="#16a34a" stroke-width="1" rx="4"/>
    <text x="975" y="455" font-size="10" text-anchor="middle" fill="#15803d" font-weight="bold">
      ✓ 최고의 효율 • 좋은 온도
    </text>
  </g>

  <!-- 하단: 결론 -->
  <rect x="50" y="550" width="1100" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="600" y="573" font-size="12" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
    벤치마크 3(최적화)이 벤치마크 2(스래싱)보다 전력 37% 절감, 온도 25% 낮음 → 설계 최적화의 중요성!
  </text>
</svg>
