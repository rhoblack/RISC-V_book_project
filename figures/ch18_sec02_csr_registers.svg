<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Pretendard, sans-serif">
  <rect width="780" height="520" fill="#FFFFFF" rx="8"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">핵심 M-mode CSR 레지스터 맵</text>

  <!-- 표 헤더 -->
  <rect x="30" y="50" width="100" height="32" rx="4" fill="#2563EB"/>
  <text x="80" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">주소</text>
  <rect x="130" y="50" width="120" height="32" rx="4" fill="#2563EB"/>
  <text x="190" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">이름</text>
  <rect x="250" y="50" width="500" height="32" rx="4" fill="#2563EB"/>
  <text x="500" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">용도 및 비트 필드</text>

  <!-- mstatus -->
  <rect x="30" y="86" width="100" height="56" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="80" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB" font-family="monospace">0x300</text>
  <rect x="130" y="86" width="120" height="56" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="190" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mstatus</text>
  <rect x="250" y="86" width="500" height="56" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="260" y="106" font-size="11" fill="#1F2937">머신 상태 레지스터 — 글로벌 인터럽트 활성화</text>
  <text x="260" y="124" font-size="10" fill="#6B7280" font-family="monospace">[3] MIE: 글로벌 인터럽트 | [7] MPIE: 이전 MIE | [12:11] MPP: 이전 모드</text>

  <!-- mtvec -->
  <rect x="30" y="146" width="100" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="80" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669" font-family="monospace">0x305</text>
  <rect x="130" y="146" width="120" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="190" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mtvec</text>
  <rect x="250" y="146" width="500" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="260" y="166" font-size="11" fill="#1F2937">트랩 벡터 기저 주소 — 트랩 핸들러 진입점</text>
  <text x="260" y="182" font-size="10" fill="#6B7280" font-family="monospace">[31:2] BASE | [1:0] MODE (0=Direct, 1=Vectored)</text>

  <!-- mepc -->
  <rect x="30" y="198" width="100" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="80" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706" font-family="monospace">0x341</text>
  <rect x="130" y="198" width="120" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="190" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mepc</text>
  <rect x="250" y="198" width="500" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="260" y="218" font-size="11" fill="#1F2937">예외 발생 시점의 PC를 저장 — MRET 복귀 주소</text>
  <text x="260" y="234" font-size="10" fill="#6B7280" font-family="monospace">[31:0] 예외 발생 명령어의 PC (IALIGN=32이면 [31:2] 유효)</text>

  <!-- mcause -->
  <rect x="30" y="250" width="100" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="80" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706" font-family="monospace">0x342</text>
  <rect x="130" y="250" width="120" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="190" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mcause</text>
  <rect x="250" y="250" width="500" height="48" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="260" y="270" font-size="11" fill="#1F2937">트랩 원인 코드 — 예외/인터럽트 구분</text>
  <text x="260" y="286" font-size="10" fill="#6B7280" font-family="monospace">[31] Interrupt(1)/Exception(0) | [30:0] Exception Code</text>

  <!-- mie -->
  <rect x="30" y="302" width="100" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="80" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB" font-family="monospace">0x304</text>
  <rect x="130" y="302" width="120" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="190" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mie</text>
  <rect x="250" y="302" width="500" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="260" y="322" font-size="11" fill="#1F2937">개별 인터럽트 활성화 마스크</text>
  <text x="260" y="338" font-size="10" fill="#6B7280" font-family="monospace">[3] MSIE: SW 인터럽트 | [7] MTIE: 타이머 | [11] MEIE: 외부</text>

  <!-- mip -->
  <rect x="30" y="354" width="100" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="80" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB" font-family="monospace">0x344</text>
  <rect x="130" y="354" width="120" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="190" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mip</text>
  <rect x="250" y="354" width="500" height="48" rx="2" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="260" y="374" font-size="11" fill="#1F2937">인터럽트 보류(pending) 상태 비트</text>
  <text x="260" y="390" font-size="10" fill="#6B7280" font-family="monospace">[3] MSIP | [7] MTIP | [11] MEIP (읽기 전용 비트 포함)</text>

  <!-- mscratch -->
  <rect x="30" y="406" width="100" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="80" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669" font-family="monospace">0x340</text>
  <rect x="130" y="406" width="120" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="190" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">mscratch</text>
  <rect x="250" y="406" width="500" height="48" rx="2" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="260" y="426" font-size="11" fill="#1F2937">트랩 핸들러용 스크래치 레지스터</text>
  <text x="260" y="442" font-size="10" fill="#6B7280" font-family="monospace">[31:0] 범용 값 — 컨텍스트 스위칭 시 스택 포인터 임시 저장</text>

  <!-- 범례 -->
  <rect x="30" y="470" width="16" height="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="52" y="481" font-size="10" fill="#1F2937">인터럽트 관련</text>
  <rect x="160" y="470" width="16" height="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="182" y="481" font-size="10" fill="#1F2937">트랩 진입/복귀</text>
  <rect x="290" y="470" width="16" height="12" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>
  <text x="312" y="481" font-size="10" fill="#1F2937">트랩 설정/보조</text>

  <!-- 비유 텍스트 -->
  <text x="390" y="508" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">비행기 블랙박스: 사고(트랩) 발생 시 상황 기록(mepc, mcause) + 복구 절차(mtvec, mstatus)</text>
</svg>