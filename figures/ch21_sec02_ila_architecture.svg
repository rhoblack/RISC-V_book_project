<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arr2r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Vivado ILA (Integrated Logic Analyzer) 구조</text>

  <!-- FPGA Chip boundary -->
  <rect x="20" y="50" width="760" height="320" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="40" y="74" font-size="12" fill="#6B7280" font-weight="bold">FPGA Fabric (XC7A35T)</text>

  <!-- User Design -->
  <rect x="40" y="90" width="280" height="200" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">사용자 설계 (RV32I SoC)</text>

  <rect x="60" y="130" width="100" height="35" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="152" text-anchor="middle" font-size="10" fill="#1F2937">Pipeline CPU</text>

  <rect x="60" y="175" width="100" height="35" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="197" text-anchor="middle" font-size="10" fill="#1F2937">Cache</text>

  <rect x="60" y="220" width="100" height="35" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="242" text-anchor="middle" font-size="10" fill="#1F2937">AMBA Bus</text>

  <rect x="190" y="130" width="110" height="35" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="245" y="152" text-anchor="middle" font-size="10" fill="#1F2937">UART / GPIO</text>

  <rect x="190" y="175" width="110" height="35" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="245" y="197" text-anchor="middle" font-size="10" fill="#1F2937">Timer / CSR</text>

  <!-- Probe signals -->
  <text x="195" y="240" font-size="9" fill="#DC2626" font-weight="bold">프로브 신호</text>
  <line x1="160" y1="147" x2="370" y2="147" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2r)"/>
  <line x1="160" y1="192" x2="370" y2="175" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2r)"/>
  <line x1="300" y1="192" x2="370" y2="200" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2r)"/>
  <text x="340" y="140" font-size="8" fill="#DC2626">pc, instr</text>
  <text x="340" y="170" font-size="8" fill="#DC2626">cache_hit</text>
  <text x="340" y="210" font-size="8" fill="#DC2626">uart_tx</text>

  <!-- ILA Core -->
  <rect x="375" y="90" width="220" height="260" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="485" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97706">ILA IP Core</text>

  <!-- Trigger -->
  <rect x="395" y="130" width="180" height="45" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="485" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">트리거 엔진</text>
  <text x="485" y="165" text-anchor="middle" font-size="9" fill="#6B7280">비교기 + AND/OR 조합</text>

  <!-- Sample Buffer -->
  <rect x="395" y="190" width="180" height="45" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="485" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">샘플 버퍼 (BRAM)</text>
  <text x="485" y="225" text-anchor="middle" font-size="9" fill="#6B7280">1024~65536 샘플 깊이</text>

  <!-- Control -->
  <rect x="395" y="250" width="180" height="45" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="485" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">캡처 제어 FSM</text>
  <text x="485" y="285" text-anchor="middle" font-size="9" fill="#6B7280">Idle → Armed → Triggered → Full</text>

  <!-- JTAG/Debug Hub -->
  <rect x="395" y="310" width="180" height="30" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="485" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">Debug Hub (dbg_hub)</text>

  <!-- JTAG Port -->
  <rect x="640" y="150" width="120" height="80" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="700" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">JTAG</text>
  <text x="700" y="195" text-anchor="middle" font-size="10" fill="#6B7280">USB → JTAG</text>
  <text x="700" y="212" text-anchor="middle" font-size="10" fill="#6B7280">(Basys 3 내장)</text>

  <line x1="575" y1="325" x2="640" y2="190" stroke="#2563EB" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- PC (Vivado) -->
  <rect x="640" y="280" width="120" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="700" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C3AED">Vivado</text>
  <text x="700" y="322" text-anchor="middle" font-size="10" fill="#6B7280">Hardware</text>
  <text x="700" y="338" text-anchor="middle" font-size="10" fill="#6B7280">Manager</text>

  <line x1="700" y1="230" x2="700" y2="280" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="720" y="260" font-size="9" fill="#7C3AED">USB</text>

  <!-- Resource note -->
  <rect x="20" y="390" width="760" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">ILA 리소스 비용 (Basys 3 기준)</text>
  <text x="130" y="440" text-anchor="middle" font-size="10" fill="#6B7280">프로브 4개 × 32비트</text>
  <text x="130" y="456" text-anchor="middle" font-size="10" fill="#2563EB">LUT: ~800 (3.8%)</text>
  <text x="350" y="440" text-anchor="middle" font-size="10" fill="#6B7280">샘플 깊이 1024</text>
  <text x="350" y="456" text-anchor="middle" font-size="10" fill="#2563EB">BRAM: 4~6개 (8~12%)</text>
  <text x="570" y="440" text-anchor="middle" font-size="10" fill="#6B7280">총 오버헤드</text>
  <text x="570" y="456" text-anchor="middle" font-size="10" fill="#DC2626">설계 리소스의 10~15%</text>
</svg>