<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" font-family="Pretendard, monospace" font-size="12">
  <defs>
    <style>
      .block { rx: 8; ry: 8; stroke-width: 2; }
      .block-label { fill: white; text-anchor: middle; font-weight: 600; font-size: 13px; }
      .block-sub { fill: white; text-anchor: middle; font-size: 10px; opacity: 0.8; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .signal-label { fill: #374151; font-size: 11px; font-weight: 600; }
      .note { fill: #6B7280; font-size: 10px; font-style: italic; }
      .title { font-size: 16px; fill: #2563EB; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
  </defs>
  <text x="20" y="25" class="title">시스템 클록 및 리셋 회로</text>

  <!-- 클록 경로 -->
  <text x="20" y="55" fill="#374151" font-size="13" font-weight="700">클록 경로:</text>

  <!-- 100MHz OSC -->
  <rect x="30" y="70" width="120" height="50" class="block" fill="#374151" stroke="#1F2937"/>
  <text x="90" y="92" class="block-label">100MHz</text>
  <text x="90" y="107" class="block-sub">OSC (W5)</text>

  <!-- MMCM/PLL -->
  <rect x="210" y="70" width="150" height="50" class="block" fill="#7C3AED" stroke="#6D28D9"/>
  <text x="285" y="92" class="block-label">MMCM / PLL</text>
  <text x="285" y="107" class="block-sub">Clocking Wizard</text>

  <!-- BUFG -->
  <rect x="420" y="70" width="100" height="50" class="block" fill="#2563EB" stroke="#1D4ED8"/>
  <text x="470" y="92" class="block-label">BUFG</text>
  <text x="470" y="107" class="block-sub">글로벌 버퍼</text>

  <!-- sys_clk_50 -->
  <rect x="580" y="70" width="140" height="50" class="block" fill="#059669" stroke="#047857"/>
  <text x="650" y="92" class="block-label">sys_clk</text>
  <text x="650" y="107" class="block-sub">50MHz 시스템 클록</text>

  <!-- 클록 화살표 -->
  <line x1="150" y1="95" x2="208" y2="95" class="arrow"/>
  <text x="180" y="88" class="signal-label">CLKIN1</text>
  <line x1="360" y1="95" x2="418" y2="95" class="arrow"/>
  <text x="390" y="88" class="signal-label">CLKOUT0</text>
  <line x1="520" y1="95" x2="578" y2="95" class="arrow"/>

  <!-- 리셋 경로 -->
  <text x="20" y="170" fill="#374151" font-size="13" font-weight="700">리셋 경로:</text>

  <!-- 버튼 (비동기) -->
  <rect x="30" y="185" width="120" height="50" class="block" fill="#DC2626" stroke="#B91C1C"/>
  <text x="90" y="207" class="block-label">btnC</text>
  <text x="90" y="222" class="block-sub">비동기 리셋</text>

  <!-- 디바운서 -->
  <rect x="210" y="185" width="120" height="50" class="block" fill="#D97706" stroke="#B45309"/>
  <text x="270" y="207" class="block-label">디바운서</text>
  <text x="270" y="222" class="block-sub">20ms 필터</text>

  <!-- 2단 FF 동기화 -->
  <rect x="390" y="185" width="160" height="50" class="block" fill="#7C3AED" stroke="#6D28D9"/>
  <text x="470" y="207" class="block-label">2단 FF 동기화</text>
  <text x="470" y="222" class="block-sub">메타스태빌리티 방지</text>

  <!-- rst_n 출력 -->
  <rect x="610" y="185" width="110" height="50" class="block" fill="#059669" stroke="#047857"/>
  <text x="665" y="207" class="block-label">rst_n</text>
  <text x="665" y="222" class="block-sub">동기 리셋</text>

  <!-- 리셋 화살표 -->
  <line x1="150" y1="210" x2="208" y2="210" class="arrow"/>
  <text x="180" y="203" class="signal-label">raw</text>
  <line x1="330" y1="210" x2="388" y2="210" class="arrow"/>
  <text x="360" y="203" class="signal-label">deb</text>
  <line x1="550" y1="210" x2="608" y2="210" class="arrow"/>

  <!-- clk 입력 to 동기화기 -->
  <line x1="470" y1="120" x2="470" y2="183" class="arrow" stroke-dasharray="4,3" stroke="#2563EB"/>
  <text x="485" y="155" fill="#2563EB" font-size="10">sys_clk</text>

  <!-- 설명 박스 -->
  <rect x="30" y="260" width="690" height="50" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="375" y="278" text-anchor="middle" fill="#374151" font-size="11" font-weight="600">동기화 원리</text>
  <text x="375" y="296" text-anchor="middle" class="note">
    비동기 리셋 신호가 클록 에지 근처에서 해제되면 메타스태빌리티 발생 가능. 2단 FF를 거치면 확률이 10^-20 이하로 감소.
  </text>
</svg>