<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #2563EB; font-family: Pretendard, sans-serif; }
      .section-label { font-size: 13px; font-weight: bold; fill: #FFFFFF; font-family: Pretendard, sans-serif; }
      .mem-label { font-size: 11px; fill: #1F2937; font-family: monospace; }
      .annotation { font-size: 12px; fill: #1F2937; font-family: Pretendard, sans-serif; }
      .code { font-size: 10px; fill: #1F2937; font-family: monospace; }
      .section-text { fill: #FFFFFF; font-size: 10px; font-weight: bold; font-family: Pretendard, sans-serif; }
      .mem-text { fill: #DBEAFE; font-size: 10px; font-family: monospace; }
      .arrow { stroke: #2563EB; stroke-width: 2; fill: none; }
      .arrow-marker { marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">메모리 레이아웃 — 스택 초기화</text>

  <!-- Memory map box -->
  <g id="memory-map">
    <!-- IMEM section -->
    <rect x="150" y="70" width="120" height="100" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="3"/>
    <text x="210" y="95" text-anchor="middle" class="section-label">.text</text>
    <text x="210" y="115" text-anchor="middle" class="mem-text">0x8000_0000</text>
    <text x="210" y="130" text-anchor="middle" class="mem-text">~0x8000_3FFF</text>
    <text x="210" y="150" text-anchor="middle" class="annotation">(16KB)</text>

    <!-- DMEM/Data section -->
    <rect x="150" y="180" width="120" height="60" fill="#60A5FA" stroke="#2563EB" stroke-width="2" rx="3"/>
    <text x="210" y="205" text-anchor="middle" class="section-label">.data</text>
    <text x="210" y="225" text-anchor="middle" class="mem-text">0x8000_4000</text>

    <!-- DMEM/BSS section -->
    <rect x="150" y="250" width="120" height="60" fill="#93C5FD" stroke="#2563EB" stroke-width="2" rx="3"/>
    <text x="210" y="275" text-anchor="middle" class="section-label">.bss</text>
    <text x="210" y="295" text-anchor="middle" class="mem-text">0x8000_5000</text>

    <!-- Heap section -->
    <rect x="150" y="320" width="120" height="80" fill="#BFDBFE" stroke="#2563EB" stroke-width="2" rx="3" stroke-dasharray="5,5"/>
    <text x="210" y="350" text-anchor="middle" class="section-label">힙</text>
    <text x="210" y="370" text-anchor="middle" class="annotation">(동적 할당)</text>
    <text x="210" y="390" text-anchor="middle" class="annotation">↓ 상향 성장</text>

    <!-- Stack section -->
    <rect x="150" y="410" width="120" height="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="3"/>
    <text x="210" y="440" text-anchor="middle" class="section-label">스택</text>
    <text x="210" y="460" text-anchor="middle" class="mem-text">sp = 0x8000_2000</text>
    <text x="210" y="480" text-anchor="middle" class="annotation">↑ 하향 성장</text>

    <!-- MMIO section -->
    <rect x="150" y="520" width="120" height="60" fill="#06B6D4" stroke="#2563EB" stroke-width="2" rx="3"/>
    <text x="210" y="545" text-anchor="middle" class="section-label" style="fill: #FFFFFF">MMIO</text>
    <text x="210" y="565" text-anchor="middle" class="mem-text" style="fill: #FFFFFF">0xC000_0000</text>
  </g>

  <!-- Address labels on left -->
  <text x="130" y="75" text-anchor="end" class="mem-label">0x8000_0000</text>
  <text x="130" y="125" text-anchor="end" class="mem-label">0x8000_3FFF</text>
  <text x="130" y="185" text-anchor="end" class="mem-label">0x8000_4000</text>
  <text x="130" y="255" text-anchor="end" class="mem-label">0x8000_5000</text>
  <text x="130" y="325" text-anchor="end" class="mem-label">힙</text>
  <text x="130" y="415" text-anchor="end" class="mem-label">0x8000_2000</text>
  <text x="130" y="525" text-anchor="end" class="mem-label">0xC000_0000</text>

  <!-- Right side: Detailed annotations -->
  <g id="annotations">
    <!-- IMEM annotation -->
    <rect x="320" y="70" width="520" height="100" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
    <text x="330" y="95" class="annotation" font-weight="bold">명령어 메모리 (IMEM)</text>
    <text x="330" y="115" class="annotation">• startup.S의 _start 레이블 배치</text>
    <text x="330" y="135" class="annotation">• main() 함수 배치</text>
    <text x="330" y="155" class="annotation">• 크기 16KB (0x4000 바이트)</text>

    <!-- DMEM annotation -->
    <rect x="320" y="180" width="520" height="120" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
    <text x="330" y="205" class="annotation" font-weight="bold">데이터 메모리 (DMEM) — 총 8KB</text>
    <text x="330" y="225" class="annotation">• .data: 초기화된 전역변수 (동전, 배열, 상수)</text>
    <text x="330" y="245" class="annotation">• .bss: 미초기화 전역변수 (0으로 시작)</text>
    <text x="330" y="265" class="annotation">• 스택과 힙이 이 공간 내에 포함</text>
    <text x="330" y="285" class="annotation">• 범위: 0x8000_4000 ~ 0x8000_5FFF (8KB)</text>

    <!-- Heap/Stack warning -->
    <rect x="320" y="320" width="520" height="80" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="3"/>
    <text x="330" y="345" class="annotation" font-weight="bold" fill="#DC2626">⚠️ 힙-스택 충돌 위험</text>
    <text x="330" y="365" class="annotation">힙은 상향 성장 (malloc)하고, 스택은 하향 성장합니다.</text>
    <text x="330" y="385" class="annotation">둘이 만나면 메모리 오버플로우! 동적 할당을 신중하게.</text>

    <!-- sp initialization -->
    <rect x="320" y="420" width="520" height="80" fill="#D1FAE5" stroke="#059669" stroke-width="2" rx="3"/>
    <text x="330" y="445" class="annotation" font-weight="bold" fill="#059669">✓ 스택 포인터 초기화</text>
    <text x="330" y="465" class="annotation">sp = __stack_end = 0x8000_2000</text>
    <text x="330" y="485" class="annotation">→ 링커 스크립트에서 정의, startup.S에서 로드</text>

    <!-- MMIO annotation -->
    <rect x="320" y="520" width="520" height="60" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
    <text x="330" y="545" class="annotation" font-weight="bold">주변 장치 (MMIO)</text>
    <text x="330" y="565" class="annotation">UART(0xC000_0000), GPIO(0xC000_0010), Timer(0xC000_0020)</text>
  </g>

  <!-- Bottom: Size calculator -->
  <g id="size-info">
    <rect x="150" y="620" width="690" height="60" fill="#F3F4F6" stroke="#2563EB" stroke-width="1" rx="3"/>
    <text x="160" y="640" class="annotation" font-weight="bold">메모리 계산:</text>
    <text x="160" y="660" class="code">IMEM (16KB) + DMEM (8KB) = 24KB 하드웨어 필요</text>
    <text x="160" y="675" class="code">DMEM 내: .data (가변) + .bss (가변) + 힙 + 스택</text>
  </g>

</svg>
