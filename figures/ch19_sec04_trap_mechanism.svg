<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arr4g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>
  <style>
    .box      { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; rx: 8; }
    .trap-box { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; rx: 8; }
    .csr-box  { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; rx: 8; }
    .ret-box  { fill: #D1FAE5; stroke: #059669; stroke-width: 2; rx: 8; }
    .label    { font-size: 13px; fill: #1E3A5F; text-anchor: middle; font-weight: bold; }
    .sub      { font-size: 11px; fill: #475569; text-anchor: middle; }
    .title    { font-size: 18px; fill: #1E3A5F; font-weight: bold; text-anchor: middle; }
    .code     { font-size: 11px; fill: #6B7280; text-anchor: start; font-family: monospace; }
    .step     { font-size: 14px; fill: #FFFFFF; text-anchor: middle; font-weight: bold; }
    .step-bg  { fill: #2563EB; }
    .arrow    { stroke: #2563EB; stroke-width: 2; fill: none; }
  </style>

  <text x="430" y="30" class="title">트랩 진입/복귀 메커니즘</text>

  <!-- ===== TRAP ENTRY (Left side) ===== -->
  <text x="230" y="65" class="label" style="font-size:15px;">트랩 진입 (Trap Entry)</text>

  <!-- Step 1 -->
  <circle cx="50" cy="105" r="14" class="step-bg"/>
  <text x="50" y="110" class="step">1</text>
  <rect x="75" y="85" width="310" height="45" class="csr-box"/>
  <text x="230" y="107" class="label" style="fill:#92400E;">mepc ← 예외 발생 명령어 PC</text>
  <text x="230" y="122" class="sub" style="fill:#92400E;">인터럽트: 다음 명령어 PC / 예외: 현재 명령어 PC</text>

  <!-- Step 2 -->
  <circle cx="50" cy="165" r="14" class="step-bg"/>
  <text x="50" y="170" class="step">2</text>
  <rect x="75" y="145" width="310" height="45" class="csr-box"/>
  <text x="230" y="167" class="label" style="fill:#92400E;">mcause ← 예외/인터럽트 코드</text>
  <text x="230" y="182" class="sub" style="fill:#92400E;">bit[31]: 1=인터럽트, 0=예외 | bit[30:0]: 코드</text>

  <!-- Step 3 -->
  <circle cx="50" cy="225" r="14" class="step-bg"/>
  <text x="50" y="230" class="step">3</text>
  <rect x="75" y="205" width="310" height="45" class="csr-box"/>
  <text x="230" y="227" class="label" style="fill:#92400E;">mtval ← 추가 정보</text>
  <text x="230" y="242" class="sub" style="fill:#92400E;">Misaligned: 잘못된 주소 / Illegal: 명령어 비트패턴</text>

  <!-- Step 4 -->
  <circle cx="50" cy="285" r="14" class="step-bg"/>
  <text x="50" y="290" class="step">4</text>
  <rect x="75" y="265" width="310" height="45" class="csr-box"/>
  <text x="230" y="287" class="label" style="fill:#92400E;">mstatus.MPIE ← mstatus.MIE</text>
  <text x="230" y="302" class="sub" style="fill:#92400E;">이전 인터럽트 인에이블 상태 백업</text>

  <!-- Step 5 -->
  <circle cx="50" cy="345" r="14" class="step-bg"/>
  <text x="50" y="350" class="step">5</text>
  <rect x="75" y="325" width="310" height="45" class="csr-box"/>
  <text x="230" y="347" class="label" style="fill:#92400E;">mstatus.MIE ← 0</text>
  <text x="230" y="362" class="sub" style="fill:#92400E;">트랩 핸들러 진입 시 인터럽트 비활성화</text>

  <!-- Step 6 -->
  <circle cx="50" cy="405" r="14" class="step-bg"/>
  <text x="50" y="410" class="step">6</text>
  <rect x="75" y="385" width="310" height="45" class="trap-box"/>
  <text x="230" y="407" class="label" style="fill:#DC2626;">PC ← mtvec</text>
  <text x="230" y="422" class="sub" style="fill:#DC2626;">트랩 핸들러 주소로 점프 + 파이프라인 플러시</text>

  <!-- ===== MRET (Right side) ===== -->
  <text x="630" y="65" class="label" style="font-size:15px; fill:#059669;">트랩 복귀 (MRET)</text>

  <!-- Step A -->
  <circle cx="470" cy="105" r="14" fill="#059669"/>
  <text x="470" y="110" class="step">A</text>
  <rect x="495" y="85" width="310" height="45" class="ret-box"/>
  <text x="650" y="107" class="label" style="fill:#059669;">PC ← mepc</text>
  <text x="650" y="122" class="sub" style="fill:#065F46;">저장된 복귀 주소로 점프</text>

  <!-- Step B -->
  <circle cx="470" cy="165" r="14" fill="#059669"/>
  <text x="470" y="170" class="step">B</text>
  <rect x="495" y="145" width="310" height="45" class="ret-box"/>
  <text x="650" y="167" class="label" style="fill:#059669;">mstatus.MIE ← mstatus.MPIE</text>
  <text x="650" y="182" class="sub" style="fill:#065F46;">인터럽트 인에이블 상태 복원</text>

  <!-- Step C -->
  <circle cx="470" cy="225" r="14" fill="#059669"/>
  <text x="470" y="230" class="step">C</text>
  <rect x="495" y="205" width="310" height="45" class="ret-box"/>
  <text x="650" y="227" class="label" style="fill:#059669;">mstatus.MPIE ← 1</text>
  <text x="650" y="242" class="sub" style="fill:#065F46;">MPIE 기본값 복원</text>

  <!-- Step D -->
  <circle cx="470" cy="285" r="14" fill="#059669"/>
  <text x="470" y="290" class="step">D</text>
  <rect x="495" y="265" width="310" height="45" class="ret-box"/>
  <text x="650" y="287" class="label" style="fill:#059669;">파이프라인 플러시</text>
  <text x="650" y="302" class="sub" style="fill:#065F46;">MRET 이후 잘못된 명령어 제거</text>

  <!-- Circular arrow showing trap-return cycle -->
  <path d="M385,420 Q430,480 470,420" stroke="#6B7280" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr4g)"/>
  <text x="430" y="490" class="sub" style="font-weight:bold;">정상 실행 복귀</text>

  <!-- mcause code table -->
  <rect x="470" y="350" width="350" height="150" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="645" y="375" class="label">mcause 주요 예외/인터럽트 코드</text>
  <text x="485" y="400" class="code">0   Instruction address misaligned</text>
  <text x="485" y="418" class="code">2   Illegal instruction</text>
  <text x="485" y="436" class="code">4   Load address misaligned</text>
  <text x="485" y="454" class="code">6   Store address misaligned</text>
  <text x="485" y="472" class="code">11  Environment call (ECALL)</text>
  <text x="485" y="490" class="code">0x8000_0007  Machine timer interrupt</text>
</svg>