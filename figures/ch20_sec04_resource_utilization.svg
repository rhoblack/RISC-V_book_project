<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="850" height="500" fill="#F8FAFC" rx="8"/>

  <text x="425" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Basys 3 (XC7A35T) 리소스 사용량 분석</text>
  <text x="425" y="50" text-anchor="middle" font-size="12" fill="#64748B">RV32I 파이프라인 + L1 캐시 + AMBA 버스 + 주변장치 구현 시 예상 사용률</text>

  <!-- LUT 바 -->
  <text x="30" y="100" font-size="13" font-weight="700" fill="#1E293B">LUT</text>
  <text x="30" y="116" font-size="10" fill="#64748B">(20,800개)</text>
  <rect x="130" y="85" width="680" height="35" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <!-- 파이프라인 코어 -->
  <rect x="130" y="85" width="170" height="35" rx="6" fill="#2563EB"/>
  <text x="215" y="107" text-anchor="middle" font-size="10" font-weight="600" fill="white">파이프라인 코어 25%</text>
  <!-- 캐시 -->
  <rect x="300" y="85" width="136" height="35" fill="#3B82F6"/>
  <text x="368" y="107" text-anchor="middle" font-size="10" font-weight="600" fill="white">캐시 20%</text>
  <!-- AMBA -->
  <rect x="436" y="85" width="68" height="35" fill="#60A5FA"/>
  <text x="470" y="107" text-anchor="middle" font-size="10" font-weight="600" fill="white">AMBA 10%</text>
  <!-- 주변장치 -->
  <rect x="504" y="85" width="34" height="35" fill="#93C5FD"/>
  <text x="521" y="107" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">5%</text>
  <!-- 퍼센트 표시 -->
  <line x1="538" y1="80" x2="538" y2="130" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="545" y="78" font-size="11" font-weight="700" fill="#DC2626">~60%</text>
  <text x="650" y="107" font-size="10" fill="#059669">여유 ~40%</text>

  <!-- FF 바 -->
  <text x="30" y="170" font-size="13" font-weight="700" fill="#1E293B">FF</text>
  <text x="30" y="186" font-size="10" fill="#64748B">(41,600개)</text>
  <rect x="130" y="155" width="680" height="35" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="130" y="155" width="204" height="35" rx="6" fill="#2563EB"/>
  <text x="232" y="177" text-anchor="middle" font-size="10" font-weight="600" fill="white">파이프라인 레지스터 30%</text>
  <rect x="334" y="155" width="68" height="35" fill="#3B82F6"/>
  <text x="368" y="177" text-anchor="middle" font-size="10" font-weight="600" fill="white">캐시 10%</text>
  <rect x="402" y="155" width="34" height="35" fill="#60A5FA"/>
  <text x="419" y="177" text-anchor="middle" font-size="9" font-weight="600" fill="white">5%</text>
  <line x1="436" y1="150" x2="436" y2="200" stroke="#059669" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="445" y="148" font-size="11" font-weight="700" fill="#059669">~45%</text>

  <!-- BRAM 바 -->
  <text x="30" y="240" font-size="13" font-weight="700" fill="#1E293B">BRAM</text>
  <text x="30" y="256" font-size="10" fill="#64748B">(50 블록)</text>
  <rect x="130" y="225" width="680" height="35" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="130" y="225" width="272" height="35" rx="6" fill="#2563EB"/>
  <text x="266" y="247" text-anchor="middle" font-size="10" font-weight="600" fill="white">I-Cache 4KB (8블록) + D-Cache 4KB (8블록)</text>
  <rect x="402" y="225" width="136" height="35" fill="#3B82F6"/>
  <text x="470" y="247" text-anchor="middle" font-size="10" font-weight="600" fill="white">IMEM+DMEM 20%</text>
  <rect x="538" y="225" width="68" height="35" fill="#60A5FA"/>
  <text x="572" y="247" text-anchor="middle" font-size="10" font-weight="600" fill="white">Tag 10%</text>
  <line x1="606" y1="220" x2="606" y2="270" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="615" y="218" font-size="11" font-weight="700" fill="#D97706">~70%</text>
  <text x="680" y="247" font-size="10" fill="#D97706">여유 적음!</text>

  <!-- DSP 바 -->
  <text x="30" y="310" font-size="13" font-weight="700" fill="#1E293B">DSP48</text>
  <text x="30" y="326" font-size="10" fill="#64748B">(90개)</text>
  <rect x="130" y="295" width="680" height="35" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="130" y="295" width="34" height="35" rx="6" fill="#2563EB"/>
  <text x="200" y="317" font-size="10" font-weight="600" fill="#1E293B">비교기 ~5%</text>
  <text x="400" y="317" font-size="10" fill="#059669">대부분 미사용 (M확장 시 활용 가능)</text>

  <!-- 범례 -->
  <rect x="30" y="360" width="790" height="120" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="425" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">모듈별 리소스 배분 (예상)</text>

  <rect x="50" y="400" width="16" height="16" rx="3" fill="#2563EB"/>
  <text x="75" y="413" font-size="11" fill="#1E293B">파이프라인 코어 (ALU, RegFile, 제어유닛, 해저드유닛)</text>

  <rect x="50" y="425" width="16" height="16" rx="3" fill="#3B82F6"/>
  <text x="75" y="438" font-size="11" fill="#1E293B">캐시 (L1 I-Cache, D-Cache, 태그 메모리, LRU)</text>

  <rect x="450" y="400" width="16" height="16" rx="3" fill="#60A5FA"/>
  <text x="475" y="413" font-size="11" fill="#1E293B">AMBA 버스 (AHB, APB 브리지, 디코더)</text>

  <rect x="450" y="425" width="16" height="16" rx="3" fill="#93C5FD"/>
  <text x="475" y="438" font-size="11" fill="#1E293B">주변장치 (UART, GPIO, Timer)</text>

  <rect x="50" y="455" width="760" height="18" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="425" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">주의: BRAM 사용률이 가장 높으므로, 캐시 크기 결정 시 BRAM 예산을 먼저 확인할 것</text>
</svg>