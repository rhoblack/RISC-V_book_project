<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">직접 매핑 캐시 구조 (Direct-Mapped Cache)</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#6B7280">4KB, 128 엔트리, 32바이트 블록 (Basys 3 BRAM 기반)</text>

  <!-- Address breakdown -->
  <text x="30" y="82" font-size="14" font-weight="bold" fill="#2563EB">32비트 주소 분해</text>

  <!-- Tag field -->
  <rect x="30" y="90" width="280" height="36" rx="4" fill="#2563EB" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="170" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Tag [31:12]</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#2563EB">20비트</text>

  <!-- Index field -->
  <rect x="314" y="90" width="200" height="36" rx="4" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="414" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Index [11:5]</text>
  <text x="414" y="140" text-anchor="middle" font-size="11" fill="#3B82F6">7비트 (128 엔트리)</text>

  <!-- Offset field -->
  <rect x="518" y="90" width="140" height="36" rx="4" fill="#60A5FA" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="588" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Offset [4:0]</text>
  <text x="588" y="140" text-anchor="middle" font-size="11" fill="#60A5FA">5비트 (32바이트)</text>

  <!-- Cache table -->
  <text x="30" y="175" font-size="14" font-weight="bold" fill="#2563EB">캐시 메모리 (128 엔트리)</text>

  <!-- Header row -->
  <rect x="30" y="185" width="50" height="30" fill="#2563EB"/>
  <text x="55" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Index</text>
  <rect x="80" y="185" width="40" height="30" fill="#2563EB"/>
  <text x="100" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">V</text>
  <rect x="120" y="185" width="160" height="30" fill="#2563EB"/>
  <text x="200" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Tag (20비트)</text>
  <rect x="280" y="185" width="380" height="30" fill="#2563EB"/>
  <text x="470" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Data Block (32바이트 = 8 워드)</text>

  <!-- Entry 0 -->
  <rect x="30" y="215" width="50" height="28" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="55" y="234" text-anchor="middle" font-size="11" fill="#1F2937">0</text>
  <rect x="80" y="215" width="40" height="28" fill="#ECFDF5" stroke="#93C5FD"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#059669">1</text>
  <rect x="120" y="215" width="160" height="28" fill="white" stroke="#93C5FD"/>
  <text x="200" y="234" text-anchor="middle" font-size="11" font-family="monospace" fill="#1F2937">0x00001</text>
  <rect x="280" y="215" width="380" height="28" fill="white" stroke="#93C5FD"/>
  <text x="470" y="234" text-anchor="middle" font-size="10" font-family="monospace" fill="#1F2937">W0 | W1 | W2 | W3 | W4 | W5 | W6 | W7</text>

  <!-- Entry 1 -->
  <rect x="30" y="243" width="50" height="28" fill="#F9FAFB" stroke="#93C5FD"/>
  <text x="55" y="262" text-anchor="middle" font-size="11" fill="#1F2937">1</text>
  <rect x="80" y="243" width="40" height="28" fill="#FEF2F2" stroke="#93C5FD"/>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#DC2626">0</text>
  <rect x="120" y="243" width="160" height="28" fill="white" stroke="#93C5FD"/>
  <text x="200" y="262" text-anchor="middle" font-size="11" font-family="monospace" fill="#6B7280">---</text>
  <rect x="280" y="243" width="380" height="28" fill="white" stroke="#93C5FD"/>
  <text x="470" y="262" text-anchor="middle" font-size="10" font-family="monospace" fill="#6B7280">(invalid)</text>

  <!-- Entry 2 -->
  <rect x="30" y="271" width="50" height="28" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="55" y="290" text-anchor="middle" font-size="11" fill="#1F2937">2</text>
  <rect x="80" y="271" width="40" height="28" fill="#ECFDF5" stroke="#93C5FD"/>
  <text x="100" y="290" text-anchor="middle" font-size="11" fill="#059669">1</text>
  <rect x="120" y="271" width="160" height="28" fill="white" stroke="#93C5FD"/>
  <text x="200" y="290" text-anchor="middle" font-size="11" font-family="monospace" fill="#1F2937">0x0003A</text>
  <rect x="280" y="271" width="380" height="28" fill="white" stroke="#93C5FD"/>
  <text x="470" y="290" text-anchor="middle" font-size="10" font-family="monospace" fill="#1F2937">W0 | W1 | W2 | W3 | W4 | W5 | W6 | W7</text>

  <!-- Dots -->
  <text x="390" y="315" text-anchor="middle" font-size="16" fill="#6B7280">. . .</text>

  <!-- Entry 127 -->
  <rect x="30" y="325" width="50" height="28" fill="#F9FAFB" stroke="#93C5FD"/>
  <text x="55" y="344" text-anchor="middle" font-size="11" fill="#1F2937">127</text>
  <rect x="80" y="325" width="40" height="28" fill="#ECFDF5" stroke="#93C5FD"/>
  <text x="100" y="344" text-anchor="middle" font-size="11" fill="#059669">1</text>
  <rect x="120" y="325" width="160" height="28" fill="white" stroke="#93C5FD"/>
  <text x="200" y="344" text-anchor="middle" font-size="11" font-family="monospace" fill="#1F2937">0x00005</text>
  <rect x="280" y="325" width="380" height="28" fill="white" stroke="#93C5FD"/>
  <text x="470" y="344" text-anchor="middle" font-size="10" font-family="monospace" fill="#1F2937">W0 | W1 | W2 | W3 | W4 | W5 | W6 | W7</text>

  <!-- Hit/Miss logic -->
  <text x="30" y="388" font-size="14" font-weight="bold" fill="#2563EB">히트/미스 판정 로직</text>

  <!-- Comparator -->
  <rect x="140" y="400" width="180" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">Tag 비교기</text>
  <text x="230" y="445" text-anchor="middle" font-size="11" fill="#1E3A5F">주소 Tag == 저장 Tag?</text>
  <text x="230" y="460" text-anchor="middle" font-size="11" fill="#1E3A5F">&amp;&amp; Valid == 1</text>

  <!-- Hit output -->
  <rect x="380" y="410" width="120" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">Hit!</text>
  <line x1="320" y1="430" x2="378" y2="430" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Miss output -->
  <rect x="380" y="460" width="120" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="440" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">Miss!</text>
  <line x1="320" y1="450" x2="350" y2="475" stroke="#DC2626" stroke-width="2"/>
  <line x1="350" y1="475" x2="378" y2="475" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Miss action -->
  <rect x="540" y="460" width="200" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="640" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">메모리에서 블록 가져오기</text>
  <text x="640" y="494" text-anchor="middle" font-size="10" fill="#92400E">(미스 페널티 발생)</text>
  <line x1="500" y1="480" x2="538" y2="480" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BRAM note -->
  <rect x="540" y="400" width="200" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="640" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Basys 3 BRAM 활용</text>
  <text x="640" y="434" text-anchor="middle" font-size="10" fill="#2563EB">Tag: BRAM 1개</text>
  <text x="640" y="448" text-anchor="middle" font-size="10" fill="#2563EB">Data: BRAM 7~8개</text>
</svg>