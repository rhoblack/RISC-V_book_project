<svg viewBox="0 0 950 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #1E40AF; font-family: 'Pretendard'; }
      .label { font-size: 12px; fill: white; font-weight: bold; font-family: 'Pretendard'; }
      .label-dark { font-size: 12px; fill: #1E40AF; font-weight: bold; font-family: monospace; }
      .text-desc { font-size: 11px; fill: #666; font-family: monospace; }
      .box-start { fill: #F59E0B; stroke: #D97706; stroke-width: 2; }
      .box-support { fill: #10B981; stroke: #059669; stroke-width: 2; }
      .box-bug { fill: #EF4444; stroke: #DC2626; stroke-width: 2; }
      .box-env { fill: #F97316; stroke: #EA580C; stroke-width: 2; }
      .box-action { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1.5; }
      .text-white { font-size: 11px; fill: white; font-family: monospace; }
      .arrow-line { stroke: #2563EB; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10B981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #EF4444; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-orange { stroke: #F97316; stroke-width: 2; fill: none; marker-end: url(#arrowhead-orange); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#F97316"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="30" class="title" text-anchor="middle">테스트 실패 분류 의사결정 트리</text>

  <!-- START -->
  <rect x="375" y="60" width="200" height="50" class="box-start" rx="4"/>
  <text x="475" y="88" class="label" text-anchor="middle">테스트 실패</text>

  <!-- Arrow -->
  <line x1="475" y1="110" x2="475" y2="140" class="arrow-line"/>

  <!-- First Decision -->
  <text x="475" y="155" class="label-dark" text-anchor="middle" font-size="13">Spike에서 통과?</text>

  <!-- Left branch: Spike passes (설계 미지원) -->
  <line x1="400" y1="160" x2="300" y2="180" class="arrow-green"/>
  <text x="330" y="170" class="text-desc" font-weight="bold">YES</text>

  <rect x="200" y="180" width="200" height="60" class="box-support" rx="4"/>
  <text x="300" y="205" class="label" text-anchor="middle">✅ 설계 미지원</text>
  <text x="300" y="222" class="text-white" text-anchor="middle" font-size="10">(Support = ✗)</text>

  <text x="300" y="315" class="text-desc" text-anchor="middle" font-weight="bold">조치:</text>
  <text x="300" y="330" class="text-desc" text-anchor="middle">1. 설계 확장 고려</text>
  <text x="300" y="345" class="text-desc" text-anchor="middle">또는</text>
  <text x="300" y="360" class="text-desc" text-anchor="middle">2. 테스트 제외</text>

  <!-- Right branch: Spike fails (논리 오류) -->
  <line x1="550" y1="160" x2="650" y2="180" class="arrow-red"/>
  <text x="620" y="170" class="text-desc" font-weight="bold">NO</text>

  <rect x="550" y="180" width="200" height="60" class="box-bug" rx="4"/>
  <text x="650" y="205" class="label" text-anchor="middle">🔴 논리 오류</text>
  <text x="650" y="222" class="text-white" text-anchor="middle" font-size="10">(Bug = ✓)</text>

  <!-- Arrow down from bug -->
  <line x1="650" y1="240" x2="650" y2="270" class="arrow-red"/>

  <!-- Debug sub-tree -->
  <text x="650" y="285" class="label-dark" text-anchor="middle" font-size="13">어느 신호가 틀렸나?</text>

  <!-- Option 1: ALU -->
  <line x1="575" y1="295" x2="500" y2="320" class="arrow-line"/>
  <text x="530" y="310" class="text-desc">ALU</text>

  <rect x="400" y="320" width="200" height="50" class="box-action" rx="3"/>
  <text x="500" y="345" class="label-dark" text-anchor="middle">🔧 ALU 재검토</text>
  <text x="500" y="360" class="text-desc" text-anchor="middle">Ch04 참조</text>

  <!-- Option 2: Forwarding -->
  <line x1="650" y1="295" x2="650" y2="320" class="arrow-line"/>
  <text x="670" y="310" class="text-desc">포워딩</text>

  <rect x="550" y="320" width="200" height="50" class="box-action" rx="3"/>
  <text x="650" y="345" class="label-dark" text-anchor="middle">🔧 포워딩 확인</text>
  <text x="650" y="360" class="text-desc" text-anchor="middle">forward_a/b 신호</text>

  <!-- Option 3: Stall -->
  <line x1="725" y1="295" x2="800" y2="320" class="arrow-line"/>
  <text x="770" y="310" class="text-desc">스톨</text>

  <rect x="700" y="320" width="200" height="50" class="box-action" rx="3"/>
  <text x="800" y="345" class="label-dark" text-anchor="middle">🔧 스톨 확인</text>
  <text x="800" y="360" class="text-desc" text-anchor="middle">load_use_hazard</text>

  <!-- Environment branch from start -->
  <line x1="475" y1="110" x2="475" y2="140" class="arrow-line"/>

  <!-- Alternative: HTIF failure -->
  <g>
    <!-- Box for HTIF check -->
    <text x="750" y="155" class="label-dark" text-anchor="middle" font-size="13">tohost 쓰기 성공?</text>

    <!-- Yes to env -->
    <line x1="840" y1="160" x2="900" y2="180" class="arrow-orange"/>
    <text x="875" y="170" class="text-desc" font-weight="bold">NO</text>

    <rect x="800" y="180" width="150" height="60" class="box-env" rx="4"/>
    <text x="875" y="205" class="label" text-anchor="middle">🟡 환경 오류</text>
    <text x="875" y="222" class="text-white" text-anchor="middle" font-size="10">(Environment)</text>
  </g>

  <!-- Detailed Debug Steps -->
  <text x="50" y="450" class="label-dark" font-weight="bold" font-size="13">Step-by-Step 디버깅</text>

  <!-- Step 1 -->
  <rect x="50" y="480" width="220" height="140" class="box-action" rx="3"/>
  <text x="160" y="500" class="label-dark" text-anchor="middle" font-weight="bold">Step 1: 로그 분석</text>

  <text x="65" y="520" class="text-desc" font-weight="bold">1. HTIF 로그 열기</text>
  <text x="65" y="535" class="text-desc">results/test.log</text>

  <text x="65" y="555" class="text-desc" font-weight="bold">2. 마지막 명령어 찾기</text>
  <text x="65" y="570" class="text-desc">[NNNN] RI ... (명령)</text>

  <text x="65" y="590" class="text-desc" font-weight="bold">3. 입력값 확인</text>
  <text x="65" y="605" class="text-desc">rs1_data, rs2_data?</text>

  <!-- Step 2 -->
  <rect x="310" y="480" width="220" height="140" class="box-action" rx="3"/>
  <text x="420" y="500" class="label-dark" text-anchor="middle" font-weight="bold">Step 2: 파형 분석</text>

  <text x="325" y="520" class="text-desc" font-weight="bold">1. VCS 파형 열기</text>
  <text x="325" y="535" class="text-desc">verdi -f design.f</text>

  <text x="325" y="555" class="text-desc" font-weight="bold">2. 신호 추적</text>
  <text x="325" y="570" class="text-desc">clk, PC, instr</text>

  <text x="325" y="590" class="text-desc" font-weight="bold">3. 문제 신호 발견</text>
  <text x="325" y="605" class="text-desc">어느 신호이 틀림?</text>

  <!-- Step 3 -->
  <rect x="570" y="480" width="220" height="140" class="box-action" rx="3"/>
  <text x="680" y="500" class="label-dark" text-anchor="middle" font-weight="bold">Step 3: 원인 특정</text>

  <text x="585" y="520" class="text-desc" font-weight="bold">1. 신호별 체크</text>
  <text x="585" y="535" class="text-desc">A: ALU 비교</text>
  <text x="585" y="550" class="text-desc">B: 포워딩 조건</text>
  <text x="585" y="565" class="text-desc">C: PC 선택</text>

  <text x="585" y="585" class="text-desc" font-weight="bold">2. 원인 문서화</text>
  <text x="585" y="605" class="text-desc">Ch NN 어느 부분</text>

  <!-- Step 4 -->
  <rect x="830" y="480" width="100" height="140" class="box-action" rx="3"/>
  <text x="880" y="500" class="label-dark" text-anchor="middle" font-weight="bold">Step 4</text>

  <text x="845" y="525" class="text-desc" font-weight="bold">수정</text>
  <text x="845" y="545" class="text-desc">↓</text>
  <text x="845" y="565" class="text-desc">재테스트</text>
  <text x="845" y="585" class="text-desc">↓</text>
  <text x="845" y="605" class="text-desc">확인</text>

  <!-- Examples -->
  <text x="50" y="650" class="label-dark" font-weight="bold" font-size="13">실패 사례별 해결</text>

  <rect x="50" y="675" width="220" height="65" style="fill: #FEF3C7; stroke: #F59E0B; stroke-width: 1;" rx="3"/>
  <text x="160" y="695" class="label-dark" text-anchor="middle" font-weight="bold">Case 1: add 실패</text>
  <text x="65" y="715" class="text-desc">→ ALU 비교기 오류</text>
  <text x="65" y="730" class="text-desc">Ch04 덧셈 로직 재검토</text>

  <rect x="310" y="675" width="220" height="65" style="fill: #D1FAE5; stroke: #059669; stroke-width: 1;" rx="3"/>
  <text x="420" y="695" class="label-dark" text-anchor="middle" font-weight="bold">Case 2: beq 실패</text>
  <text x="325" y="715" class="text-desc">→ branch_taken 신호</text>
  <text x="325" y="730" class="text-desc">Ch11 분기 판정 로직</text>

  <rect x="570" y="675" width="220" height="65" style="fill: #FCE7F3; stroke: #EC4899; stroke-width: 1;" rx="3"/>
  <text x="680" y="695" class="label-dark" text-anchor="middle" font-weight="bold">Case 3: lw 실패</text>
  <text x="585" y="715" class="text-desc">→ load_use_stall</text>
  <text x="585" y="730" class="text-desc">Ch10 스톨 조건</text>
</svg>
