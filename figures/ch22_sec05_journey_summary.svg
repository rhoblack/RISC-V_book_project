<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <rect width="850" height="350" fill="#F8FAFC" rx="8"/>

  <text x="425" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">교재 전체 여정 — 하드웨어에서 소프트웨어까지</text>

  <!-- 타임라인 베이스 -->
  <line x1="50" y1="200" x2="800" y2="200" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Part 0-1: ISA -->
  <circle cx="100" cy="200" r="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">1-3</text>
  <text x="100" y="170" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">ISA 이해</text>
  <text x="100" y="235" text-anchor="middle" font-size="8" fill="#64748B">Part 0~1</text>

  <!-- Part 2: 단일 사이클 -->
  <circle cx="220" cy="200" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="220" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">4-6</text>
  <text x="220" y="165" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">단일 사이클</text>
  <text x="220" y="155" text-anchor="middle" font-size="8" fill="#059669">피보나치!</text>
  <text x="220" y="240" text-anchor="middle" font-size="8" fill="#64748B">Part 2</text>

  <!-- Part 3: 멀티사이클 -->
  <circle cx="310" cy="200" r="16" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="310" y="204" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5">7-8</text>
  <text x="310" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">멀티사이클</text>
  <text x="310" y="235" text-anchor="middle" font-size="8" fill="#64748B">Part 3</text>

  <!-- Part 4: 파이프라인 -->
  <circle cx="430" cy="200" r="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="430" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">9-12</text>
  <text x="430" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">파이프라인</text>
  <text x="430" y="147" text-anchor="middle" font-size="8" fill="#059669">버블정렬 FPGA!</text>
  <text x="430" y="245" text-anchor="middle" font-size="8" fill="#64748B">Part 4</text>

  <!-- Part 5-6: 캐시+버스 -->
  <circle cx="545" cy="200" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="545" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5">13-17</text>
  <text x="545" y="168" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">캐시 + AMBA</text>
  <text x="545" y="158" text-anchor="middle" font-size="8" fill="#059669">Hello RISC-V!</text>
  <text x="545" y="238" text-anchor="middle" font-size="8" fill="#64748B">Part 5~6</text>

  <!-- Part 7: 예외/인터럽트 -->
  <circle cx="640" cy="200" r="18" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="640" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5">18-19</text>
  <text x="640" y="170" text-anchor="middle" font-size="9" font-weight="600" fill="#1E293B">예외/인터럽트</text>
  <text x="640" y="235" text-anchor="middle" font-size="8" fill="#64748B">Part 7</text>

  <!-- Part 8: FPGA + SW (현재!) -->
  <circle cx="750" cy="200" r="30" fill="#2563EB" stroke="#1D4ED8" stroke-width="3" filter="url(#shadow)"/>
  <text x="750" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="white">20-22</text>
  <text x="750" y="211" text-anchor="middle" font-size="8" fill="#DBEAFE">NOW!</text>
  <text x="750" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">C 프로그램 실행!</text>
  <text x="750" y="250" text-anchor="middle" font-size="8" fill="#2563EB" font-weight="600">Part 8</text>

  <!-- 감정 곡선 -->
  <path d="M 80 280 Q 150 290 220 260 Q 280 275 310 270 Q 370 285 430 240 Q 490 260 545 250 Q 590 265 640 255 Q 700 230 750 210" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="50" y="285" font-size="9" fill="#DC2626" font-weight="600">감정</text>

  <!-- 범례 -->
  <rect x="200" y="310" width="450" height="25" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="230" cy="322" r="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="245" y="327" font-size="9" fill="#1E293B">주요 마일스톤</text>
  <circle cx="350" cy="322" r="6" fill="#2563EB"/>
  <text x="365" y="327" font-size="9" fill="#1E293B">현재 위치 (Ch22)</text>
  <line x1="450" y1="322" x2="480" y2="322" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="490" y="327" font-size="9" fill="#DC2626">감정 곡선</text>
</svg>