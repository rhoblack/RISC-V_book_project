<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, monospace" font-size="12">
  <defs>
    <style>
      .sig-name { fill: #374151; font-size: 12px; font-weight: 600; text-anchor: end; }
      .clk-line { stroke: #2563EB; stroke-width: 1.5; fill: none; }
      .sig-line { stroke: #374151; stroke-width: 1.5; fill: none; }
      .setup-area { fill: #DBEAFE; opacity: 0.3; }
      .wait-area { fill: #FEE2E2; opacity: 0.3; }
      .access-area { fill: #D1FAE5; opacity: 0.3; }
      .cycle-num { font-size: 10px; fill: #9CA3AF; text-anchor: middle; }
      .title { font-size: 14px; fill: #7C3AED; font-weight: 700; }
      .val-text { font-size: 10px; text-anchor: middle; font-weight: 600; }
      .phase-label { font-size: 10px; text-anchor: middle; font-weight: 600; }
    </style>
  </defs>
  <text x="10" y="20" class="title">APB 읽기 전송 + 웨이트 스테이트</text>

  <text x="200" y="40" class="cycle-num">T1</text>
  <text x="320" y="40" class="cycle-num">T2 (wait)</text>
  <text x="440" y="40" class="cycle-num">T3</text>
  <text x="560" y="40" class="cycle-num">T4</text>

  <!-- Phase highlights -->
  <rect x="140" y="42" width="120" height="180" class="setup-area"/>
  <rect x="260" y="42" width="120" height="180" class="wait-area"/>
  <rect x="380" y="42" width="120" height="180" class="access-area"/>

  <!-- PCLK -->
  <text x="105" y="65" class="sig-name">PCLK</text>
  <path d="M 110,60 L 140,60 L 140,45 L 200,45 L 200,60 L 260,60 L 260,45 L 320,45 L 320,60 L 380,60 L 380,45 L 440,45 L 440,60 L 500,60 L 500,45 L 560,45 L 560,60 L 620,60 L 620,45 L 680,45 L 680,60" class="clk-line"/>

  <!-- PSEL -->
  <text x="105" y="90" class="sig-name">PSEL</text>
  <path d="M 110,90 L 140,90 L 140,75 L 500,75 L 500,90 L 680,90" class="sig-line"/>

  <!-- PENABLE -->
  <text x="105" y="115" class="sig-name">PENABLE</text>
  <path d="M 110,115 L 260,115 L 260,100 L 500,100 L 500,115 L 680,115" class="sig-line"/>

  <!-- PWRITE -->
  <text x="105" y="140" class="sig-name">PWRITE</text>
  <path d="M 110,140 L 680,140" class="sig-line"/>
  <text x="320" y="152" class="val-text" fill="#6B7280">0 (Read)</text>

  <!-- PADDR -->
  <text x="105" y="165" class="sig-name">PADDR</text>
  <rect x="140" y="148" width="360" height="20" rx="2" fill="#EDE9FE" opacity="0.4"/>
  <path d="M 110,165 L 140,165 L 145,150 L 495,150 L 500,165 L 680,165" class="sig-line"/>
  <text x="320" y="162" class="val-text" fill="#7C3AED">Address (유지)</text>

  <!-- PREADY -->
  <text x="105" y="190" class="sig-name">PREADY</text>
  <path d="M 110,190 L 260,190 L 260,190 L 260,190 L 380,190 L 380,175 L 500,175 L 500,190 L 680,190" class="sig-line" stroke-width="2"/>
  <text x="320" y="205" class="val-text" fill="#DC2626">PREADY = 0</text>
  <text x="440" y="205" class="val-text" fill="#059669">PREADY = 1</text>

  <!-- PRDATA -->
  <text x="105" y="225" class="sig-name">PRDATA</text>
  <rect x="380" y="208" width="120" height="20" rx="2" fill="#D1FAE5" opacity="0.4"/>
  <path d="M 110,225 L 380,225 L 385,210 L 495,210 L 500,225 L 680,225" class="sig-line"/>
  <text x="440" y="222" class="val-text" fill="#059669">Read Data</text>

  <!-- Phase labels -->
  <text x="200" y="248" class="phase-label" fill="#2563EB">SETUP</text>
  <text x="320" y="248" class="phase-label" fill="#DC2626">WAIT</text>
  <text x="440" y="248" class="phase-label" fill="#059669">ACCESS</text>
</svg>