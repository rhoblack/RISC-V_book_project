<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 배경 -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- 제목 -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">
    5가지 전력 절약 기법의 효과 비교
  </text>
  <text x="600" y="55" font-size="12" text-anchor="middle" fill="#64748b">
    각 기법의 전력 개선율과 구현 복잡도
  </text>

  <!-- ===== Y축 (전력 절감율) ===== -->
  <line x1="100" y1="80" x2="100" y2="420" stroke="#1e293b" stroke-width="2"/>
  <text x="30" y="250" font-size="12" fill="#1e293b" text-anchor="middle" writing-mode="tb">
    전력 절감 (%)
  </text>

  <!-- Y축 눈금 -->
  <line x1="95" y1="420" x2="105" y2="420" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="425" font-size="11" fill="#64748b" text-anchor="end">0%</text>

  <line x1="95" y1="340" x2="105" y2="340" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="345" font-size="11" fill="#64748b" text-anchor="end">20%</text>

  <line x1="95" y1="260" x2="105" y2="260" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="265" font-size="11" fill="#64748b" text-anchor="end">40%</text>

  <line x1="95" y1="180" x2="105" y2="180" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="185" font-size="11" fill="#64748b" text-anchor="end">60%</text>

  <line x1="95" y1="100" x2="105" y2="100" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="105" font-size="11" fill="#64748b" text-anchor="end">80%</text>

  <!-- ===== X축 (기법) ===== -->
  <line x1="100" y1="420" x2="1100" y2="420" stroke="#1e293b" stroke-width="2"/>

  <!-- 그룹화: 5가지 기법, 각 200픽셀 폭 -->
  <!-- 1. DVFS (70% 절감) -->
  <rect x="130" y="148" width="140" height="272" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="4"/>
  <text x="200" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    DVFS
  </text>
  <text x="200" y="448" font-size="11" text-anchor="middle" fill="#64748b">
    동적 전압/주파수
  </text>
  <text x="200" y="128" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    70%
  </text>
  <text x="200" y="110" font-size="10" text-anchor="middle" fill="#e0e7ff">
    효과 최고
  </text>

  <!-- 2. Clock Gating (25% 절감) -->
  <rect x="310" y="330" width="140" height="90" fill="#06b6d4" stroke="#0891b2" stroke-width="2" rx="4"/>
  <text x="380" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Clock
  </text>
  <text x="380" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Gating
  </text>
  <text x="380" y="308" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    25%
  </text>
  <text x="380" y="290" font-size="10" text-anchor="middle" fill="#ecf0ff">
    구현 간단
  </text>

  <!-- 3. 메모리 선택 (15% 절감) -->
  <rect x="490" y="360" width="140" height="60" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" rx="4"/>
  <text x="560" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    메모리
  </text>
  <text x="560" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    선택
  </text>
  <text x="560" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    15%
  </text>
  <text x="560" y="320" font-size="10" text-anchor="middle" fill="#f3e8ff">
    애플리케이션 의존
  </text>

  <!-- 4. 파이프라인 (10% 절감 또는 증가) -->
  <rect x="670" y="380" width="140" height="40" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="4"/>
  <text x="740" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    파이프라인
  </text>
  <text x="740" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    깊이 조정
  </text>
  <text x="740" y="358" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    ±10%
  </text>
  <text x="740" y="340" font-size="10" text-anchor="middle" fill="#fffbeb">
    Trade-off
  </text>

  <!-- 5. 병렬화 (음수 = 증가) -->
  <rect x="850" y="400" width="140" height="20" fill="#ef4444" stroke="#991b1b" stroke-width="2" rx="4"/>
  <text x="920" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    병렬화
  </text>
  <text x="920" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e293b">
    (전력 증가)
  </text>
  <text x="920" y="388" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    -30%
  </text>
  <text x="920" y="370" font-size="10" text-anchor="middle" fill="#fee2e2">
    면적 증가
  </text>

  <!-- ===== 우측: 요약 테이블 ===== -->
  <g>
    <rect x="1020" y="120" width="170" height="300" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="4"/>

    <text x="1105" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
      선택 기준
    </text>

    <!-- 행 1: 최고 효율 -->
    <rect x="1025" y="155" width="160" height="50" fill="white" stroke="#dbeafe" stroke-width="1" rx="2"/>
    <text x="1035" y="172" font-size="10" fill="#0c4a6e" font-weight="bold">
      효율 최고
    </text>
    <text x="1035" y="188" font-size="9" fill="#64748b">
      → DVFS (70%)
    </text>
    <text x="1035" y="200" font-size="9" fill="#64748b">
      단, 구현 복잡
    </text>

    <!-- 행 2: 빠른 구현 -->
    <rect x="1025" y="210" width="160" height="50" fill="white" stroke="#dbeafe" stroke-width="1" rx="2"/>
    <text x="1035" y="227" font-size="10" fill="#0c4a6e" font-weight="bold">
      빠른 구현
    </text>
    <text x="1035" y="243" font-size="9" fill="#64748b">
      → Clock Gating (25%)
    </text>
    <text x="1035" y="255" font-size="9" fill="#64748b">
      효과/시간 최고
    </text>

    <!-- 행 3: 성능 필요 -->
    <rect x="1025" y="265" width="160" height="50" fill="white" stroke="#dbeafe" stroke-width="1" rx="2"/>
    <text x="1035" y="282" font-size="10" fill="#0c4a6e" font-weight="bold">
      성능 필요
    </text>
    <text x="1035" y="298" font-size="9" fill="#64748b">
      → 파이프라인 조정
    </text>
    <text x="1035" y="310" font-size="9" fill="#64748b">
      성능↑ vs 전력↑
    </text>
  </g>
</svg>
