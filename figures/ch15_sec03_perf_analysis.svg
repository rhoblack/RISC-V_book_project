<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <rect width="720" height="480" fill="#F8FAFC" rx="12"/>
  <text x="360" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">캐시 히트율 vs 실효 CPI</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#6B7280">실효 CPI = 기본 CPI + (1 − 히트율) × 미스 페널티 × 미스 발생 비율</text>

  <!-- 그래프 영역 -->
  <!-- axes -->
  <line x1="90" y1="380" x2="640" y2="380" stroke="#374151" stroke-width="2"/>  <!-- X축 -->
  <line x1="90" y1="380" x2="90" y2="80" stroke="#374151" stroke-width="2"/>   <!-- Y축 -->

  <!-- X축 레이블 -->
  <text x="365" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">캐시 히트율 (%)</text>
  <!-- X축 눈금 -->
  <line x1="90" y1="380" x2="90" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="400" text-anchor="middle" font-size="11" fill="#374151">0</text>
  <line x1="145" y1="380" x2="145" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="400" text-anchor="middle" font-size="11" fill="#374151">10</text>
  <line x1="200" y1="380" x2="200" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="200" y="400" text-anchor="middle" font-size="11" fill="#374151">20</text>
  <line x1="255" y1="380" x2="255" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="255" y="400" text-anchor="middle" font-size="11" fill="#374151">30</text>
  <line x1="310" y1="380" x2="310" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#374151">40</text>
  <line x1="365" y1="380" x2="365" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="365" y="400" text-anchor="middle" font-size="11" fill="#374151">50</text>
  <line x1="420" y1="380" x2="420" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="420" y="400" text-anchor="middle" font-size="11" fill="#374151">60</text>
  <line x1="475" y1="380" x2="475" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="475" y="400" text-anchor="middle" font-size="11" fill="#374151">70</text>
  <line x1="530" y1="380" x2="530" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="530" y="400" text-anchor="middle" font-size="11" fill="#374151">80</text>
  <line x1="585" y1="380" x2="585" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="585" y="400" text-anchor="middle" font-size="11" fill="#374151">90</text>
  <line x1="640" y1="380" x2="640" y2="386" stroke="#374151" stroke-width="1.5"/>
  <text x="640" y="400" text-anchor="middle" font-size="11" fill="#374151">100</text>

  <!-- Y축 레이블 -->
  <text x="28" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" transform="rotate(-90,28,230)">실효 CPI</text>
  <!-- Y축 눈금: CPI 0~5, 그래프 높이 300px, CPI 1 = 60px -->
  <!-- Y=380 → CPI=0, Y=320→CPI=1, Y=260→CPI=2, Y=200→CPI=3, Y=140→CPI=4, Y=80→CPI=5 -->
  <line x1="84" y1="380" x2="90" y2="380" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="384" text-anchor="end" font-size="11" fill="#374151">0</text>
  <line x1="84" y1="320" x2="90" y2="320" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="324" text-anchor="end" font-size="11" fill="#374151">1</text>
  <line x1="84" y1="260" x2="90" y2="260" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="264" text-anchor="end" font-size="11" fill="#374151">2</text>
  <line x1="84" y1="200" x2="90" y2="200" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="204" text-anchor="end" font-size="11" fill="#374151">3</text>
  <line x1="84" y1="140" x2="90" y2="140" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="144" text-anchor="end" font-size="11" fill="#374151">4</text>
  <line x1="84" y1="80" x2="90" y2="80" stroke="#374151" stroke-width="1.5"/>
  <text x="76" y="84" text-anchor="end" font-size="11" fill="#374151">5</text>

  <!-- 격자선 -->
  <line x1="90" y1="320" x2="640" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="260" x2="640" y2="260" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="200" x2="640" y2="200" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="140" x2="640" y2="140" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="80" x2="640" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== 곡선 계산 ======
    X: hit_rate 0~100%, pixel = 90 + hit_rate/100 * 550
    Y: CPI = 1.2 + (1-hr) * 11 * 0.30  (LW비율 30%, 미스페널티 11사이클)
       hr=0:  CPI=1.2+3.3=4.5, Y=380-4.5*60=380-270=110
       hr=10: CPI=1.2+2.97=4.17, Y=380-4.17*60=380-250=130
       hr=20: CPI=1.2+2.64=3.84, Y=380-3.84*60=380-230=150
       hr=30: CPI=1.2+2.31=3.51, Y=380-3.51*60=380-211=169
       hr=40: CPI=1.2+1.98=3.18, Y=380-3.18*60=380-191=189
       hr=50: CPI=1.2+1.65=2.85, Y=380-2.85*60=380-171=209
       hr=60: CPI=1.2+1.32=2.52, Y=380-2.52*60=380-151=229
       hr=70: CPI=1.2+0.99=2.19, Y=380-2.19*60=380-131=249
       hr=80: CPI=1.2+0.66=1.86, Y=380-1.86*60=380-112=268
       hr=90: CPI=1.2+0.33=1.53, Y=380-1.53*60=380-92=288
       hr=95: CPI=1.2+0.165=1.365, Y=380-1.365*60=380-82=298
       hr=100:CPI=1.2, Y=380-1.2*60=380-72=308
  -->

  <!-- I-Cache 포함 CPI 곡선 (미스 발생 비율 30%) -->
  <polyline
    points="90,110 145,130 200,150 255,169 310,189 365,209 420,229 475,249 530,268 585,288 613,298 640,308"
    fill="none" stroke="#2563EB" stroke-width="3"/>

  <!-- 이상적 CPI=1.2 직선 -->
  <line x1="90" y1="308" x2="640" y2="308" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="648" y="308" font-size="10" fill="#6B7280">CPI=1.2</text>

  <!-- ====== 포인트 마커 ====== -->
  <!-- 히트율 80%: X=530, CPI=1.86, Y=268 -->
  <circle cx="530" cy="268" r="7" fill="#EF4444" stroke="white" stroke-width="2"/>
  <line x1="530" y1="268" x2="530" y2="380" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="432" y="236" width="130" height="40" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="497" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#B91C1C">히트율 80%</text>
  <text x="497" y="268" text-anchor="middle" font-size="10" fill="#B91C1C">CPI ≈ 1.86</text>

  <!-- 히트율 90%: X=585, CPI=1.53, Y=288 -->
  <circle cx="585" cy="288" r="7" fill="#EF4444" stroke="white" stroke-width="2"/>
  <line x1="585" y1="288" x2="585" y2="380" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="590" y="268" width="110" height="40" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="645" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#B91C1C">히트율 90%</text>
  <text x="645" y="300" text-anchor="middle" font-size="10" fill="#B91C1C">CPI ≈ 1.53</text>

  <!-- 히트율 95%: X=613, CPI=1.365, Y=298 -->
  <circle cx="613" cy="298" r="7" fill="#EF4444" stroke="white" stroke-width="2"/>
  <rect x="495" y="310" width="110" height="40" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="550" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#B91C1C">히트율 95%</text>
  <text x="550" y="342" text-anchor="middle" font-size="10" fill="#B91C1C">CPI ≈ 1.37</text>

  <!-- 범례 -->
  <rect x="95" y="88" width="260" height="62" rx="6" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="110" y1="107" x2="145" y2="107" stroke="#2563EB" stroke-width="3"/>
  <text x="153" y="111" font-size="11" fill="#374151">실효 CPI (LW 비율 30%, 미스 페널티 11사이클)</text>
  <line x1="110" y1="130" x2="145" y2="130" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="153" y="134" font-size="11" fill="#374151">이상적 CPI = 1.2 (캐시 없는 파이프라인)</text>

  <!-- 수식 표시 -->
  <rect x="95" y="415" width="530" height="42" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="360" y="432" text-anchor="middle" font-size="12" fill="#1D4ED8">CPI_실효 = CPI_기본 + LW비율 × 미스율 × 미스_페널티</text>
  <text x="360" y="450" text-anchor="middle" font-size="12" fill="#1D4ED8">= 1.2 + 0.30 × (1 − 히트율) × 11</text>
</svg>
