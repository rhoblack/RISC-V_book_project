<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">Write-Through vs Write-Back 비교</text>

  <!-- Write-Through 영역 -->
  <rect x="30" y="50" width="400" height="420" rx="12" fill="#F0F7FF" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">Write-Through</text>

  <!-- CPU -->
  <rect x="160" y="100" width="140" height="45" rx="8" fill="#2563EB" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="230" y="128" text-anchor="middle" font-size="14" fill="white" font-weight="bold">CPU (Store)</text>

  <!-- Cache (WT) -->
  <rect x="160" y="190" width="140" height="45" rx="8" fill="#3B82F6" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="230" y="218" text-anchor="middle" font-size="14" fill="white" font-weight="bold">D-Cache</text>

  <!-- Main Memory (WT) -->
  <rect x="160" y="290" width="140" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="318" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">Main Memory</text>

  <!-- Arrows WT -->
  <line x1="230" y1="145" x2="230" y2="188" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="280" y="172" font-size="11" fill="#2563EB">Write</text>

  <line x1="230" y1="235" x2="230" y2="288" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="280" y="265" font-size="11" fill="#E11D48" font-weight="bold">동시 Write</text>

  <!-- WT 특징 -->
  <text x="60" y="380" font-size="12" fill="#1E3A5F">- 캐시 + 메모리 동시 기록</text>
  <text x="60" y="400" font-size="12" fill="#1E3A5F">- Dirty 비트 불필요</text>
  <text x="60" y="420" font-size="12" fill="#E11D48">- 매 Store마다 메모리 접근</text>
  <text x="60" y="440" font-size="12" fill="#1E3A5F">- 일관성 유지 간단</text>

  <!-- Write-Back 영역 -->
  <rect x="470" y="50" width="400" height="420" rx="12" fill="#F0F7FF" stroke="#2563EB" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">Write-Back</text>

  <!-- CPU (WB) -->
  <rect x="600" y="100" width="140" height="45" rx="8" fill="#2563EB" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="670" y="128" text-anchor="middle" font-size="14" fill="white" font-weight="bold">CPU (Store)</text>

  <!-- Cache (WB) -->
  <rect x="600" y="190" width="140" height="45" rx="8" fill="#3B82F6" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="670" y="210" text-anchor="middle" font-size="14" fill="white" font-weight="bold">D-Cache</text>
  <text x="670" y="228" text-anchor="middle" font-size="11" fill="#FDE68A">+ Dirty Bit</text>

  <!-- Main Memory (WB) -->
  <rect x="600" y="290" width="140" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="670" y="318" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">Main Memory</text>

  <!-- Arrows WB -->
  <line x1="670" y1="145" x2="670" y2="188" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="720" y="172" font-size="11" fill="#2563EB">Write</text>

  <line x1="670" y1="235" x2="670" y2="288" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow1)"/>
  <text x="720" y="265" font-size="11" fill="#059669" font-weight="bold">Eviction 시만</text>

  <!-- WB 특징 -->
  <text x="500" y="380" font-size="12" fill="#1E3A5F">- 캐시에만 기록 (지연 기록)</text>
  <text x="500" y="400" font-size="12" fill="#E11D48">- Dirty 비트 필수</text>
  <text x="500" y="420" font-size="12" fill="#059669">- 메모리 트래픽 대폭 감소</text>
  <text x="500" y="440" font-size="12" fill="#1E3A5F">- Eviction 시 Write-Back 필요</text>

  <!-- 하단 비교 화살표 -->
  <line x1="430" y1="470" x2="470" y2="470" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="450" y="490" text-anchor="middle" font-size="11" fill="#2563EB">성능 우수</text>
</svg>