<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">

  <!-- 배경 -->
  <rect width="960" height="500" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">멀티사이클(FSM) vs 파이프라인 실행 방식 비교</text>

  <!-- ============ 왼쪽: 멀티사이클 FSM ============ -->
  <text x="230" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">멀티사이클 (FSM)</text>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#64748B">한 번에 하나의 명령어만 실행 — CPI ≈ 4~5</text>

  <!-- 사이클 헤더 -->
  <text x="52" y="102" text-anchor="middle" font-size="9" fill="#475569">명령어</text>
  <!-- 사이클 번호 (C1~C12) -->
  <text x="86"  y="102" text-anchor="middle" font-size="9" fill="#475569">C1</text>
  <text x="116" y="102" text-anchor="middle" font-size="9" fill="#475569">C2</text>
  <text x="146" y="102" text-anchor="middle" font-size="9" fill="#475569">C3</text>
  <text x="176" y="102" text-anchor="middle" font-size="9" fill="#475569">C4</text>
  <text x="206" y="102" text-anchor="middle" font-size="9" fill="#475569">C5</text>
  <text x="236" y="102" text-anchor="middle" font-size="9" fill="#475569">C6</text>
  <text x="266" y="102" text-anchor="middle" font-size="9" fill="#475569">C7</text>
  <text x="296" y="102" text-anchor="middle" font-size="9" fill="#475569">C8</text>
  <text x="326" y="102" text-anchor="middle" font-size="9" fill="#475569">C9</text>
  <text x="356" y="102" text-anchor="middle" font-size="9" fill="#475569">C10</text>
  <text x="389" y="102" text-anchor="middle" font-size="9" fill="#475569">C11</text>
  <text x="422" y="102" text-anchor="middle" font-size="9" fill="#475569">C12</text>

  <!-- Instr A: C1~C5 (5사이클) -->
  <text x="52" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Instr A</text>
  <rect x="71" y="110" width="30" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="86" y="125" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="101" y="110" width="30" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="116" y="125" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="131" y="110" width="30" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="146" y="125" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="161" y="110" width="30" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="176" y="125" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="191" y="110" width="30" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="206" y="125" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- Instr B: C6~C10 (5사이클) -->
  <text x="52" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Instr B</text>
  <rect x="221" y="140" width="30" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="236" y="155" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="251" y="140" width="30" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="266" y="155" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="281" y="140" width="30" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="296" y="155" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="311" y="140" width="30" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="326" y="155" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="341" y="140" width="30" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="356" y="155" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- Instr C: C11~C12 부분 표시 (점선) -->
  <text x="52" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Instr C</text>
  <rect x="371" y="170" width="30" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD" stroke-dasharray="3,2"/>
  <text x="386" y="185" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="404" y="170" width="30" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7" stroke-dasharray="3,2"/>
  <text x="419" y="185" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <text x="445" y="185" text-anchor="middle" font-size="10" fill="#64748B">…</text>

  <!-- 시간 화살표 -->
  <line x1="65" y1="205" x2="440" y2="205" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="250" y="218" text-anchor="middle" font-size="9" fill="#64748B">12사이클 경과 → 2.4개 명령어 완료</text>

  <!-- ============ 오른쪽: 파이프라인 ============ -->
  <text x="710" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">파이프라인</text>
  <text x="710" y="78" text-anchor="middle" font-size="10" fill="#64748B">매 사이클 새 명령어 진입 — 이상적 CPI = 1</text>

  <!-- 사이클 헤더 -->
  <text x="522" y="102" text-anchor="middle" font-size="9" fill="#475569">명령어</text>
  <text x="560" y="102" text-anchor="middle" font-size="9" fill="#475569">C1</text>
  <text x="595" y="102" text-anchor="middle" font-size="9" fill="#475569">C2</text>
  <text x="630" y="102" text-anchor="middle" font-size="9" fill="#475569">C3</text>
  <text x="665" y="102" text-anchor="middle" font-size="9" fill="#475569">C4</text>
  <text x="700" y="102" text-anchor="middle" font-size="9" fill="#475569">C5</text>
  <text x="735" y="102" text-anchor="middle" font-size="9" fill="#475569">C6</text>
  <text x="770" y="102" text-anchor="middle" font-size="9" fill="#475569">C7</text>
  <text x="805" y="102" text-anchor="middle" font-size="9" fill="#475569">C8</text>
  <text x="840" y="102" text-anchor="middle" font-size="9" fill="#475569">C9</text>

  <!-- I1 -->
  <text x="522" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">I1</text>
  <rect x="543" y="110" width="32" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="559" y="125" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="578" y="110" width="32" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="594" y="125" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="613" y="110" width="32" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="629" y="125" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="648" y="110" width="32" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="664" y="125" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="683" y="110" width="32" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="699" y="125" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- I2 -->
  <text x="522" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">I2</text>
  <rect x="578" y="140" width="32" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="594" y="155" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="613" y="140" width="32" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="629" y="155" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="648" y="140" width="32" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="664" y="155" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="683" y="140" width="32" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="699" y="155" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="718" y="140" width="32" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="734" y="155" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- I3 -->
  <text x="522" y="184" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">I3</text>
  <rect x="613" y="170" width="32" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="629" y="185" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="648" y="170" width="32" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="664" y="185" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="683" y="170" width="32" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="699" y="185" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="718" y="170" width="32" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="734" y="185" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="753" y="170" width="32" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="769" y="185" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- I4 -->
  <text x="522" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">I4</text>
  <rect x="648" y="200" width="32" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="664" y="215" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="683" y="200" width="32" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="699" y="215" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="718" y="200" width="32" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="734" y="215" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="753" y="200" width="32" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="769" y="215" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="788" y="200" width="32" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="804" y="215" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- I5 -->
  <text x="522" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">I5</text>
  <rect x="683" y="230" width="32" height="22" fill="#DBEAFE" rx="3" stroke="#93C5FD"/>
  <text x="699" y="245" text-anchor="middle" font-size="8" fill="#1E40AF">IF</text>
  <rect x="718" y="230" width="32" height="22" fill="#BBF7D0" rx="3" stroke="#6EE7B7"/>
  <text x="734" y="245" text-anchor="middle" font-size="8" fill="#065F46">ID</text>
  <rect x="753" y="230" width="32" height="22" fill="#FEF3C7" rx="3" stroke="#FCD34D"/>
  <text x="769" y="245" text-anchor="middle" font-size="8" fill="#78350F">EX</text>
  <rect x="788" y="230" width="32" height="22" fill="#FCE7F3" rx="3" stroke="#F9A8D4"/>
  <text x="804" y="245" text-anchor="middle" font-size="8" fill="#831843">MEM</text>
  <rect x="823" y="230" width="32" height="22" fill="#F3E8FF" rx="3" stroke="#C4B5FD"/>
  <text x="839" y="245" text-anchor="middle" font-size="8" fill="#4C1D95">WB</text>

  <!-- Steady-state 강조 박스 (C5 열) -->
  <rect x="683" y="106" width="32" height="150" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
  <text x="699" y="268" text-anchor="middle" font-size="8" font-weight="bold" fill="#D97706">Steady</text>
  <text x="699" y="278" text-anchor="middle" font-size="8" font-weight="bold" fill="#D97706">state</text>

  <!-- 시간 화살표 -->
  <line x1="535" y1="265" x2="870" y2="265" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="700" y="278" text-anchor="middle" font-size="9" fill="#64748B">9사이클 경과 → 5개 명령어 완료 (C5부터 매 사이클 1개)</text>

  <!-- ============ 구분선 ============ -->
  <line x1="480" y1="50" x2="480" y2="295" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============ 하단: 범례 ============ -->
  <rect x="60" y="310" width="840" height="58" fill="#F1F5F9" rx="6" stroke="#E2E8F0"/>
  <text x="480" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">스테이지 색상 범례</text>
  <rect x="130" y="336" width="22" height="14" fill="#DBEAFE" rx="2" stroke="#93C5FD"/>
  <text x="158" y="347" font-size="9" fill="#1E293B">IF — 명령어 인출(Instruction Fetch)</text>
  <rect x="310" y="336" width="22" height="14" fill="#BBF7D0" rx="2" stroke="#6EE7B7"/>
  <text x="338" y="347" font-size="9" fill="#1E293B">ID — 명령어 해석(Instruction Decode)</text>
  <rect x="530" y="336" width="22" height="14" fill="#FEF3C7" rx="2" stroke="#FCD34D"/>
  <text x="558" y="347" font-size="9" fill="#1E293B">EX — 실행(Execute)</text>
  <rect x="130" y="354" width="22" height="14" fill="#FCE7F3" rx="2" stroke="#F9A8D4"/>
  <text x="158" y="365" font-size="9" fill="#1E293B">MEM — 메모리 접근(Memory Access)</text>
  <rect x="410" y="354" width="22" height="14" fill="#F3E8FF" rx="2" stroke="#C4B5FD"/>
  <text x="438" y="365" font-size="9" fill="#1E293B">WB — 결과 저장(Write-Back)</text>

  <!-- ============ 성능 비교 ============ -->
  <rect x="60" y="380" width="840" height="100" fill="#EFF6FF" rx="6" stroke="#BFDBFE"/>
  <text x="480" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">성능 비교 요약</text>

  <!-- 멀티사이클 -->
  <rect x="80" y="410" width="360" height="58" fill="white" rx="4" stroke="#BFDBFE"/>
  <text x="260" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D4ED8">멀티사이클 FSM</text>
  <text x="260" y="444" text-anchor="middle" font-size="9" fill="#374151">CPI ≈ 4.1 | Fmax ≈ 50 MHz</text>
  <text x="260" y="458" text-anchor="middle" font-size="9" fill="#374151">처리량 ≈ 12.2 MIPS (50 / 4.1)</text>

  <!-- 파이프라인 -->
  <rect x="520" y="410" width="360" height="58" fill="white" rx="4" stroke="#BFDBFE"/>
  <text x="700" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D4ED8">파이프라인 (목표)</text>
  <text x="700" y="444" text-anchor="middle" font-size="9" fill="#374151">CPI ≈ 1.0 | Fmax ≈ 100 MHz</text>
  <text x="700" y="458" text-anchor="middle" font-size="9" fill="#374151">처리량 ≈ 100 MIPS (8× 향상)</text>

  <!-- 화살표 정의 -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>
</svg>
