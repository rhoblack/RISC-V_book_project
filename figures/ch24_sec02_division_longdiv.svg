<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="520" viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif">
  <rect width="780" height="520" fill="#F8FAFC" rx="8"/>
  <text x="390" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Restoring Division 하드웨어 동작</text>
  <text x="390" y="44" text-anchor="middle" font-size="11" fill="#64748B">예제: 13 ÷ 3 (이진: 1101 ÷ 11) — 4비트 축소 버전</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 하드웨어 블록도 (왼쪽) -->
  <g transform="translate(30, 60)">
    <text x="150" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">하드웨어 구조</text>

    <!-- Remainder 레지스터 -->
    <rect x="20" y="20" width="260" height="40" rx="6" fill="#2563EB"/>
    <text x="150" y="45" text-anchor="middle" font-size="10" fill="white" font-weight="600">Remainder (나머지) — N+1비트</text>

    <!-- 좌시프트 화살표 -->
    <path d="M280,40 Q300,40 300,70 Q300,100 280,100" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <text x="315" y="75" font-size="9" fill="#2563EB">좌시프트</text>

    <!-- 뺄셈기 -->
    <rect x="60" y="80" width="180" height="35" rx="6" fill="#3B82F6"/>
    <text x="150" y="102" text-anchor="middle" font-size="10" fill="white" font-weight="600">뺄셈기: R - Divisor</text>

    <!-- Divisor -->
    <rect x="60" y="130" width="180" height="30" rx="6" fill="#60A5FA"/>
    <text x="150" y="150" text-anchor="middle" font-size="10" fill="white" font-weight="600">Divisor (제수) — 고정</text>

    <!-- 판정 -->
    <polygon points="150,180 190,210 150,240 110,210" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="150" y="213" text-anchor="middle" font-size="9" fill="#1E40AF" font-weight="600">R ≥ 0?</text>

    <!-- Yes 경로 -->
    <line x1="190" y1="210" x2="260" y2="210" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="225" y="200" font-size="9" fill="#059669" font-weight="600">Yes</text>
    <rect x="260" y="195" width="40" height="30" rx="4" fill="#059669"/>
    <text x="280" y="215" text-anchor="middle" font-size="10" fill="white" font-weight="700">Q=1</text>

    <!-- No 경로 -->
    <line x1="110" y1="210" x2="40" y2="210" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="0" y="195" width="40" height="30" rx="4" fill="#DC2626"/>
    <text x="20" y="215" text-anchor="middle" font-size="10" fill="white" font-weight="700">Q=0</text>
    <text x="20" y="240" font-size="8" fill="#DC2626">복원(Restore)</text>

    <!-- Quotient -->
    <rect x="60" y="270" width="180" height="35" rx="6" fill="#1E40AF"/>
    <text x="150" y="292" text-anchor="middle" font-size="10" fill="white" font-weight="600">Quotient (몫) — 좌시프트 삽입</text>

    <!-- 반복 -->
    <text x="150" y="330" text-anchor="middle" font-size="10" fill="#1E40AF" font-weight="600">N번 반복 (32비트 → 32회)</text>
  </g>

  <!-- 수동 추적 (오른쪽) -->
  <g transform="translate(380, 60)">
    <text x="190" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">수동 추적: 1101₂ ÷ 11₂ (13 ÷ 3)</text>

    <!-- 테이블 헤더 -->
    <rect x="0" y="15" width="380" height="25" rx="4" fill="#2563EB"/>
    <text x="30" y="32" text-anchor="middle" font-size="9" fill="white" font-weight="600">단계</text>
    <text x="110" y="32" text-anchor="middle" font-size="9" fill="white" font-weight="600">나머지(시프트)</text>
    <text x="210" y="32" text-anchor="middle" font-size="9" fill="white" font-weight="600">R - D</text>
    <text x="290" y="32" text-anchor="middle" font-size="9" fill="white" font-weight="600">R≥0?</text>
    <text x="350" y="32" text-anchor="middle" font-size="9" fill="white" font-weight="600">Q비트</text>

    <!-- 초기 상태 -->
    <rect x="0" y="42" width="380" height="22" rx="0" fill="#EFF6FF"/>
    <text x="30" y="57" text-anchor="middle" font-size="9" fill="#1E293B">초기</text>
    <text x="110" y="57" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">R=00000, D=011</text>
    <text x="210" y="57" text-anchor="middle" font-size="9" fill="#64748B">—</text>
    <text x="290" y="57" text-anchor="middle" font-size="9" fill="#64748B">—</text>
    <text x="350" y="57" text-anchor="middle" font-size="9" fill="#64748B">—</text>

    <!-- Step 1 -->
    <rect x="0" y="66" width="380" height="22" rx="0" fill="white"/>
    <text x="30" y="81" text-anchor="middle" font-size="9" fill="#1E293B">1</text>
    <text x="110" y="81" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00001</text>
    <text x="210" y="81" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00001-011 = -</text>
    <text x="290" y="81" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">No</text>
    <text x="350" y="81" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="700">0</text>

    <!-- Step 2 -->
    <rect x="0" y="90" width="380" height="22" rx="0" fill="#EFF6FF"/>
    <text x="30" y="105" text-anchor="middle" font-size="9" fill="#1E293B">2</text>
    <text x="110" y="105" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00011</text>
    <text x="210" y="105" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00011-011 = 000</text>
    <text x="290" y="105" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">Yes</text>
    <text x="350" y="105" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">1</text>

    <!-- Step 3 -->
    <rect x="0" y="114" width="380" height="22" rx="0" fill="white"/>
    <text x="30" y="129" text-anchor="middle" font-size="9" fill="#1E293B">3</text>
    <text x="110" y="129" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00000</text>
    <text x="210" y="129" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00000-011 = -</text>
    <text x="290" y="129" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">No</text>
    <text x="350" y="129" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="700">0</text>

    <!-- Step 4 -->
    <rect x="0" y="138" width="380" height="22" rx="0" fill="#EFF6FF"/>
    <text x="30" y="153" text-anchor="middle" font-size="9" fill="#1E293B">4</text>
    <text x="110" y="153" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00001</text>
    <text x="210" y="153" text-anchor="middle" font-size="9" fill="#1E293B" font-family="monospace">00001-011 = -</text>
    <text x="290" y="153" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">No</text>
    <text x="350" y="153" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="700">0</text>

    <!-- 결과 -->
    <rect x="0" y="170" width="380" height="35" rx="6" fill="#DCFCE7" stroke="#059669" stroke-width="1"/>
    <text x="190" y="185" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">결과: Q = 0100₂ = 4, R = 00001₂ = 1</text>
    <text x="190" y="200" text-anchor="middle" font-size="9" fill="#059669">검증: 3 × 4 + 1 = 13 ✓</text>

    <!-- FSM 상태 다이어그램 -->
    <text x="190" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">나눗셈 FSM 상태 전이</text>

    <!-- IDLE -->
    <circle cx="50" cy="280" r="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="50" y="284" text-anchor="middle" font-size="9" fill="#1E40AF" font-weight="600">IDLE</text>

    <!-- INIT -->
    <circle cx="150" cy="280" r="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="150" y="284" text-anchor="middle" font-size="9" fill="#1E40AF" font-weight="600">INIT</text>

    <!-- COMPUTE -->
    <circle cx="250" cy="280" r="28" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
    <text x="250" y="284" text-anchor="middle" font-size="9" fill="white" font-weight="600">COMP</text>

    <!-- SIGN_ADJ -->
    <circle cx="330" cy="340" r="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="330" y="337" text-anchor="middle" font-size="8" fill="#1E40AF" font-weight="600">SIGN</text>
    <text x="330" y="348" text-anchor="middle" font-size="8" fill="#1E40AF" font-weight="600">ADJ</text>

    <!-- DONE -->
    <circle cx="170" cy="380" r="28" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
    <text x="170" y="384" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">DONE</text>

    <!-- 전이 화살표 -->
    <line x1="78" y1="280" x2="118" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="98" y="272" text-anchor="middle" font-size="7" fill="#64748B">start</text>

    <line x1="178" y1="280" x2="218" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- COMPUTE 자기루프 -->
    <path d="M260,252 Q280,230 240,252" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="270" y="238" font-size="7" fill="#64748B">cnt&lt;31</text>

    <line x1="270" y1="300" x2="308" y2="325" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="278" y="318" font-size="7" fill="#64748B">signed</text>

    <line x1="305" y1="358" x2="202" y2="378" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

    <line x1="258" y1="306" x2="195" y2="358" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="210" y="338" font-size="7" fill="#059669">unsigned</text>

    <line x1="142" y1="380" x2="70" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- 성능 요약 -->
  <rect x="30" y="460" width="720" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="390" y="478" text-anchor="middle" font-size="10" fill="#92400E" font-weight="600">핵심: 곱셈은 병렬화 가능(1~3사이클) → 나눗셈은 순차적(32사이클) → 나눗셈이 병목</text>
  <text x="390" y="493" text-anchor="middle" font-size="9" fill="#92400E">실제 프로그램에서 나눗셈 비율은 1~3%이므로, 전체 성능 영향은 제한적입니다.</text>
</svg>
