<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="525" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">파이프라인 타이밍 다이어그램 — 읽기 가이드</text>

  <!-- 축 설명 박스 -->
  <rect x="20" y="42" width="1010" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="35" y="63" font-size="12" fill="#2563EB" font-weight="bold">가로축 = 클록 사이클 (시간 흐름)</text>
  <text x="400" y="63" font-size="12" fill="#2563EB" font-weight="bold">세로축 = 명령어 순서 (프로그램 순서)</text>
  <text x="750" y="63" font-size="12" fill="#2563EB" font-weight="bold">각 칸 = 해당 사이클에 수행하는 스테이지</text>

  <!-- 그리드 배경 -->
  <rect x="130" y="90" width="880" height="310" fill="white" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 세로선 (사이클 구분) -->
  <line x1="218" y1="90" x2="218" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="306" y1="90" x2="306" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="394" y1="90" x2="394" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="482" y1="90" x2="482" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="570" y1="90" x2="570" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="658" y1="90" x2="658" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="746" y1="90" x2="746" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="834" y1="90" x2="834" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="922" y1="90" x2="922" y2="400" stroke="#E5E7EB" stroke-width="0.8"/>

  <!-- 가로선 (명령어 구분) -->
  <line x1="130" y1="152" x2="1010" y2="152" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="130" y1="214" x2="1010" y2="214" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="130" y1="276" x2="1010" y2="276" stroke="#E5E7EB" stroke-width="0.8"/>
  <line x1="130" y1="338" x2="1010" y2="338" stroke="#E5E7EB" stroke-width="0.8"/>

  <!-- 사이클 번호 (가로축) -->
  <text x="174" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC1</text>
  <text x="262" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC2</text>
  <text x="350" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC3</text>
  <text x="438" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC4</text>
  <text x="526" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC5</text>
  <text x="614" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC6</text>
  <text x="702" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC7</text>
  <text x="790" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC8</text>
  <text x="878" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC9</text>
  <text x="966" y="108" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="bold">CC10</text>

  <!-- 명령어 라벨 (세로축) -->
  <text x="80" y="140" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">add x1,x2,x3</text>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">sub x4,x5,x6</text>
  <text x="80" y="260" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">and x7,x8,x9</text>
  <text x="80" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">or x10,x11,x12</text>
  <text x="80" y="380" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">xor x13,x14,x15</text>

  <!-- 스테이지 색상 정의 -->
  <!-- IF=#2563EB, ID=#3B82F6, EX=#60A5FA, MEM=#93C5FD, WB=#DBEAFE -->

  <!-- I1: add -->
  <rect x="132" y="118" width="84" height="32" rx="4" fill="#2563EB"/>
  <text x="174" y="139" text-anchor="middle" font-size="12" fill="white" font-weight="bold">IF</text>
  <rect x="220" y="118" width="84" height="32" rx="4" fill="#3B82F6"/>
  <text x="262" y="139" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ID</text>
  <rect x="308" y="118" width="84" height="32" rx="4" fill="#60A5FA"/>
  <text x="350" y="139" text-anchor="middle" font-size="12" fill="white" font-weight="bold">EX</text>
  <rect x="396" y="118" width="84" height="32" rx="4" fill="#93C5FD"/>
  <text x="438" y="139" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="484" y="118" width="84" height="32" rx="4" fill="#DBEAFE"/>
  <text x="526" y="139" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I2: sub -->
  <rect x="220" y="180" width="84" height="32" rx="4" fill="#2563EB"/>
  <text x="262" y="201" text-anchor="middle" font-size="12" fill="white" font-weight="bold">IF</text>
  <rect x="308" y="180" width="84" height="32" rx="4" fill="#3B82F6"/>
  <text x="350" y="201" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ID</text>
  <rect x="396" y="180" width="84" height="32" rx="4" fill="#60A5FA"/>
  <text x="438" y="201" text-anchor="middle" font-size="12" fill="white" font-weight="bold">EX</text>
  <rect x="484" y="180" width="84" height="32" rx="4" fill="#93C5FD"/>
  <text x="526" y="201" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="572" y="180" width="84" height="32" rx="4" fill="#DBEAFE"/>
  <text x="614" y="201" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I3: and -->
  <rect x="308" y="242" width="84" height="32" rx="4" fill="#2563EB"/>
  <text x="350" y="263" text-anchor="middle" font-size="12" fill="white" font-weight="bold">IF</text>
  <rect x="396" y="242" width="84" height="32" rx="4" fill="#3B82F6"/>
  <text x="438" y="263" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ID</text>
  <rect x="484" y="242" width="84" height="32" rx="4" fill="#60A5FA"/>
  <text x="526" y="263" text-anchor="middle" font-size="12" fill="white" font-weight="bold">EX</text>
  <rect x="572" y="242" width="84" height="32" rx="4" fill="#93C5FD"/>
  <text x="614" y="263" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="660" y="242" width="84" height="32" rx="4" fill="#DBEAFE"/>
  <text x="702" y="263" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I4: or -->
  <rect x="396" y="304" width="84" height="32" rx="4" fill="#2563EB"/>
  <text x="438" y="325" text-anchor="middle" font-size="12" fill="white" font-weight="bold">IF</text>
  <rect x="484" y="304" width="84" height="32" rx="4" fill="#3B82F6"/>
  <text x="526" y="325" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ID</text>
  <rect x="572" y="304" width="84" height="32" rx="4" fill="#60A5FA"/>
  <text x="614" y="325" text-anchor="middle" font-size="12" fill="white" font-weight="bold">EX</text>
  <rect x="660" y="304" width="84" height="32" rx="4" fill="#93C5FD"/>
  <text x="702" y="325" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="748" y="304" width="84" height="32" rx="4" fill="#DBEAFE"/>
  <text x="790" y="325" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold">WB</text>

  <!-- I5: xor -->
  <rect x="484" y="366" width="84" height="32" rx="4" fill="#2563EB"/>
  <text x="526" y="387" text-anchor="middle" font-size="12" fill="white" font-weight="bold">IF</text>
  <rect x="572" y="366" width="84" height="32" rx="4" fill="#3B82F6"/>
  <text x="614" y="387" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ID</text>
  <rect x="660" y="366" width="84" height="32" rx="4" fill="#60A5FA"/>
  <text x="702" y="387" text-anchor="middle" font-size="12" fill="white" font-weight="bold">EX</text>
  <rect x="748" y="366" width="84" height="32" rx="4" fill="#93C5FD"/>
  <text x="790" y="387" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">MEM</text>
  <rect x="836" y="366" width="84" height="32" rx="4" fill="#DBEAFE"/>
  <text x="878" y="387" text-anchor="middle" font-size="12" fill="#2563EB" font-weight="bold">WB</text>

  <!-- 범례 -->
  <rect x="20" y="420" width="1010" height="90" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="35" y="445" font-size="12" font-weight="bold" fill="#D97706">다이어그램 읽기 가이드</text>
  <rect x="35" y="455" width="30" height="14" rx="2" fill="#2563EB"/>
  <text x="72" y="467" font-size="11" fill="#1F2937">IF: 명령어 인출</text>
  <rect x="185" y="455" width="30" height="14" rx="2" fill="#3B82F6"/>
  <text x="222" y="467" font-size="11" fill="#1F2937">ID: 해독/레지스터 읽기</text>
  <rect x="375" y="455" width="30" height="14" rx="2" fill="#60A5FA"/>
  <text x="412" y="467" font-size="11" fill="#1F2937">EX: 연산 실행</text>
  <rect x="525" y="455" width="30" height="14" rx="2" fill="#93C5FD"/>
  <text x="562" y="467" font-size="11" fill="#1F2937">MEM: 메모리 접근</text>
  <rect x="695" y="455" width="30" height="14" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.5"/>
  <text x="732" y="467" font-size="11" fill="#1F2937">WB: 결과 기록</text>

  <text x="35" y="497" font-size="11" fill="#1F2937">&#x2022; 가로로 읽으면: 한 명령어의 수명(5사이클 지연)을 추적할 수 있습니다.</text>
  <text x="530" y="497" font-size="11" fill="#1F2937">&#x2022; 세로로 읽으면: 한 사이클에 동시 실행 중인 스테이지를 확인할 수 있습니다.</text>
</svg>