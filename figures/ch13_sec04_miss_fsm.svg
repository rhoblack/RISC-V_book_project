<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Pretendard, sans-serif">
  <rect width="820" height="480" fill="#F8FAFC" rx="12"/>
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">캐시 미스 FSM (Cache Miss Finite State Machine)</text>

  <defs>
    <marker id="arFSM" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arFSMr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#EF4444"/>
    </marker>
    <marker id="arFSMg" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- IDLE 상태 -->
  <circle cx="160" cy="200" r="65" fill="white" stroke="#10B981" stroke-width="3"/>
  <circle cx="160" cy="200" r="57" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="160" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">IDLE</text>
  <text x="160" y="210" text-anchor="middle" font-size="10" fill="#065F46">2'b00</text>
  <text x="160" y="228" text-anchor="middle" font-size="10" fill="#374151">stall=0</text>
  <text x="160" y="242" text-anchor="middle" font-size="10" fill="#374151">mem_req=0</text>

  <!-- MISS 상태 -->
  <circle cx="420" cy="140" r="65" fill="white" stroke="#EF4444" stroke-width="3"/>
  <circle cx="420" cy="140" r="57" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="420" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#991B1B">MISS</text>
  <text x="420" y="150" text-anchor="middle" font-size="10" fill="#991B1B">2'b01</text>
  <text x="420" y="168" text-anchor="middle" font-size="10" fill="#374151">stall=1</text>
  <text x="420" y="182" text-anchor="middle" font-size="10" fill="#374151">mem_req=1</text>

  <!-- FILL 상태 -->
  <circle cx="420" cy="330" r="65" fill="white" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="420" cy="330" r="57" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="420" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">FILL</text>
  <text x="420" y="340" text-anchor="middle" font-size="10" fill="#92400E">2'b10</text>
  <text x="420" y="358" text-anchor="middle" font-size="10" fill="#374151">stall=1</text>
  <text x="420" y="372" text-anchor="middle" font-size="10" fill="#374151">mem_req=0</text>

  <!-- DONE 상태 -->
  <circle cx="660" cy="235" r="65" fill="white" stroke="#2563EB" stroke-width="3"/>
  <circle cx="660" cy="235" r="57" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="660" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">DONE</text>
  <text x="660" y="245" text-anchor="middle" font-size="10" fill="#1D4ED8">2'b11</text>
  <text x="660" y="263" text-anchor="middle" font-size="10" fill="#374151">stall=0</text>
  <text x="660" y="277" text-anchor="middle" font-size="10" fill="#374151">mem_req=0</text>

  <!-- 전환: IDLE → MISS -->
  <path d="M220,168 Q320,120 356,140" stroke="#EF4444" stroke-width="2.5" fill="none" marker-end="url(#arFSMr)"/>
  <text x="285" y="128" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="600">cpu_req &amp;&amp; !cache_hit</text>

  <!-- 자기 전환: IDLE → IDLE (히트 시) -->
  <path d="M103,148 Q60,90 117,152" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arFSMg)"/>
  <text x="52" y="110" text-anchor="middle" font-size="10" fill="#10B981">cache_hit</text>
  <text x="52" y="123" text-anchor="middle" font-size="10" fill="#10B981">또는</text>
  <text x="52" y="136" text-anchor="middle" font-size="10" fill="#10B981">!cpu_req</text>

  <!-- 전환: MISS → FILL -->
  <path d="M420,207 L420,263" stroke="#F59E0B" stroke-width="2.5" fill="none" marker-end="url(#arFSMr)"/>
  <text x="450" y="240" font-size="10" fill="#F59E0B" font-weight="600">mem_ready</text>

  <!-- 전환: FILL → DONE -->
  <path d="M478,308 Q570,270 598,242" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arFSM)"/>
  <text x="555" y="272" text-anchor="middle" font-size="10" fill="#2563EB" font-weight="600">fill_cnt==7</text>
  <text x="555" y="285" text-anchor="middle" font-size="10" fill="#2563EB">(8워드 완료)</text>

  <!-- 전환: DONE → IDLE -->
  <path d="M600,210 Q420,130 222,185" stroke="#10B981" stroke-width="2.5" fill="none" marker-end="url(#arFSMg)"/>
  <text x="400" y="155" text-anchor="middle" font-size="10" fill="#10B981" font-weight="600">항상</text>

  <!-- fill_cnt 설명 박스 -->
  <rect x="30" y="390" width="360" height="70" fill="white" rx="8" stroke="#F59E0B" stroke-width="2"/>
  <text x="210" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">fill_cnt (3비트 카운터)</text>
  <text x="210" y="432" text-anchor="middle" font-size="11" fill="#374151">FILL 상태에서 0→7 증가</text>
  <text x="210" y="450" text-anchor="middle" font-size="11" fill="#374151">8워드(32바이트) 블록 채움 완료 시 DONE 진입</text>

  <!-- icache_stall 설명 박스 -->
  <rect x="410" y="390" width="380" height="70" fill="white" rx="8" stroke="#EF4444" stroke-width="2"/>
  <text x="600" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">icache_stall 신호</text>
  <text x="600" y="432" text-anchor="middle" font-size="11" fill="#374151">icache_stall = (state == MISS) || (state == FILL)</text>
  <text x="600" y="450" text-anchor="middle" font-size="11" fill="#374151">MISS+FILL 구간(최대 5사이클) 동안 파이프라인 홀드</text>
</svg>
