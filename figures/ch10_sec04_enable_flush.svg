<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="525" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">파이프라인 제어 신호: Enable / Flush 동작 원리</text>

  <!-- 파이프라인 흐름 -->
  <rect x="60" y="70" width="100" height="50" rx="8" fill="#2563EB"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" fill="white" font-weight="bold">PC</text>

  <rect x="200" y="55" width="25" height="80" rx="3" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="212" y="95" text-anchor="middle" font-size="8" fill="#6B7280" writing-mode="tb">IF/ID</text>

  <rect x="265" y="70" width="100" height="50" rx="8" fill="#3B82F6"/>
  <text x="315" y="100" text-anchor="middle" font-size="13" fill="white" font-weight="bold">ID</text>

  <rect x="405" y="55" width="25" height="80" rx="3" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="417" y="95" text-anchor="middle" font-size="8" fill="#6B7280" writing-mode="tb">ID/EX</text>

  <rect x="470" y="70" width="100" height="50" rx="8" fill="#60A5FA"/>
  <text x="520" y="100" text-anchor="middle" font-size="13" fill="white" font-weight="bold">EX</text>

  <rect x="610" y="55" width="25" height="80" rx="3" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="622" y="95" text-anchor="middle" font-size="8" fill="#6B7280" writing-mode="tb">EX/MEM</text>

  <rect x="675" y="70" width="100" height="50" rx="8" fill="#93C5FD"/>
  <text x="725" y="100" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">MEM</text>

  <rect x="815" y="55" width="25" height="80" rx="3" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="827" y="95" text-anchor="middle" font-size="8" fill="#6B7280" writing-mode="tb">MEM/WB</text>

  <rect x="880" y="70" width="100" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="930" y="100" text-anchor="middle" font-size="13" fill="#2563EB" font-weight="bold">WB</text>

  <!-- 화살표 연결 -->
  <line x1="160" y1="95" x2="200" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="95" x2="265" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="365" y1="95" x2="405" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="95" x2="470" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="95" x2="610" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="635" y1="95" x2="675" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="95" x2="815" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="840" y1="95" x2="880" y2="95" stroke="#1F2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PC_en 신호 -->
  <line x1="110" y1="140" x2="110" y2="165" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="55" y="165" width="110" height="28" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="110" y="184" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">PC_en</text>

  <!-- IF/ID_en 신호 -->
  <line x1="212" y1="140" x2="212" y2="165" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="155" y="165" width="115" height="28" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="212" y="184" text-anchor="middle" font-size="11" fill="#2563EB" font-weight="bold">IF/ID_en</text>

  <!-- ID/EX_flush 신호 -->
  <line x1="417" y1="140" x2="417" y2="165" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="360" y="165" width="115" height="28" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="417" y="184" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">ID/EX_flush</text>

  <!-- 해저드 감지 유닛 -->
  <rect x="150" y="220" width="340" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="320" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97706">해저드 감지 유닛 (Hazard Detection Unit)</text>
  <text x="320" y="268" text-anchor="middle" font-size="10" fill="#D97706">Load-Use 해저드 감지 시 스톨 신호 생성</text>

  <!-- 해저드 유닛 → 제어 신호 -->
  <line x1="200" y1="220" x2="110" y2="193" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="220" x2="212" y2="193" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="420" y1="220" x2="417" y2="193" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== 동작 설명 테이블 ===== -->
  <rect x="20" y="305" width="1010" height="200" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="335" font-size="14" font-weight="bold" fill="#1F2937">제어 신호 동작 요약</text>

  <!-- 테이블 헤더 -->
  <rect x="40" y="345" width="200" height="30" rx="4" fill="#2563EB"/>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="white" font-weight="bold">상황</text>
  <rect x="240" y="345" width="150" height="30" rx="4" fill="#2563EB"/>
  <text x="315" y="365" text-anchor="middle" font-size="11" fill="white" font-weight="bold">PC_en</text>
  <rect x="390" y="345" width="150" height="30" rx="4" fill="#2563EB"/>
  <text x="465" y="365" text-anchor="middle" font-size="11" fill="white" font-weight="bold">IF/ID_en</text>
  <rect x="540" y="345" width="150" height="30" rx="4" fill="#2563EB"/>
  <text x="615" y="365" text-anchor="middle" font-size="11" fill="white" font-weight="bold">ID/EX_flush</text>
  <rect x="690" y="345" width="320" height="30" rx="4" fill="#2563EB"/>
  <text x="850" y="365" text-anchor="middle" font-size="11" fill="white" font-weight="bold">효과</text>

  <!-- 정상 동작 -->
  <text x="140" y="400" text-anchor="middle" font-size="11" fill="#1F2937">정상 실행</text>
  <text x="315" y="400" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">1</text>
  <text x="465" y="400" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">1</text>
  <text x="615" y="400" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">0</text>
  <text x="850" y="400" text-anchor="middle" font-size="11" fill="#1F2937">파이프라인 정상 진행</text>

  <!-- 스톨 -->
  <text x="140" y="430" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">Load-Use 스톨</text>
  <text x="315" y="430" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">0</text>
  <text x="465" y="430" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">0</text>
  <text x="615" y="430" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="bold">1</text>
  <text x="850" y="430" text-anchor="middle" font-size="11" fill="#1F2937">PC/IF/ID 동결 + EX에 버블 삽입</text>

  <!-- 구분선 -->
  <line x1="40" y1="380" x2="1010" y2="380" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="40" y1="415" x2="1010" y2="415" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 핵심 규칙 -->
  <rect x="40" y="455" width="970" height="35" rx="4" fill="#FEE2E2"/>
  <text x="525" y="478" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="bold">핵심 규칙: Enable과 Flush가 동시에 인가될 경우 Flush가 우선합니다. (Flush 신호는 Enable보다 상위 우선순위)</text>
</svg>