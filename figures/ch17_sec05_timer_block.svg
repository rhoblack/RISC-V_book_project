<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arr5r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#FFFFFF" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">타이머/카운터 블록 다이어그램</text>

  <!-- APB side -->
  <rect x="30" y="70" width="110" height="180" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="85" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">APB</text>
  <text x="85" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">인터페이스</text>
  <text x="85" y="140" text-anchor="middle" font-size="10" fill="#1F2937">PADDR[3:0]</text>
  <text x="85" y="156" text-anchor="middle" font-size="10" fill="#1F2937">PWDATA</text>
  <text x="85" y="172" text-anchor="middle" font-size="10" fill="#1F2937">PRDATA</text>
  <text x="85" y="188" text-anchor="middle" font-size="10" fill="#1F2937">PWRITE</text>
  <text x="85" y="210" text-anchor="middle" font-size="10" fill="#1F2937">PSEL, PENABLE</text>

  <!-- Registers -->
  <rect x="190" y="55" width="180" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#1F2937" font-family="monospace">0x00: TIM_CTRL</text>

  <rect x="190" y="100" width="180" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#1F2937" font-family="monospace">0x04: TIM_COUNT</text>

  <rect x="190" y="145" width="180" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="280" y="167" text-anchor="middle" font-size="11" fill="#1F2937" font-family="monospace">0x08: TIM_CMP</text>

  <rect x="190" y="190" width="180" height="35" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#1F2937" font-family="monospace">0x0C: TIM_PRESCALE</text>

  <rect x="190" y="235" width="180" height="35" rx="4" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="280" y="257" text-anchor="middle" font-size="11" fill="#1F2937" font-family="monospace">0x10: TIM_INT_STATUS</text>

  <!-- Counter logic -->
  <rect x="430" y="80" width="160" height="100" rx="6" fill="#2563EB"/>
  <text x="510" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="white">카운터 로직</text>
  <text x="510" y="132" text-anchor="middle" font-size="10" fill="white">프리스케일러</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="white">↓</text>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="white">32비트 업카운터</text>

  <!-- Comparator -->
  <rect x="430" y="210" width="160" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="510" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">비교기</text>
  <text x="510" y="256" text-anchor="middle" font-size="10" fill="#1F2937">COUNT == CMP ?</text>

  <!-- Interrupt output -->
  <rect x="650" y="210" width="120" height="60" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="710" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">인터럽트</text>
  <text x="710" y="256" text-anchor="middle" font-size="10" fill="#DC2626">timer_irq</text>

  <!-- Arrows -->
  <line x1="140" y1="160" x2="185" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="370" y1="120" x2="425" y2="120" stroke="#2563EB" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="510" y1="180" x2="510" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="370" y1="160" x2="395" y2="240" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr5)" stroke-dasharray="4,3"/>
  <line x1="590" y1="240" x2="645" y2="240" stroke="#DC2626" stroke-width="2" marker-end="url(#arr5r)"/>

  <!-- Mode description -->
  <rect x="50" y="305" width="700" height="80" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="70" y="328" font-size="11" fill="#1F2937"><tspan font-weight="bold">TIM_CTRL[0]:</tspan> 타이머 활성화(EN), <tspan font-weight="bold">[1]:</tspan> 자동 재시작(AUTO_RELOAD), <tspan font-weight="bold">[2]:</tspan> 인터럽트 활성화(IE)</text>
  <text x="70" y="348" font-size="11" fill="#1F2937"><tspan font-weight="bold">동작:</tspan> EN=1이면 프리스케일러 분주 후 COUNT 증가 → COUNT==CMP이면 timer_irq 발생</text>
  <text x="70" y="368" font-size="11" fill="#1F2937"><tspan font-weight="bold">Chapter 19 연결:</tspan> timer_irq → 프로세서 mip.MTIP → 인터럽트 처리 (Part 7에서 통합)</text>
</svg>