<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 배경 -->
  <rect width="1000" height="700" fill="#f8fafc"/>

  <!-- 제목 -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">
    PPA (Power-Performance-Area) 트레이드오프
  </text>
  <text x="500" y="55" font-size="12" text-anchor="middle" fill="#64748b">
    세 목표를 동시에 최적화할 수 없으며, Pareto frontier 위의 설계가 최적
  </text>

  <!-- ===== 주요 삼각형 ===== -->
  <!-- 꼭짓점: 좌상단(Area), 우상단(Performance), 하단(Power) -->
  <polygon points="200,150 800,150 500,550" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>

  <!-- 꼭짓점 원 -->
  <circle cx="200" cy="150" r="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <circle cx="800" cy="150" r="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <circle cx="500" cy="550" r="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>

  <!-- 꼭짓점 레이블 -->
  <text x="200" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
    Area (면적)
  </text>
  <text x="200" y="102" font-size="11" text-anchor="middle" fill="#64748b">
    ↓ LUT, BRAM
  </text>

  <text x="800" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
    Performance (성능)
  </text>
  <text x="800" y="102" font-size="11" text-anchor="middle" fill="#64748b">
    ↑ MHz, CPI↓
  </text>

  <text x="500" y="600" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">
    Power (전력)
  </text>
  <text x="500" y="618" font-size="11" text-anchor="middle" fill="#64748b">
    ↓ mW
  </text>

  <!-- ===== Pareto Frontier (최적선) ===== -->
  <!-- 빨간 곡선으로 표시 (삼각형 변) -->
  <path d="M 200 150 L 650 220 L 800 150" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="130" font-size="12" fill="#7f1d1d" font-weight="bold">Pareto Frontier (최적선)</text>

  <!-- ===== 설계점 예시 ===== -->
  <!-- A: Area 최적 (좌상단 근처) -->
  <circle cx="250" cy="250" r="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <text x="280" y="255" font-size="11" fill="#7f1d1d" font-weight="bold">A</text>
  <text x="310" y="250" font-size="10" fill="#64748b">영역 최적</text>
  <text x="310" y="265" font-size="10" fill="#64748b">낮은 성능</text>

  <!-- B: 균형잡힌 설계 (Pareto frontier 위) -->
  <circle cx="500" cy="280" r="8" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="530" y="285" font-size="11" fill="#15803d" font-weight="bold">B (최적)</text>
  <text x="560" y="280" font-size="10" fill="#64748b">균형잡힌</text>
  <text x="560" y="295" font-size="10" fill="#64748b">설계</text>

  <!-- C: Performance 최적 (우상단 근처) -->
  <circle cx="750" cy="250" r="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <text x="780" y="255" font-size="11" fill="#7f1d1d" font-weight="bold">C</text>
  <text x="810" y="250" font-size="10" fill="#64748b">성능 최적</text>
  <text x="810" y="265" font-size="10" fill="#64748b">높은 면적</text>

  <!-- D: 지배당하는 설계 (삼각형 내부) -->
  <circle cx="400" cy="350" r="8" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="355" font-size="11" fill="#ea580c" font-weight="bold">D</text>
  <text x="460" y="350" font-size="10" fill="#64748b">비효율적</text>
  <text x="460" y="365" font-size="10" fill="#64748b">(지배당함)</text>

  <!-- ===== 트레이드오프 설명 박스 ===== -->
  <rect x="50" y="600" width="900" height="80" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="4"/>

  <text x="70" y="625" font-size="12" font-weight="bold" fill="#0c4a6e">
    트레이드오프 원칙:
  </text>

  <text x="70" y="645" font-size="11" fill="#0c4a6e">
    • 성능↑ (파이프라인 추가): 면적↑, 전력↑ (더 많은 FF, 더 높은 주파수)
  </text>

  <text x="70" y="662" font-size="11" fill="#0c4a6e">
    • 면적↓ (로직 최소화): 성능↓ (더 느린 경로, 지연 증가)
  </text>

  <text x="70" y="679" font-size="11" fill="#0c4a6e">
    • 전력↓ (전압/주파수 감소): 성능↓ (느린 게이팅, 동작 불가)
  </text>
</svg>
