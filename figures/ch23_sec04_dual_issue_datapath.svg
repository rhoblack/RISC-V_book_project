<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .label { font-size: 11px; fill: #1e293b; text-anchor: middle; }
    .small { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .box { rx: 6; ry: 6; }
    .stage { fill: #2563EB; }
    .stage2 { fill: #3B82F6; }
    .bg { fill: #DBEAFE; }
  </style>

  <text x="460" y="28" class="title">2-이슈 인오더 파이프라인 데이터패스</text>

  <!-- IF Stage -->
  <rect x="30" y="50" width="160" height="500" class="bg box" stroke="#2563EB" stroke-width="1"/>
  <text x="110" y="72" class="label" font-weight="bold" fill="#2563EB">IF Stage</text>

  <!-- PC -->
  <rect x="55" y="85" width="110" height="30" class="stage box"/>
  <text x="110" y="105" class="label" fill="white">PC</text>

  <!-- Fetch 2 instructions -->
  <rect x="45" y="130" width="130" height="50" class="stage2 box"/>
  <text x="110" y="152" class="label" fill="white">IMEM</text>
  <text x="110" y="168" class="label" fill="white">(64-bit 인출)</text>

  <rect x="45" y="200" width="60" height="28" fill="white" class="box" stroke="#2563EB"/>
  <text x="75" y="219" class="label">Instr A</text>
  <rect x="115" y="200" width="60" height="28" fill="white" class="box" stroke="#2563EB"/>
  <text x="145" y="219" class="label">Instr B</text>

  <line x1="110" y1="115" x2="110" y2="130" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="75" y1="180" x2="75" y2="200" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="145" y1="180" x2="145" y2="200" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- Pipeline Reg IF/ID -->
  <rect x="195" y="50" width="16" height="500" fill="#2563EB" rx="3" opacity="0.3"/>
  <text x="203" y="45" class="small" transform="rotate(-90, 203, 45)">IF/ID</text>

  <!-- ID Stage -->
  <rect x="216" y="50" width="180" height="500" class="bg box" stroke="#2563EB" stroke-width="1"/>
  <text x="306" y="72" class="label" font-weight="bold" fill="#2563EB">ID Stage</text>

  <!-- Register File (4R/2W) -->
  <rect x="236" y="90" width="140" height="55" class="stage2 box"/>
  <text x="306" y="112" class="label" fill="white">레지스터 파일</text>
  <text x="306" y="128" class="label" fill="white">4R / 2W 포트</text>

  <!-- Decoder A & B -->
  <rect x="236" y="160" width="65" height="30" class="stage box"/>
  <text x="269" y="180" class="label" fill="white">Dec A</text>
  <rect x="311" y="160" width="65" height="30" class="stage box"/>
  <text x="344" y="180" class="label" fill="white">Dec B</text>

  <!-- Hazard Detection -->
  <rect x="236" y="210" width="140" height="40" fill="#ef4444" class="box" opacity="0.85"/>
  <text x="306" y="228" class="label" fill="white" font-weight="bold">의존성 검사</text>
  <text x="306" y="244" class="small" fill="white">(Inter-issue HDU)</text>

  <!-- Issue Logic -->
  <rect x="236" y="265" width="140" height="35" fill="#f59e0b" class="box"/>
  <text x="306" y="287" class="label" fill="white" font-weight="bold">발행 로직</text>

  <text x="306" y="318" class="small">의존성 있으면</text>
  <text x="306" y="332" class="small">Way B → NOP 삽입</text>

  <!-- Pipeline Reg ID/EX -->
  <rect x="401" y="50" width="16" height="500" fill="#2563EB" rx="3" opacity="0.3"/>
  <text x="409" y="45" class="small" transform="rotate(-90, 409, 45)">ID/EX</text>

  <!-- EX Stage -->
  <rect x="422" y="50" width="180" height="500" class="bg box" stroke="#2563EB" stroke-width="1"/>
  <text x="512" y="72" class="label" font-weight="bold" fill="#2563EB">EX Stage</text>

  <!-- ALU A -->
  <rect x="440" y="100" width="65" height="50" class="stage box"/>
  <text x="473" y="122" class="label" fill="white">ALU</text>
  <text x="473" y="138" class="label" fill="white">Way A</text>

  <!-- ALU B -->
  <rect x="520" y="100" width="65" height="50" class="stage2 box"/>
  <text x="553" y="122" class="label" fill="white">ALU</text>
  <text x="553" y="138" class="label" fill="white">Way B</text>

  <!-- Forwarding Unit -->
  <rect x="440" y="170" width="145" height="40" fill="#ef4444" class="box" opacity="0.85"/>
  <text x="513" y="188" class="label" fill="white" font-weight="bold">포워딩 유닛</text>
  <text x="513" y="204" class="small" fill="white">(4-소스 MUX)</text>

  <!-- Branch Unit -->
  <rect x="440" y="230" width="145" height="35" class="stage box"/>
  <text x="513" y="252" class="label" fill="white">분기 판정 유닛</text>

  <!-- Pipeline Reg EX/MEM -->
  <rect x="607" y="50" width="16" height="500" fill="#2563EB" rx="3" opacity="0.3"/>
  <text x="615" y="45" class="small" transform="rotate(-90, 615, 45)">EX/MEM</text>

  <!-- MEM Stage -->
  <rect x="628" y="50" width="130" height="500" class="bg box" stroke="#2563EB" stroke-width="1"/>
  <text x="693" y="72" class="label" font-weight="bold" fill="#2563EB">MEM Stage</text>

  <rect x="643" y="100" width="100" height="50" class="stage2 box"/>
  <text x="693" y="122" class="label" fill="white">DMEM</text>
  <text x="693" y="138" class="label" fill="white">(단일 포트)</text>

  <text x="693" y="180" class="small">Way A: 메모리 접근</text>
  <text x="693" y="196" class="small">Way B: ALU 전용</text>
  <text x="693" y="212" class="small">(메모리 접근 불가)</text>

  <!-- Pipeline Reg MEM/WB -->
  <rect x="763" y="50" width="16" height="500" fill="#2563EB" rx="3" opacity="0.3"/>
  <text x="771" y="45" class="small" transform="rotate(-90, 771, 45)">MEM/WB</text>

  <!-- WB Stage -->
  <rect x="784" y="50" width="120" height="500" class="bg box" stroke="#2563EB" stroke-width="1"/>
  <text x="844" y="72" class="label" font-weight="bold" fill="#2563EB">WB Stage</text>

  <rect x="799" y="100" width="90" height="35" class="stage box"/>
  <text x="844" y="122" class="label" fill="white">WB A</text>
  <rect x="799" y="150" width="90" height="35" class="stage2 box"/>
  <text x="844" y="172" class="label" fill="white">WB B</text>

  <!-- 제약 조건 박스 -->
  <rect x="30" y="370" width="880" height="170" fill="white" class="box" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="460" y="395" class="label" font-weight="bold" fill="#2563EB">2-이슈 설계 제약 조건</text>

  <text x="240" y="420" class="small">Way A (슬롯 0)</text>
  <text x="240" y="438" class="small">- ALU / 분기 / 로드 / 스토어</text>
  <text x="240" y="456" class="small">- 모든 명령어 유형 실행 가능</text>
  <text x="240" y="474" class="small">- 메모리 포트 독점 사용</text>

  <text x="660" y="420" class="small">Way B (슬롯 1)</text>
  <text x="660" y="438" class="small">- ALU 전용 (로드/스토어 불가)</text>
  <text x="660" y="456" class="small">- Way A 결과에 대한 의존성 검사</text>
  <text x="660" y="474" class="small">- 의존성 시 NOP으로 대체 (1-이슈 퇴화)</text>

  <text x="460" y="510" class="label" fill="#ef4444" font-weight="bold">핵심 제약: Way B → Way A 의존성 있으면 단일 발행으로 퇴화 (IPC = 1)</text>
  <text x="460" y="530" class="label" fill="#64748b">레지스터 파일: 4 읽기 포트 + 2 쓰기 포트 필요 (면적 ~2.5배 증가)</text>
</svg>