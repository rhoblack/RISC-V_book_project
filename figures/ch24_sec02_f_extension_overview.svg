<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Pretendard, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#F8FAFC" rx="8"/>
  <text x="440" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E293B">IEEE 754 단정밀도 부동소수점 형식 (32비트)</text>

  <!-- 비트 필드 -->
  <g transform="translate(60, 60)">
    <text x="30" y="15" font-size="11" fill="#64748B" font-family="monospace">31</text>
    <text x="90" y="15" font-size="11" fill="#64748B" font-family="monospace">30        23</text>
    <text x="380" y="15" font-size="11" fill="#64748B" font-family="monospace">22                          0</text>

    <!-- Sign -->
    <rect x="0" y="25" width="60" height="45" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="30" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">S</text>
    <text x="30" y="65" text-anchor="middle" font-size="10" fill="#DC2626">1비트</text>

    <!-- Exponent -->
    <rect x="65" y="25" width="200" height="45" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="4"/>
    <text x="165" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">지수부 (Exponent)</text>
    <text x="165" y="65" text-anchor="middle" font-size="10" fill="#2563EB">8비트, bias = 127</text>

    <!-- Mantissa -->
    <rect x="270" y="25" width="490" height="45" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="4"/>
    <text x="515" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#16A34A">가수부 (Mantissa/Fraction)</text>
    <text x="515" y="65" text-anchor="middle" font-size="10" fill="#16A34A">23비트, 숨은 1 포함 시 24비트 유효 정밀도</text>
  </g>

  <!-- 공식 -->
  <rect x="60" y="140" width="760" height="40" fill="white" stroke="#2563EB" stroke-width="1.5" rx="6"/>
  <text x="440" y="166" text-anchor="middle" font-size="15" fill="#1E293B" font-family="monospace">값 = (-1)^S x 1.Mantissa x 2^(Exponent - 127)</text>

  <!-- 비교 테이블: HW vs SW -->
  <g transform="translate(60, 210)">
    <text x="380" y="0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">F 확장 구현 방식 비교</text>

    <!-- 하드웨어 구현 -->
    <rect x="0" y="20" width="360" height="240" fill="white" stroke="#2563EB" stroke-width="2" rx="10"/>
    <rect x="0" y="20" width="360" height="40" fill="#2563EB" rx="10"/>
    <rect x="0" y="48" width="360" height="12" fill="#2563EB"/>
    <text x="180" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="white">하드웨어 FPU (Hardware)</text>

    <text x="20" y="85" font-size="12" fill="#475569">- 전용 부동소수점 레지스터 f0~f31</text>
    <text x="20" y="108" font-size="12" fill="#475569">- 1~5 사이클 지연 (연산에 따라)</text>
    <text x="20" y="131" font-size="12" fill="#475569">- DSP48E1 슬라이스 10~20개 소모</text>
    <text x="20" y="154" font-size="12" fill="#475569">- LUT 2000~5000개 추가</text>
    <text x="20" y="177" font-size="12" fill="#EF4444" font-weight="bold">- Basys 3에서 리소스 부족 위험</text>
    <text x="20" y="200" font-size="12" fill="#16A34A" font-weight="bold">+ 고성능: FLOPS 직접 실행</text>
    <text x="20" y="223" font-size="12" fill="#16A34A" font-weight="bold">+ CPI 증가 최소</text>
    <text x="20" y="246" font-size="12" fill="#475569">  적합: 대형 FPGA (Kintex, Virtex)</text>

    <!-- 소프트웨어 에뮬레이션 -->
    <rect x="400" y="20" width="360" height="240" fill="white" stroke="#3B82F6" stroke-width="2" rx="10"/>
    <rect x="400" y="20" width="360" height="40" fill="#3B82F6" rx="10"/>
    <rect x="400" y="48" width="360" height="12" fill="#3B82F6"/>
    <text x="580" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="white">소프트웨어 에뮬레이션 (Software)</text>

    <text x="420" y="85" font-size="12" fill="#475569">- 정수 레지스터 x0~x31만 사용</text>
    <text x="420" y="108" font-size="12" fill="#475569">- 수십~수백 사이클 지연</text>
    <text x="420" y="131" font-size="12" fill="#475569">- 추가 하드웨어 0 (기존 RV32I 사용)</text>
    <text x="420" y="154" font-size="12" fill="#475569">- GCC soft-float 라이브러리</text>
    <text x="420" y="177" font-size="12" fill="#16A34A" font-weight="bold">+ Basys 3 리소스 절약</text>
    <text x="420" y="200" font-size="12" fill="#16A34A" font-weight="bold">+ 구현 복잡도 Zero</text>
    <text x="420" y="223" font-size="12" fill="#EF4444" font-weight="bold">- 저성능: 100x 느림</text>
    <text x="420" y="246" font-size="12" fill="#475569">  적합: Basys 3, 교육 목적</text>
  </g>

  <!-- 하단 권장사항 -->
  <rect x="60" y="470" width="760" height="25" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="4"/>
  <text x="440" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">권장: Basys 3에서는 소프트웨어 에뮬레이션, 대형 FPGA에서는 하드웨어 FPU 구현</text>
</svg>