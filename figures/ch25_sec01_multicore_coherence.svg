<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="520" fill="#FAFBFF" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">멀티코어 캐시 일관성(Cache Coherence) 문제</text>

  <!-- Core 0 -->
  <rect x="60" y="70" width="160" height="60" rx="8" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="white">Core 0</text>

  <!-- Core 0 Cache -->
  <rect x="60" y="150" width="160" height="80" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">L1 Cache</text>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#1F2937" font-family="monospace">addr 0x100: X = 5</text>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#6B7280">(상태: Modified)</text>

  <!-- Core 1 -->
  <rect x="310" y="70" width="160" height="60" rx="8" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="white">Core 1</text>

  <!-- Core 1 Cache -->
  <rect x="310" y="150" width="160" height="80" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="390" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">L1 Cache</text>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#1F2937" font-family="monospace">addr 0x100: X = 3</text>
  <text x="390" y="218" text-anchor="middle" font-size="11" fill="#6B7280">(상태: Shared → Stale!)</text>

  <!-- Core 2 -->
  <rect x="560" y="70" width="160" height="60" rx="8" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <text x="640" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="white">Core 2</text>

  <!-- Core 2 Cache -->
  <rect x="560" y="150" width="160" height="80" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="640" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">L1 Cache</text>
  <text x="640" y="200" text-anchor="middle" font-size="12" fill="#1F2937" font-family="monospace">addr 0x100: X = 3</text>
  <text x="640" y="218" text-anchor="middle" font-size="11" fill="#6B7280">(상태: Invalid)</text>

  <!-- 화살표: Core → Cache -->
  <line x1="140" y1="130" x2="140" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="390" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="130" x2="640" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 공유 버스 -->
  <rect x="40" y="270" width="720" height="40" rx="6" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="white">공유 버스 (Shared Bus) — 스누핑 인터커넥트</text>

  <!-- Cache → Bus 연결 -->
  <line x1="140" y1="230" x2="140" y2="268" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="230" x2="390" y2="268" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="230" x2="640" y2="268" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 메인 메모리 -->
  <rect x="280" y="350" width="240" height="70" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="400" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">주 메모리 (Main Memory)</text>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#6B7280" font-family="monospace">addr 0x100: X = 3 (오래된 값)</text>

  <!-- Bus → Memory -->
  <line x1="400" y1="310" x2="400" y2="348" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 문제 설명 박스 -->
  <rect x="60" y="450" width="680" height="55" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="400" y="472" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">문제: Core 0이 X를 5로 수정했지만, Core 1과 Core 2는 여전히 X = 3을 보고 있음</text>
  <text x="400" y="492" text-anchor="middle" font-size="12" fill="#7F1D1D">→ 캐시 일관성 프로토콜(MESI 등)로 해결 필요</text>

  <!-- Core 0 수정 표시 -->
  <text x="140" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">STORE X, 5 실행!</text>
</svg>