  <text x="396" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">★ Steady-State</text>

  <!-- C5 열 설명 -->
  <text x="645" y="89"  font-size="8" fill="#4C1D95">← I1: WB</text>
  <text x="645" y="137" font-size="8" fill="#831843">← I2: MEM</text>
  <text x="645" y="185" font-size="8" fill="#78350F">← I3: EX</text>
  <text x="645" y="233" font-size="8" fill="#065F46">← I4: ID</text>
  <text x="645" y="281" font-size="8" fill="#1E40AF">← I5: IF</text>

  <!-- 설명 박스 -->
  <rect x="80" y="314" width="560" height="70" fill="#FFFBEB" rx="4" stroke="#FDE68A"/>
  <text x="350" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">★ C5부터 Steady-State: 모든 스테이지가 동시에 활성화!</text>
  <text x="350" y="350" text-anchor="middle" font-size="9" fill="#78350F">C5 시점: I1(WB), I2(MEM), I3(EX), I4(ID), I5(IF) — 5개 스테이지가 모두 다른 명령어를 처리</text>
  <text x="350" y="366" text-anchor="middle" font-size="9" fill="#78350F">이후 매 사이클마다 명령어 1개 완료 → 이상적 CPI = 1.0</text>
  <text x="350" y="379" text-anchor="middle" font-size="9" fill="#78350F">처음 4사이클 = 파이프라인 채우기(fill) 단계 (완전 채워지는 데 N-1 = 4사이클 필요)</text>
