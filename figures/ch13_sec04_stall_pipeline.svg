<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Pretendard, sans-serif">
  <rect width="820" height="420" fill="#F8FAFC" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">캐시 미스 시 파이프라인 홀드 (Pipeline Stall on Cache Miss)</text>

  <!-- 사이클 레이블 -->
  <text x="170" y="60" text-anchor="middle" font-size="11" fill="#6B7280">사이클</text>
  <text x="240" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">2</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">3</text>
  <text x="420" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">4</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">5</text>
  <text x="540" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#EF4444">6</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#EF4444">7</text>
  <text x="660" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#EF4444">8</text>
  <text x="720" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#EF4444">9</text>
  <text x="780" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">10</text>

  <!-- 행 레이블 -->
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#374151">PC(IF)</text>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#374151">IF/ID</text>
  <text x="100" y="172" text-anchor="middle" font-size="11" fill="#374151">ID/EX</text>
  <text x="100" y="212" text-anchor="middle" font-size="11" fill="#374151">EX/MEM</text>
  <text x="100" y="252" text-anchor="middle" font-size="11" fill="#374151">MEM/WB</text>

  <!-- 미스 없을 때 정상 흐름 (1~5사이클) -->
  <!-- PC: I1 I2 I3 I4 I5 || stall... -->
  <rect x="210" y="70" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="239" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">I1</text>
  <rect x="270" y="70" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="299" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">I2</text>
  <rect x="330" y="70" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="359" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">I3</text>
  <rect x="390" y="70" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="419" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">I4</text>
  <rect x="450" y="70" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="479" y="88" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">I5(miss)</text>

  <!-- 캐시 미스 스톨 구간: PC 홀드 (6~9사이클) -->
  <rect x="510" y="70" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="539" y="88" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">HOLD</text>
  <rect x="570" y="70" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="599" y="88" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">HOLD</text>
  <rect x="630" y="70" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="659" y="88" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">HOLD</text>
  <rect x="690" y="70" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="719" y="88" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="700">HOLD</text>

  <!-- 재개 (10사이클) -->
  <rect x="750" y="70" width="58" height="28" fill="#D1FAE5" rx="4" stroke="#10B981" stroke-width="1.5"/>
  <text x="779" y="88" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">I6</text>

  <!-- IF/ID 행 -->
  <rect x="270" y="110" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="299" y="128" text-anchor="middle" font-size="10" fill="#1D4ED8">I1</text>
  <rect x="330" y="110" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="359" y="128" text-anchor="middle" font-size="10" fill="#1D4ED8">I2</text>
  <rect x="390" y="110" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="419" y="128" text-anchor="middle" font-size="10" fill="#1D4ED8">I3</text>
  <rect x="450" y="110" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="479" y="128" text-anchor="middle" font-size="10" fill="#1D4ED8">I4</text>
  <!-- I5가 IF 스테이지에서 미스, 홀드 -->
  <rect x="510" y="110" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="539" y="128" text-anchor="middle" font-size="10" fill="#EF4444">I5 HOLD</text>
  <rect x="570" y="110" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="599" y="128" text-anchor="middle" font-size="10" fill="#EF4444">I5 HOLD</text>
  <rect x="630" y="110" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="659" y="128" text-anchor="middle" font-size="10" fill="#EF4444">I5 HOLD</text>
  <rect x="690" y="110" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="719" y="128" text-anchor="middle" font-size="10" fill="#EF4444">I5 HOLD</text>
  <rect x="750" y="110" width="58" height="28" fill="#D1FAE5" rx="4" stroke="#10B981" stroke-width="1.5"/>
  <text x="779" y="128" text-anchor="middle" font-size="10" fill="#065F46">I5 OK</text>

  <!-- ID/EX 행 -->
  <rect x="330" y="150" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="359" y="168" text-anchor="middle" font-size="10" fill="#1D4ED8">I1</text>
  <rect x="390" y="150" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="419" y="168" text-anchor="middle" font-size="10" fill="#1D4ED8">I2</text>
  <rect x="450" y="150" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="479" y="168" text-anchor="middle" font-size="10" fill="#1D4ED8">I3</text>
  <!-- I4 이후 홀드 -->
  <rect x="510" y="150" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="539" y="168" text-anchor="middle" font-size="10" fill="#EF4444">I4 HOLD</text>
  <rect x="570" y="150" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="599" y="168" text-anchor="middle" font-size="10" fill="#EF4444">I4 HOLD</text>
  <rect x="630" y="150" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="659" y="168" text-anchor="middle" font-size="10" fill="#EF4444">I4 HOLD</text>
  <rect x="690" y="150" width="58" height="28" fill="#FEE2E2" rx="4" stroke="#EF4444" stroke-width="1.5"/>
  <text x="719" y="168" text-anchor="middle" font-size="10" fill="#EF4444">I4 HOLD</text>
  <rect x="750" y="150" width="58" height="28" fill="#DBEAFE" rx="4" stroke="#2563EB" stroke-width="1.5"/>
  <text x="779" y="168" text-anchor="middle" font-size="10" fill="#1D4ED8">I4</text>

  <!-- EX/MEM, MEM/WB 생략 표시 -->
  <text x="540" y="210" text-anchor="middle" font-size="11" fill="#9CA3AF">( EX/MEM, MEM/WB 스테이지도 동일하게 홀드 )</text>

  <!-- icache_stall 신호 표시 -->
  <rect x="210" y="265" width="540" height="28" fill="#FEF3C7" rx="4" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="283" text-anchor="middle" font-size="11" fill="#92400E" font-weight="700">icache_stall = 1  (5사이클 동안 활성)</text>
  <text x="210" y="263" text-anchor="start" font-size="10" fill="#F59E0B">사이클6</text>
  <text x="745" y="263" text-anchor="end" font-size="10" fill="#F59E0B">사이클9</text>

  <!-- 스톨 제어 신호 박스 -->
  <rect x="30" y="310" width="760" height="85" fill="white" rx="10" stroke="#DBEAFE" stroke-width="2"/>
  <text x="410" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">스톨 제어 신호 (icache_stall=1 시)</text>
  <line x1="50" y1="340" x2="770" y2="340" stroke="#DBEAFE" stroke-width="1"/>
  <text x="200" y="360" text-anchor="middle" font-size="12" fill="#EF4444" font-weight="600">pc_en = 0</text>
  <text x="200" y="378" text-anchor="middle" font-size="11" fill="#374151">PC 업데이트 정지</text>
  <text x="410" y="360" text-anchor="middle" font-size="12" fill="#EF4444" font-weight="600">if_id_en = 0</text>
  <text x="410" y="378" text-anchor="middle" font-size="11" fill="#374151">IF/ID 레지스터 홀드</text>
  <text x="620" y="360" text-anchor="middle" font-size="12" fill="#10B981" font-weight="600">id_ex_flush = 0</text>
  <text x="620" y="378" text-anchor="middle" font-size="11" fill="#374151">플러시 없음 (Load-Use와 다름!)</text>
</svg>
