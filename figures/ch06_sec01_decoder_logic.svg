<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow1g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="900" height="520" fill="#F8FAFC" rx="12"/>

  <!-- 타이틀 -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">명령어 디코더 구조 (Instruction Decoder)</text>

  <!-- 명령어 입력 -->
  <rect x="30" y="70" width="200" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">instruction[31:0]</text>
  <text x="130" y="115" text-anchor="middle" font-size="11" fill="#6B7280">32비트 명령어 입력</text>

  <!-- 필드 분리 박스 -->
  <rect x="30" y="160" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">필드 분리</text>

  <rect x="50" y="200" width="160" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="130" y="219" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">opcode [6:0]</text>

  <rect x="50" y="236" width="160" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="130" y="255" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">funct3 [14:12]</text>

  <rect x="50" y="272" width="160" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="130" y="291" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">funct7 [31:25]</text>

  <rect x="50" y="308" width="160" height="28" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="130" y="327" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">rd/rs1/rs2</text>

  <!-- 화살표: 명령어 → 필드 분리 -->
  <line x1="130" y1="130" x2="130" y2="158" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- 메인 디코더 -->
  <rect x="320" y="100" width="220" height="120" rx="8" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">메인 디코더</text>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#DBEAFE">opcode → 명령어 유형</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#DBEAFE">7가지 opcode 분류</text>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#93C5FD">R / I / S / B / U / J / SYSTEM</text>

  <!-- ALU 디코더 -->
  <rect x="320" y="260" width="220" height="100" rx="8" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">ALU 디코더</text>
  <text x="430" y="310" text-anchor="middle" font-size="12" fill="#DBEAFE">funct3 + funct7 → ALUSel</text>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#93C5FD">10가지 ALU 연산 선택</text>

  <!-- 화살표: 필드 → 메인 디코더 -->
  <line x1="230" y1="214" x2="318" y2="155" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <!-- 화살표: 필드 → ALU 디코더 -->
  <line x1="230" y1="270" x2="318" y2="290" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="230" y1="291" x2="318" y2="305" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- 제어 신호 출력 -->
  <rect x="630" y="60" width="240" height="400" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="750" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">제어 신호 출력</text>

  <rect x="650" y="100" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="119" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">ALUSel [3:0]</text>

  <rect x="650" y="136" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="155" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">ImmSel [2:0]</text>

  <rect x="650" y="172" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="191" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">RegWEn</text>

  <rect x="650" y="208" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="227" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">MemRW [1:0]</text>

  <rect x="650" y="244" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="263" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">PCSel [1:0]</text>

  <rect x="650" y="280" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="299" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">WBSel [1:0]</text>

  <rect x="650" y="316" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="335" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">BSel (ALU B 입력)</text>

  <rect x="650" y="352" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="371" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">ASel (ALU A 입력)</text>

  <rect x="650" y="388" width="200" height="28" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="750" y="407" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">BrUn (무부호 비교)</text>

  <rect x="650" y="424" width="200" height="28" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="750" y="443" text-anchor="middle" font-size="12" font-family="monospace" fill="#1E293B">illegal_instr</text>

  <!-- 화살표: 메인 디코더 → 제어 신호 -->
  <line x1="540" y1="160" x2="628" y2="160" stroke="#059669" stroke-width="2" marker-end="url(#arrow1g)"/>
  <!-- 화살표: ALU 디코더 → ALUSel -->
  <line x1="540" y1="310" x2="600" y2="114" stroke="#059669" stroke-width="2" marker-end="url(#arrow1g)"/>

  <!-- 범례 -->
  <rect x="30" y="400" width="250" height="100" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="45" y="420" font-size="12" font-weight="600" fill="#475569">디코딩 단계:</text>
  <text x="45" y="440" font-size="11" fill="#475569">1단계: 32비트 명령어 → 필드 분리</text>
  <text x="45" y="458" font-size="11" fill="#475569">2단계: opcode → 명령어 유형 분류</text>
  <text x="45" y="476" font-size="11" fill="#475569">3단계: funct3/funct7 → ALU 연산 결정</text>
  <text x="45" y="494" font-size="11" fill="#475569">4단계: 제어 신호 생성</text>
</svg>