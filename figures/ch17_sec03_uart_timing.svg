<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, monospace">
  <!-- 배경 -->
  <rect width="1000" height="320" fill="#F8FAFC" rx="8"/>

  <!-- 제목 -->
  <text x="500" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">UART 8N1 비트 타이밍 (16× 오버샘플링)</text>

  <!-- ===== 열 구분: IDLE + START + D0~D7 + STOP = 11 비트 구간 ===== -->
  <!-- 각 비트 폭 = 80px, 시작 X = 90 -->
  <!-- IDLE: 90~170, START: 170~250, D0:250~330, D1:330~410, D2:410~490, D3:490~570, D4:570~650, D5:650~730, D6:730~810, D7:810~890, STOP:890~970 -->

  <!-- 비트 구간 배경 (교번 음영) -->
  <rect x="90"  y="55" width="80" height="170" fill="#F1F5F9" opacity="0.6"/>
  <rect x="170" y="55" width="80" height="170" fill="#FEF3C7" opacity="0.5"/>
  <rect x="250" y="55" width="80" height="170" fill="#DBEAFE" opacity="0.4"/>
  <rect x="330" y="55" width="80" height="170" fill="#F1F5F9" opacity="0.4"/>
  <rect x="410" y="55" width="80" height="170" fill="#DBEAFE" opacity="0.4"/>
  <rect x="490" y="55" width="80" height="170" fill="#F1F5F9" opacity="0.4"/>
  <rect x="570" y="55" width="80" height="170" fill="#DBEAFE" opacity="0.4"/>
  <rect x="650" y="55" width="80" height="170" fill="#F1F5F9" opacity="0.4"/>
  <rect x="730" y="55" width="80" height="170" fill="#DBEAFE" opacity="0.4"/>
  <rect x="810" y="55" width="80" height="170" fill="#F1F5F9" opacity="0.4"/>
  <rect x="890" y="55" width="80" height="170" fill="#D1FAE5" opacity="0.5"/>

  <!-- 비트 레이블 (상단) -->
  <text x="130" y="50" text-anchor="middle" font-size="11" fill="#64748B">IDLE</text>
  <text x="210" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">START</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D0</text>
  <text x="370" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D1</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D2</text>
  <text x="530" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D3</text>
  <text x="610" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D4</text>
  <text x="690" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D5</text>
  <text x="770" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D6</text>
  <text x="850" y="50" text-anchor="middle" font-size="11" fill="#2563EB">D7</text>
  <text x="930" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">STOP</text>

  <!-- ===== 신호 레이블 (좌측) ===== -->
  <text x="80" y="95"  text-anchor="end" font-size="12" font-weight="bold" fill="#1E293B">uart_tx</text>
  <text x="80" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#1E293B">rx_sync_1</text>
  <text x="80" y="220" text-anchor="end" font-size="12" fill="#64748B">baud_tick</text>

  <!-- ===== uart_tx 파형 (Y=65 HIGH, Y=105 LOW) ===== -->
  <!-- IDLE: HIGH -->
  <line x1="90"  y1="75" x2="170" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- IDLE→START 하강 에지 -->
  <line x1="170" y1="75" x2="170" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- START: LOW -->
  <line x1="170" y1="105" x2="250" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- START→D0 상승 에지 (D0=1 가정) -->
  <line x1="250" y1="105" x2="250" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- D0=1 (HIGH) -->
  <line x1="250" y1="75"  x2="330" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- D1=0 -->
  <line x1="330" y1="75"  x2="330" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="330" y1="105" x2="410" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- D2=0 -->
  <line x1="410" y1="105" x2="490" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- D3=1 -->
  <line x1="490" y1="105" x2="490" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <line x1="490" y1="75"  x2="570" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- D4=0 -->
  <line x1="570" y1="75"  x2="570" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="570" y1="105" x2="650" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- D5=1 -->
  <line x1="650" y1="105" x2="650" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <line x1="650" y1="75"  x2="730" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- D6=0 -->
  <line x1="730" y1="75"  x2="730" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="730" y1="105" x2="810" y2="105" stroke="#2563EB" stroke-width="2.5"/>
  <!-- D7=1 -->
  <line x1="810" y1="105" x2="810" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <line x1="810" y1="75"  x2="890" y2="75"  stroke="#2563EB" stroke-width="2.5"/>
  <!-- STOP=1 (HIGH) -->
  <line x1="890" y1="75"  x2="970" y2="75"  stroke="#2563EB" stroke-width="2.5"/>

  <!-- ===== rx_sync_1 파형 (2클럭 지연, Y=135 HIGH, Y=165 LOW) ===== -->
  <!-- IDLE: HIGH -->
  <line x1="90"  y1="145" x2="175" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- START: LOW -->
  <line x1="175" y1="145" x2="175" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="175" y1="165" x2="255" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D0=1 -->
  <line x1="255" y1="165" x2="255" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="255" y1="145" x2="335" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D1=0 -->
  <line x1="335" y1="145" x2="335" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="335" y1="165" x2="415" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D2=0 -->
  <line x1="415" y1="165" x2="495" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D3=1 -->
  <line x1="495" y1="165" x2="495" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="495" y1="145" x2="575" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D4=0 -->
  <line x1="575" y1="145" x2="575" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="575" y1="165" x2="655" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D5=1 -->
  <line x1="655" y1="165" x2="655" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="655" y1="145" x2="735" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D6=0 -->
  <line x1="735" y1="145" x2="735" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="735" y1="165" x2="815" y2="165" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- D7=1 -->
  <line x1="815" y1="165" x2="815" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="815" y1="145" x2="895" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- STOP -->
  <line x1="895" y1="145" x2="970" y2="145" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- ===== baud_tick 펄스 (Y=210 baseline, Y=198 HIGH) ===== -->
  <!-- START 구간 16개 tick (x=170~250, 각 5px 폭) -->
  <!-- tick 위치: 175, 180, 185, 190, 195, 200, 205, 210, 215, 220, 225, 230, 235, 240, 245, 250 -->
  <line x1="90"  y1="215" x2="970" y2="215" stroke="#94A3B8" stroke-width="1"/>

  <!-- START의 16 ticks -->
  <line x1="175" y1="215" x2="175" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="180" y1="215" x2="180" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="185" y1="215" x2="185" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="190" y1="215" x2="190" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="195" y1="215" x2="195" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="200" y1="215" x2="200" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="205" y1="215" x2="205" y2="203" stroke="#64748B" stroke-width="1"/>
  <!-- 8번째 tick: 빨간색 강조 -->
  <line x1="210" y1="215" x2="210" y2="195" stroke="#EF4444" stroke-width="2.5"/>
  <line x1="215" y1="215" x2="215" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="220" y1="215" x2="220" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="225" y1="215" x2="225" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="230" y1="215" x2="230" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="235" y1="215" x2="235" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="240" y1="215" x2="240" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="245" y1="215" x2="245" y2="203" stroke="#64748B" stroke-width="1"/>
  <!-- 16번째 tick (START 끝 / D0 시작): 초록색 강조 -->
  <line x1="250" y1="215" x2="250" y2="193" stroke="#10B981" stroke-width="2.5"/>

  <!-- D0의 16 ticks -->
  <line x1="255" y1="215" x2="255" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="260" y1="215" x2="260" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="265" y1="215" x2="265" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="270" y1="215" x2="270" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="275" y1="215" x2="275" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="280" y1="215" x2="280" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="285" y1="215" x2="285" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="290" y1="215" x2="290" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="295" y1="215" x2="295" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="300" y1="215" x2="300" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="305" y1="215" x2="305" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="310" y1="215" x2="310" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="315" y1="215" x2="315" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="320" y1="215" x2="320" y2="203" stroke="#64748B" stroke-width="1"/>
  <line x1="325" y1="215" x2="325" y2="203" stroke="#64748B" stroke-width="1"/>
  <!-- D0의 16번째 tick: 초록색 강조 -->
  <line x1="330" y1="215" x2="330" y2="193" stroke="#10B981" stroke-width="2.5"/>

  <!-- 이후 각 비트의 16번째 tick만 표시 (초록) -->
  <line x1="410" y1="215" x2="410" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="490" y1="215" x2="490" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="570" y1="215" x2="570" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="650" y1="215" x2="650" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="730" y1="215" x2="730" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="810" y1="215" x2="810" y2="193" stroke="#10B981" stroke-width="2"/>
  <line x1="890" y1="215" x2="890" y2="193" stroke="#10B981" stroke-width="2"/>

  <!-- 각 비트 중간 baud_tick들 (간략화: 8번째만 표시) -->
  <line x1="370" y1="215" x2="370" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="450" y1="215" x2="450" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="530" y1="215" x2="530" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="610" y1="215" x2="610" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="690" y1="215" x2="690" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="770" y1="215" x2="770" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="850" y1="215" x2="850" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="930" y1="215" x2="930" y2="203" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,1"/>

  <!-- baud_tick 레이블 -->
  <text x="210" y="232" text-anchor="middle" font-size="9" fill="#EF4444">tick8</text>
  <text x="250" y="232" text-anchor="middle" font-size="9" fill="#10B981">tick16</text>
  <text x="330" y="232" text-anchor="middle" font-size="9" fill="#10B981">×16</text>
  <text x="410" y="232" text-anchor="middle" font-size="9" fill="#10B981">×16</text>
  <text x="490" y="232" text-anchor="middle" font-size="9" fill="#10B981">×16</text>
  <text x="570" y="232" text-anchor="middle" font-size="9" fill="#10B981">×16</text>

  <!-- ===== 샘플링 포인트 삼각형 ===== -->
  <!-- 8번째 tick (START 검증): 빨간 삼각형 -->
  <polygon points="210,170 205,182 215,182" fill="#EF4444" opacity="0.9"/>
  <text x="210" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#EF4444">시작비트 검증</text>

  <!-- D0 샘플링 포인트: 초록 삼각형 -->
  <polygon points="250,170 245,182 255,182" fill="#10B981" opacity="0.9"/>
  <text x="253" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#10B981">중앙샘플링</text>

  <!-- 각 데이터 비트 샘플링 포인트 (작은 삼각형) -->
  <polygon points="330,170 326,180 334,180" fill="#10B981" opacity="0.7"/>
  <polygon points="410,170 406,180 414,180" fill="#10B981" opacity="0.7"/>
  <polygon points="490,170 486,180 494,180" fill="#10B981" opacity="0.7"/>
  <polygon points="570,170 566,180 574,180" fill="#10B981" opacity="0.7"/>
  <polygon points="650,170 646,180 654,180" fill="#10B981" opacity="0.7"/>
  <polygon points="730,170 726,180 734,180" fill="#10B981" opacity="0.7"/>
  <polygon points="810,170 806,180 814,180" fill="#10B981" opacity="0.7"/>

  <!-- ===== HIGH/LOW 레이블 ===== -->
  <text x="92" y="73"  font-size="9" fill="#2563EB">HIGH</text>
  <text x="92" y="108" font-size="9" fill="#2563EB">LOW</text>
  <text x="92" y="143" font-size="9" fill="#3B82F6">HIGH</text>
  <text x="92" y="168" font-size="9" fill="#3B82F6">LOW</text>

  <!-- ===== 하단 범례 ===== -->
  <line x1="90" y1="250" x2="120" y2="250" stroke="#EF4444" stroke-width="2.5"/>
  <polygon points="110,245 107,252 113,252" fill="#EF4444"/>
  <text x="125" y="254" font-size="10" fill="#1E293B">시작 비트 검증 (8번째 baud_tick)</text>

  <line x1="350" y1="250" x2="380" y2="250" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="370,245 367,252 373,252" fill="#10B981"/>
  <text x="385" y="254" font-size="10" fill="#1E293B">데이터 중앙 샘플링 (16번째 baud_tick)</text>

  <line x1="90" y1="270" x2="120" y2="270" stroke="#2563EB" stroke-width="2.5"/>
  <text x="125" y="274" font-size="10" fill="#1E293B">uart_tx (실제 전송 신호)</text>

  <line x1="90" y1="270" x2="120" y2="270" stroke="none"/>
  <line x1="350" y1="270" x2="380" y2="270" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="385" y="274" font-size="10" fill="#1E293B">rx_sync_1 (2FF 동기화 후, ~2클럭 지연)</text>

  <!-- ===== 구간 폭 표시 ===== -->
  <line x1="170" y1="285" x2="250" y2="285" stroke="#B45309" stroke-width="1"/>
  <line x1="170" y1="281" x2="170" y2="289" stroke="#B45309" stroke-width="1"/>
  <line x1="250" y1="281" x2="250" y2="289" stroke="#B45309" stroke-width="1"/>
  <text x="210" y="298" text-anchor="middle" font-size="9" fill="#B45309">1비트 = 16× baud_tick</text>

  <!-- 테두리 -->
  <rect width="1000" height="320" fill="none" stroke="#CBD5E1" stroke-width="1" rx="8"/>
</svg>
