<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" font-family="Pretendard, monospace" font-size="13">
  <defs>
    <style>
      .field-label { font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .bit-label { font-size: 10px; fill: #374151; text-anchor: middle; }
      .field-name { font-size: 12px; fill: white; text-anchor: middle; font-weight: 600; }
      .type-label { font-size: 16px; fill: #DB2777; font-weight: 700; }
    </style>
  </defs>
  <text x="10" y="30" class="type-label">J-Type</text>
  <!-- imm[20]: bit 31 (1 bit) -->
  <rect x="60" y="40" width="30" height="40" rx="4" fill="#DB2777"/>
  <text x="75" y="65" class="field-name" font-size="10">[20]</text>
  <text x="75" y="95" class="field-label">31</text>
  <!-- imm[10:1]: bits 30-21 (10 bits) -->
  <rect x="92" y="40" width="170" height="40" rx="4" fill="#EC4899"/>
  <text x="177" y="65" class="field-name">imm[10:1]</text>
  <text x="177" y="95" class="field-label">[30:21] 10비트</text>
  <!-- imm[11]: bit 20 (1 bit) -->
  <rect x="264" y="40" width="30" height="40" rx="4" fill="#DB2777"/>
  <text x="279" y="65" class="field-name" font-size="10">[11]</text>
  <text x="279" y="95" class="field-label">20</text>
  <!-- imm[19:12]: bits 19-12 (8 bits) -->
  <rect x="296" y="40" width="170" height="40" rx="4" fill="#F472B6"/>
  <text x="381" y="65" class="field-name">imm[19:12]</text>
  <text x="381" y="95" class="field-label">[19:12] 8비트</text>
  <!-- rd: bits 11-7 (5 bits) -->
  <rect x="468" y="40" width="100" height="40" rx="4" fill="#F9A8D4"/>
  <text x="518" y="65" class="field-name">rd</text>
  <text x="518" y="95" class="field-label">[11:7] 5비트</text>
  <!-- opcode: bits 6-0 (7 bits) -->
  <rect x="570" y="40" width="140" height="40" rx="4" fill="#BE185D"/>
  <text x="640" y="65" class="field-name">opcode</text>
  <text x="640" y="95" class="field-label">[6:0] 7비트</text>
  <!-- bit markers -->
  <text x="60" y="38" class="bit-label">31</text>
  <text x="90" y="38" class="bit-label">30</text>
  <text x="262" y="38" class="bit-label">21 20</text>
  <text x="296" y="38" class="bit-label">19</text>
  <text x="466" y="38" class="bit-label">12 11</text>
  <text x="568" y="38" class="bit-label">7 6</text>
  <text x="710" y="38" class="bit-label">0</text>
</svg>